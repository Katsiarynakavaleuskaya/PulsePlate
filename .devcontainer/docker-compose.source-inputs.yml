services:
  devcontainer:
    extends:
      file: docker-compose.devcontainer.yml
      service: devcontainer

  sdk-source-inputs:
    platform: linux/amd64
    build:
      context: ..
      dockerfile_inline: |
        FROM python@sha256:7a6b87c02e1f4d6bb572e379235cbbdd7892add0572442c9b0b860a3f5aa9857 AS fetch
        COPY scripts/ci/docker_source_artifacts.json scripts/ci/fetch_docker_source_artifacts.py /tooling/scripts/ci/
        RUN python -I /tooling/scripts/ci/fetch_docker_source_artifacts.py --manifest /tooling/scripts/ci/docker_source_artifacts.json --output-dir /verified
        FROM scratch
        COPY --from=fetch /verified/zlib-71747d1d39168833e0cae8ed84b8ce77cb049699.tar.gz /verified/ncurses-snapshots-dc909d77781ef5c2a0684e9ad9eb9f0c0baf5ecc.tar.gz /verified/openssl-3.5.9.tar.gz /verified/postgresql-18.6.tar.gz /input/native/
    deploy:
      replicas: 0

  native-sdk-artifacts:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev-bootstrap-sdk
      platforms:
        - linux/amd64
      additional_contexts:
        sdk-source-archives: service:sdk-source-inputs
      args:
        PULSEPLATE_PYTHON_INDEX_URL: https://packages.pulseplate.app/root/pulseplate/+simple/
      secrets:
        - pp_netrc
    deploy:
      replicas: 0

# Compose extends imports service fields. Its referenced resources are declared here.
secrets:
  pp_netrc:
    file: ${PULSEPLATE_NATIVE_SDK_NETRC_FILE:-/dev/null}

volumes:
  pulseplate-dev-venv:
  pulseplate-pip-cache:
  pulseplate-npm-cache:
