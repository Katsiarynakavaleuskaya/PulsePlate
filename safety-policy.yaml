# Safety policy file for Safety CLI 3 scan.
# Format: YAML v3.0 (required by Safety scan).
# Documentation: https://docs.safetycli.com/
#
# PyUp ID 88739 (fonttools TTX eval): approved private CI/Docker package index
# currently exposes only fonttools 4.61.1 while public PyPI has >=4.62.0.
# Remove this ignore when requirements pin fonttools>=4.62.0 and the mirror syncs.
# Advisory: docs/security/FONTTOOLS_TTX_EVAL_ADVISORY.md

version: "3.0"

scanning-settings:
  max-depth: 6
  exclude: []
  include-files: []
  system:
    targets: []

report:
  dependency-vulnerabilities:
    enabled: true
    auto-ignore-in-report:
      python:
        environment-results: true
        unpinned-requirements: true
      vulnerabilities:
        "88739":
          reason: >-
            Private package index still mirrors fonttools 4.61.1 only; remove
            when docs/security/FONTTOOLS_TTX_EVAL_ADVISORY.md is closed.
          expires: "2026-07-08"
      cvss-severity: []

fail-scan-with-exit-code:
  dependency-vulnerabilities:
    enabled: true
    fail-on-any-of:
      cvss-severity:
        - critical
        - high
        - unknown
      exploitability:
        - critical
        - high
        - unknown

security-updates:
  dependency-vulnerabilities:
    auto-security-updates-limit:
      - patch

installation:
  default-action: allow
  audit-logging:
    enabled: true
  allow:
    packages: []
    vulnerabilities: {}
  deny:
    packages: {}
    vulnerabilities:
      warning-on-any-of:
        cvss-severity: []
      block-on-any-of:
        cvss-severity: []
