[mypy]
python_version = 3.12
mypy_path = .
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Don't ignore missing imports - fix them instead
ignore_missing_imports = False

# Exclude test directories
exclude = (?x)^(tests/|tests_strict/|cache/|test_cache/|frontend/build/|htmlcov/|releases/|data/|external/)

# Per-module options
[mypy-tests.*]
ignore_errors = True

[mypy-tests_strict.*]
ignore_errors = True

[mypy-cache.*]
ignore_errors = True

[mypy-test_cache.*]
ignore_errors = True

[mypy-frontend.build.*]
ignore_errors = True

[mypy-htmlcov.*]
ignore_errors = True

[mypy-releases.*]
ignore_errors = True

[mypy-data.*]
ignore_errors = True

[mypy-external.*]
ignore_errors = True
