version: '3.8'

services:
  pulseplate-staging:
    image: ghcr.io/katsiarynakavaleuskaya/pulseplate:latest
    container_name: pulseplate-staging
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=staging
    env_file:
      - .env  # See .env file for DATABASE_URL configuration
      - ../deploy/ollama-configs/local.env.example  # Local Ollama config
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: pulseplate-nginx-local
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - pulseplate-staging
    restart: unless-stopped
