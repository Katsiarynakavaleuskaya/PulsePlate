repos:
  # --- Generic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  # --- Lint: Ruff (fast flake8 + isort + black replacement)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint, local)
        files: ^(?!frontend/).+\.py$
        args: [--fix]
      - id: ruff-format
        name: ruff (format, local)
        files: ^(?!frontend/).+\.py$

  # --- Type checking: mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (type-check)
        args:
          - --pretty
          - --show-error-codes
          - --implicit-optional
          - --ignore-missing-imports
          - --install-types
          - --non-interactive
          - --exclude=_pickle
        files: ^(app|scripts|mcp_.*|setup_.*|update_.*|verify_.*)\b.*\.py$

  # --- Security: bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (security, changed files)
        stages: [pre-commit]
        types: [python]
        # Changed-files only (fast path). Full scan added below on pre-push/CI.
        exclude: |
          ^frontend/|^node_modules/|^dist/|^build/|^test-results/|^\.venv/|^venv/|^cache/
        args:
          - -q
          - -s
          - B101

  # --- Vulnerabilities: safety (requirements scan)
  # Temporarily disabled - safety hook manifest issue
  # - repo: https://github.com/pyupio/safety
  #   rev: 3.2.8
  #   hooks:
  #     - id: safety
  #       name: safety (pip vulns)
  #       files: ^(?!frontend/).+requirements.*\.txt$
  #       args: [--full-report]
  #       stages: [pre-push]

  # --- Docstrings: pydocstyle (temporarily disabled for PR #142)
  # - repo: https://github.com/PyCQA/pydocstyle
  #   rev: 6.3.0
  #   hooks:
  #     - id: pydocstyle
  #       name: pydocstyle (docstrings)
  #       files: ^(?!frontend/).+\.py$
  #       # Customize conventions/ignore codes in pyproject.toml if needed
  #       args: [--convention=google]

  # --- Commit message lint (commitizen)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
        name: commitizen check (conventional commits)
        stages: [commit-msg]
        additional_dependencies: []
        # Expects a pyproject.toml with [tool.commitizen] config, otherwise uses defaults

  # --- Local composite hooks (pre-push): strict gates before remote
  - repo: local
    hooks:
      # ruff — строгий на pre-push (не пропускаем автофикс молча)
      - id: ruff-pre-push
        name: ruff (pre-push, strict)
        entry: ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]

      # bandit-full — полный security scan со smart excludes
      - id: bandit-full-pre-push
        name: bandit (pre-push, full repo)
        entry: bash -c "make bandit-full"
        language: system
        pass_filenames: false
        stages: [pre-push]

      # backend tests — run python tests before push
      - id: backend-tests-pre-push
        name: backend tests (pre-push)
        entry: bash -c "python -m pytest tests/ -x --tb=short --maxfail=5 -q"
        language: system
        pass_filenames: false
        stages: [pre-push]

      # frontend tests — run frontend tests before push
      - id: frontend-tests-pre-push
        name: frontend tests (pre-push)
        entry: bash -c "cd frontend && npm run test"
        language: system
        pass_filenames: false
        stages: [pre-push]

ci:
  autofix_commit_msg: "chore(pre-commit): auto-fix via pre-commit"
  autofix_prs: true
  skip: []
  submodules: false
