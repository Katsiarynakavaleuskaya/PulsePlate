repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--line-length=100]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
        args:
          - --config-file=pyproject.toml
          - app
          - core
        pass_filenames: false
  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest smoke
        entry: bash -lc 'pytest -q -k "smoke or quick or basic"'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: security-check
        name: Security scan before push
        entry: bash scripts/ci_bandit.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: env-check
        name: Environment smoke check
        entry: python scripts/env_check.py
        language: system
        stages: [pre-commit]
        pass_filenames: false
      - id: dependency-check
        name: Check for vulnerable dependencies
        entry: bash scripts/ci_pip_audit.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: main-branch-protection
        name: Protect main branch from direct push
        entry: bash scripts/check_main_branch_push.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
