repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^cache/
      - id: end-of-file-fixer
        exclude: ^cache/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Re-enabled with narrowed scope to avoid legacy type errors elsewhere.
    # Follow-up: broaden coverage to entire codebase after fixing types.
    # Task: "Expand mypy coverage beyond routers once types are fixed".
    rev: v1.11.2
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
        files: ^app/routers/.*\.py$

  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest-smoke
        entry: python3 -m pytest -q -m smoke --maxfail=1
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        env:
          PYTHONPATH: ".:core:app:tests"
          VIP_MODULE_ENABLED: "true"
          FEATURE_PREMIUM_NUTRITION: "true"
          APP_ENV: "test"
          API_KEY: "test_key"
        exclude: '(?:__pycache__|\.pyc$|tests/__pycache__)'
      - id: pytest
        name: pytest
        entry: python3 -m pytest --cov=. --cov-config=.coveragerc --cov-fail-under=97 -q --maxfail=5
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        env:
          PYTHONPATH: ".:core:app:tests"
          VIP_MODULE_ENABLED: "true"
          FEATURE_PREMIUM_NUTRITION: "true"
          APP_ENV: "test"
          API_KEY: "test_key"
