repos:
  # --- Generic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # --- Code style: Black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: black (python)
        files: ^(?!frontend/).+\.py$
        args: [--line-length=100]

  # --- Lint: Ruff (fast flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        files: ^(?!frontend/).+\.py$
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)
        files: ^(?!frontend/).+\.py$

  # --- Type checking: mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (type-check)
        # Staged rollout: Start with well-typed app modules (routers, services, schemas)
        # Roadmap: Q4 2025 - Expand to core/ (models.py, db.py, food_apis/)
        #          Q1 2026 - Full codebase coverage with targeted # type: ignore for legacy files
        files: ^app/.*\.py$
        args:
          - --pretty
          - --show-error-codes
          - --implicit-optional
          - --install-types
          - --non-interactive
          - --ignore-missing-imports

  # --- Security: bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (security)
        files: ^(?!frontend/).+\.py$
        args: [-q, -r, .]

  # --- Vulnerabilities: pip-audit (requirements scan)
  - repo: https://github.com/trailofbits/pip-audit
    rev: v2.7.2
    hooks:
      - id: pip-audit
        name: pip-audit (pip vulns)
        files: ^(?!frontend/).+requirements.*\.txt$
        args: [--full-report]
        stages: [pre-push]

  # --- Docstrings: pydocstyle
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstrings)
        files: ^(?!frontend/).+\.py$
        # Customize conventions/ignore codes in pyproject.toml if needed
        args: [--convention=google]

  # --- Commit message lint (commitizen)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
        name: commitizen check (conventional commits)
        stages: [commit-msg]
        additional_dependencies: []
        # Expects a pyproject.toml with [tool.commitizen] config, otherwise uses defaults

  # --- Local: run pytest only on push (avoid slowing down every commit)
  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit/integration)
        entry: bash -c "pytest -q --maxfail=1 --disable-warnings"
        language: system
        pass_filenames: false
        stages: [pre-push]

ci:
  autofix_commit_msg: "chore(pre-commit): auto-fix via pre-commit"
  autofix_prs: true
  skip: []
  submodules: false
