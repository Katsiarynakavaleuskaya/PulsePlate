repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^cache/
      - id: end-of-file-fixer
        exclude: ^cache/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Re-enabled with narrowed scope to avoid legacy type errors elsewhere.
    # Follow-up: broaden coverage to entire codebase after fixing types.
    # Task: "Expand mypy coverage beyond routers once types are fixed".
    rev: v1.18.2
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
        files: ^app/routers/.*\.py$

  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest-smoke
        entry: bash -c 'PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -m smoke --maxfail=1'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        env:
          PYTHONPATH: ".:core:app:tests"
          VIP_MODULE_ENABLED: "true"
          FEATURE_PREMIUM_NUTRITION: "true"
          APP_ENV: "test"
          API_KEY: "test_key"
          PYTHONDONTWRITEBYTECODE: "1"
      - id: pytest
        name: pytest
        entry: bash -c 'PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/ --ignore=tests/edges --cov=. --cov-config=.coveragerc --cov-fail-under=95 -q --maxfail=5; status=$?; git checkout -- data/food_aliases.csv cache/food_db/database_versions.json >/dev/null 2>&1 || true; exit $status'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        env:
          PYTHONPATH: ".:core:app:tests"
          VIP_MODULE_ENABLED: "true"
          FEATURE_PREMIUM_NUTRITION: "true"
          APP_ENV: "test"
          API_KEY: "test_key"
          PYTHONDONTWRITEBYTECODE: "1"
        verbose: true
