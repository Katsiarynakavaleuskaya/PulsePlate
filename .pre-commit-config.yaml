repos:
  # --- Generic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # Automatically fixes missing trailing newlines (POSIX requirement)
        # All text files must end with '\n' character
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  # --- Python cache cleanup
  - repo: local
    hooks:
      - id: clean-python-cache
        name: clean-python-cache
        entry: bash -c "find . -path ./.git -prune -o -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true; find . -path ./.git -prune -o -type f -name '*.pyc' -delete 2>/dev/null || true"
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # --- Code style: Black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: black (format)
        language_version: python3
        files: ^(?!frontend/).+\.py$

  # --- Lint: Ruff (fast flake8 + isort + type hints)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        name: ruff (lint, local)
        files: ^(?!frontend/).+\.py$
        args: [--fix]
      - id: ruff
        name: ruff (type hints check)
        files: ^(app/.*\.py|core/.*\.py|scripts/.*\.py|providers/.*\.py|(mcp_|setup_|update_|verify_).*\.py|(app|main|settings|secure_config|signed_links|llm|nutrition_core|nutrition_plate|bmi_core|bodyfat|bmi_visualization)\.py)$
        exclude: ^core/(db|auto_repair|data_sanitizer|business_bayesian_analyzer)\.py$
        args: [--select, ANN, --fix]  # Check and auto-fix type annotations
        stages: [pre-push]  # Run on pre-push for stricter enforcement

  # --- Type checking: mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (type-check)
        pass_filenames: false
        stages: [pre-push]
        args:
          - --pretty
          - --show-error-codes
          - app
          - core
        files: ^(app/.*\.py|core/.*\.py|scripts/.*\.py|mcp_.*\.py|setup_.*\.py|update_.*\.py|verify_.*\.py|app\.py|main\.py|settings\.py|secure_config\.py|signed_links\.py|llm\.py|nutrition_core\.py|nutrition_plate\.py|bmi_core\.py|bodyfat\.py|bmi_visualization\.py|providers/.*\.py)$

  # --- Security: bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (security, changed files)
        stages: [pre-commit]
        types: [python]
        # Changed-files only (fast path). Full scan added below on pre-push/CI.
        exclude: ^frontend/|^tests/|^tests_strict/|^node_modules/|^dist/|^build/|^test-results/|^\.venv/|^venv/|^cache/|^test_quick_check\.py$
        args:
          - -q
          - -c
          - pyproject.toml

  # --- Vulnerabilities: pip-audit (replacement for safety)
  - repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit
        name: pip-audit (pip vulns)
        stages: [pre-push]
        args: [--requirement, requirements.txt, --strict, --timeout, '60']

  # --- Docstrings: pydocstyle (re-enabled on pre-push)
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstrings)
        files: ^(?!frontend/).+\.py$
        stages: [manual]
        args: [--convention=google]

  # --- Commit message lint (commitizen)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
        name: commitizen check (conventional commits)
        stages: [commit-msg]
        additional_dependencies: []
        # Expects a pyproject.toml with [tool.commitizen] config, otherwise uses defaults

  # --- Local composite hooks (pre-push): strict gates before remote
  - repo: local
    hooks:
      # Check trailing newlines (POSIX compliance)
      # All text files must end with '\n' character per POSIX standard
      - id: check-trailing-newline
        name: check trailing newline (POSIX)
        entry: python3 scripts/check_trailing_newline.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]
        files: \.(py|sh)$

      # ruff — strict on pre-push (no silent auto-fix bypass)
      # Limited to working directories only (excludes tests) - ANN checks only
      - id: ruff-pre-push
        name: ruff (pre-push, strict)
        entry: bash -c "if ! command -v ruff >/dev/null 2>&1; then echo '⚠️  ruff not available, skipping pre-push check' && exit 0; else ruff check --select ANN app/ core/ scripts/ app.py main.py settings.py secure_config.py signed_links.py llm.py nutrition_core.py nutrition_plate.py bmi_core.py bodyfat.py bmi_visualization.py mcp_*.py setup_*.py update_*.py verify_*.py providers/; fi"
        language: system
        pass_filenames: false
        stages: [pre-push]

      # bandit-full — full security scan with smart excludes
      - id: bandit-full-pre-push
        name: bandit (pre-push, full repo)
        entry: bash -c "make bandit-full"
        language: system
        pass_filenames: false
        stages: [pre-push]

      # docker-build-test — test Docker build before push (with timeout)
      - id: docker-build-test
        name: docker build test
        entry: bash -c "if timeout 300 make docker-build 2>&1 | tail -50; then echo '✅ Docker build successful'; else echo '⚠️  Docker build failed or timed out after 5 minutes - check logs above'; exit 1; fi"
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(Dockerfile|\.dockerignore|docker-compose\.yaml|requirements\.txt|app/|core/|scripts/)

ci:
  autofix_commit_msg: "chore(pre-commit): auto-fix via pre-commit"
  autofix_prs: true
  skip: []
  submodules: false
