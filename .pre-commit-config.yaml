repos:
  # --- Generic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  # --- Code style: Black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: black (format)
        language_version: python3
        files: ^(?!frontend/).+\.py$

  # --- Lint: Ruff (fast flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint, local)
        files: ^(?!frontend/).+\.py$
        args: [--fix]
      - id: ruff-format
        name: ruff (format, local)
        files: ^(?!frontend/).+\.py$

  # --- Type checking: mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (type-check)
        args:
          - --pretty
          - --show-error-codes
          - --implicit-optional
          - --ignore-missing-imports
          - --install-types
          - --non-interactive
        files: ^(app/|scripts/|mcp_.*|setup_.*|update_.*|verify_.*).*\.(py)$

  # --- Security: bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (security, changed files)
        stages: [pre-commit]
        types: [python]
        # Changed-files only (fast path). Full scan added below on pre-push/CI.
        exclude: |
          ^frontend/|^node_modules/|^dist/|^build/|^test-results/|^\.venv/|^venv/|^cache/
        args:
          - -q
          - -s
          - B101

  # --- Vulnerabilities: safety (requirements scan)
  # Temporarily disabled - safety hook manifest issue
  # - repo: https://github.com/pyupio/safety
  #   rev: 3.2.8
  #   hooks:
  #     - id: safety
  #       name: safety (pip vulns)
  #       files: ^(?!frontend/).+requirements.*\.txt$
  #       args: [--full-report]
  #       stages: [pre-push]

  # --- Docstrings: pydocstyle (temporarily disabled)
  # - repo: https://github.com/PyCQA/pydocstyle
  #   rev: 6.3.0
  #   hooks:
  #     - id: pydocstyle
  #       name: pydocstyle (docstrings)
  #       files: ^(?!frontend/).+\.py$
  #       # Customize conventions/ignore codes in pyproject.toml if needed
  #       args: [--convention=google]

  # --- Commit message lint (commitizen)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
        name: commitizen check (conventional commits)
        stages: [commit-msg]
        additional_dependencies: []
        # Expects a pyproject.toml with [tool.commitizen] config, otherwise uses defaults

  # --- Frontend linting and testing: mandatory quality gates
  - repo: local
    hooks:
      - id: frontend-lint-fix
        name: frontend lint (autofix)
        entry: bash -c "cd frontend && export PATH=$PWD/node_modules/.bin:$PATH && npm run lint -- --fix"
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^frontend/

      - id: frontend-lint
        name: frontend lint (ESLint check)
        entry: bash -c "cd frontend && export PATH=$PWD/node_modules/.bin:$PATH && npm run lint"
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^frontend/

      - id: python-tests
        name: python tests (pytest, fast)
        entry: python -m pytest tests/ --tb=line --disable-warnings --maxfail=3
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]

      - id: frontend-tests
        name: frontend tests (Vitest, fast)
        entry: bash -c "cd frontend && npm run test -- --run --reporter=basic"
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^frontend/

  # --- Additional quality gates (pre-push only)
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck (tsc)
        entry: bash -c "cd frontend && npm run typecheck"
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^frontend/

      - id: frontend-build
        name: frontend build (vite)
        entry: bash -c "cd frontend && npm run build"
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^frontend/

      - id: python-tests-strict
        name: python tests (tests_strict)
        entry: bash -c 'test -d tests_strict && python -m pytest tests_strict/ --maxfail=1 --tb=short --disable-warnings || echo "Skipping tests_strict - directory not found"'
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]

      - id: pip-check
        name: pip dependency check
        entry: python -m pip check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: npm-audit
        name: npm audit (prod deps)
        entry: bash -c "cd frontend && npm audit --omit=dev --audit-level=high"
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ruff-pre-push
        name: ruff (pre-push, strict)
        entry: ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: bandit-full-pre-push
        name: bandit (pre-push, full repo)
        entry: bash -c "make bandit-full"
        language: system
        pass_filenames: false
        stages: [pre-push]

ci:
  autofix_commit_msg: "chore(pre-commit): auto-fix via pre-commit"
  autofix_prs: true
  skip: []
  submodules: false
