repos:
  # --- Generic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  # --- Python cache cleanup
  - repo: local
    hooks:
      - id: clean-python-cache
        name: clean-python-cache
        entry: bash -c "find . -path ./.git -prune -o -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true; find . -path ./.git -prune -o -type f -name '*.pyc' -delete 2>/dev/null || true"
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # --- Code style: Black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: black (format)
        language_version: python3
        files: ^(?!frontend/).+\.py$

  # --- Lint: Ruff (fast flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        name: ruff (lint, local)
        files: ^(?!frontend/).+\.py$
        args: [--fix]

  # --- Type checking: mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (type-check)
        args:
          - --pretty
          - --show-error-codes
          - --implicit-optional
          - --ignore-missing-imports
          - --install-types
          - --non-interactive
        files: ^(app|app/.*\.py|scripts/.*\.py|tests/.*\.py|mcp_.*\.py|setup_.*\.py|update_.*\.py|verify_.*\.py)$

  # --- Security: bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (security, changed files)
        stages: [pre-commit]
        types: [python]
        # Changed-files only (fast path). Full scan added below on pre-push/CI.
        exclude: |
          ^frontend/|^tests/|^tests_strict/|^node_modules/|^dist/|^build/|^test-results/|^\.venv/|^venv/|^cache/
        args:
          - -q
          - -s
          - B101

  # --- Vulnerabilities: pip-audit (replacement for safety)
  - repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit
        name: pip-audit (pip vulns)
        stages: [pre-push]
        args: [--requirement, requirements.txt, --strict]

  # --- Docstrings: pydocstyle (re-enabled on pre-push)
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstrings)
        files: ^(?!frontend/).+\.py$
        stages: [pre-push]
        args: [--convention=google]

  # --- Commit message lint (commitizen)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
        name: commitizen check (conventional commits)
        stages: [commit-msg]
        additional_dependencies: []
        # Expects a pyproject.toml with [tool.commitizen] config, otherwise uses defaults

  # --- Local composite hooks (pre-push): strict gates before remote
  - repo: local
    hooks:
      # ruff — strict on pre-push (no silent auto-fix bypass)
      - id: ruff-pre-push
        name: ruff (pre-push, strict)
        entry: ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]

      # bandit-full — full security scan with smart excludes
      - id: bandit-full-pre-push
        name: bandit (pre-push, full repo)
        entry: bash -c "make bandit-full"
        language: system
        pass_filenames: false
        stages: [pre-push]

      # docker-build-test — test Docker build before push
      - id: docker-build-test
        name: docker build test
        entry: bash -c "make docker-build && echo '✅ Docker build successful'"
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(Dockerfile|\.dockerignore|docker-compose\.yaml|requirements\.txt|app/|core/|scripts/)

ci:
  autofix_commit_msg: "chore(pre-commit): auto-fix via pre-commit"
  autofix_prs: true
  skip: []
  submodules: false
