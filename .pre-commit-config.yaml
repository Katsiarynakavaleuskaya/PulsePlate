repos:
  # --- Generic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # --- Code style: Black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: black (python)
        files: ^(?!frontend/).+\.py$
        args: [--line-length=100]

  # --- Lint: Ruff (fast flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        files: ^(?!frontend/).+\.py$
        args: [--fix]
      - id: ruff-format
        name: ruff (format)
        files: ^(?!frontend/).+\.py$

  # --- Type checking: mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (type-check)
        files: ^(?!frontend/).+\.py$
        args:
          - --pretty
          - --show-error-codes
          - --implicit-optional
          - --install-types
          - --non-interactive

  # --- Security: bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (security)
        files: ^(?!frontend/).+\.py$
        args: [-q, -r, .]

  # --- Vulnerabilities: safety (requirements scan)
  # Temporarily disabled due to manifest issues
  # - repo: https://github.com/pyupio/safety
  #   rev: 3.2.8
  #   hooks:
  #     - id: safety
  #       name: safety (pip vulns)
  #       files: ^(?!frontend/).+requirements.*\.txt$
  #       args: [--full-report]
  #       stages: [pre-push]

  # --- Docstrings: pydocstyle
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstrings)
        files: ^(?!frontend/).+\.py$
        # Customize conventions/ignore codes in pyproject.toml if needed
        args: [--convention=google]

  # --- Commit message lint (commitizen)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
        name: commitizen check (conventional commits)
        stages: [commit-msg]
        additional_dependencies: []
        # Expects a pyproject.toml with [tool.commitizen] config, otherwise uses defaults

  # --- Local: run pytest only on push (avoid slowing down every commit)
  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit/integration)
        entry: bash -c "pytest -q --maxfail=1 --disable-warnings"
        language: system
        pass_filenames: false
        stages: [pre-push]

ci:
  autofix_commit_msg: "chore(pre-commit): auto-fix via pre-commit"
  autofix_prs: true
  skip: []
  submodules: false
