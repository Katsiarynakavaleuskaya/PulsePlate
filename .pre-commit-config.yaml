# Pre-commit hooks for PulsePlate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--ignore=E203,W503,F601"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
  - repo: local
    hooks:
      - id: pytest-check
        name: Run quick smoke tests before commit
        entry: bash -c 'pytest -q test_quick_check.py test_setup.py -x'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: coverage-check
        name: Check coverage >=97% before push (CI only)
        entry: bash -c 'if [ "$CI" = "true" ] || [ "$GITHUB_ACTIONS" = "true" ]; then echo "[coverage-check] CI detected, enforcing coverage >=97%"; coverage run -m pytest && coverage report --fail-under=97; else echo "[coverage-check] Local push detected, skipping coverage gate (CI enforces it)"; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: security-check
        name: Security scan before push
        entry: bash scripts/ci_bandit.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: dependency-check
        name: Check for vulnerable dependencies
        entry: bash scripts/ci_pip_audit.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: main-branch-protection
        name: Protect main branch from direct push
        entry: bash -c 'scripts/check_main_branch_push.sh'
        language: system
        stages: [pre-push]
        pass_filenames: false
