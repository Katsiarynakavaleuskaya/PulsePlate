# Staging environment configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulseplate-staging-config
data:
  APP_ENV: "staging"
  DEBUG: "true"
  VIP_MODULE_ENABLED: "true"
  FEATURE_PREMIUM_NUTRITION: "true"
  API_KEY: "staging_key"
  DATABASE_URL: "sqlite:///staging.db"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseplate-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulseplate-staging
  template:
    metadata:
      labels:
        app: pulseplate-staging
    spec:
      containers:
      - name: pulseplate
        image: ghcr.io/katsiarynakavaleuskaya/pulseplate:staging
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: pulseplate-staging-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulseplate-staging-service
spec:
  selector:
    app: pulseplate-staging
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
