# Optional staging runtime only. The canonical split deploy contract lives in
# `deploy/docker-compose.production.yaml` and
# `deploy/docker-compose.production.selfhosted.yaml`.
# This file remains a temporary staging seam while the fallback-vhost / staging
# deploy-enablement work tracked in
# `docs/roadmap/BACKLOG_LEDGER.md#ledger-p1-remove-staging-tls-fallback-seam-after-full-staging-readiness`
# is still open.
networks:
  web:
    external: false
  observability:
    internal: true

secrets:
  pulseplate_metrics_scrape_key:
    file: ./secrets/pulseplate_metrics_scrape_key

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - ${STAGING_ENV_FILE:-/srv/pulseplate-staging/.env}
    restart: always
    networks: [web]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${STAGING_IMAGE_REF:?STAGING_IMAGE_REF is required}
    env_file:
      - ${STAGING_ENV_FILE:-/srv/pulseplate-staging/.env}   # server-local secrets
    restart: always
    networks: [web, observability]
    secrets:
      - pulseplate_metrics_scrape_key
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - FOOD_UPDATE_SCHEDULER_MODE=${FOOD_UPDATE_SCHEDULER_MODE:-external}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - food_db_cache:/app/cache/food_db
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips="caddy"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: ${STAGING_IMAGE_REF:?STAGING_IMAGE_REF is required}
    profiles: ["scheduler-external"]
    restart: unless-stopped
    networks: [web]
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - FOOD_UPDATE_SCHEDULER_MODE=${FOOD_UPDATE_SCHEDULER_MODE:-external}
    command: python -m core.food_apis.scheduler --serve
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - food_db_cache:/app/cache/food_db
    healthcheck:
      disable: true

  prometheus:
    image: prom/prometheus@sha256:84f0d46e960e86b6965d2e4d99a06f92f176dd75a31ead99126a009891e00f22
    platform: linux/amd64
    user: "65532:65532"
    restart: unless-stopped
    networks: [observability]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - pulseplate_metrics_scrape_key
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  caddy:
    image: ${STAGING_CADDY_IMAGE_REF:?STAGING_CADDY_IMAGE_REF is required}
    restart: always
    networks: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - STAGING_DOMAIN=${STAGING_DOMAIN}
    volumes:
      - /srv/pulseplate-staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  food_db_cache:
  caddy_data:
  caddy_config:
  prometheus_data:
