# Production on a single Droplet with colocated PostgreSQL (self-hosted lane).
# For managed PostgreSQL + same host edge, use docker-compose.production.yaml instead.
#
# Run from repo root (or set COMPOSE_FILE + PROJECT_DIR for backup scripts):
#   docker compose --profile scheduler-external --project-directory deploy \
#     -f deploy/docker-compose.production.selfhosted.yaml up -d
#
# Requires deploy/.env with IMAGE_REF, POSTGRES_*, PRODUCTION_DOMAIN, etc.
# The app service sets DATABASE_URL from POSTGRES_* to force the colocated postgres service.

networks:
  web:
    external: false
    ipam:
      config:
        - subnet: 172.30.100.0/24
  observability:
    internal: true

secrets:
  pulseplate_metrics_scrape_key:
    file: ./secrets/pulseplate_metrics_scrape_key

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks: [web]
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    restart: unless-stopped
    networks: [web, observability]
    secrets:
      - pulseplate_metrics_scrape_key
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      # Force colocated Postgres on the compose network (ignore stale managed DATABASE_URL in .env).
      # Match SQLAlchemy driver in `.env.example` (`postgresql+psycopg://`). Use URL-safe passwords
      # or percent-encode reserved URI characters in POSTGRES_PASSWORD.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FOOD_UPDATE_SCHEDULER_MODE=${FOOD_UPDATE_SCHEDULER_MODE:-external}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - food_db_cache:/app/cache/food_db
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers
      --forwarded-allow-ips="caddy"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    profiles: ["scheduler-external"]
    restart: unless-stopped
    networks: [web]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FOOD_UPDATE_SCHEDULER_MODE=${FOOD_UPDATE_SCHEDULER_MODE:-external}
    command: python -m core.food_apis.scheduler --serve
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - food_db_cache:/app/cache/food_db
    healthcheck:
      disable: true

  prometheus:
    image: prom/prometheus:v3.14.0-distroless@sha256:934c331c7aa29ffdb23b4befec6f34321c518453e63713d741d8ac1737c8e049
    platform: linux/amd64
    user: "65532:65532"
    restart: unless-stopped
    networks: [observability]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - pulseplate_metrics_scrape_key
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  caddy:
    build:
      context: ../frontend
      dockerfile: Dockerfile.caddy-spa
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    restart: unless-stopped
    networks: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN:?PRODUCTION_DOMAIN is required}
      - STAGING_FALLBACK_DOMAIN=${STAGING_FALLBACK_DOMAIN:-pulseplate-staging.duckdns.org}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  food_db_cache:
  caddy_data:
  caddy_config:
  prometheus_data:
