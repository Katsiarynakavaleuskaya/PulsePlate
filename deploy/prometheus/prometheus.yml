global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: ${PULSEPLATE_ENVIRONMENT}

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alias-alerts.yml

scrape_configs:
  - job_name: pulseplate-api
    scheme: http
    metrics_path: /metrics
    http_headers:
      X-API-Key:
        files:
          - /run/secrets/pulseplate_metrics_scrape_key
    static_configs:
      - targets:
          - app:8000
    metric_relabel_configs:
      - action: labeldrop
        regex: ^environment$
