version: '3.8'

services:
  pulseplate-production:
    image: ghcr.io/katsiarynakavaleuskaya/pulseplate:latest
    container_name: pulseplate-production
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    env_file:
      - .env  # See .env file for DATABASE_URL configuration
      - ./ollama-configs/cloud.env  # Ollama Cloud config
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: pulseplate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl  # Ensure SSL certs exist and are properly permissioned (chmod 600 for keys, 644 for certs)
    depends_on:
      - pulseplate-production
    restart: unless-stopped
