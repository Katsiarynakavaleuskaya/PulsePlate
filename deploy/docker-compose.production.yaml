networks:
  web:
    external: false
    # Pin the subnet so uvicorn can safely trust forwarded headers only from this
    # internal Docker network (instead of "*"). If this subnet conflicts with
    # your host/VPC, change it and keep --forwarded-allow-ips in sync below.
    ipam:
      config:
        - subnet: 172.30.100.0/24
  observability:
    internal: true

secrets:
  pulseplate_metrics_scrape_key:
    file: ./secrets/pulseplate_metrics_scrape_key

services:
  app:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    restart: unless-stopped
    networks: [web, observability]
    secrets:
      - pulseplate_metrics_scrape_key
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      # Production uses an external managed PostgreSQL instance.
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - FOOD_UPDATE_SCHEDULER_MODE=${FOOD_UPDATE_SCHEDULER_MODE:-external}
    volumes:
      - food_db_cache:/app/cache/food_db
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers
      --forwarded-allow-ips="172.30.100.0/24"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    profiles: ["scheduler-external"]
    restart: unless-stopped
    networks: [web]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - FOOD_UPDATE_SCHEDULER_MODE=${FOOD_UPDATE_SCHEDULER_MODE:-external}
    command: python -m core.food_apis.scheduler --serve
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - food_db_cache:/app/cache/food_db
    healthcheck:
      disable: true

  prometheus:
    image: prom/prometheus:v3.14.0-distroless@sha256:934c331c7aa29ffdb23b4befec6f34321c518453e63713d741d8ac1737c8e049
    platform: linux/amd64
    user: "65532:65532"
    restart: unless-stopped
    networks: [observability]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - pulseplate_metrics_scrape_key
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  caddy:
    build:
      context: ../frontend
      dockerfile: Dockerfile.caddy-spa
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    restart: unless-stopped
    networks: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN}
      - STAGING_FALLBACK_DOMAIN=${STAGING_FALLBACK_DOMAIN:-pulseplate-staging.duckdns.org}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  food_db_cache:
  caddy_data:
  caddy_config:
  prometheus_data:
