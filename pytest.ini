[pytest]
testpaths = tests
python_files = test_*.py
# Exclude disabled hypothesis tests and other problematic tests
addopts =
    --ignore=tests/disabled_hypothesis/
    --maxfail=5
    --tb=short
filterwarnings =
    ignore::PendingDeprecationWarning
    # Silence specific runtime warnings from intentional AsyncMock usage in tests
    # These are known test patterns where AsyncMock creates coroutines that are intentionally not awaited
    ignore:coroutine 'DatabaseUpdateScheduler\.(start|stop|_update_loop|force_update)' was never awaited:RuntimeWarning:core\.food_apis\.scheduler
    ignore:coroutine 'DatabaseUpdateScheduler\._update_loop' was never awaited:RuntimeWarning:unittest\.mock
markers =
    asyncio: mark test as using asyncio
    smoke: fast smoke tests for critical endpoints
    slow: slow tests that should only run in nightly builds
    demo: demo tests with verbose output (run with --capture=no)
    serial: mark test to run serially (not in parallel) to avoid race conditions
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
