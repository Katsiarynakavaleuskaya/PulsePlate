[pytest]
# Основная конфигурация pytest
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Асинхронные тесты
asyncio_mode = auto

# Покрытие кода
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=5
    -ra

# Маркеры
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    performance: marks tests as performance tests
    coverage: marks tests as coverage tests
    monte_carlo: marks tests as Monte Carlo tests
    bayesian: marks tests as Bayesian analysis tests
    hypothesis: marks tests using Hypothesis property-based testing
    smoke: marks tests as smoke tests
    demo: marks tests as demo tests
    quarantined: marks tests as quarantined (skip in PR)

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pydantic.*
    ignore::DeprecationWarning:pydantic.*

# Плагины (удаляем - они загружаются автоматически)

# Параллельное выполнение
# -n auto для автоматического определения количества процессов
# -n 0 для отключения параллельного выполнения

# Таймауты (удаляем - не поддерживается в базовом pytest)

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Байесовская диагностика
# Автоматически активируется при импорте pytest_bayesian_plugin
