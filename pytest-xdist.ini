# pytest-xdist configuration for optimal parallel test execution

[tool:pytest]
# Parallel execution settings
addopts = --dist=worksteal -n auto

# Test distribution strategy
# worksteal: Dynamic load balancing - fastest tests get more work
# load: Static distribution based on test file size
# loadscope: Distribute by test class/function scope
# loadfile: Distribute by test file

# Worker settings
# -n auto: Use all available CPU cores
# -n 4: Use exactly 4 workers
# -n 0: Disable parallel execution

# Coverage settings for parallel execution
# Each worker collects coverage separately, then merged
--cov=core
--cov=app
--cov-report=xml
--cov-report=term-missing
--cov-fail-under=97

# Performance optimizations
--tb=short
--maxfail=10
--durations=10

# Parallel execution compatibility
# Some tests may need to be marked as non-parallel
markers =
    no_parallel: mark test as not suitable for parallel execution
    slow: mark test as slow running
    integration: mark test as integration test
