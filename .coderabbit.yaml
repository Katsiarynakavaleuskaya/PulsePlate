# CodeRabbit configuration for PulsePlate
# https://docs.coderabbit.ai/guides/customization

language: en-US

tone_instructions: |
  Focus on health/nutrition domain best practices.
  Maintain 97% test coverage requirement.
  Follow Apple HIG guidelines for iOS components.
  Use FastAPI best practices for backend.
  Prioritize user experience and accessibility.
  Ensure all tests pass before suggesting changes.
  Prefer explicit over implicit code.
  Add type hints for all functions.
  Use descriptive variable and function names.
  Follow PEP 8 style guidelines.

reviews:
  auto_review:
    enabled: true
  profile: chill
  path_filters:
    - "**/*.py"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.md"
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.json"
    - "!**/node_modules/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/venv/**"
    - "!**/.venv/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/htmlcov/**"
    - "!**/.pytest_cache/**"
    - "!**/cache/**"
    - "!**/releases/**"
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Format all Python code with Black using max line length 100.
        Require type hints for all functions in Python code.
        Use Pydantic v2 APIs (model_dump(), model_validate()) instead of deprecated v1 methods.
        Follow PEP 8 style guidelines.
        Maintain 97% test coverage requirement.
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: |
        Follow TypeScript/JavaScript best practices.
        Use proper type annotations.
        Follow React best practices for components.
        Maintain accessibility standards.
    - path: "**/*.md"
      instructions: |
        Use clear, concise documentation.
        Include code examples where appropriate.
        Follow markdown best practices.
