<!DOCTYPE html>
<!--
    THIS IS A TEMPLATE THAT SHOULD BE USED EVERY TIME AND MODIFIED.
    WHAT TO KEEP:
    ✓ Overall structure (header, sidebar, main content)
    ✓ Anthropic branding (colors, fonts, layout)
    ✓ Seed navigation section (always include this)
    ✓ Self-contained artifact (everything inline)

    WHAT TO CREATIVELY EDIT:
    ✗ The p5.js algorithm (implement YOUR vision)
    ✗ The parameters (define what YOUR art needs)
    ✗ The UI controls (match YOUR parameters)

    Let your philosophy guide the implementation.
    The world is your oyster - be creative!
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Art Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Memory Constellation</h1>
            <div class="subtitle">Protocol drift, repair loops, and bounded research—rendered as a seeded field.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (CUSTOMIZE THIS FOR YOUR ART) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="800" max="12000" step="200" value="4200" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">4200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Drift Speed</label>
                    <div class="slider-container">
                        <input type="range" id="driftSpeed" min="0.1" max="2.5" step="0.1" value="0.7" oninput="updateParam('driftSpeed', this.value)">
                        <span class="value-display" id="driftSpeed-value">0.7</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Orbit Strength</label>
                    <div class="slider-container">
                        <input type="range" id="orbitStrength" min="0.0" max="2.5" step="0.05" value="0.9" oninput="updateParam('orbitStrength', this.value)">
                        <span class="value-display" id="orbitStrength-value">0.9</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.0005" max="0.01" step="0.0005" value="0.003" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.003</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Conflict Rate</label>
                    <div class="slider-container">
                        <input type="range" id="conflictRate" min="0.0" max="0.5" step="0.01" value="0.12" oninput="updateParam('conflictRate', this.value)">
                        <span class="value-display" id="conflictRate-value">0.12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Repair Rate</label>
                    <div class="slider-container">
                        <input type="range" id="repairRate" min="0.0" max="1.0" step="0.01" value="0.25" oninput="updateParam('repairRate', this.value)">
                        <span class="value-display" id="repairRate-value">0.25</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Fade</label>
                    <div class="slider-container">
                        <input type="range" id="trailFade" min="0" max="80" step="1" value="12" oninput="updateParam('trailFade', this.value)">
                        <span class="value-display" id="trailFade-value">12</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (OPTIONAL - CUSTOMIZE OR REMOVE) -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Canonical</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#6a9bcc" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#6a9bcc</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Untrusted</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#d97757" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#d97757</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Conflict</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#788c5d" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#788c5d</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS - CUSTOMIZE FOR YOUR ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            particleCount: 4200,
            driftSpeed: 0.7,
            orbitStrength: 0.9,
            noiseScale: 0.003,
            conflictRate: 0.12,
            repairRate: 0.25,
            trailFade: 12,
            colorPalette: ['#6a9bcc', '#d97757', '#788c5d']
        };

        let defaultParams = {...params}; // Store defaults for reset

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS GENERATIVE ART ALGORITHM - REPLACE WITH YOUR VISION
        // ═══════════════════════════════════════════════════════════════════════

        let particles = [];
        let anchors = [];
        let zOff = 0;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');

            pixelDensity(2);
            strokeCap(ROUND);
            noFill();

            initializeSystem();

            // Remove loading message
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            zOff = 0;

            anchors = buildAnchors();
            particles = [];

            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle(i));
            }

            background(250, 249, 245);
        }

        function buildAnchors() {
            // A ring of "canonical sources"—stable attractors in the field.
            const labels = ['Workflow', 'KPP', 'Envelopes', 'Research', 'Reflection', 'Contracts'];
            const r = width * 0.32;
            const center = createVector(width / 2, height / 2);

            let out = [];
            for (let i = 0; i < labels.length; i++) {
                const a = (TWO_PI * i) / labels.length - PI / 2;
                const pos = createVector(center.x + cos(a) * r, center.y + sin(a) * r);
                out.push({ id: i, label: labels[i], pos });
            }
            return out;
        }

        function draw() {
            // Fade background to accumulate evidence-like trails.
            background(250, 249, 245, constrain(params.trailFade, 0, 80));

            // Soft anchor glow.
            drawAnchors();

            // Evolve a slow "history" dimension.
            zOff += 0.0025;

            for (let p of particles) {
                p.step();
                p.render();
            }
        }

        function drawAnchors() {
            for (let a of anchors) {
                const c = color(params.colorPalette[0]);
                c.setAlpha(55);
                stroke(c);
                strokeWeight(1.2);
                circle(a.pos.x, a.pos.y, 10);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // PARTICLE SYSTEM - CUSTOMIZE FOR YOUR ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        class Particle {
            constructor(i) {
                this.i = i;
                this.pos = createVector(random(width), random(height));
                this.prev = this.pos.copy();
                this.vel = p5.Vector.random2D().mult(0.5);

                // Types:
                // - 0: canonical-seeking (stable)
                // - 1: untrusted (noisier drift)
                // - 2: conflict (pulled by two anchors until repaired)
                this.type = random() < params.conflictRate ? 2 : (random() < 0.35 ? 1 : 0);

                this.anchorA = floor(random(anchors.length));
                this.anchorB = (this.type === 2) ? (this.anchorA + floor(random(1, anchors.length))) % anchors.length : -1;

                this.mass = random(0.6, 1.4);
                this.age = 0;
            }

            step() {
                this.age += 1;

                // Flow drift from a layered noise field.
                const n = noise(this.pos.x * params.noiseScale, this.pos.y * params.noiseScale, zOff);
                const ang = n * TWO_PI * 2.0;
                const drift = p5.Vector.fromAngle(ang).mult(params.driftSpeed * 0.55);

                // Attraction to canonical anchors.
                const a1 = anchors[this.anchorA].pos;
                let f1 = p5.Vector.sub(a1, this.pos);
                const d1 = max(12, f1.mag());
                f1.normalize();
                f1.mult((params.orbitStrength * 1.2) / sqrt(d1));

                let force = drift.add(f1);

                // Untrusted particles exaggerate drift.
                if (this.type === 1) {
                    const jitter = p5.Vector.random2D().mult(0.15);
                    force.add(jitter);
                }

                // Conflict particles: pulled by two anchors; interference creates "drift".
                if (this.type === 2 && this.anchorB >= 0) {
                    const a2 = anchors[this.anchorB].pos;
                    let f2 = p5.Vector.sub(a2, this.pos);
                    const d2 = max(12, f2.mag());
                    f2.normalize();
                    f2.mult((params.orbitStrength * 1.2) / sqrt(d2));

                    // A gentle repulsion from the segment midpoint—keeps the conflict visible.
                    const mid = p5.Vector.add(a1, a2).mult(0.5);
                    let rep = p5.Vector.sub(this.pos, mid);
                    const dr = max(40, rep.mag());
                    rep.normalize();
                    rep.mult(0.55 / sqrt(dr));

                    force.add(f2);
                    force.add(rep);

                    // Repair impulse: probabilistically collapse contradiction to one anchor.
                    const repairProb = params.repairRate * 0.0025;
                    if (random() < repairProb) {
                        this.type = 0;
                        this.anchorB = -1;
                        // Damping as "repair": the system re-enters with stricter structure.
                        this.vel.mult(0.55);
                    }
                }

                // Integrate.
                force.mult(1.0 / this.mass);
                this.vel.add(force);
                this.vel.mult(0.92);
                this.vel.limit(3.0);

                this.prev.set(this.pos);
                this.pos.add(this.vel);

                // Wrap edges.
                if (this.pos.x < 0) this.pos.x += width;
                if (this.pos.x > width) this.pos.x -= width;
                if (this.pos.y < 0) this.pos.y += height;
                if (this.pos.y > height) this.pos.y -= height;
            }

            render() {
                let col;
                if (this.type === 0) col = color(params.colorPalette[0]);       // canonical
                else if (this.type === 1) col = color(params.colorPalette[1]);  // untrusted
                else col = color(params.colorPalette[2]);                        // conflict

                // Aged particles fade slightly—old “claims” become less salient.
                const a = 52 - min(26, this.age / 240);
                col.setAlpha(a);

                stroke(col);
                strokeWeight(this.type === 2 ? 1.15 : 0.9);
                line(this.prev.x, this.prev.y, this.pos.x, this.pos.y);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS - CUSTOMIZE FOR YOUR PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            // Keep UI displays in sync.
            document.getElementById(`${paramName}-value`).textContent = value;

            // Parse numeric values (sliders provide strings).
            const numeric = paramName === 'particleCount' || paramName === 'trailFade'
                ? parseInt(value, 10)
                : parseFloat(value);

            params[paramName] = numeric;

            // Some params require a full re-init for determinism.
            if (paramName === 'particleCount' || paramName === 'noiseScale') {
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            document.getElementById(`${colorId}-value`).textContent = value;

            const idx = colorId === 'color1' ? 0 : (colorId === 'color2' ? 1 : 2);
            params.colorPalette[idx] = value;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};

            // Update UI elements
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('driftSpeed').value = params.driftSpeed;
            document.getElementById('driftSpeed-value').textContent = params.driftSpeed;
            document.getElementById('orbitStrength').value = params.orbitStrength;
            document.getElementById('orbitStrength-value').textContent = params.orbitStrength;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('conflictRate').value = params.conflictRate;
            document.getElementById('conflictRate-value').textContent = params.conflictRate;
            document.getElementById('repairRate').value = params.repairRate;
            document.getElementById('repairRate-value').textContent = params.repairRate;
            document.getElementById('trailFade').value = params.trailFade;
            document.getElementById('trailFade-value').textContent = params.trailFade;

            // Reset colors
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
