<!DOCTYPE html>
<!--
    THIS IS A TEMPLATE THAT SHOULD BE USED EVERY TIME AND MODIFIED.
    WHAT TO KEEP:
    ✓ Overall structure (header, sidebar, main content)
    ✓ Anthropic branding (colors, fonts, layout)
    ✓ Seed navigation section (always include this)
    ✓ Self-contained artifact (everything inline)

    WHAT TO CREATIVELY EDIT:
    ✗ The p5.js algorithm (implement YOUR vision)
    ✗ The parameters (define what YOUR art needs)
    ✗ The UI controls (match YOUR parameters)

    Let your philosophy guide the implementation.
    The world is your oyster - be creative!
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Art Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Convergent Orchestration</h1>
            <div class="subtitle">Flow-field governance where divergence and consensus co-create structure.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (CUSTOMIZE THIS FOR YOUR ART) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Agent Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="800" max="6000" step="200" value="2600" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">2600</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Field Tension</label>
                    <div class="slider-container">
                        <input type="range" id="fieldTension" min="0.2" max="2.2" step="0.1" value="1.2" oninput="updateParam('fieldTension', this.value)">
                        <span class="value-display" id="fieldTension-value">1.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Consensus Pulse</label>
                    <div class="slider-container">
                        <input type="range" id="consensusPulse" min="0.0" max="2.0" step="0.05" value="0.95" oninput="updateParam('consensusPulse', this.value)">
                        <span class="value-display" id="consensusPulse-value">0.95</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.02" step="0.001" value="0.006" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.006</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Memory</label>
                    <div class="slider-container">
                        <input type="range" id="trailLength" min="4" max="40" step="1" value="18" oninput="updateParam('trailLength', this.value)">
                        <span class="value-display" id="trailLength-value">18</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (OPTIONAL - CUSTOMIZE OR REMOVE) -->
            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Base Field</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#d97757</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Consensus Band</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#6a9bcc</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Residual Drift</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#788c5d" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#788c5d</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            particleCount: 2600,
            fieldTension: 1.2,
            consensusPulse: 0.95,
            noiseScale: 0.006,
            trailLength: 18,
            colorPalette: ["#d97757", "#6a9bcc", "#788c5d"],
        };

        let defaultParams = { ...params };
        let particles = [];
        let flowField = [];
        let cols, rows;
        const scl = 12;
        let consensusClock = 0.0;

        function setup() {
            const canvas = createCanvas(1200, 1200);
            canvas.parent("canvas-container");
            pixelDensity(1);
            initializeSystem();
            document.querySelector(".loading").style.display = "none";
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            particles = [];
            cols = floor(width / scl);
            rows = floor(height / scl);
            flowField = new Array(cols * rows);
            for (let i = 0; i < params.particleCount; i += 1) {
                particles.push(new Particle());
            }
            consensusClock = 0.0;
            background(250, 249, 245);
        }

        function generateFlowField() {
            const pulse = (sin(consensusClock) + 1.0) * 0.5 * params.consensusPulse;
            let yOff = 0.0;
            for (let y = 0; y < rows; y += 1) {
                let xOff = 0.0;
                for (let x = 0; x < cols; x += 1) {
                    const idx = x + y * cols;
                    const nx = xOff + params.seed * 0.00009;
                    const ny = yOff + params.seed * 0.00007;
                    const n = noise(nx, ny);

                    const baseAngle = n * TWO_PI * 2.0;
                    const latticeAngle = atan2(y - rows / 2, x - cols / 2) + HALF_PI;
                    const braid = sin((x + y) * 0.13 + consensusClock * 1.2) * 0.6;

                    const angle =
                        baseAngle * (1.0 - pulse * 0.55) +
                        (latticeAngle + braid) * (pulse * 0.55);

                    const v = p5.Vector.fromAngle(angle);
                    v.setMag(map(n, 0, 1, 0.25, 1.0) * params.fieldTension);
                    flowField[idx] = v;
                    xOff += params.noiseScale;
                }
                yOff += params.noiseScale;
            }
        }

        function draw() {
            // Slow fade to retain flow memory while avoiding over-saturation.
            noStroke();
            fill(250, 249, 245, map(params.trailLength, 4, 40, 16, 4));
            rect(0, 0, width, height);

            consensusClock += 0.013;
            generateFlowField();

            for (let i = 0; i < particles.length; i += 1) {
                particles[i].follow(flowField);
                particles[i].update();
                particles[i].edges();
                particles[i].show();
            }
        }

        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = random(1.2, 2.8);
                this.prevPos = this.pos.copy();
                this.colorPhase = random();
            }

            update() {
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed * map(params.fieldTension, 0.2, 2.2, 0.75, 1.3));
                this.pos.add(this.vel);
                this.acc.mult(0);
            }

            applyForce(force) {
                this.acc.add(force);
            }

            follow(vectors) {
                const x = floor(this.pos.x / scl);
                const y = floor(this.pos.y / scl);
                const idx = x + y * cols;
                const force = vectors[idx];
                if (force) {
                    this.applyForce(force);
                }
            }

            show() {
                const speedNorm = this.vel.mag() / max(this.maxSpeed, 0.0001);
                const pulseNorm = (sin(consensusClock * 2.0 + this.colorPhase * TWO_PI) + 1.0) * 0.5;
                const blend = constrain((speedNorm + pulseNorm) * 0.5, 0, 1);

                const c1 = color(params.colorPalette[0]);
                const c2 = color(params.colorPalette[1]);
                const c3 = color(params.colorPalette[2]);
                const c12 = lerpColor(c1, c2, blend);
                const tone = lerpColor(c12, c3, abs(0.5 - pulseNorm) * 1.25);
                tone.setAlpha(map(params.trailLength, 4, 40, 190, 65));

                stroke(tone);
                strokeWeight(map(params.fieldTension, 0.2, 2.2, 0.55, 1.45));
                line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
                this.updatePrev();
            }

            updatePrev() {
                this.prevPos.x = this.pos.x;
                this.prevPos.y = this.pos.y;
            }

            edges() {
                let wrapped = false;
                if (this.pos.x > width) {
                    this.pos.x = 0;
                    wrapped = true;
                } else if (this.pos.x < 0) {
                    this.pos.x = width;
                    wrapped = true;
                }
                if (this.pos.y > height) {
                    this.pos.y = 0;
                    wrapped = true;
                } else if (this.pos.y < 0) {
                    this.pos.y = height;
                    wrapped = true;
                }
                if (wrapped) {
                    this.updatePrev();
                }
            }
        }

        function updateParam(paramName, value) {
            const numericValue = parseFloat(value);
            params[paramName] = numericValue;
            document.getElementById(`${paramName}-value`).textContent = String(value);

            if (paramName === "particleCount") {
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            const indexMap = { color1: 0, color2: 1, color3: 2 };
            const index = indexMap[colorId];
            params.colorPalette[index] = value;
            document.getElementById(`${colorId}-value`).textContent = value;
        }

        function updateSeedDisplay() {
            document.getElementById("seed-input").value = params.seed;
        }

        function updateSeed() {
            const input = document.getElementById("seed-input");
            const newSeed = parseInt(input.value, 10);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = { ...defaultParams };

            document.getElementById("particleCount").value = params.particleCount;
            document.getElementById("particleCount-value").textContent = params.particleCount;
            document.getElementById("fieldTension").value = params.fieldTension;
            document.getElementById("fieldTension-value").textContent = params.fieldTension;
            document.getElementById("consensusPulse").value = params.consensusPulse;
            document.getElementById("consensusPulse-value").textContent = params.consensusPulse;
            document.getElementById("noiseScale").value = params.noiseScale;
            document.getElementById("noiseScale-value").textContent = params.noiseScale;
            document.getElementById("trailLength").value = params.trailLength;
            document.getElementById("trailLength-value").textContent = params.trailLength;

            document.getElementById("color1").value = params.colorPalette[0];
            document.getElementById("color1-value").textContent = params.colorPalette[0];
            document.getElementById("color2").value = params.colorPalette[1];
            document.getElementById("color2-value").textContent = params.colorPalette[1];
            document.getElementById("color3").value = params.colorPalette[2];
            document.getElementById("color3-value").textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener("load", () => {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
