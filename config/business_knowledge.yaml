# Business Knowledge Base Configuration
# RU: База знаний о бизнесе
# EN: Business knowledge base for revenue streams, customer segments, and cost centers

revenue_streams:
  subscription:
    monthly:
      price_range: [5, 50]
      conversion_rate: 0.02
    yearly:
      price_range: [50, 500]
      conversion_rate: 0.05
    lifetime:
      price_range: [100, 1000]
      conversion_rate: 0.01
  freemium:
    free_tier:
      conversion_rate: 0.15
    premium_tier:
      price_range: [10, 100]
      conversion_rate: 0.08
  usage_based:
    per_request:
      price_range: [0.01, 1.0]
      conversion_rate: 0.1
    per_storage:
      price_range: [0.1, 10.0]
      conversion_rate: 0.05

customer_segments:
  individual:
    ltv: 200
    churn_rate: 0.05
  professional:
    ltv: 1000
    churn_rate: 0.02
  enterprise:
    ltv: 10000
    churn_rate: 0.01

# Cost centers configuration
# RU: Конфигурация центров затрат
# EN: Cost centers configuration
#
# Semantics: These numbers represent RELATIVE SHARES within each top-level category,
# not absolute shares of the total budget. Each category (infrastructure, development,
# marketing, operations) has its own weight, and the values within each category
# represent the proportion of that category's budget allocated to each sub-item.
#
# RU: Семантика: Эти числа представляют ОТНОСИТЕЛЬНЫЕ ДОЛИ внутри каждой категории верхнего уровня,
# а не абсолютные доли от общего бюджета. Каждая категория (инфраструктура, разработка,
# маркетинг, операции) имеет свой вес, а значения внутри каждой категории
# представляют долю бюджета этой категории, выделенную на каждый подпункт.
#
# Example: If infrastructure category gets 30% of total budget, then:
#   - aws gets 0.3 * 30% = 9% of total budget
#   - gcp gets 0.25 * 30% = 7.5% of total budget
#   - azure gets 0.2 * 30% = 6% of total budget
#
# RU: Пример: Если категория инфраструктуры получает 30% от общего бюджета, то:
#   - aws получает 0.3 * 30% = 9% от общего бюджета
#   - gcp получает 0.25 * 30% = 7.5% от общего бюджета
#   - azure получает 0.2 * 30% = 6% от общего бюджета
#
# Note: Category weights are defined separately (not in this file) and must be
# provided when computing absolute budget allocations.
#
# RU: Примечание: Веса категорий определяются отдельно (не в этом файле) и должны быть
# предоставлены при вычислении абсолютных распределений бюджета.
cost_centers:
  infrastructure:
    aws: 0.3
    gcp: 0.25
    azure: 0.2
  development:
    salaries: 0.4
    tools: 0.1
  marketing:
    ads: 0.2
    content: 0.1
  operations:
    support: 0.15
    legal: 0.05
