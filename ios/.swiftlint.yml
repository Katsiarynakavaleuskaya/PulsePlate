# SwiftLint Configuration for PulsePlate iOS App
# Based on Apple HIG and health app best practices

# Paths to include/exclude
included:
  - PulsePlate
  - PulsePlateTests
  - PulsePlateUITests

excluded:
  - build
  - .build
  - DerivedData
  - Resources
  - Assets.xcassets

# Rules configuration
disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - array_init
  - attributes
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name
  - first_where
  - force_unwrapping
  - function_default_parameter_at_end
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_literal_over_init
  - prefixed_toplevel_constant
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - switch_case_on_newline
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Custom rules for health apps
custom_rules:
  # Health data privacy
  health_data_privacy:
    name: "Health Data Privacy"
    regex: 'HealthKit|HKHealthStore|HKQuery'
    message: "Health data access should be properly authorized and documented"
    severity: warning

  # StoreKit integration
  storekit_best_practices:
    name: "StoreKit Best Practices"
    regex: 'SKProduct|SKPayment|StoreKit'
    message: "StoreKit integration should follow Apple guidelines"
    severity: warning

# Line length configuration
line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

# File length
file_length:
  warning: 500
  error: 1000

# Function length
function_body_length:
  warning: 50
  error: 100

# Type body length
type_body_length:
  warning: 300
  error: 500

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 10
  error: 20

# Nesting
nesting:
  type_level:
    warning: 3
    error: 6
  statement_level:
    warning: 5
    error: 10

# Identifier names
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 60

# Type name
type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 40
    error: 60

# Force unwrapping
force_unwrapping:
  severity: warning

# Force casting
force_cast:
  severity: warning

# Implicitly unwrapped optionals
implicitly_unwrapped_optional:
  severity: warning

# Trailing semicolon
trailing_semicolon:
  severity: warning

# Vertical whitespace
vertical_whitespace:
  max_empty_lines: 2

# Large tuple
large_tuple:
  warning: 3
  error: 4

# Return arrow whitespace
return_arrow_whitespace:
  severity: warning

# Operator function whitespace
operator_whitespace:
  severity: warning

# Comma
comma:
  severity: warning

# Colon
colon:
    apply_to_dictionaries: true
    severity: warning

# Opening brace
opening_brace:
  severity: warning

# Closing brace
closing_brace:
  severity: warning

# Leading whitespace
leading_whitespace:
  severity: warning

# Mark
mark:
  severity: warning

# TODO
todo:
  severity: warning

# Legacy constructor
legacy_constructor:
  severity: warning

# Legacy constant
legacy_constant:
  severity: warning

# Legacy random
legacy_random:
  severity: warning

# Next
next:
  severity: warning

# Notification center detaching
notification_center_detaching:
  severity: warning

# NSObject prefer isEqual
nsobject_prefer_isequal:
  severity: warning

# Number separator
number_separator:
  severity: warning

# Object literal
object_literal:
  severity: warning

# Only one case enum
only_one_case_enum:
  severity: warning

# Operator usage whitespace
operator_usage_whitespace:
  severity: warning

# Or
or:
  severity: warning

# Overridden super call
overridden_super_call:
  severity: warning

# Override in extension
override_in_extension:
  severity: warning

# Pattern matching keywords
pattern_matching_keywords:
  severity: warning

# Prefer self type over type of self
prefer_self_type_over_type_of_self:
  severity: warning

# Prefer zero literal over init
prefer_zero_literal_over_init:
  severity: warning

# Prefixed toplevel constant
prefixed_toplevel_constant:
  severity: warning

# Prohibited interface builder
prohibited_interface_builder:
  severity: warning

# Prohibited super call
prohibited_super_call:
  severity: warning

# Quick discouraged call
quick_discouraged_call:
  severity: warning

# Quick discouraged focused test
quick_discouraged_focused_test:
  severity: warning

# Quick discouraged pending test
quick_discouraged_pending_test:
  severity: warning

# Reduce into
reduce_into:
  severity: warning

# Redundant nil coalescing
redundant_nil_coalescing:
  severity: warning

# Redundant type annotation
redundant_type_annotation:
  severity: warning

# Required enum case
required_enum_case:
  severity: warning

# Single test class
single_test_class:
  severity: warning

# Sorted first last
sorted_first_last:
  severity: warning

# Sorted imports
sorted_imports:
  severity: warning

# Static operator
static_operator:
  severity: warning

# Strong IBOutlet
strong_iboutlet:
  severity: warning

# Switch case on newline
switch_case_on_newline:
  severity: warning

# Toggle bool
toggle_bool:
  severity: warning

# Unavailable function
unavailable_function:
  severity: warning

# Unneeded parentheses in closure argument
unneeded_parentheses_in_closure_argument:
  severity: warning

# Untyped error in catch
untyped_error_in_catch:
  severity: warning

# Vertical parameter alignment on call
vertical_parameter_alignment_on_call:
  severity: warning

# Vertical whitespace closing braces
vertical_whitespace_closing_braces:
  severity: warning

# Vertical whitespace opening braces
vertical_whitespace_opening_braces:
  severity: warning

# XCT specific matcher
xct_specific_matcher:
  severity: warning

# Yoda condition
yoda_condition:
  severity: warning

# Reporter configuration
reporter: "xcode"

# Analyzer rules
analyzer_rules:
  - explicit_self
  - unused_declaration
  - unused_import
  - unused_parameter
  - unused_variable
