coverage:
  precision: 2
  round: down
  # We target 96% coverage as required by project standards
  range: 97..100
  status:
    project:
      default:
        target: 96%
        threshold: 1%
ignore:
  - "example_nutrition_api.py"
  - "quick_coverage_check.py"
  - "check_coverage.py"
  - "test_setup.py"
  - "test_visualization.py"
  - "test_quick_check.py"
  - "test_patch_verification.py"
  - "run_coverage_tests.py"
  - "tests_strict/**"
  - "**/__init__.py"
