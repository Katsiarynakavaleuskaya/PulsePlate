coverage:
  precision: 2
  round: down
  # We target 97% coverage as required by project standards
  range: 97..100
  status:
    project:
      default:
        target: 97%
        threshold: 1%
    patch:
      default:
        target: 97%
        threshold: 1%
        # Don't block PR if patch coverage dips; our diff-coverage job is the real gate
        informational: true
ignore:
  - "example_nutrition_api.py"
  - "quick_coverage_check.py"
  - "check_coverage.py"
  - "test_setup.py"
  - "test_visualization.py"
  - "test_quick_check.py"
  - "test_patch_verification.py"
  - "run_coverage_tests.py"
  - "tests/**"
  - "tests_strict/**"
  - "module_purge.py"
  - "**/__init__.py"
