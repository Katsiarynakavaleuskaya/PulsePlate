coverage:
  precision: 2
  round: down
  # We target high coverage but avoid blocking PRs on tiny temporary dips.
  # Using 95..100 keeps the bar ambitious while allowing incremental work.
  range: 95..100
ignore:
  - "example_nutrition_api.py"
  - "quick_coverage_check.py"
  - "check_coverage.py"
  - "test_setup.py"
  - "test_visualization.py"
  - "test_quick_check.py"
  - "test_patch_verification.py"
  - "tests_strict/**"
  - "**/__init__.py"
