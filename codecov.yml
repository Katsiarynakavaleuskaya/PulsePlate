codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        # Use numeric target for more robust parsing
        target: 0.97
        threshold: 0.002
        informational: false
        only_pulls: false
        base: auto
    patch:
      default:
        target: 0
        threshold: 0.01
        informational: true
        only_pulls: true

# Exclude files/folders from Codecov calculations (to match .coveragerc intent)
ignore:
  - "tests/**"
  - "tests_strict/**"
  - "releases/**"
  - "external/**"
  - "frontend/**"
  - "data/**"
  - "scripts/**"
  - "**/debug_*.py"
  - "**/example_*.py"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
