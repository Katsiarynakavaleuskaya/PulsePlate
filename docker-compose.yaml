# Using Compose Specification (no version required)

services:
  # Main application service
  pulseplate:
    build:
      context: .
      target: production
      args:
        BUILDPLATFORM: linux/amd64
        TARGETPLATFORM: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - API_KEY=${API_KEY}
      - ENVIRONMENT=production
      - SERVER_SALT=${SERVER_SALT:?SERVER_SALT is required}
      - EXPORT_TOKEN_SECRET=${EXPORT_TOKEN_SECRET:?EXPORT_TOKEN_SECRET is required}
      - PRIVATE_EXPORTS_ENABLED=${PRIVATE_EXPORTS_ENABLED:-true}
      - EXPORT_TOKEN_TTL_SECONDS=${EXPORT_TOKEN_TTL_SECONDS:-900}
      - VIP_LLM_INSIGHT_REQUESTS_PER_MONTH=${VIP_LLM_INSIGHT_REQUESTS_PER_MONTH:-30}
      - PRO_LLM_INSIGHT_REQUESTS_PER_MONTH=${PRO_LLM_INSIGHT_REQUESTS_PER_MONTH:-20}
      - CBT_AGENT_EXECUTION_MODE=${CBT_AGENT_EXECUTION_MODE:-auto-safe}
      - AGENT_CONTROL_AUDIT_LOG_PATH=${AGENT_CONTROL_AUDIT_LOG_PATH:-/app/logs/agent_control_audit.jsonl}
    volumes:
      - ./data:/app/data:ro
      - artifacts-volume:/app/artifacts:rw
      - cache-volume:/app/cache:rw
      - logs-volume:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pulseplate-network

  # Development service
  pulseplate-dev:
    build:
      context: .
      target: development
      args:
        BUILDPLATFORM: linux/amd64
        TARGETPLATFORM: linux/amd64
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app
      - API_KEY=${API_KEY}
      - ENVIRONMENT=development
      - SERVER_SALT=${SERVER_SALT:?SERVER_SALT is required}
      - EXPORT_TOKEN_SECRET=${EXPORT_TOKEN_SECRET:-__set_me__}
      - PRIVATE_EXPORTS_ENABLED=${PRIVATE_EXPORTS_ENABLED:-true}
      - EXPORT_TOKEN_TTL_SECONDS=${EXPORT_TOKEN_TTL_SECONDS:-900}
      - VIP_LLM_INSIGHT_REQUESTS_PER_MONTH=${VIP_LLM_INSIGHT_REQUESTS_PER_MONTH:-30}
      - PRO_LLM_INSIGHT_REQUESTS_PER_MONTH=${PRO_LLM_INSIGHT_REQUESTS_PER_MONTH:-20}
      - CBT_AGENT_EXECUTION_MODE=${CBT_AGENT_EXECUTION_MODE:-auto-safe}
      - AGENT_CONTROL_AUDIT_LOG_PATH=${AGENT_CONTROL_AUDIT_LOG_PATH:-/app/logs/agent_control_audit.jsonl}
    volumes:
      - .:/app:rw
      - /app/__pycache__
      - /app/.pytest_cache
    restart: unless-stopped
    profiles:
      - dev
    networks:
      - pulseplate-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    profiles:
      - cache
    networks:
      - pulseplate-network

  # PostgreSQL for production data (optional)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=pulseplate
      - POSTGRES_USER=pulseplate
      # Default is for local/dev only (service is profile-gated).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - database
    networks:
      - pulseplate-network

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  cache-volume:
    driver: local
  logs-volume:
    driver: local
  artifacts-volume:
    driver: local

networks:
  pulseplate-network:
    driver: bridge
