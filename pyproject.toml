[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseplate"
version = "0.1.0"
description = "Comprehensive health and nutrition application with BMI calculations, body fat analysis, and personalized nutrition recommendations"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Proprietary"}
authors = [
    {name = "PulsePlate Team", email = "lexakm532@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.120.4",
    "starlette>=0.49.1,<0.50.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "hypothesis>=6.144.0",
]

[tool.setuptools]
packages = ["core", "app", "providers"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv", "*.txt"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-q"
asyncio_mode = "auto"

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = false
ignore_missing_imports = true
plugins = []
explicit_package_bases = true
namespace_packages = true
# Exclude files/dirs that cause duplicate module mapping or are heavy/generated.
# - app.py conflicts with package module "app" (app/__init__.py) for mypy module resolution.
# - Exclude caches and build artifacts to keep runs stable and fast.
exclude = '''
(
  ^app\.py$|
  ^cache/|
  ^test_cache/|
  ^frontend/build/|
  ^htmlcov/|
  ^releases/.*|
  ^data/|
  ^external/|
  ^providers/.*|
  ^releases/v0\.1\.0/.*
)
'''

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.coverage.run]
source = ["."]
omit = [
    "alembic/*",
    "releases/*",
    "cache/*",
    "data/*",
    "external/*",
    "frontend/build/*",
    "htmlcov/*",
    "coverage/*",
    "providers/pico.py",
    "app/routers/vip.py",
    "conftest.py",
    "tests/*",
    # Bayesian tooling - new experimental feature, comprehensive tests pending
    "core/bayesian_recommendations.py",
    "core/bayesian_technical_utils.py",
    "core/business_bayesian_analyzer.py",
    "debug_test.py",
    "example_nutrition_api.py",
    "check_coverage.py",
    "check_failing_tests.py",
    "fix_coverage_tests.py",
    "quick_coverage_check.py",
    "quick_coverage_update.py",
    "run_coverage_tests.py",
    "setup_dev_env.py",
    "setup_env_check.py",
    "test_quick_check.py",
    "fix_failing_tests.py",
    "setup_custom_mcp.py",
    "test_pro_access.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
    "F811",  # Redefinition of unused variable
    "F401",  # Imported but unused
    "F841",  # Local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "F811", "F401", "F841"]
"scripts/*.py" = ["E402"]
"releases/**/*.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.13"
reportMissingImports = false
pythonPath = "."

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
version_files = []
