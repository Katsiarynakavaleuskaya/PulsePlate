[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config --tb=short -ra"
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "e2e: marks tests as end-to-end tests",
  "performance: marks tests as performance tests",
  "coverage: marks tests as coverage tests",
  "monte_carlo: marks tests as Monte Carlo tests",
  "bayesian: marks tests as Bayesian analysis tests",
  "hypothesis: marks tests using Hypothesis property-based testing",
  "smoke: marks tests as smoke tests",
  "demo: marks tests as demo tests",
  "quarantined: marks tests as quarantined (skip in PR)",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = false
ignore_missing_imports = true
plugins = []
explicit_package_bases = true
namespace_packages = true
# Exclude files/dirs that cause duplicate module mapping or are heavy/generated.
# - app.py conflicts with package module "app" (app/__init__.py) for mypy module resolution.
# - Exclude caches and build artifacts to keep runs stable and fast.
exclude = '''
(
  ^app\.py$|
  ^cache/|
  ^test_cache/|
  ^frontend/build/|
  ^htmlcov/|
  ^releases/.*|
  ^data/|
  ^external/|
  ^providers/.*|
  ^releases/v0\.1\.0/.*
)
'''

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
    "F811",  # Redefinition of unused variable
    "F401",  # Imported but unused
    "F841",  # Local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "F811", "F401", "F841"]
"scripts/*.py" = ["E402"]
"releases/**/*.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
reportMissingImports = false
pythonPath = "."

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
version_files = []
