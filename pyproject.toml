[tool.pytest.ini_options]
pythonpath = "."
addopts = "-q"
asyncio_mode = "auto"

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = false
ignore_missing_imports = true
plugins = []
explicit_package_bases = true
# Exclude files/dirs that cause duplicate module mapping or are heavy/generated.
# - app.py conflicts with package module "app" (app/__init__.py) for mypy module resolution.
# - Exclude caches and build artifacts to keep runs stable and fast.
exclude = '''
(
  ^app\.py$|
  ^cache/|
  ^test_cache/|
  ^frontend/build/|
  ^htmlcov/|
  ^releases/|
  ^data/|
  ^external/
)
'''

[tool.black]
line-length = 100
target-version = ["py312"]
