[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"
# Base options for all test runs (maxfail configured per-environment in CI)
addopts = [
    "-q",
    "--ignore=tests/disabled_hypothesis/",
    "--tb=short",
]
filterwarnings = [
    "ignore::PendingDeprecationWarning",
    # Silence specific runtime warnings from intentional AsyncMock usage in tests
    # These are known test patterns where AsyncMock creates coroutines that are intentionally not awaited
    "ignore:coroutine 'DatabaseUpdateScheduler\\.(start|stop|_update_loop|force_update)' was never awaited:RuntimeWarning:core\\.food_apis\\.scheduler",
    "ignore:coroutine 'DatabaseUpdateScheduler\\._update_loop' was never awaited:RuntimeWarning:unittest\\.mock",
    # Silence noisy ResourceWarning from third-party SQLite usage (coverage/sqlalchemy/anyio/etc.)
    "ignore:unclosed database in <sqlite3.Connection object:ResourceWarning",
]
markers = [
    "asyncio: mark test as using asyncio",
    "smoke: fast smoke tests for critical endpoints",
    "slow: slow tests that should only run in nightly builds",
    "heavy: resource-intensive tests (integration, LLM, large datasets) - exclude from PR runs",
    "integration: integration tests requiring external services",
    "demo: demo tests with verbose output (run with --capture=no)",
    "serial: mark test to run serially (not in parallel) to avoid race conditions",
    "xdist_group(name): group tests for xdist scheduling",
    "needs_data: requires local datasets/snapshots not available in CI",
    "external: hits external APIs (should be mocked in CI)",
    "optional_dep: requires optional dependencies (matplotlib, cryptography, etc.)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = false
ignore_missing_imports = true
plugins = []
# Exclude files/dirs that cause duplicate module mapping or are heavy/generated.
# - app.py conflicts with package module "app" (app/__init__.py) for mypy module resolution.
# - Exclude caches and build artifacts to keep runs stable and fast.
exclude = '''
(
  ^app\.py$|
  ^cache/|
  ^test_cache/|
  ^frontend/build/|
  ^htmlcov/|
  ^releases/.*|
  ^data/|
  ^external/|
  ^providers/.*|
  ^releases/v0\.1\.0/.*
)
'''

[[tool.mypy.overrides]]
# Optional slowapi: type: ignore needed for full mypy; pre-push uses --follow-imports=skip so ignores unused.
module = ["app.security.rate_limit"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
# ``cast(RAGContext, vector_rag.retrieve_context_structured(...))`` is required for pre-push mypy
# (--follow-imports=skip treats ``vector_rag`` as partially unknown). Full mypy resolves imports and
# would flag redundant-cast without this override.
module = ["core.rag.recursive_retrieval"]
disable_error_code = ["redundant-cast"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
    "F811",  # Redefinition of unused variable
    "F401",  # Imported but unused
    "F841",  # Local variable assigned but never used
]

[tool.ruff.lint.isort]
known-first-party = ["app", "bmi_core", "providers", "core"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "F811", "F401", "F841"]
"scripts/*.py" = ["E402"]
"releases/**/*.py" = ["E402"]
"app/__init__.py" = ["ANN401"]  # PEP 562 __getattr__ requires Any return type

[tool.pyright]
pythonVersion = "3.13"
reportMissingImports = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
version_files = []
