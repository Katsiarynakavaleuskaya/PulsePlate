[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Базовые наборы правил (pycodestyle/pyflakes/isort)
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# В тестах часто встречается импорт внутри тест-функций: игнорируем E402.
"tests/**/*.py" = ["E402"]
# В app.py допускаем «поздние» импорты (если они действительно нужны):
"app.py" = ["E402"]
# В строгих тестах тоже допускаем поздние импорты:
"tests_strict/**/*.py" = ["E402"]
# В скриптах и debug файлах допускаем поздние импорты для sys.path манипуляций:
"scripts/**/*.py" = ["E402"]
"debug_endpoint.py" = ["E402"]
# В coverage boost тестах игнорируем неиспользуемые переменные:
"tests/test_premium_week_coverage_boost.py" = ["F841"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-q"
asyncio_mode = "auto"
