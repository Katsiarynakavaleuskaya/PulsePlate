[tool.pytest.ini_options]
pythonpath = "."
addopts = "-q"
asyncio_mode = "auto"

[tool.isort]
profile = "black"  # Ruff format is black-compatible
line_length = 100

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = false
ignore_missing_imports = true
plugins = []
explicit_package_bases = true
mypy_path = "."
namespace_packages = true
# Exclude files/dirs that cause duplicate module mapping or are heavy/generated.
# - app.py conflicts with package module "app" (app/__init__.py) for mypy module resolution.
# - Exclude caches and build artifacts to keep runs stable and fast.
exclude = '''
(
  ^app\.py$|
  ^core/time_utils\.py$|
  ^core/db\.py$|
  ^cache/|
  ^test_cache/|
  ^frontend/build/|
  ^htmlcov/|
  ^releases/.*|
  ^data/|
  ^external/|
  ^providers/.*|
  ^releases/v0\.1\.0/.*|
  ^releases/v0\.1\.0/BMI-App_2025_clean-0\.1\.0/app\.py$
)
'''

# Note: We use Ruff for both linting AND formatting (replaces Black + flake8 + isort)
# Ruff is faster and fully compatible with Black's formatting style
# DO NOT add [tool.black] config - it will conflict with Ruff formatter

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
# Use black-compatible formatting (Ruff replaces Black entirely)
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
# Включаем проверки:
# E/W - pycodestyle errors/warnings
# F - Pyflakes (unused imports, undefined names, etc.)
# I - isort (import ordering)
# N - pep8-naming
# UP - pyupgrade (modern Python syntax)
# B - flake8-bugbear (common bugs)
# C4 - flake8-comprehensions
# T20 - flake8-print (no print statements in production)
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]

ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long (handled by formatter)
    "F811",  # Redefinition of unused variable (tests)
    "F401",  # Imported but unused (handled separately)
    "F841",  # Local variable assigned but never used
    "N802",  # Function name should be lowercase (compatibility)
    "N803",  # Argument name should be lowercase (compatibility)
    "B008",  # Do not perform function call in argument defaults (FastAPI)
]

# Автоматически исправлять что возможно
fixable = ["I", "F401", "UP", "C4"]
unfixable = []

[tool.ruff.lint.isort]
# Настройки сортировки импортов (совместимо с isort)
known-first-party = ["core", "app", "providers", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 2
force-single-line = false
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "E402",   # Module level import not at top of file
    "F811",   # Redefinition of unused name
    "F401",   # Imported but unused
    "F841",   # Local variable assigned but never used
    "B009",   # Do not call getattr with a constant - common in tests
    "B004",   # Using hasattr(__call__) - acceptable in tests
    "B010",   # Do not call setattr with constant - needed for test mocking
    "B011",   # Do not assert False - valid pattern in tests
    # B017 убран - будем использовать конкретные исключения для безопасности
    "N806",   # Variable in function should be lowercase - test fixtures
    "N811",   # Constant imported as non-constant - test aliases
    "N812",   # Lowercase imported as non-lowercase - test abbreviations
]
"tests/edges/*.py" = ["B009", "B010", "N812"]  # Edge case tests need special patterns
"scripts/*.py" = ["E402", "T20"]  # Scripts can have top-level imports
"releases/**/*.py" = ["E402", "B904"]  # Release archives - legacy code
"setup_custom_mcp.py" = ["B007"]  # Loop variables intentionally unused
"app.py" = ["N806", "B904", "B009"]  # Main app file - specific patterns
"core/exports.py" = ["N806"]  # ReportLab class names by convention
"core/food_sources/*.py" = ["N806"]  # Nutrient naming conventions (Fe_mg, Ca_mg)
"core/db.py" = ["N812", "B010"]  # SQLAlchemy patterns
"providers/*.py" = ["B904"]  # Provider error wrapping pattern
"ios/Scripts/*.py" = ["N806"]  # iOS helper scripts

[tool.pyright]
pythonVersion = "3.13"
reportMissingImports = false
pythonPath = "."

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
version_files = []
