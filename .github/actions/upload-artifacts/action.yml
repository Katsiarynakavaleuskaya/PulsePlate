name: 'Upload Test Artifacts'
description: 'Upload coverage and JUnit test artifacts'
inputs:
  coverage-file:
    description: 'Path to coverage XML file'
    required: false
    default: 'coverage.xml'
  junit-file:
    description: 'Path to JUnit XML file'
    required: false
    default: 'tests/results.xml'
  python-version:
    description: 'Python version for artifact naming'
    required: false
    default: '3.12'
  artifact-prefix:
    description: 'Prefix for artifact names'
    required: false
    default: 'test'
  retention-days:
    description: 'Artifact retention in days'
    required: false
    default: '14'

runs:
  using: 'composite'
  steps:
    - name: Upload coverage artifact
      if: inputs.coverage-file != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.python-version }}
        path: ${{ inputs.coverage-file }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}

    - name: Upload JUnit test report
      if: inputs.junit-file != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-prefix }}-junit-${{ inputs.python-version }}
        path: ${{ inputs.junit-file }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}
