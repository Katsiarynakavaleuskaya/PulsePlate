name: 'Initialize Test Database'
description: 'Initialize test database schema and verify tables'
inputs:
  pythonpath:
    description: 'PYTHONPATH environment variable value'
    required: false
    default: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app"
runs:
  using: 'composite'
  steps:
    - name: Initialize test database
      shell: bash
      env:
        APP_ENV: test
        ENVIRONMENT: test
        PYTHONPATH: ${{ inputs.pythonpath }}
      run: |
        # Ensure database directory exists
        mkdir -p cache

        # Initialize database schema (create tables)
        # Note: PYTHONPATH from env above enables these imports without sys.path manipulation
        python <<'EOF'
        import core.models  # noqa: F401 - ensure models are registered
        from core.db import init_db
        init_db()
        print('✅ Database initialized successfully')
        EOF

        # Verify tables were created and log details
        # Note: PYTHONPATH from env above enables these imports without sys.path manipulation
        python <<'EOF'
        from core.db import _RAW_ENGINE, DATABASE_URL
        from sqlalchemy import inspect
        import sys
        from pathlib import Path

        # Extract DB path from URL for verification
        db_path = DATABASE_URL.replace("sqlite:///", "")
        db_file = Path(db_path)

        print(f"📁 Database file: {db_path}")
        print(f"📁 Database file exists: {db_file.exists()}")
        if db_file.exists():
            print(f"📁 Database file size: {db_file.stat().st_size} bytes")

        # Use _RAW_ENGINE for inspection (engine may be wrapped)
        inspector = inspect(_RAW_ENGINE)
        tables = inspector.get_table_names()
        tables_str = ', '.join(sorted(tables))
        print(f"✅ Found {len(tables)} tables: {tables_str}")

        # Check for required tables (including context)
        required_tables = ['users', 'recipes', 'meals', 'food_items', 'context']
        missing_tables = [t for t in required_tables if t not in tables]

        if missing_tables:
            print(f"❌ Missing required tables: {', '.join(missing_tables)}")
            print(f"Available tables: {tables_str}")
            print(f"Database URL: {DATABASE_URL}")
            print(f"Database file exists: {db_file.exists()}")
            sys.exit(1)

        print(f"✅ All required tables found: {', '.join(required_tables)}")

        # Verify users table structure
        if 'users' in tables:
            columns = [col['name'] for col in inspector.get_columns('users')]
            print(f"✅ Users table columns: {', '.join(columns)}")
        EOF
