name: 'Initialize Test Database'
description: 'Initialize test database schema and verify tables'
inputs:
  pythonpath:
    description: 'PYTHONPATH environment variable value'
    required: false
    default: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app"
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail  # Exit immediately if any command fails
        python -m pip install --upgrade pip
        CONSTRAINTS_ARG=""
        if [ -f constraints.txt ]; then
          CONSTRAINTS_ARG="-c constraints.txt"
        fi
        # Install runtime dependencies first (FastAPI, SQLAlchemy, etc.)
        if [ -f requirements.txt ]; then
          echo "Installing runtime dependencies from requirements.txt..."
          python -m pip install -r requirements.txt $CONSTRAINTS_ARG || { echo "❌ Failed to install requirements.txt"; exit 1; }
        fi
        # Then install dev/test dependencies (pytest, coverage, etc.)
        if [ -f requirements-dev.txt ]; then
          echo "Installing dev/test dependencies from requirements-dev.txt..."
          python -m pip install -r requirements-dev.txt $CONSTRAINTS_ARG || { echo "❌ Failed to install requirements-dev.txt"; exit 1; }
        fi

    - name: Initialize test database
      shell: bash
      env:
        APP_ENV: test
        ENVIRONMENT: test
        PYTHONPATH: ${{ inputs.pythonpath }}
      run: |
        # Ensure database directory exists
        mkdir -p cache

        # Verify SQLAlchemy is installed
        python -c "import sqlalchemy; from sqlalchemy import inspect; print('✅ SQLAlchemy available')" || { echo "❌ SQLAlchemy not installed. Run 'pip install -r requirements-dev.txt' first."; exit 1; }

        # Initialize database schema (create tables)
        python -c "
        import sys
        sys.path.insert(0, '.')
        import core.models  # noqa: F401 - ensure models are registered
        from core.db import init_db
        init_db()
        print('✅ Database initialized successfully')
        "
        # Verify tables were created
        python -c "
        import sys
        sys.path.insert(0, '.')
        from core.db import session_scope
        from sqlalchemy import inspect
        with session_scope() as session:
            inspector = inspect(session.bind)
            tables = inspector.get_table_names()
            tables_str = ', '.join(tables)
            print(f\"✅ Found {len(tables)} tables: {tables_str}\")
            assert 'users' in tables, 'users table not found'
        "
