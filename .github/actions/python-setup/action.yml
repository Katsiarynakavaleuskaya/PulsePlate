name: 'Python Setup'
description: 'Setup Python environment with dependencies'
inputs:
  python-version:
    description: 'Python version to use'
    required: true
  install-dev-deps:
    description: 'Install development dependencies (pre-commit, bandit, etc.)'
    required: false
    default: 'false'
  install-test-deps:
    description: 'Install test dependencies (pytest, pytest-cov)'
    required: false
    default: 'false'
  constraints-file:
    description: 'Constraints file applied during wheelhouse build/install'
    required: false
    default: 'constraints.txt'
  working-directory:
    description: 'Working directory for the job'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: |
          ${{ inputs.working-directory }}/requirements*.txt

    - name: Install base dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euxo pipefail
        if [[ -f requirements-dev.txt || -f requirements.txt ]]; then
          install_args=()
          if [[ -f requirements-dev.txt ]]; then
            install_args+=(--install-dev)
          fi
          python "$GITHUB_ACTION_PATH/../../scripts/ci/install_locked_python_requirements.py" \
            --python-executable python \
            --constraints-file "${{ inputs.constraints-file }}" \
            "${install_args[@]}"
        else
          echo "::notice::No requirements-dev.txt or requirements.txt found; skipping base dependency install"
        fi

    - name: Install development dependencies
      if: ${{ inputs.install-dev-deps == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euxo pipefail
        echo "::notice::Pinned development tooling is provided by requirements-dev.txt via install_locked_python_requirements.py"

    - name: Install test dependencies
      if: ${{ inputs.install-test-deps == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euxo pipefail
        echo "::notice::Pinned test tooling is provided by requirements-dev.txt via install_locked_python_requirements.py"
