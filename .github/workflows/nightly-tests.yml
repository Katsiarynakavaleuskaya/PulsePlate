# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Nightly Full Tests

env:
  FRONTEND_NODE_VERSION_FILE: ".nvmrc"
  PULSEPLATE_PYTHON_INDEX_URL: ${{ secrets.PULSEPLATE_PYTHON_INDEX_URL || vars.PULSEPLATE_PYTHON_INDEX_URL }}
  PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ secrets.PULSEPLATE_PYTHON_TRUSTED_HOST || vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.6'

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ env.FRONTEND_NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache pip
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        uses: ./.github/actions/python-setup
        with:
          python-version: '3.13.6'
          requirements-profile: 'ci-test'

      - name: Install root Node dependencies
        uses: ./.github/actions/npm-ci-with-retry

      - name: Install frontend dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          working-directory: frontend

      - name: Run full test suite with coverage (include slow/MC)
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONFAULTHANDLER: '1'
          PYTEST_TIMEOUT: '300'
          BAYESIAN_PERSIST: '1'
          BAYESIAN_HISTORY_PATH: '/tmp/test_execution_history.json'
          MC_SEED: '2025'
          MC_SAMPLES: '40'
          MC_SAMPLES_FEW: '15'
          MAIN_TEST_SHARDS: '16'
          MAIN_TEST_MAX_PARALLEL: '4'
          MAIN_TEST_SHARD_TIMEOUT_SECONDS: '4800'
          MAIN_TEST_COVERAGE_TIMEOUT_SECONDS: '1200'
        run: |
          set -euo pipefail
          echo "TEST_STEP_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -c "import sys; print('PY', sys.version)"
          echo "MAIN_TEST_SHARDS=${MAIN_TEST_SHARDS}"
          echo "MAIN_TEST_MAX_PARALLEL=${MAIN_TEST_MAX_PARALLEL}"
          echo "MAIN_TEST_SHARD_TIMEOUT_SECONDS=${MAIN_TEST_SHARD_TIMEOUT_SECONDS}"
          echo "MAIN_TEST_COVERAGE_TIMEOUT_SECONDS=${MAIN_TEST_COVERAGE_TIMEOUT_SECONDS}"
          set +e
          time python scripts/ci/run_main_test_shards.py \
            --python-version "3.13" \
            --shard-count "${MAIN_TEST_SHARDS}" \
            --max-parallel "${MAIN_TEST_MAX_PARALLEL}" \
            --marker-expression "not demo" \
            --durations-min "1.0" \
            --report-chars "fEsxXw" \
            --htmlcov
          test_exit_code=$?
          set -e
          echo "TEST_STEP_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$test_exit_code"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload HTML coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: htmlcov
          path: htmlcov
