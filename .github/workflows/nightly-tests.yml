# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Nightly Full Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13.5'

      - name: Cache pip
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run full test suite with coverage (include slow/MC)
        env:
          PYTHONUNBUFFERED: '1'
          BAYESIAN_PERSIST: '1'
          BAYESIAN_HISTORY_PATH: '/tmp/test_execution_history.json'
          MC_SEED: '2025'
          MC_SAMPLES: '40'
          MC_SAMPLES_FEW: '15'
        run: |
          pytest -c pyproject.toml -m "not demo" -n auto \
            --cov=. --cov-report=term-missing --cov-report=xml --cov-report=html \
            --cov-fail-under=97 -ra

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload HTML coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: htmlcov
          path: htmlcov
