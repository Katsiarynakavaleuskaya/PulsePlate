# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Nightly Full Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.6'

      - name: Cache pip
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run full test suite with coverage (include slow/MC)
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONFAULTHANDLER: '1'
          PYTEST_TIMEOUT: '300'
          BAYESIAN_PERSIST: '1'
          BAYESIAN_HISTORY_PATH: '/tmp/test_execution_history.json'
          MC_SEED: '2025'
          MC_SAMPLES: '40'
          MC_SAMPLES_FEW: '15'
        run: |
          pytest -c pyproject.toml -m "not demo" -n auto --dist=loadgroup -q \
            --durations=25 --durations-min=1.0 \
            -r fEsxXw \
            -o faulthandler_timeout=300 \
            --cov=. --cov-report=term-missing --cov-report=xml --cov-report=html \
            --cov-fail-under=97

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload HTML coverage artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: htmlcov
          path: htmlcov
