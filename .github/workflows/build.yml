name: Docker Build and Push

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize runs that can publish the same commit artifacts across refs (branch + tag)
  group: ghcr-build-push-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test Docker image
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare Trivy ignore policy
        run: |
          set -euo pipefail
          test -f trivy/ignore-policy.rego
          cp trivy/ignore-policy.rego .trivy-ignore-policy.rego
          ls -la .trivy-ignore-policy.rego

      - name: Free disk space (Ubuntu hosted runner)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 / Node 24

      - name: Build Docker image (local, for tests)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          build-args: |
            PULSEPLATE_PYTHON_INDEX_URL=${{ secrets.PULSEPLATE_PYTHON_INDEX_URL || vars.PULSEPLATE_PYTHON_INDEX_URL }}
            PULSEPLATE_PYTHON_TRUSTED_HOST=${{ secrets.PULSEPLATE_PYTHON_TRUSTED_HOST || vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}
            PULSEPLATE_REQUIREMENTS_FILE=requirements-docker-runtime.txt
          platforms: linux/amd64
          push: false
          load: true
          tags: pulseplate:test
          cache-from: type=gha,scope=build-production-${{ github.ref_name }}
          cache-to: type=gha,scope=build-production-${{ github.ref_name }},mode=min,ignore-error=true
          provenance: false
          target: production

      - name: Check Docker runtime dependency surface
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_runtime_dependency_surface.py \
            --image pulseplate:test \
            --blocked-debian-package apt \
            --blocked-debian-package gpgv \
            --blocked-debian-package libgnutls30 \
            --output-json docker-runtime-dependency-surface.json

      - name: Resolve Docker image telemetry baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/fetch_docker_image_baseline.py \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --artifact-name docker-image-telemetry-build \
            --fallback-json docs/telemetry/docker_image_baseline.production.json \
            --output docker-image-baseline.json

      - name: Collect Docker image telemetry
        run: |
          set -euo pipefail
          python3 scripts/ci/docker_image_telemetry.py \
            --image-ref pulseplate:test \
            --baseline-json docker-image-baseline.json \
            --json-out docker-image-telemetry.json \
            --markdown-out docker-image-telemetry.md

      - name: Publish Docker telemetry to step summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f docker-image-telemetry.md ]; then
            cat docker-image-telemetry.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Docker telemetry artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: docker-image-telemetry-build
          path: |
            docker-runtime-dependency-surface.json
            docker-image-telemetry.json
            docker-image-telemetry.md
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Docker image budget
        id: docker_image_budget
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_image_budget.py \
            --telemetry-json docker-image-telemetry.json \
            --budget-json docs/telemetry/docker_image_budget.production.json \
            --json-out docker-image-budget-check.json \
            --markdown-out docker-image-budget-check.md

      - name: Publish Docker budget check to step summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f docker-image-budget-check.md ]; then
            cat docker-image-budget-check.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Docker budget check artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: docker-image-budget-check-build
          path: |
            docker-image-budget-check.json
            docker-image-budget-check.md
          if-no-files-found: warn
          retention-days: 14

      - name: Test Docker image
        run: |
          # Set up cleanup trap to ensure container is always removed
          trap "docker stop pulseplate-test 2>/dev/null || true; docker rm pulseplate-test 2>/dev/null || true" EXIT

          api_key_name="API""_KEY"
          allow_dev_api_key_name="ALLOW_DEV_API""_KEY"
          export_token_secret_name="EXPORT_TOKEN""_SECRET"
          server_salt_name="SERVER""_SALT"
          apple_shared_secret_name="APPLE_SHARED""_SECRET"
          subscription_db_enabled_name="SUBSCRIPTION_DB""_ENABLED"
          database_url_name="DATABASE""_URL"

          # Start container with tightened security
          docker run -d --name pulseplate-test -p 8000:8000 \
            -e "${api_key_name}=test_key" \
            -e "${allow_dev_api_key_name}=false" \
            -e "${export_token_secret_name}=ci-smoke-export-secret" \
            -e "${server_salt_name}=StrongServerSaltForCI1234567890!" \
            -e "${apple_shared_secret_name}=StrongAppleSharedSecretForCI1234567890!" \
            -e "${subscription_db_enabled_name}=true" \
            -e "${database_url_name}=sqlite:////app/cache/pulseplate-smoke.db" \
            -e APP_ENV=ci \
            -e ENVIRONMENT=ci \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            pulseplate:test

          # Wait for container to start
          echo "Waiting for container to start..."
          sleep 5

          # Check if container is running
          if ! docker ps | grep -q pulseplate-test; then
            echo "Container failed to start"
            docker logs pulseplate-test
            exit 1
          fi

          # Wait for application to be ready with retry
          max_attempts=30
          attempt=0
          echo "Waiting for application to be ready..."
          until curl -f http://localhost:8000/health > /dev/null 2>&1 || [ $attempt -eq $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts - waiting for health endpoint..."
            sleep 2
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Application health check failed after ${max_attempts} attempts"
            echo "Container logs:"
            docker logs pulseplate-test
            exit 1
          fi

          echo "Application is ready, testing health endpoint..."
          # Test health endpoint (canonical)
          curl -f http://localhost:8000/health || exit 1

          echo "Testing canonical OpenAPI route contract..."
          curl -fsS -o openapi.json http://localhost:8000/openapi.json
          python3 - <<'PY'
          import json

          with open("openapi.json", "r", encoding="utf-8") as schema_file:
              schema = json.load(schema_file)

          paths = schema.get("paths", {})
          assert "/api/v1/bmi" in paths, (
              "Missing /api/v1/bmi in OpenAPI paths. "
              f"Found: {sorted(paths)[:50]}..."
          )
          methods = {method.lower() for method in paths["/api/v1/bmi"].keys()}
          assert "post" in methods, f"Missing POST for /api/v1/bmi. Methods: {sorted(methods)}"
          assert "/api/v1/bodyfat" not in paths, "/api/v1/bodyfat must not leak into canonical OpenAPI"
          print("OK: canonical OpenAPI route checks passed")
          PY

          echo "Testing bodyfat compatibility route wiring..."
          payload='{"gender":"male","age":30,"waist_cm":80.0,"neck_cm":38.0,"height_m":1.75,"weight_kg":75.0}'
          status="$(curl -sS -o bodyfat_response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            http://localhost:8000/api/v1/bodyfat)"

          echo "POST /api/v1/bodyfat status=$status"
          if [ "$status" = "404" ]; then
            echo "Body (first 500 chars):"
            head -c 500 bodyfat_response.txt
            exit 1
          fi
          # Accept 422: smoke test validates routing and wiring, not input validation logic.
          if [ "$status" != "200" ] && [ "$status" != "422" ]; then
            echo "Unexpected status=$status. Body (first 500 chars):"
            head -c 500 bodyfat_response.txt
            exit 1
          fi

          echo "✅ Docker image test completed successfully"

      - name: Fail build job when Docker budget check failed
        if: ${{ steps.docker_image_budget.outcome == 'failure' }}
        run: |
          echo "::error::Docker image hard budget gate failed."
          exit 1

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    env:
      # secrets.* is not available in step-level `if:` (actionlint / context rules); gate at job env instead.
      GHCR_READ_TOKEN_AVAILABLE: ${{ secrets.GHCR_READ_TOKEN != '' }}
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # PAT may be present but expired/revoked; anonymous pull still works for public trivy-db.
      - name: Log in to GHCR (Trivy DB)
        if: ${{ env.GHCR_READ_TOKEN_AVAILABLE == 'true' }}
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if ! echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          then
            echo "::warning::GHCR_READ_TOKEN is set but docker login was denied; continuing without registry auth."
          fi

      - name: Prepare Trivy SARIF output path and ignore policy
        run: |
          set -euo pipefail
          rm -rf -- trivy-results.sarif
          rm -rf "${RUNNER_TEMP}/pulseplate-trivy"
          mkdir -p "${RUNNER_TEMP}/pulseplate-trivy"
          test -f trivy/ignore-policy.rego
          cp trivy/ignore-policy.rego .trivy-ignore-policy.rego
          ls -la .trivy-ignore-policy.rego

      - name: Run Trivy vulnerability scanner (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          scan-type: fs
          scan-ref: .
          cache-dir: /tmp/trivy-cache
          ignore-policy: .trivy-ignore-policy.rego
          scanners: vuln
          format: sarif
          output: ${{ runner.temp }}/pulseplate-trivy/trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore
          version: v0.69.3

      - name: Check Trivy filesystem SARIF output
        id: trivy_fs_sarif
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sarif_path="${RUNNER_TEMP}/pulseplate-trivy/trivy-results.sarif"
          if [ -s "$sarif_path" ]; then
            cp -- "$sarif_path" trivy-results.sarif
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Trivy filesystem SARIF not produced; Security tab upload skipped."
          fi

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() && steps.trivy_fs_sarif.outputs.present == 'true' }}
        uses: github/codeql-action/upload-sarif@c00e4aee0547167576bc6663920491135a3dee27 # v4
        with:
          sarif_file: trivy-results.sarif

  # Publish tested Docker image
  publish:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name != 'pull_request'
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
      packages: write # write implies read; required for GHCR push/pull
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare Trivy ignore policy
        run: |
          set -euo pipefail
          test -f trivy/ignore-policy.rego
          cp trivy/ignore-policy.rego .trivy-ignore-policy.rego
          ls -la .trivy-ignore-policy.rego

      - name: Free disk space (Ubuntu hosted runner)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 / Node 24

      - name: Set lowercase image name
        id: image-name
        run: |
          echo "image_name=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0 / Node 24
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0 / Node 24
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}


      - name: Build and push Docker image
        id: docker-build-push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          build-args: |
            PULSEPLATE_PYTHON_INDEX_URL=${{ secrets.PULSEPLATE_PYTHON_INDEX_URL || vars.PULSEPLATE_PYTHON_INDEX_URL }}
            PULSEPLATE_PYTHON_TRUSTED_HOST=${{ secrets.PULSEPLATE_PYTHON_TRUSTED_HOST || vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}
            PULSEPLATE_REQUIREMENTS_FILE=requirements-docker-runtime.txt
          # Single-arch for cache/push stability (CodeRabbit discussion_r2869743452). Restore linux/arm64 when GHA cache/provenance is stable.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-production-${{ github.ref_name }}
          # mode=min to match build job and keep cache export/import fast (mode=max can hang 30+ min on export).
          # ignore-error=true prevents publish failure when cache exporter returns transient BlobNotFound.
          cache-to: type=gha,scope=build-production-${{ github.ref_name }},mode=min,ignore-error=true
          # PR #1448: re-enable SLSA provenance attestations for GHCR publish.
          # Keep scoped cache + mode=min + ignore-error=true to reduce export flakes.
          provenance: mode=max
          sbom: true
          target: production

      - name: Set image ref for SBOM and image scan
        id: image-ref
        run: |
          echo "ref=${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Image scan: --exit-code 0 makes findings report-only (no fail on vuln count).
      # continue-on-error: true keeps the publish job moving when Trivy fails before SARIF exists
      # (DB/network/registry); hashFiles guards upload-sarif. Do not change output path without
      # updating hashFiles('trivy-image.sarif') and upload/warn steps (paths are workspace-relative).
      - name: Run Trivy vulnerability scanner (image scan, report-only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          scan-type: image
          image-ref: ${{ steps.image-ref.outputs.ref }}
          cache-dir: /tmp/trivy-cache
          ignore-policy: .trivy-ignore-policy.rego
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          exit-code: '0'
          version: v0.69.3

      - name: Warn when Trivy image SARIF is missing
        if: ${{ hashFiles('trivy-image.sarif') == '' }}
        run: |
          echo "::warning::Trivy image SARIF not produced; CodeQL upload will be skipped. Check scan logs (registry/auth/DB)."

      # upload-sarif fails closed if sarif is missing; Trivy may not write a file on hard errors.
      - name: Upload Trivy image scan results
        if: ${{ hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@c00e4aee0547167576bc6663920491135a3dee27 # v4
        with:
          sarif_file: 'trivy-image.sarif'

      - name: Generate SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: ${{ steps.image-ref.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest Docker image provenance
        id: attest-build-provenance
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          subject-digest: ${{ steps.docker-build-push.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker image SBOM
        id: attest-build-sbom
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          subject-digest: ${{ steps.docker-build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Verify Docker image attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_provenance_attestation.py \
            --image-name "${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}" \
            --digest "${{ steps.docker-build-push.outputs.digest }}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build.yml" \
            --source-ref "${{ github.ref }}" \
            --json-out docker-provenance-attestation-check.json \
            --markdown-out docker-provenance-attestation-check.md

      - name: Prepare release-control-plane build digest sources
        run: |
          set -euo pipefail
          mkdir -p release-control-plane-build-sources
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source_dir = Path("release-control-plane-build-sources")
          sbom = Path("sbom.spdx.json")
          attestation = Path("docker-provenance-attestation-check.json")
          if not sbom.is_file():
              raise SystemExit("ERROR: sbom.spdx.json is missing")
          if not attestation.is_file():
              raise SystemExit("ERROR: docker-provenance-attestation-check.json is missing")
          attestation_payload = json.loads(attestation.read_text(encoding="utf-8"))
          if attestation_payload.get("passed") is not True:
              raise SystemExit("ERROR: Docker provenance/SBOM attestations are not verified")
          (source_dir / "artifact_digest.txt").write_text(
              "${{ steps.docker-build-push.outputs.digest }}\n",
              encoding="utf-8",
          )
          (source_dir / "sbom_digest.txt").write_text(
              f"sha256:{hashlib.sha256(sbom.read_bytes()).hexdigest()}\n",
              encoding="utf-8",
          )
          (source_dir / "provenance_digest.txt").write_text(
              f"sha256:{hashlib.sha256(attestation.read_bytes()).hexdigest()}\n",
              encoding="utf-8",
          )
          (source_dir / "attestation_status.txt").write_text("VERIFIED\n", encoding="utf-8")
          PY

      - name: Upload release-control-plane build digest sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: release-control-plane-build-sources
          path: |
            release-control-plane-build-sources/artifact_digest.txt
            release-control-plane-build-sources/sbom_digest.txt
            release-control-plane-build-sources/provenance_digest.txt
            release-control-plane-build-sources/attestation_status.txt
            docker-provenance-attestation-check.json
            docker-provenance-attestation-check.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  # Deploy to staging (if on main branch)
  # TODO: Enable when staging deployment is ready
  # deploy-staging:
  #   runs-on: ubuntu-latest
  #   needs: [build, security-scan, test]
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   environment: staging
  #   permissions:
  #     contents: read
  #     packages: read
  #
  #   steps:
  #     - name: Deploy to staging
  #       run: |
  #         echo "Deploying to staging environment..."
  #         # Add actual deployment commands here
  #         # This could be:
  #         # - kubectl apply -f k8s/staging/
  #         # - docker-compose -f docker-compose.staging.yml up -d
  #         # - helm upgrade --install pulseplate-staging ./helm-chart
