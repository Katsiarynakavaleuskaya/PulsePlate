name: Docker Build and Push

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test Docker image
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@49b3bc8e6b6737cd9f29c6a9b6f6e3e0f52f1bd0 # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@2b51285b1a9ec5ab8b4d0b2b0613b9fe2f6bd9f0 # v3.7.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e22f86bfb35d0a25f7560d9c3a8b1b4ec5ab9ba # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c4 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0.20.5
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d43c1f16ce892c29b0a8c1e35ea7c4b131f3cf66 # v0.30.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@fcd400978dce9a5380deed8eb1db098f9a5c88e9 # v3.25.13
        with:
          sarif_file: 'trivy-results.sarif'

  # Test Docker image
  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@2b51285b1a9ec5ab8b4d0b2b0613b9fe2f6bd9f0 # v3.7.1

      - name: Build test image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c4 # v5.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: pulseplate:test
          target: production

      - name: Test Docker image
        run: |
          # Start container
          docker run -d --name pulseplate-test -p 8000:8000 pulseplate:test

          # Wait for container to be ready
          for i in {1..30}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Container failed to start within 30 seconds"
              docker logs pulseplate-test
              exit 1
            fi
            sleep 1
          done

          # Test API endpoint
          curl -f http://localhost:8000/api/v1/health || exit 1

          # Cleanup
          docker stop pulseplate-test
          docker rm pulseplate-test

  # Deploy to staging (if on main branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, security-scan, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment commands here
          # This could be:
          # - kubectl apply -f k8s/staging/
          # - docker-compose -f docker-compose.staging.yml up -d
          # - helm upgrade --install pulseplate-staging ./helm-chart
