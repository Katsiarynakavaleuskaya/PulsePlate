name: Docker Build and Push

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit manual execution mode; disabled never publishes
        type: choice
        required: true
        default: disabled
        options: [disabled, normal, prometheus-source-qualify, backend-sdk-qualify, prometheus-oras-qualify, prometheus-source-pair]
      prometheus_module_action:
        description: Explicit Prometheus metadata module action; unchanged retains original locks
        type: choice
        required: true
        default: unchanged
        options: [unchanged, xnet060-replay]

concurrency:
  # Serialize runs that can publish the same commit artifacts across refs (branch + tag)
  group: ghcr-build-push-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test Docker image
  build:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.mode == 'normal'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Trivy ignore policy
        run: |
          set -euo pipefail
          test -f trivy/ignore-policy.rego
          cp trivy/ignore-policy.rego .trivy-ignore-policy.rego
          ls -la .trivy-ignore-policy.rego

      - name: Free disk space (Ubuntu hosted runner)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Prepare Docker source artifacts
        run: |
          set -euo pipefail
          python3 scripts/ci/fetch_docker_source_artifacts.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 / Node 24

      - name: Prepare private Python index Docker authentication
        shell: bash
        env:
          DEVPI_CI_USER: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DEVPI_CI_USER || '' }}
          DEVPI_CI_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DEVPI_CI_PASSWORD || '' }}
          PULSEPLATE_PYTHON_INDEX_URL: ${{ vars.PULSEPLATE_PYTHON_INDEX_URL }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required for Docker package auth.}"
          auth_file="$RUNNER_TEMP/pulseplate-docker-netrc"
          umask 077
          : > "$auth_file"
          if [[ -z "${DEVPI_CI_USER:-}" && -z "${DEVPI_CI_PASSWORD:-}" ]]; then
            exit 0
          fi
          if [[ -z "${DEVPI_CI_USER:-}" || -z "${DEVPI_CI_PASSWORD:-}" ]]; then
            echo "::error::Set both DEVPI_CI_USER and DEVPI_CI_PASSWORD, or neither."
            exit 1
          fi
          case "$DEVPI_CI_USER$DEVPI_CI_PASSWORD" in
            *[[:space:]]*)
              echo "::error::DEVPI_CI_USER and DEVPI_CI_PASSWORD must not contain whitespace."
              exit 1
              ;;
          esac
          case "$DEVPI_CI_USER" in
            [Rr][Oo][Oo][Tt])
              echo "::error::Root devpi credentials are forbidden for Docker package installs."
              exit 1
              ;;
          esac
          case "${PULSEPLATE_PYTHON_INDEX_URL:-}" in
            *://*@*)
              echo "::error::PULSEPLATE_PYTHON_INDEX_URL must not contain credentials; use DEVPI_CI_USER/DEVPI_CI_PASSWORD."
              exit 1
              ;;
          esac
          {
            printf 'machine packages.pulseplate.app\n'
            printf '  login %s\n' "$DEVPI_CI_USER"
            printf '  password %s\n' "$DEVPI_CI_PASSWORD"
          } > "$auth_file"

      - name: Build Docker image (local, for tests)
        id: production-native-build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        env:
          PULSEPLATE_PYTHON_INDEX_URL: ${{ vars.PULSEPLATE_PYTHON_INDEX_URL }}
          PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}
        with:
          context: .
          build-args: |
            PULSEPLATE_REQUIREMENTS_FILE=requirements-docker-runtime.txt
          secret-envs: |
            pp_py_index=PULSEPLATE_PYTHON_INDEX_URL
            pp_py_host=PULSEPLATE_PYTHON_TRUSTED_HOST
          secret-files: |
            pp_netrc=${{ runner.temp }}/pulseplate-docker-netrc
          platforms: linux/amd64
          push: false
          load: true
          tags: pulseplate:test
          cache-from: type=gha,scope=build-production-${{ github.ref_name }}
          cache-to: type=gha,scope=build-production-${{ github.ref_name }},mode=min,ignore-error=true
          provenance: false
          target: production

      - name: Build staging image from the same qualified backend inputs
        id: staging-native-build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        env:
          PULSEPLATE_PYTHON_INDEX_URL: ${{ vars.PULSEPLATE_PYTHON_INDEX_URL }}
          PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}
        with:
          context: .
          target: staging
          build-args: |
            PULSEPLATE_REQUIREMENTS_FILE=requirements-docker-runtime.txt
          secret-envs: |
            pp_py_index=PULSEPLATE_PYTHON_INDEX_URL
            pp_py_host=PULSEPLATE_PYTHON_TRUSTED_HOST
          secret-files: |
            pp_netrc=${{ runner.temp }}/pulseplate-docker-netrc
          platforms: linux/amd64
          push: false
          load: true
          tags: pulseplate:staging-native
          cache-from: type=gha,scope=build-production-${{ github.ref_name }}
          provenance: false

      - name: Remove private Python index Docker authentication
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -f "$RUNNER_TEMP/pulseplate-docker-netrc"
          fi

      - name: Retain exact production and staging native image bytes
        id: backend-native-export
        env:
          PRODUCTION_IMAGE_ID: ${{ steps.production-native-build.outputs.imageid }}
          STAGING_IMAGE_ID: ${{ steps.staging-native-build.outputs.imageid }}
          PRODUCTION_BUILD_METADATA: ${{ steps.production-native-build.outputs.metadata }}
          STAGING_BUILD_METADATA: ${{ steps.staging-native-build.outputs.metadata }}
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/pulseplate-docker-netrc"
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          import subprocess

          root = Path.cwd()
          output = Path(os.environ["RUNNER_TEMP"]) / ("backend-native-images-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          output.mkdir(mode=0o700)
          docker, git = shutil.which("docker"), shutil.which("git")
          if not docker or not git or not Path(docker).is_absolute() or not Path(git).is_absolute():
              raise SystemExit("Native image export binaries unavailable")

          def run(argv, name, timeout=120):
              result = subprocess.run(argv, capture_output=True, timeout=timeout, check=False)
              (output / (name + ".stdout")).write_bytes(result.stdout)
              (output / (name + ".stderr")).write_bytes(result.stderr)
              if result.returncode:
                  raise SystemExit("Native image export failed: " + name)
              return result.stdout

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1048576), b""):
                      value.update(chunk)
              return value.hexdigest()

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if event["repository"]["id"] != 1043311030 or os.environ["GITHUB_REPOSITORY"] != "Katsiarynakavaleuskaya/PulsePlate":
              raise SystemExit("Native image export repository mismatch")
          records = {}
          for target, tag, variable in (("production", "pulseplate:test", "PRODUCTION"),
                                        ("staging", "pulseplate:staging-native", "STAGING")):
              expected = os.environ[variable + "_IMAGE_ID"]
              if re.fullmatch(r"sha256:[0-9a-f]{64}", expected) is None:
                  raise SystemExit("Native image build ID missing")
              observed = json.loads(run([docker, "image", "inspect", tag], target + "-inspect"))
              if len(observed) != 1 or (observed[0]["Id"], observed[0]["Os"], observed[0]["Architecture"]) != (expected, "linux", "amd64"):
                  raise SystemExit("Native image/config/platform mismatch")
              archive = output / (target + ".docker.tar")
              run([docker, "image", "save", "--output", str(archive), tag], target + "-save", 900)
              info = archive.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or not 0 < info.st_size <= 2147483648:
                  raise SystemExit("Native image archive outside bound")
              again = json.loads(run([docker, "image", "inspect", tag], target + "-recheck"))
              if again != observed:
                  raise SystemExit("Native image changed during export")
              records[target] = {"image_config_id": expected, "platform": "linux/amd64",
                                 "archive": archive.name, "archive_bytes": info.st_size,
                                 "archive_sha256": digest(archive), "native_inspect": observed[0],
                                 "build_metadata": json.loads(os.environ[variable + "_BUILD_METADATA"])}
          sources = {}
          for name in ("Dockerfile", ".dockerignore", "scripts/ci/docker_source_artifacts.json"):
              path = root / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("Native image source is not regular")
              sources[name] = {"bytes": path.stat().st_size, "sha256": digest(path)}
          origin = {"repository_id": 1043311030, "repository": os.environ["GITHUB_REPOSITORY"],
                    "source_head": run([git, "rev-parse", "HEAD"], "source-head").decode().strip(),
                    "source_tree": run([git, "rev-parse", "HEAD^{tree}"], "source-tree").decode().strip(),
                    "source_ref": os.environ["GITHUB_REF"], "run_id": int(os.environ["GITHUB_RUN_ID"]),
                    "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "job": os.environ["GITHUB_JOB"],
                    "source_files": sources, "images": records,
                    "claim": "Exact hosted image bytes only; fresh native/security acceptance and published-image proof remain separate. No registry publication or guest execution in this export step."}
          (output / "origin.json").write_text(json.dumps(origin, sort_keys=True, indent=2) + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write("complete=true\n")
          PY

      - name: Preserve exact backend native images for pullback qualification
        if: ${{ always() && steps.backend-native-export.outputs.complete == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: backend-native-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-native-images-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30

      - name: Check Docker runtime dependency surface
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_runtime_dependency_surface.py \
            --image pulseplate:test \
            --blocked-debian-package apt \
            --blocked-debian-package gzip \
            --blocked-debian-package gpgv \
            --blocked-debian-package libacl1 \
            --blocked-debian-package libattr1 \
            --blocked-debian-package libgnutls30 \
            --blocked-debian-package libsqlite3-0 \
            --blocked-debian-package libpcre2-8-0 \
            --blocked-debian-package perl-base \
            --blocked-debian-package bsdutils \
            --blocked-debian-package libblkid1 \
            --blocked-debian-package libmount1 \
            --blocked-debian-package libsmartcols1 \
            --blocked-debian-package libuuid1 \
            --blocked-debian-package mount \
            --blocked-debian-package util-linux \
            --blocked-debian-package util-linux-extra \
            --blocked-debian-package libsystemd0 \
            --blocked-debian-package libudev1 \
            --blocked-debian-prefix perl-modules- \
            --output-json docker-runtime-dependency-surface.json

      - name: Scan production image before publication eligibility
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          version: v0.74.0
          scan-type: image
          image-ref: pulseplate:test
          cache-dir: /tmp/trivy-cache
          ignore-policy: .trivy-ignore-policy.rego
          trivyignores: .trivyignore
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-build-image.json

      - name: Validate native Trivy suppression semantics
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/ci/check_trivy_ignore_policy_native.py

      - name: Validate production image report and render SARIF
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_runtime_dependency_surface.py \
            --image pulseplate:test --trivy-report trivy-build-image.json
          trivy convert --format sarif --ignorefile /dev/null \
            --output trivy-build-image.sarif trivy-build-image.json
          test -s trivy-build-image.sarif

      - name: Preserve production image scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: production-image-scan
          path: |
            trivy-build-image.json
            trivy-build-image.sarif
            docker-runtime-dependency-surface.json
          if-no-files-found: error
          retention-days: 30

      - name: Use checked-in Docker image telemetry baseline on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cp docs/telemetry/docker_image_baseline.production.json docker-image-baseline.json

      - name: Resolve Docker image telemetry baseline
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/fetch_docker_image_baseline.py \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --artifact-name docker-image-telemetry-build \
            --fallback-json docs/telemetry/docker_image_baseline.production.json \
            --output docker-image-baseline.json

      - name: Collect Docker image telemetry
        run: |
          set -euo pipefail
          python3 scripts/ci/docker_image_telemetry.py \
            --image-ref pulseplate:test \
            --baseline-json docker-image-baseline.json \
            --json-out docker-image-telemetry.json \
            --markdown-out docker-image-telemetry.md

      - name: Publish Docker telemetry to step summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f docker-image-telemetry.md ]; then
            cat docker-image-telemetry.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Docker telemetry artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: docker-image-telemetry-build
          path: |
            docker-runtime-dependency-surface.json
            docker-image-telemetry.json
            docker-image-telemetry.md
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Docker image budget
        id: docker_image_budget
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_image_budget.py \
            --telemetry-json docker-image-telemetry.json \
            --budget-json docs/telemetry/docker_image_budget.production.json \
            --json-out docker-image-budget-check.json \
            --markdown-out docker-image-budget-check.md

      - name: Publish Docker budget check to step summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f docker-image-budget-check.md ]; then
            cat docker-image-budget-check.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Docker budget check artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: docker-image-budget-check-build
          path: |
            docker-image-budget-check.json
            docker-image-budget-check.md
          if-no-files-found: warn
          retention-days: 14

      - name: Test Docker image
        run: |
          # Set up cleanup trap to ensure container is always removed
          trap "docker stop pulseplate-test 2>/dev/null || true; docker rm pulseplate-test 2>/dev/null || true" EXIT

          api_key_name="API""_KEY"
          allow_dev_api_key_name="ALLOW_DEV_API""_KEY"
          export_token_secret_name="EXPORT_TOKEN""_SECRET"
          server_salt_name="SERVER""_SALT"
          apple_shared_secret_name="APPLE_SHARED""_SECRET"
          subscription_db_enabled_name="SUBSCRIPTION_DB""_ENABLED"
          database_url_name="DATABASE""_URL"

          # Start container with tightened security
          docker run -d --name pulseplate-test -p 8000:8000 \
            -e "${api_key_name}=test_key" \
            -e "${allow_dev_api_key_name}=false" \
            -e "${export_token_secret_name}=ci-smoke-export-secret" \
            -e "${server_salt_name}=StrongServerSaltForCI1234567890!" \
            -e "${apple_shared_secret_name}=StrongAppleSharedSecretForCI1234567890!" \
            -e "${subscription_db_enabled_name}=true" \
            -e "${database_url_name}=sqlite:////app/cache/pulseplate-smoke.db" \
            -e APP_ENV=ci \
            -e ENVIRONMENT=ci \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            pulseplate:test

          # Wait for container to start
          echo "Waiting for container to start..."
          sleep 5

          # Check if container is running
          if ! docker ps | grep -q pulseplate-test; then
            echo "Container failed to start"
            docker logs pulseplate-test
            exit 1
          fi

          # Wait for application to be ready with retry
          max_attempts=30
          attempt=0
          echo "Waiting for application to be ready..."
          until curl -f http://localhost:8000/health > /dev/null 2>&1 || [ $attempt -eq $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts - waiting for health endpoint..."
            sleep 2
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Application health check failed after ${max_attempts} attempts"
            echo "Container logs:"
            docker logs pulseplate-test
            exit 1
          fi

          echo "Application is ready, testing health endpoint..."
          # Test health endpoint (canonical)
          curl -f http://localhost:8000/health || exit 1

          echo "Testing canonical OpenAPI route contract..."
          curl -fsS -o openapi.json http://localhost:8000/openapi.json
          python3 - <<'PY'
          import json

          with open("openapi.json", "r", encoding="utf-8") as schema_file:
              schema = json.load(schema_file)

          paths = schema.get("paths", {})
          assert "/api/v1/bmi" in paths, (
              "Missing /api/v1/bmi in OpenAPI paths. "
              f"Found: {sorted(paths)[:50]}..."
          )
          methods = {method.lower() for method in paths["/api/v1/bmi"].keys()}
          assert "post" in methods, f"Missing POST for /api/v1/bmi. Methods: {sorted(methods)}"
          assert "/api/v1/bodyfat" not in paths, "/api/v1/bodyfat must not leak into canonical OpenAPI"
          print("OK: canonical OpenAPI route checks passed")
          PY

          echo "Testing bodyfat compatibility route wiring..."
          payload='{"gender":"male","age":30,"waist_cm":80.0,"neck_cm":38.0,"height_m":1.75,"weight_kg":75.0}'
          status="$(curl -sS -o bodyfat_response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            http://localhost:8000/api/v1/bodyfat)"

          echo "POST /api/v1/bodyfat status=$status"
          if [ "$status" = "404" ]; then
            echo "Body (first 500 chars):"
            head -c 500 bodyfat_response.txt
            exit 1
          fi
          # Accept 422: smoke test validates routing and wiring, not input validation logic.
          if [ "$status" != "200" ] && [ "$status" != "422" ]; then
            echo "Unexpected status=$status. Body (first 500 chars):"
            head -c 500 bodyfat_response.txt
            exit 1
          fi

          echo "✅ Docker image test completed successfully"

      - name: Check native scheduler worker lifecycle
        env:
          POSTGRES_IMAGE: pgvector/pgvector:0.8.6-pg15-trixie@sha256:43904fc138a63f93611a2995cec2566e8ae883c8678cd65c60315fa44308f81f
        run: |
          set -euo pipefail
          python3 scripts/ci/check_scheduler_worker_runtime.py --image pulseplate:test \
            --postgres-image "$POSTGRES_IMAGE"

      - name: Fail build job when Docker budget check failed
        if: ${{ steps.docker_image_budget.outcome == 'failure' }}
        run: |
          echo "::error::Docker image hard budget gate failed."
          exit 1

  # Security scan
  security-scan:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.mode == 'normal'
    runs-on: ubuntu-latest
    needs: build
    env:
      # secrets.* is not available in step-level `if:` (actionlint / context rules); gate at job env instead.
      GHCR_READ_TOKEN_AVAILABLE: ${{ secrets.GHCR_READ_TOKEN != '' }}
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PAT may be present but expired/revoked; anonymous pull still works for public trivy-db.
      - name: Log in to GHCR (Trivy DB)
        if: ${{ env.GHCR_READ_TOKEN_AVAILABLE == 'true' }}
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if ! echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          then
            echo "::warning::GHCR_READ_TOKEN is set but docker login was denied; continuing without registry auth."
          fi

      - name: Prepare Trivy SARIF output path and ignore policy
        run: |
          set -euo pipefail
          rm -rf -- trivy-results.sarif
          rm -rf "${RUNNER_TEMP}/pulseplate-trivy"
          mkdir -p "${RUNNER_TEMP}/pulseplate-trivy"
          test -f trivy/ignore-policy.rego
          cp trivy/ignore-policy.rego .trivy-ignore-policy.rego
          ls -la .trivy-ignore-policy.rego

      - name: Run Trivy vulnerability scanner (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          scan-type: fs
          scan-ref: .
          cache-dir: /tmp/trivy-cache
          ignore-policy: .trivy-ignore-policy.rego
          scanners: vuln
          format: sarif
          output: ${{ runner.temp }}/pulseplate-trivy/trivy-results.sarif
          skip-dirs: trivy
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore
          version: v0.74.0

      - name: Check Trivy filesystem SARIF output
        id: trivy_fs_sarif
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sarif_path="${RUNNER_TEMP}/pulseplate-trivy/trivy-results.sarif"
          if [ -s "$sarif_path" ]; then
            cp -- "$sarif_path" trivy-results.sarif
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Trivy filesystem SARIF not produced; Security tab upload skipped."
          fi

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() && steps.trivy_fs_sarif.outputs.present == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-results.sarif

  # Publish tested Docker image
  publish:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.mode == 'normal')
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
      packages: write # write implies read; required for GHCR push/pull
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Trivy ignore policy
        run: |
          set -euo pipefail
          test -f trivy/ignore-policy.rego
          cp trivy/ignore-policy.rego .trivy-ignore-policy.rego
          ls -la .trivy-ignore-policy.rego

      - name: Free disk space (Ubuntu hosted runner)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Prepare Docker source artifacts
        run: |
          set -euo pipefail
          python3 scripts/ci/fetch_docker_source_artifacts.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 / Node 24

      - name: Set lowercase image name
        id: image-name
        run: |
          echo "image_name=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0 / Node 24
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}


      - name: Prepare private Python index Docker authentication
        shell: bash
        env:
          DEVPI_CI_USER: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DEVPI_CI_USER || '' }}
          DEVPI_CI_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DEVPI_CI_PASSWORD || '' }}
          PULSEPLATE_PYTHON_INDEX_URL: ${{ vars.PULSEPLATE_PYTHON_INDEX_URL }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required for Docker package auth.}"
          auth_file="$RUNNER_TEMP/pulseplate-docker-netrc"
          umask 077
          : > "$auth_file"
          if [[ -z "${DEVPI_CI_USER:-}" && -z "${DEVPI_CI_PASSWORD:-}" ]]; then
            exit 0
          fi
          if [[ -z "${DEVPI_CI_USER:-}" || -z "${DEVPI_CI_PASSWORD:-}" ]]; then
            echo "::error::Set both DEVPI_CI_USER and DEVPI_CI_PASSWORD, or neither."
            exit 1
          fi
          case "$DEVPI_CI_USER$DEVPI_CI_PASSWORD" in
            *[[:space:]]*)
              echo "::error::DEVPI_CI_USER and DEVPI_CI_PASSWORD must not contain whitespace."
              exit 1
              ;;
          esac
          case "$DEVPI_CI_USER" in
            [Rr][Oo][Oo][Tt])
              echo "::error::Root devpi credentials are forbidden for Docker package installs."
              exit 1
              ;;
          esac
          case "${PULSEPLATE_PYTHON_INDEX_URL:-}" in
            *://*@*)
              echo "::error::PULSEPLATE_PYTHON_INDEX_URL must not contain credentials; use DEVPI_CI_USER/DEVPI_CI_PASSWORD."
              exit 1
              ;;
          esac
          {
            printf 'machine packages.pulseplate.app\n'
            printf '  login %s\n' "$DEVPI_CI_USER"
            printf '  password %s\n' "$DEVPI_CI_PASSWORD"
          } > "$auth_file"

      - name: Build Docker image for publish scan
        id: docker-build-scan
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        env:
          PULSEPLATE_PYTHON_INDEX_URL: ${{ vars.PULSEPLATE_PYTHON_INDEX_URL }}
          PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}
        with:
          context: .
          build-args: |
            PULSEPLATE_REQUIREMENTS_FILE=requirements-docker-runtime.txt
          secret-envs: |
            pp_py_index=PULSEPLATE_PYTHON_INDEX_URL
            pp_py_host=PULSEPLATE_PYTHON_TRUSTED_HOST
          secret-files: |
            pp_netrc=${{ runner.temp }}/pulseplate-docker-netrc
          # Single-arch for cache/push stability (CodeRabbit discussion_r2869743452). Restore linux/arm64 when GHA cache/provenance is stable.
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-production-${{ github.ref_name }}
          # mode=min to match build job and keep cache export/import fast (mode=max can hang 30+ min on export).
          # ignore-error=true prevents publish failure when cache exporter returns transient BlobNotFound.
          cache-to: type=gha,scope=build-production-${{ github.ref_name }},mode=min,ignore-error=true
          # The image is loaded locally so Trivy can fail closed before any GHCR write.
          # GitHub-signed provenance/SBOM attestations are created after the scanned
          # image is pushed and its registry digest is known.
          provenance: false
          target: production

      - name: Remove private Python index Docker authentication
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -f "$RUNNER_TEMP/pulseplate-docker-netrc"
          fi

      - name: Set image ref for SBOM and image scan
        id: image-ref
        run: |
          echo "ref=${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Check Docker publish runtime dependency surface
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_runtime_dependency_surface.py \
            --image "${IMAGE_REF}" \
            --blocked-debian-package apt \
            --blocked-debian-package gzip \
            --blocked-debian-package gpgv \
            --blocked-debian-package libacl1 \
            --blocked-debian-package libattr1 \
            --blocked-debian-package libgnutls30 \
            --blocked-debian-package libsqlite3-0 \
            --blocked-debian-package libpcre2-8-0 \
            --blocked-debian-package perl-base \
            --blocked-debian-package bsdutils \
            --blocked-debian-package libblkid1 \
            --blocked-debian-package libmount1 \
            --blocked-debian-package libsmartcols1 \
            --blocked-debian-package libuuid1 \
            --blocked-debian-package mount \
            --blocked-debian-package util-linux \
            --blocked-debian-package util-linux-extra \
            --blocked-debian-package libsystemd0 \
            --blocked-debian-package libudev1 \
            --blocked-debian-prefix perl-modules- \
            --output-json docker-publish-runtime-dependency-surface.json

      # Image scan fails closed on HIGH/CRITICAL findings and scanner/SARIF errors.
      # Do not change output path without updating hashFiles('trivy-image.sarif')
      # and upload/fail steps (paths are workspace-relative).
      - name: Run Trivy vulnerability scanner (image scan, fail-closed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          scan-type: image
          image-ref: ${{ steps.image-ref.outputs.ref }}
          cache-dir: /tmp/trivy-cache
          ignore-policy: .trivy-ignore-policy.rego
          scanners: vuln
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          exit-code: '1'
          version: v0.74.0

      - name: Fail when Trivy image SARIF is missing
        if: ${{ always() }}
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_runtime_dependency_surface.py \
            --image "$IMAGE_REF" --trivy-report trivy-image.json
          trivy convert --format sarif --ignorefile /dev/null \
            --output trivy-image.sarif trivy-image.json
          test -s trivy-image.sarif

      - name: Preserve publish image scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: publish-image-scan
          path: |
            trivy-image.json
            trivy-image.sarif
            docker-publish-runtime-dependency-surface.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Trivy image scan results
        if: ${{ always() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: 'trivy-image.sarif'

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0 / Node 24
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned Docker image
        id: docker-build-push
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            docker image push "$tag"
          done <<'TAGS'
          ${{ steps.meta.outputs.tags }}
          TAGS

          image_ref="${{ steps.image-ref.outputs.ref }}"
          image_repo="${image_ref%:*}"
          repo_digests="$(docker image inspect "$image_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          repo_digest="$(printf '%s\n' "$repo_digests" | grep -F -m1 "${image_repo}@sha256:" || true)"
          if [ -z "$repo_digest" ]; then
            echo "::error::Pushed image digest not found for ${image_repo}; refusing to attest."
            exit 1
          fi
          digest="${repo_digest#*@}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image-ref.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest Docker image provenance
        id: attest-build-provenance
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          subject-digest: ${{ steps.docker-build-push.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker image SBOM
        id: attest-build-sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          subject-digest: ${{ steps.docker-build-push.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: sbom.spdx.json
          push-to-registry: true

      - name: Verify Docker image attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_docker_provenance_attestation.py \
            --image-name "${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}" \
            --digest "${{ steps.docker-build-push.outputs.digest }}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build.yml" \
            --source-ref "${{ github.ref }}" \
            --json-out docker-provenance-attestation-check.json \
            --markdown-out docker-provenance-attestation-check.md

      - name: Prepare release-control-plane build digest sources
        run: |
          set -euo pipefail
          mkdir -p release-control-plane-build-sources
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source_dir = Path("release-control-plane-build-sources")
          sbom = Path("sbom.spdx.json")
          attestation = Path("docker-provenance-attestation-check.json")
          if not sbom.is_file():
              raise SystemExit("ERROR: sbom.spdx.json is missing")
          if not attestation.is_file():
              raise SystemExit("ERROR: docker-provenance-attestation-check.json is missing")
          attestation_payload = json.loads(attestation.read_text(encoding="utf-8"))
          if attestation_payload.get("passed") is not True:
              raise SystemExit("ERROR: Docker provenance/SBOM attestations are not verified")
          provenance_results = attestation_payload.get("provenance", {}).get(
              "verification_result", []
          )
          if not provenance_results:
              raise SystemExit("ERROR: Docker provenance attestation summary is missing")
          provenance_statement = provenance_results[0].get("verificationResult", {}).get(
              "statement", {}
          )
          provenance_summary_digest = provenance_statement.get(
              "redacted_statement_summary_sha256"
          )
          if not isinstance(provenance_summary_digest, str) or len(provenance_summary_digest) != 64:
              raise SystemExit("ERROR: Docker provenance summary digest is invalid")
          (source_dir / "artifact_digest.txt").write_text(
              "${{ steps.docker-build-push.outputs.digest }}\n",
              encoding="utf-8",
          )
          (source_dir / "sbom_digest.txt").write_text(
              f"sha256:{hashlib.sha256(sbom.read_bytes()).hexdigest()}\n",
              encoding="utf-8",
          )
          attestation_check_digest = f"sha256:{hashlib.sha256(attestation.read_bytes()).hexdigest()}\n"
          (source_dir / "attestation_check_digest.txt").write_text(
              attestation_check_digest,
              encoding="utf-8",
          )
          (source_dir / "provenance_digest.txt").write_text(
              f"sha256:{provenance_summary_digest}\n",
              encoding="utf-8",
          )
          (source_dir / "attestation_status.txt").write_text("VERIFIED\n", encoding="utf-8")
          PY

      - name: Upload release-control-plane build digest sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: release-control-plane-build-sources
          path: |
            release-control-plane-build-sources/artifact_digest.txt
            release-control-plane-build-sources/sbom_digest.txt
            release-control-plane-build-sources/attestation_check_digest.txt
            release-control-plane-build-sources/provenance_digest.txt
            release-control-plane-build-sources/attestation_status.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  # Deploy to staging (if on main branch)
  # TODO: Enable when staging deployment is ready
  # deploy-staging:
  #   runs-on: ubuntu-latest
  #   needs: [build, security-scan, test]
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   environment: staging
  #   permissions:
  #     contents: read
  #     packages: read
  #
  #   steps:
  #     - name: Deploy to staging
  #       run: |
  #         echo "Deploying to staging environment..."
  #         # Add actual deployment commands here
  #         # This could be:
  #         # - kubectl apply -f k8s/staging/
  #         # - docker-compose -f docker-compose.staging.yml up -d
  #         # - helm upgrade --install pulseplate-staging ./helm-chart

  prometheus-source-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'prometheus-source-qualify' &&
      github.repository == 'Katsiarynakavaleuskaya/PulsePlate'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.PROMETHEUS_SOURCE_QUALIFICATION_TIMEOUT_MINUTES || '20') }}
    permissions:
      contents: read
    env:
      PROMETHEUS_QUALIFICATION_SECONDS: '900'
      PROMETHEUS_CLEANUP_SECONDS: '120'
    steps:
      - name: Require first explicit metadata attempt
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            echo '::error::Metadata qualification reruns require a new reviewed dispatch.'
            exit 1
          fi
      - name: Checkout qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up qualification Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.14'
      - name: Qualify Prometheus package metadata only
        shell: bash
        env:
          PROMETHEUS_MODULE_ACTION: ${{ inputs.prometheus_module_action }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          module_args=()
          case "$PROMETHEUS_MODULE_ACTION" in
            unchanged) ;;
            xnet060-replay) module_args+=(--derive-xnet060) ;;
            *) echo '::error::Unsupported Prometheus module action'; exit 1 ;;
          esac
          python_bin="$(command -v python)"
          "$python_bin" -m scripts.ci.prometheus_source_image \
            --work-dir "$RUNNER_TEMP/prometheus-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --timeout-seconds "$PROMETHEUS_QUALIFICATION_SECONDS" \
            --cleanup-seconds "$PROMETHEUS_CLEANUP_SECONDS" "${module_args[@]}"
      - name: Retain complete qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: prometheus-source-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prometheus-source-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: error
          retention-days: 30

  prometheus-ghcr-package-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'prometheus-source-qualify' &&
      github.repository == 'Katsiarynakavaleuskaya/PulsePlate'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.PROMETHEUS_GHCR_QUALIFICATION_TIMEOUT_MINUTES || '3') }}
    permissions:
      contents: read
      packages: read
    env:
      PROMETHEUS_GHCR_QUALIFICATION_SECONDS: '90'
      PROMETHEUS_GHCR_CLEANUP_SECONDS: '30'
    outputs:
      qualified: ${{ steps.package.outputs.qualified }}
    steps:
      - name: Require first explicit package observation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            echo '::error::Package qualification reruns require a new reviewed dispatch.'
            exit 1
          fi
      - name: Checkout fixed qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up package qualification Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.14'
      - name: Observe existing package identity only
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          python_bin="$(command -v python)"
          "$python_bin" -m scripts.ci.prometheus_source_image \
            --qualify-existing-ghcr-package \
            --work-dir "$RUNNER_TEMP/ghcr-private-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --public-output "$RUNNER_TEMP/ghcr-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/qualification.json" \
            --timeout-seconds "$PROMETHEUS_GHCR_QUALIFICATION_SECONDS" \
            --cleanup-seconds "$PROMETHEUS_GHCR_CLEANUP_SECONDS"
          printf 'qualified=true\n' >> "$GITHUB_OUTPUT"
      - name: Retain exact validated package observation
        if: ${{ success() && steps.package.outputs.qualified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: prometheus-ghcr-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-public-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
          if-no-files-found: error
          retention-days: 30

  backend-arm-sdk-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'backend-sdk-qualify' &&
      github.repository == 'Katsiarynakavaleuskaya/PulsePlate' &&
      github.repository_id == '1043311030'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ fromJSON(vars.BACKEND_SDK_QUALIFICATION_TIMEOUT_MINUTES || '60') }}
    permissions:
      contents: read
      actions: read
    env:
      SDK_SOURCE_IMAGE: python@sha256:f0320b9bf735a4c4db05e7578e487cbed66c097e36b59a3864ca6d3e7c7dcea9
    steps:
      - name: Require one explicit genuine ARM SDK producer attempt
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REPOSITORY_ID" = '1043311030'
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
      - name: Checkout exact SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up stock ARM SDK validation Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.14'
      - name: Observe the canonical stock ARM source image before SDK acquisition
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/arm-sdk-$GITHUB_RUN_ID-1/evidence"
          mkdir -p "$evidence"
          docker pull --platform linux/arm64 "$SDK_SOURCE_IMAGE"
          docker image inspect "$SDK_SOURCE_IMAGE" > "$evidence/source-image.json"
          docker run --rm --platform linux/arm64 --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint /usr/local/bin/python \
            "$SDK_SOURCE_IMAGE" -I -c \
            'import json,platform,struct,sys,sysconfig; from pathlib import Path; p=Path(sys.executable).resolve(); b=p.read_bytes(); assert sys.platform=="linux" and platform.machine()=="aarch64" and sys.version_info[:2]==(3,13) and struct.calcsize("P")==8 and sysconfig.get_config_var("SOABI")=="cpython-313-aarch64-linux-gnu" and b[:6]==b"\x7fELF\x02\x01" and b[18:20]==b"\xb7\x00"; print(json.dumps({"python":sys.version,"machine":platform.machine(),"SOABI":sysconfig.get_config_var("SOABI"),"ELF_machine":183}))' \
            > "$evidence/source-ABI.stdout" 2> "$evidence/source-ABI.stderr"
      - name: Prepare Docker source artifacts
        run: |
          set -euo pipefail
          python3 scripts/ci/fetch_docker_source_artifacts.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 / Node 24
      - name: Prepare existing private acquisition credentials
        env:
          DEVPI_CI_USER: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DEVPI_CI_USER || '' }}
          DEVPI_CI_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DEVPI_CI_PASSWORD || '' }}
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$RUNNER_TEMP/arm-sdk.netrc"
          : > "$RUNNER_TEMP/arm-sdk.netrc"
          if [[ -z "${DEVPI_CI_USER:-}" && -z "${DEVPI_CI_PASSWORD:-}" ]]; then exit 0; fi
          test -n "${DEVPI_CI_USER:-}" && test -n "${DEVPI_CI_PASSWORD:-}"
          case "$DEVPI_CI_USER$DEVPI_CI_PASSWORD" in *[[:space:]]*) exit 1 ;; esac
          case "$DEVPI_CI_USER" in [Rr][Oo][Oo][Tt]) exit 1 ;; esac
          printf 'machine packages.pulseplate.app\n  login %s\n  password %s\n' \
            "$DEVPI_CI_USER" "$DEVPI_CI_PASSWORD" > "$RUNNER_TEMP/arm-sdk.netrc"
      - name: Build genuine ARM cp313 SDK using its existing target
        id: sdk-build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        env:
          PULSEPLATE_PYTHON_INDEX_URL: ${{ vars.PULSEPLATE_PYTHON_INDEX_URL }}
        with:
          context: .
          target: psycopg-sdk
          platforms: linux/arm64
          build-args: |
            PSYCOPG_SDK_PYTHON_IMAGE=${{ env.SDK_SOURCE_IMAGE }}
          secret-envs: |
            pp_py_index=PULSEPLATE_PYTHON_INDEX_URL
          secret-files: |
            pp_netrc=${{ runner.temp }}/arm-sdk.netrc
          push: false
          load: true
          outputs: type=local,dest=${{ runner.temp }}/arm-sdk-${{ github.run_id }}-1/sdk-root
          tags: pulseplate-sdk:arm-cp313
          provenance: false
      - name: Remove acquisition credentials before static SDK validation
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/arm-sdk.netrc"
          test ! -e "$RUNNER_TEMP/arm-sdk.netrc"
      - name: Bind genuine SDK origin, image and exported payload bytes
        id: sdk-origin
        env:
          SDK_IMAGE_ID: ${{ steps.sdk-build.outputs.imageid }}
          SDK_BUILD_METADATA: ${{ steps.sdk-build.outputs.metadata }}
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/arm-sdk.netrc"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import io
          import json
          import os
          import platform
          import re
          import shutil
          import stat
          import subprocess
          import tarfile
          import sys
          from scripts.ci.install_locked_python_requirements import _psycopg_sdk_target, read_psycopg_c_sdk

          root = Path.cwd()
          area = Path(os.environ["RUNNER_TEMP"]) / ("arm-sdk-" + os.environ["GITHUB_RUN_ID"] + "-1")
          sdk = area / "sdk-root"
          evidence = area / "evidence"
          if evidence.is_symlink() or not evidence.is_dir():
              raise SystemExit("SDK source observation directory missing")
          target = _psycopg_sdk_target(os.environ["SDK_SOURCE_IMAGE"])
          if (target.machine, target.python_tag, target.elf_machine) != ("aarch64", "cp313", 183):
              raise SystemExit("Actual SDK target differs from canonical ARM tuple")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if event["repository"]["id"] != 1043311030:
              raise SystemExit("SDK producer repository mismatch")
          # Static wheel/receipt/DSO recognition only. No supplied SDK library,
          # provider or OpenSSL configuration is activated in this stock Python.
          wheel = read_psycopg_c_sdk(sdk / "psycopg-sdk", native_root=sdk)
          docker, git = shutil.which("docker"), shutil.which("git")
          if not docker or not git or not Path(docker).is_absolute() or not Path(git).is_absolute():
              raise SystemExit("SDK native transport tool missing")

          def run(argv, name, timeout=120):
              result = subprocess.run(argv, capture_output=True, timeout=timeout, check=False)
              (evidence / (name + ".stdout")).write_bytes(result.stdout)
              (evidence / (name + ".stderr")).write_bytes(result.stderr)
              if result.returncode:
                  raise SystemExit("SDK native origin operation failed: " + name)
              return result.stdout

          inspected = json.loads(run([docker, "image", "inspect", "pulseplate-sdk:arm-cp313"], "sdk-image"))
          if len(inspected) != 1 or (inspected[0]["Id"], inspected[0]["Os"], inspected[0]["Architecture"]) != (os.environ["SDK_IMAGE_ID"], "linux", "arm64"):
              raise SystemExit("SDK image/config/platform mismatch")
          name = "pp-sdk-export-" + os.environ["GITHUB_RUN_ID"]
          owner = "io.pulseplate.sdk-export=" + os.environ["GITHUB_RUN_ID"]
          image_id = inspected[0]["Id"]
          before = run([docker, "ps", "--all", "--format", "{{.Names}}"], "sdk-export-before").decode().splitlines()
          if name in before:
              raise SystemExit("SDK export container name collision")
          try:
              run([docker, "create", "--name", name, "--label", owner, "--platform", "linux/arm64",
                   "--network", "none", "--read-only", "--cap-drop", "ALL", "--security-opt", "no-new-privileges:true",
                   "--entrypoint", "/not-executed", image_id], "sdk-export-create")
              paths = ("usr/local/lib/libpq.so.5.18", "usr/local/lib/libssl.so.3", "usr/local/lib/libcrypto.so.3",
                       "psycopg-sdk/psycopg-c-sdk.json", "psycopg-sdk/" + wheel.path.name)
              for index, relative in enumerate(paths):
                  observed = run([docker, "cp", name + ":/" + relative, "-"], "sdk-export-member-" + str(index))
                  with tarfile.open(fileobj=io.BytesIO(observed), mode="r:") as archive:
                      members = archive.getmembers()
                      if len(members) != 1 or not members[0].isreg() or members[0].size > 16777216:
                          raise SystemExit("SDK native member export shape unsupported")
                      stream = archive.extractfile(members[0])
                      if stream is None or stream.read() != (sdk / relative).read_bytes():
                          raise SystemExit("SDK image and local exporter bytes differ")
              run([docker, "image", "save", "--output", str(area / "sdk.docker.tar"), image_id], "sdk-image-save", 900)
          finally:
              current = run([docker, "ps", "--all", "--format", "{{.Names}}"], "sdk-export-cleanup-inventory").decode().splitlines()
              if name in current:
                  container = json.loads(run([docker, "inspect", name], "sdk-export-owned-inspect"))[0]
                  if container["Image"] != image_id or container["Config"]["Labels"].get("io.pulseplate.sdk-export") != os.environ["GITHUB_RUN_ID"] or container["State"]["Running"]:
                      raise SystemExit("SDK export container ownership changed")
                  run([docker, "rm", name], "sdk-export-remove")
              names = run([docker, "ps", "--all", "--format", "{{.Names}}"], "sdk-export-absence").decode().splitlines()
              if name in names:
                  raise SystemExit("SDK export container survives")
          inventory = []
          for path in sorted(sdk.rglob("*")):
              info = path.lstat()
              relative = path.relative_to(sdk).as_posix()
              if stat.S_ISLNK(info.st_mode):
                  inventory.append({"path": relative, "type": "symlink", "target": os.readlink(path), "mode": stat.S_IMODE(info.st_mode)})
              elif stat.S_ISREG(info.st_mode):
                  inventory.append({"path": relative, "type": "file", "bytes": info.st_size,
                                    "sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "mode": stat.S_IMODE(info.st_mode)})
              elif not stat.S_ISDIR(info.st_mode):
                  raise SystemExit("Unexpected SDK filesystem member")
          source_files = {}
          for relative in ("Dockerfile", ".dockerignore", "scripts/ci/install_locked_python_requirements.py",
                           "scripts/ci/fetch_docker_source_artifacts.py", "scripts/ci/docker_source_artifacts.json",
                           "scripts/ci/check_private_python_proxy_health.py", ".github/workflows/build.yml"):
              path = root / relative
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("SDK producer input is not regular")
              source_files[relative] = {"bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          source_image = json.loads((evidence / "source-image.json").read_bytes())
          if len(source_image) != 1 or (source_image[0]["Os"], source_image[0]["Architecture"]) != ("linux", "arm64"):
              raise SystemExit("SDK source-image platform differs")
          if not {target.source_image, "docker.io/library/" + target.source_image}.intersection(source_image[0].get("RepoDigests", [])):
              raise SystemExit("SDK source-image digest differs")
          record = {"repository_id": 1043311030, "source_head": run([git, "rev-parse", "HEAD"], "sdk-source-head").decode().strip(),
                    "source_ref": os.environ["GITHUB_REF"], "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": 1,
                    "source_image": target.source_image, "source_image_native": source_image[0], "target": target.__dict__, "native_image": inspected[0],
                    "build_metadata": json.loads(os.environ["SDK_BUILD_METADATA"]), "source_files": source_files,
                    "export_members": inventory, "stock_python": sys.version, "kernel_machine": platform.machine(),
                    "claim": "Genuine hosted producer/export and static consistency only. External clean supporting-tool-root admission, UBI secret-free quarantine/offline consumption/final COPY and immutable Apple Oracle remain separate; no trust authority from these hashes."}
          (area / "sdk-origin.json").write_text(json.dumps(record, sort_keys=True, indent=2) + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write("complete=true\n")
          PY
      - name: Retain ARM SDK raw origin and export evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: backend-arm-cp313-sdk-${{ github.run_id }}-1
          path: ${{ runner.temp }}/arm-sdk-${{ github.run_id }}-1/
          if-no-files-found: error
          retention-days: 30

  prometheus-oras-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'prometheus-oras-qualify' &&
      github.repository == 'Katsiarynakavaleuskaya/PulsePlate' && github.repository_id == '1043311030'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      PROMETHEUS_TOOL_SECONDS: '1800'
      PROMETHEUS_CLEANUP_SECONDS: '120'
      PROMETHEUS_TOOL_TRIVY_CACHE: /tmp/trivy-cache-prometheus-tool
    steps:
      - name: Require first explicit tool attempt
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - name: Checkout exact tool producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up producer Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.14'
      - name: Install pinned tool scanner and acquire DB
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        with:
          version: v0.74.0
          image-ref: gcr.io/distroless/static-debian13@sha256:2293b36c7c9082bf4115aab724b4d2cddec82c8eba39bf27ac0517e159acf150
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          cache-dir: /tmp/trivy-cache-prometheus-tool
      - name: Compile one ORAS tool and qualify native format
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          "$python_bin" -m scripts.ci.prometheus_source_image --operation tool \
            --work-dir "$RUNNER_TEMP/prometheus-oras-$GITHUB_RUN_ID-1" \
            --timeout-seconds "$PROMETHEUS_TOOL_SECONDS" --cleanup-seconds "$PROMETHEUS_CLEANUP_SECONDS"
      - name: Retain tool source and native observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: prometheus-oras-${{ github.run_id }}-1
          path: ${{ runner.temp }}/prometheus-oras-${{ github.run_id }}-1/evidence/
          if-no-files-found: error
          retention-days: 90

  prometheus-source-build-pair:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'prometheus-source-pair' &&
      github.repository == 'Katsiarynakavaleuskaya/PulsePlate' && github.repository_id == '1043311030'
    runs-on: ubuntu-24.04
    # 15m shared preparation + two 60m builds + two 5m native checks + cleanup,
    # with bounded setup/SPDX/attestation/upload reserve. Build caps stay 3600s.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    env:
      PROMETHEUS_BUILD_SECONDS_EACH: '3600'
      PROMETHEUS_CLEANUP_SECONDS: '120'
    steps:
      - name: Require first explicit pair attempt
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - name: Checkout exact frozen producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up producer Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.14'
      - name: Execute exactly two serial source-image builds
        id: pair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          "$python_bin" -m scripts.ci.prometheus_source_image --operation pair \
            --work-dir "$RUNNER_TEMP/prometheus-pair-$GITHUB_RUN_ID-1" \
            --timeout-seconds "$PROMETHEUS_BUILD_SECONDS_EACH" --cleanup-seconds "$PROMETHEUS_CLEANUP_SECONDS"
      - name: Generate SPDX from the retained OCI bytes
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: oci-archive:${{ runner.temp }}/prometheus-pair-${{ github.run_id }}-1/evidence/image.oci.tar
          format: spdx-json
          output-file: ${{ runner.temp }}/prometheus-pair-${{ github.run_id }}-1/evidence/sbom.spdx.json
      - name: Attest the original source producer
        id: original-provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ghcr.io/katsiarynakavaleuskaya/pulseplate
          subject-digest: ${{ steps.pair.outputs.manifest_digest }}
          push-to-registry: false
          create-storage-record: false
      - name: Attest the original SPDX
        id: original-sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ghcr.io/katsiarynakavaleuskaya/pulseplate
          subject-digest: ${{ steps.pair.outputs.manifest_digest }}
          sbom-path: ${{ runner.temp }}/prometheus-pair-${{ github.run_id }}-1/evidence/sbom.spdx.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain original signed bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.original-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.original-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/prometheus-pair-$GITHUB_RUN_ID-1/evidence/provenance-bundle.jsonl"
          cp -- "$SBOM_BUNDLE" "$RUNNER_TEMP/prometheus-pair-$GITHUB_RUN_ID-1/evidence/sbom-bundle.jsonl"
      - name: Retain complete real pair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: prometheus-source-candidate-${{ github.run_id }}-1
          path: ${{ runner.temp }}/prometheus-pair-${{ github.run_id }}-1/evidence/
          if-no-files-found: error
          retention-days: 90

  prometheus-publish:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'Katsiarynakavaleuskaya/PulsePlate' && github.repository_id == '1043311030'
    needs: [build, security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      PROMETHEUS_PUBLICATION_SECONDS: '1800'
      PROMETHEUS_CLEANUP_SECONDS: '120'
    steps:
      - name: Checkout exact main producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Promote precise retained bytes and pull them back
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m scripts.ci.prometheus_source_image --operation promote \
            --work-dir "$RUNNER_TEMP/prometheus-publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --timeout-seconds "$PROMETHEUS_PUBLICATION_SECONDS" --cleanup-seconds "$PROMETHEUS_CLEANUP_SECONDS"
      - name: Retain main publication and pullback
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: prometheus-publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prometheus-publication-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: error
          retention-days: 90
