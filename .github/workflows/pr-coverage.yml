name: PR Coverage Guard

on:
  pull_request:
    branches: [ main, master, develop, ci/** ]
  workflow_dispatch: {}

jobs:
  diff-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13.5
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13.5'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (constrained)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests with coverage (xml) - 20-way split
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONMALLOC: malloc
          HYPOTHESIS_PROFILE: ci
          PYTHONWARNINGS: default
        run: |
          # NOTE: Keep -n 1 due to GH runner MemoryError during collection; mitigated by finer splits.
          for GROUP in $(seq 1 20); do
            APPEND_FLAG=""
            XML_FLAG="--cov-report=xml:.coverage${GROUP}.xml"
            if [ "$GROUP" -gt 1 ]; then
              APPEND_FLAG="--cov-append"
            fi
            # Final shard writes the canonical coverage.xml for diff-cover
            if [ "$GROUP" -eq 20 ]; then
              XML_FLAG="--cov-report=xml --cov-report=term-missing"
            fi
            echo "Running shard ${GROUP}/20..."
            pytest -q --disable-warnings --cov=. $APPEND_FLAG $XML_FLAG --cov-fail-under=97 -n 1 --splits 20 --group "$GROUP"
          done

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}":"${{ github.base_ref }}"

      - name: Enforce diff coverage >= 97%
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch "${{ github.base_ref }}" \
            --fail-under 97 \
            --exclude 'frontend/**' \
            --exclude 'alembic/**' \
            --exclude 'releases/**' \
            --exclude 'cache/**' \
            --exclude 'data/**' \
            --exclude 'external/**' \
            --exclude 'htmlcov/**' \
            --exclude 'coverage/**' \
            --exclude 'providers/pico.py' \
            --exclude 'app/routers/vip.py' \
            --exclude 'conftest.py' \
            --exclude 'tests/**' \
            --exclude '*.json' \
            --exclude '*.lock' \
            --exclude '*.md' \
            --exclude '*.yml' \
            --exclude '*.yaml' \
            --exclude '*.toml' \
            --exclude '*.txt'
