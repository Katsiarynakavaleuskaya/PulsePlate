name: PR Coverage Guard

on:
  pull_request:
    branches: [ main, master, develop, ci/** ]
  workflow_dispatch: {}

jobs:
  diff-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13.5
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13.5'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (constrained)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests with coverage (xml) - Part 1
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONWARNINGS: default
        run: |
          # Run first 1/6 of tests using pytest-split to reduce memory per shard
          pytest -q --disable-warnings --cov=. --cov-report=xml:.coverage1.xml -n 1 --splits 6 --group 1

      - name: Run tests with coverage (xml) - Part 2
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONWARNINGS: default
        run: |
          # Run 2/6 of tests, append coverage
          pytest -q --disable-warnings --cov=. --cov-append --cov-report=xml:.coverage2.xml -n 1 --splits 6 --group 2

      - name: Run tests with coverage (xml) - Part 3
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONWARNINGS: default
        run: |
          # Run 3/6 of tests, append coverage
          pytest -q --disable-warnings --cov=. --cov-append --cov-report=xml:.coverage3.xml -n 1 --splits 6 --group 3

      - name: Run tests with coverage (xml) - Part 4
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONWARNINGS: default
        run: |
          # Run 4/6 of tests, append coverage
          pytest -q --disable-warnings --cov=. --cov-append --cov-report=xml:.coverage4.xml -n 1 --splits 6 --group 4

      - name: Run tests with coverage (xml) - Part 5
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONWARNINGS: default
        run: |
          # Run 5/6 of tests, append coverage
          pytest -q --disable-warnings --cov=. --cov-append --cov-report=xml:.coverage5.xml -n 1 --splits 6 --group 5

      - name: Run tests with coverage (xml) - Part 6
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONWARNINGS: default
        run: |
          # Run final 6/6 of tests, append coverage and generate final XML
          pytest -q --disable-warnings --cov=. --cov-append --cov-report=xml -n 1 --splits 6 --group 6

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}":"${{ github.base_ref }}"

      - name: Enforce diff coverage >= 97%
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch "${{ github.base_ref }}" \
            --fail-under 97 \
            --exclude 'frontend/**' \
            --exclude 'alembic/**' \
            --exclude 'releases/**' \
            --exclude 'cache/**' \
            --exclude 'data/**' \
            --exclude 'external/**' \
            --exclude 'htmlcov/**' \
            --exclude 'coverage/**' \
            --exclude 'providers/pico.py' \
            --exclude 'app/routers/vip.py' \
            --exclude 'conftest.py' \
            --exclude 'tests/**' \
            --exclude '*.json' \
            --exclude '*.lock' \
            --exclude '*.md' \
            --exclude '*.yml' \
            --exclude '*.yaml' \
            --exclude '*.toml' \
            --exclude '*.txt'
