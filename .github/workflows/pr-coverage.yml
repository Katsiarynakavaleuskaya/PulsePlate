name: PR Coverage Guard

on:
  pull_request:
    branches: [ main, master, develop, ci/** ]
  workflow_dispatch: {}

jobs:
  diff-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (constrained)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Show memory stats before tests
        run: |
          echo "=== System Memory ==="
          free -m
          echo "=== Top processes by memory ==="
          ps aux --sort=-rss | head -n 10

      - name: Run tests with coverage (pure sequential, no xdist)
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONMALLOC: malloc
          HYPOTHESIS_PROFILE: ci
          PYTHONWARNINGS: default
          # Disable coverage context tracking to avoid sqlite 'context' table errors
          COV_CORE_CONTEXT: ""
          # Use stub provider to avoid LLM initialization overhead
          LLM_PROVIDER: stub
        run: |
          # NOTE: Removed ALL parallelism including -n flag to eliminate execnet/xdist overhead
          # pytest-xdist causes MemoryError in execnet serialization (_save_integral)
          # Running pure sequential: no workers, no sharding, no parallel collection
          echo "Running full test suite in pure sequential mode (no xdist)..."
          pytest -q --disable-warnings --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 --maxfail=3

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}":"${{ github.base_ref }}"

      - name: Enforce diff coverage >= 97%
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch "${{ github.base_ref }}" \
            --fail-under 97 \
            --exclude 'frontend/**' \
            --exclude 'alembic/**' \
            --exclude 'releases/**' \
            --exclude 'cache/**' \
            --exclude 'data/**' \
            --exclude 'external/**' \
            --exclude 'htmlcov/**' \
            --exclude 'coverage/**' \
            --exclude 'providers/pico.py' \
            --exclude 'app/routers/vip.py' \
            --exclude 'conftest.py' \
            --exclude 'tests/**' \
            --exclude '*.json' \
            --exclude '*.lock' \
            --exclude '*.md' \
            --exclude '*.yml' \
            --exclude '*.yaml' \
            --exclude '*.toml' \
            --exclude '*.txt'
