name: PR Coverage Guard

on:
  pull_request:
    branches: [ main, master, develop, ci/** ]
  workflow_dispatch: {}

jobs:
  diff-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13.5
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13.5'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (constrained)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests with coverage (xml)
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONWARNINGS: default
        run: |
          pytest -q --disable-warnings --cov=. --cov-report=xml

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          # Fetch base branch with full history so diff-cover can calculate diffs
          # fetch-depth: 0 in checkout already ensures complete clone
          git fetch --no-tags --prune origin "${{ github.base_ref }}":"${{ github.base_ref }}"
          # Create local branch pointing to base ref for reliable diff-cover comparison
          git branch --force base "${{ github.base_ref }}"

      - name: Enforce diff coverage >= 97%
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch "${{ github.base_ref }}" \
            --fail-under 97 \
            --exclude 'frontend/**' \
            --exclude 'alembic/**' \
            --exclude 'releases/**' \
            --exclude 'cache/**' \
            --exclude 'data/**' \
            --exclude 'external/**' \
            --exclude 'htmlcov/**' \
            --exclude 'coverage/**' \
            --exclude 'providers/pico.py' \
            --exclude 'app/routers/vip.py' \
            --exclude 'conftest.py' \
            --exclude 'tests/**' \
            --exclude '*.json' \
            --exclude '*.lock' \
            --exclude '*.md' \
            --exclude '*.yml' \
            --exclude '*.yaml' \
            --exclude '*.toml' \
            --exclude '*.txt'
