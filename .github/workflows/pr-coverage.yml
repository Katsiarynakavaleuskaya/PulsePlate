name: PR Coverage Guard

on:
  pull_request:
    branches: [ main, master, develop, ci/** ]
  workflow_dispatch: {}

jobs:
  diff-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Set up Python 3.13.6
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13.6'

      - name: Cache pip
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (constrained)
        run: |
          python -m pip install --upgrade pip
          # Install base runtime deps first to ensure FastAPI and other core packages are present
          python -m pip install -r requirements.txt -c constraints.txt
          # Then install dev/test extras
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Verify nh3 installation (diagnostic)
        run: |
          echo "=== Tooling versions ==="
          which python
          python -m pip --version
          which pip || true
          pip --version || true
          echo "=== Python version ==="
          python -c "import sys; print(sys.version)"
          echo "=== nh3 in requirements files ==="
          grep -n "^nh3" requirements.txt requirements-dev.txt || echo "nh3 not found in requirements"
          echo "=== nh3 installation check ==="
          python -m pip show nh3 || echo "nh3 not installed"
          python -c "import nh3; print('nh3 OK, version:', nh3.__version__)" || echo "nh3 import failed"
          echo "=== All installed packages with nh3 ==="
          python -m pip freeze | grep -i nh3 || echo "nh3 not in freeze output"

      - name: Run tests with coverage (xml)
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONWARNINGS: default
        run: |
          # Run parallel tests (exclude serial-marked tests to avoid xdist hang)
          pytest -q --disable-warnings --cov=. -n auto -m "not serial"

          # Run serial tests separately (coverage append mode)
          pytest -q --disable-warnings --cov=. --cov-append -n 0 -m serial

      - name: Generate combined coverage XML
        run: |
          python -m coverage xml -i -o coverage.xml

      - name: Verify coverage XML
        run: |
          if [ ! -s coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated or is empty."
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          # Fetch base branch with full history so diff-cover can calculate diffs
          # fetch-depth: 0 in checkout already ensures complete clone
          git fetch --no-tags --prune origin "${{ github.base_ref }}":"${{ github.base_ref }}"
          # Create local branch pointing to base ref for reliable diff-cover comparison
          git branch --force base "${{ github.base_ref }}"

      - name: Create diff-cover HTML report (debug)
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml --compare-branch "${{ github.base_ref }}" --format html:diff-coverage.html || true

      - name: Upload diff-cover report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diff-coverage-report
          path: diff-coverage.html

      - name: Enforce diff coverage >= 97%
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_THRESHOLD: 97
        run: |
          diff-cover coverage.xml \
            --compare-branch "${{ github.base_ref }}" \
            --fail-under "${{ env.COVERAGE_THRESHOLD }}" \
            --exclude 'frontend/**' \
            --exclude 'alembic/**' \
            --exclude 'releases/**' \
            --exclude 'cache/**' \
            --exclude 'data/**' \
            --exclude 'external/**' \
            --exclude 'htmlcov/**' \
            --exclude 'coverage/**' \
            --exclude 'providers/pico.py' \
            --exclude 'app/routers/vip.py' \
            --exclude 'conftest.py' \
            --exclude 'tests/**' \
            --exclude '*.json' \
            --exclude '*.lock' \
            --exclude '*.md' \
            --exclude '*.yml' \
            --exclude '*.yaml' \
            --exclude '*.toml' \
            --exclude '*.txt'
