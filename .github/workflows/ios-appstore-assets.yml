name: ios-appstore-assets

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-appstore-assets.yml"
      - "Makefile"
      - ".gitignore"
      - "tests/test_ios_appstore_asset_validators.py"
  workflow_dispatch:
    inputs:
      upload_to_asc:
        description: "Upload metadata and screenshots to App Store Connect draft"
        required: false
        default: false
        type: boolean
      upload_app_privacy:
        description: "Upload App Privacy answers with Apple ID session auth"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-appstore-assets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-assets:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_asc)
    runs-on: xcode-27
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile
    # RU: Для PR проверяем один канонический locale на iPhone + iPad.
    # EN: PR validation captures one canonical locale across iPhone + iPad.
    # RU: Полный multi-locale прогон остаётся для workflow_dispatch upload flow.
    # EN: Full multi-locale capture remains available for workflow_dispatch upload flows.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 / Node 24

      - name: Select Xcode
        run: |
          set -euo pipefail
          CANDIDATES=(
            "/Applications/Xcode_27.0.0.app/Contents/Developer"
            "/Applications/Xcode_27.0.app/Contents/Developer"
            "/Applications/Xcode.app/Contents/Developer"
          )

          for candidate in "${CANDIDATES[@]}"; do
            if [ -d "$candidate" ]; then
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              sudo xcode-select -s "$candidate"
              echo "Selected DEVELOPER_DIR: $candidate"
              XCODEBUILD_VERSION="$(xcodebuild -version)"
              XCODE_VERSION="${XCODEBUILD_VERSION#Xcode }"
              XCODE_VERSION="${XCODE_VERSION%%$'\n'*}"
              if [ "$XCODE_VERSION" != "27.0" ]; then
                echo "::error::Selected Xcode must be exactly 27.0. Got $XCODE_VERSION"
                exit 1
              fi
              echo "Using Xcode at $candidate"
              : "${ImageOS:?Runner ImageOS identity unavailable}"
              : "${ImageVersion:?Runner ImageVersion identity unavailable}"
              echo "Runner image: $ImageOS $ImageVersion"
              xcodebuild -version
              SWIFT_VERSION_OUTPUT="$(swift --version)"
              echo "$SWIFT_VERSION_OUTPUT"
              if [[ "$SWIFT_VERSION_OUTPUT" != *"Apple Swift version 6.4"* ]]; then
                echo "::error::Expected Apple Swift 6.4 under Xcode 27.0"
                exit 1
              fi
              for sdk in iphoneos iphonesimulator; do
                sdk_version="$(xcrun --sdk "$sdk" --show-sdk-version)"
                echo "$sdk SDK: $sdk_version"
                if [ "$sdk_version" != "27.0" ]; then
                  echo "::error::Expected $sdk SDK 27.0, got $sdk_version"
                  exit 1
                fi
              done
              python3 - <<'RUNTIME_CHECK'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"], text=True))
          matches = [r for r in data.get("runtimes", []) if r.get("identifier") == "com.apple.CoreSimulator.SimRuntime.iOS-27-0" and r.get("isAvailable")]
          if len(matches) != 1:
              print("::error::Expected one available iOS 27.0 simulator runtime", file=sys.stderr)
              sys.exit(1)
          print("Selected simulator runtime:", matches[0]["identifier"])
          RUNTIME_CHECK
              exit 0
            fi
          done

          echo "::error::No Xcode 27.0 installation found"
          echo "Available Xcode installations under /Applications:"
          for xcode_app in /Applications/Xcode*.app; do
            if [ -d "$xcode_app" ]; then
              echo " - $xcode_app"
            fi
          done
          exit 1

      - name: Prepare external Bundler root
        run: |
          set -euo pipefail
          umask 077
          bundle_root="${RUNNER_TEMP}/pulseplate-ios-bundle-validate-assets"
          mkdir -p "$bundle_root"
          printf 'PULSEPLATE_BUNDLE_ROOT=%s\nBUNDLE_APP_CONFIG=%s/.bundle\n' \
            "$bundle_root" "$bundle_root" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: ${{ env.PULSEPLATE_BUNDLE_ROOT }}

      - name: Install gems
        working-directory: ios
        run: bundle install

      - name: Capture screenshots
        working-directory: ios
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          SNAPSHOT_LANGUAGES: ${{ github.event_name == 'pull_request' && 'en-US' || '' }}
        run: bundle exec fastlane ios snapshot_all

      - name: Validate assets
        working-directory: ios
        run: bundle exec fastlane ios validate_assets

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: ios-appstore-screenshots
          path: ios/fastlane/screenshots
          if-no-files-found: warn

  upload-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_asc
    needs: validate-assets
    runs-on: xcode-27
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile
    timeout-minutes: 75
    environment: appstore-assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 / Node 24

      - name: Select Xcode
        run: |
          set -euo pipefail
          for candidate in \
            /Applications/Xcode_27.0.0.app/Contents/Developer \
            /Applications/Xcode_27.0.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer; do
            if [ -d "$candidate" ]; then
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              sudo xcode-select -s "$candidate"
              echo "Selected DEVELOPER_DIR: $candidate"
              XCODEBUILD_VERSION="$(xcodebuild -version)"
              XCODE_VERSION="${XCODEBUILD_VERSION#Xcode }"
              XCODE_VERSION="${XCODE_VERSION%%$'\n'*}"
              if [ "$XCODE_VERSION" != "27.0" ]; then
                echo "::error::Selected Xcode must be exactly 27.0. Got $XCODE_VERSION"
                exit 1
              fi
              : "${ImageOS:?Runner ImageOS identity unavailable}"
              : "${ImageVersion:?Runner ImageVersion identity unavailable}"
              echo "Runner image: $ImageOS $ImageVersion"
              xcodebuild -version
              SWIFT_VERSION_OUTPUT="$(swift --version)"
              echo "$SWIFT_VERSION_OUTPUT"
              if [[ "$SWIFT_VERSION_OUTPUT" != *"Apple Swift version 6.4"* ]]; then
                echo "::error::Expected Apple Swift 6.4 under Xcode 27.0"
                exit 1
              fi
              for sdk in iphoneos iphonesimulator; do
                sdk_version="$(xcrun --sdk "$sdk" --show-sdk-version)"
                echo "$sdk SDK: $sdk_version"
                if [ "$sdk_version" != "27.0" ]; then
                  echo "::error::Expected $sdk SDK 27.0, got $sdk_version"
                  exit 1
                fi
              done
              python3 - <<'RUNTIME_CHECK'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"], text=True))
          matches = [r for r in data.get("runtimes", []) if r.get("identifier") == "com.apple.CoreSimulator.SimRuntime.iOS-27-0" and r.get("isAvailable")]
          if len(matches) != 1:
              print("::error::Expected one available iOS 27.0 simulator runtime", file=sys.stderr)
              sys.exit(1)
          print("Selected simulator runtime:", matches[0]["identifier"])
          RUNTIME_CHECK
              exit 0
            fi
          done
          echo "::error::No Xcode 27.0 installation found"
          echo "Available Xcode installations under /Applications:"
          for xcode_app in /Applications/Xcode*.app; do
            if [ -d "$xcode_app" ]; then
              echo " - $xcode_app"
            fi
          done
          exit 1

      - name: Prepare external Bundler root
        run: |
          set -euo pipefail
          umask 077
          bundle_root="${RUNNER_TEMP}/pulseplate-ios-bundle-upload-assets"
          mkdir -p "$bundle_root"
          printf 'PULSEPLATE_BUNDLE_ROOT=%s\nBUNDLE_APP_CONFIG=%s/.bundle\n' \
            "$bundle_root" "$bundle_root" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: ${{ env.PULSEPLATE_BUNDLE_ROOT }}

      - name: Install gems
        working-directory: ios
        run: bundle install

      - name: Download screenshot artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 / Node 24
        with:
          name: ios-appstore-screenshots
          path: ios/fastlane/screenshots

      - name: Guard privileged upload ref
        env:
          ALLOWED_UPLOAD_REFS_REGEX: '^refs/heads/main$|^refs/heads/release/.+$|^refs/tags/release-.+$'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" =~ ${ALLOWED_UPLOAD_REFS_REGEX} ]]; then
            echo "Allowed privileged upload ref: ${GITHUB_REF} @ ${GITHUB_SHA}"
            exit 0
          fi

          echo "::error::Privileged App Store uploads may run only from main or release refs. Got ${GITHUB_REF}"
          exit 1

      - name: Preflight protected App Store upload secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_STORE_BUNDLE_IDENTIFIER: ${{ secrets.APP_STORE_BUNDLE_IDENTIFIER }}
        run: |
          set -euo pipefail
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APP_STORE_BUNDLE_IDENTIFIER; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing protected App Store upload secret(s): ${missing[*]}. See docs/runbooks/IOS_APPSTORE_ASSETS_ROLLOUT.md"
            exit 1
          fi

      - name: Upload metadata and screenshots
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_STORE_BUNDLE_IDENTIFIER: ${{ secrets.APP_STORE_BUNDLE_IDENTIFIER }}
        run: bundle exec fastlane ios upload_metadata_and_screenshots

  upload-app-privacy:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_app_privacy
    runs-on: macos-15
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile
    timeout-minutes: 30
    environment: appstore-privacy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 / Node 24

      - name: Prepare external Bundler root
        run: |
          set -euo pipefail
          umask 077
          bundle_root="${RUNNER_TEMP}/pulseplate-ios-bundle-upload-app-privacy"
          mkdir -p "$bundle_root"
          printf 'PULSEPLATE_BUNDLE_ROOT=%s\nBUNDLE_APP_CONFIG=%s/.bundle\n' \
            "$bundle_root" "$bundle_root" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: ${{ env.PULSEPLATE_BUNDLE_ROOT }}

      - name: Install gems
        working-directory: ios
        run: bundle install

      - name: Validate metadata and privacy package
        working-directory: ios
        run: bundle exec fastlane ios validate_metadata_package

      - name: Guard privileged upload ref
        env:
          ALLOWED_UPLOAD_REFS_REGEX: '^refs/heads/main$|^refs/heads/release/.+$|^refs/tags/release-.+$'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" =~ ${ALLOWED_UPLOAD_REFS_REGEX} ]]; then
            echo "Allowed privileged upload ref: ${GITHUB_REF} @ ${GITHUB_SHA}"
            exit 0
          fi

          echo "::error::Privileged App Store uploads may run only from main or release refs. Got ${GITHUB_REF}"
          exit 1

      - name: Preflight protected App Privacy secrets
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_TEAM_NAME: ${{ secrets.FASTLANE_TEAM_NAME }}
          APP_STORE_BUNDLE_IDENTIFIER: ${{ secrets.APP_STORE_BUNDLE_IDENTIFIER }}
        run: |
          set -euo pipefail
          missing=()
          for name in FASTLANE_USER FASTLANE_SESSION FASTLANE_TEAM_ID FASTLANE_TEAM_NAME APP_STORE_BUNDLE_IDENTIFIER; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing protected App Privacy secret(s): ${missing[*]}. See docs/runbooks/IOS_APPSTORE_ASSETS_ROLLOUT.md"
            exit 1
          fi

      - name: Upload App Privacy
        working-directory: ios
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_TEAM_NAME: ${{ secrets.FASTLANE_TEAM_NAME }}
          APP_STORE_BUNDLE_IDENTIFIER: ${{ secrets.APP_STORE_BUNDLE_IDENTIFIER }}
        run: bundle exec fastlane ios upload_app_privacy
