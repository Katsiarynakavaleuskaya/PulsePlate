name: PR Automation

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, feat/**, fix/**]
  workflow_dispatch:
    inputs:
      coderabbit_timeout_min:
        description: 'CodeRabbit review timeout in minutes (default: 15)'
        required: false
        default: '15'
        type: string

env:
  CODE_RABBIT_TIMEOUT_MIN: ${{ github.event.inputs.coderabbit_timeout_min || '15' }}
  SLEEP_SECONDS: '30' # Interval for checking CodeRabbit status

jobs:
  wait-for-coderabbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for CodeRabbit review completion
        id: wait_coderabbit
        run: |
          TIMEOUT_SECONDS=$(( CODE_RABBIT_TIMEOUT_MIN * 60 ))
          MAX_ITERATIONS=$(( TIMEOUT_SECONDS / SLEEP_SECONDS ))
          echo "Waiting for CodeRabbit review for up to $CODE_RABBIT_TIMEOUT_MIN minutes..."

          for i in $(seq 1 $MAX_ITERATIONS); do
            echo "Checking CodeRabbit status (attempt $i/$MAX_ITERATIONS)..."
            STATUS=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --jq '.[].state' | grep -E 'APPROVED|CHANGES_REQUESTED|COMMENTED' || echo "PENDING")

            if echo "$STATUS" | grep -qE 'APPROVED|CHANGES_REQUESTED|COMMENTED'; then
              echo "CodeRabbit review completed with status: $STATUS"
              break
            fi

            if [ $i -eq $MAX_ITERATIONS ]; then
              echo "CodeRabbit review timed out after $CODE_RABBIT_TIMEOUT_MIN minutes."
              exit 1
            fi

            sleep $SLEEP_SECONDS
          done

  apply-auto-fixes:
    needs: wait-for-coderabbit
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Run ESLint auto-fix
        run: npm run lint:fix --prefix frontend || echo "⚠️  ESLint found issues but continuing to allow fixes to be committed"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install --install-hooks || echo "⚠️  Pre-commit install had issues, continuing..."

      - name: Run pre-commit auto-fix
        run: pre-commit run --all-files || echo "⚠️  Pre-commit found issues but continuing to allow fixes to be committed"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: apply auto-fixes from CodeRabbit and linters"
          git push
