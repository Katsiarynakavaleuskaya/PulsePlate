name: PR Automation

concurrency:
  group: pr-auto-fix-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.sha }}
  cancel-in-progress: false

env:
  CODE_RABBIT_TIMEOUT_MIN: ${{ github.event.inputs.coderabbit_timeout_min || '15' }}
  SLEEP_SECONDS: '30'
  CODE_REVIEWER: ${{ github.event.inputs.code_reviewer || 'coderabbitai' }}
  # Maximum iterations will be calculated in the script using the formula:
  # ceil((timeoutMinutes * 60) / sleepSeconds)
  # This ensures we don't exceed the timeout while accounting for partial sleep cycles

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [main, develop, feat/**, fix/**]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number (required for manual trigger)'
        required: true
        type: string
      coderabbit_timeout_min:
        description: 'CodeRabbit timeout in minutes'
        required: false
        default: '15'
        type: string
      code_reviewer:
        description: 'Code reviewer username'
        required: false
        default: 'coderabbitai'
        type: string

jobs:
  wait-for-coderabbit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      checks: read
    outputs:
      status: ${{ steps.wait.outputs.status }}
    steps:
      - name: Wait for CodeRabbit review
        id: wait
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            // Parse timeout and sleep configuration from environment variables
            const timeoutMinutes = parseInt(process.env.CODE_RABBIT_TIMEOUT_MIN ?? '15', 10);
            const baseDelaySeconds = parseInt(process.env.SLEEP_SECONDS ?? '30', 10);

            // Calculate maximum iterations for polling CodeRabbit reviews
            // Using conservative estimate with base delay to ensure we don't exceed timeout
            const timeoutSeconds = timeoutMinutes * 60;
            const maxIterations = Math.ceil(timeoutSeconds / baseDelaySeconds);

            // Get PR number from context or manual input
            let prNumber;
            if (context.eventName === 'workflow_dispatch') {
              prNumber = parseInt(context.payload.inputs.pr_number, 10);
              if (isNaN(prNumber)) {
                core.setFailed(`Invalid PR number input: "${context.payload.inputs.pr_number}". Must be a valid integer.`);
                return;
              }
            } else {
              prNumber = context.payload.pull_request?.number;
            }

            if (!prNumber) {
              core.setFailed('Unable to determine pull request number. For manual triggers, provide pr_number input.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function reviewCompleted() {
              // Get PR to fetch head SHA
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              const headSha = pr.head.sha;

              // Check if CodeRabbit check exists and is completed
              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha
              });

              const codeRabbitCheck = checks.check_runs.find(check =>
                check.name === 'CodeRabbit' &&
                check.status === 'completed' &&
                check.conclusion === 'success'
              );

              // Log latest CodeRabbit check status for debugging (deterministic)
              const allCodeRabbitChecks = checks.check_runs
                .filter(check => check.name === 'CodeRabbit')
                .sort((a, b) => new Date(b.completed_at || b.started_at || 0) - new Date(a.completed_at || a.started_at || 0));
              if (allCodeRabbitChecks.length > 0) {
                const latestCheck = allCodeRabbitChecks[0];
                core.info(`CodeRabbit check status: ${latestCheck.status}, conclusion: ${latestCheck.conclusion}`);
              } else {
                core.info('No CodeRabbit check found');
              }

              return !!codeRabbitCheck;
            }

            for (let attempt = 1; attempt <= maxIterations; attempt += 1) {
              if (await reviewCompleted()) {
                core.info(`CodeRabbit review completed on attempt ${attempt}.`);
                core.setOutput('status', 'completed');
                return;
              }

              // Calculate delay with jitter
              const jitterFactor = 0.5 + Math.random() * 1.0; // Random factor between 0.5 and 1.5
              const delaySeconds = Math.floor(baseDelaySeconds * jitterFactor);

              core.info(`CodeRabbit check not complete (attempt ${attempt}/${maxIterations}). Waiting ${delaySeconds}s (fixed delay with jitter)...`);
              await new Promise(resolve => setTimeout(resolve, delaySeconds * 1000));
            }

            core.setFailed(`CodeRabbit check not completed within ${timeoutMinutes} minutes.`);

  apply-auto-fixes:
    needs: wait-for-coderabbit
    if: >
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.wait-for-coderabbit.outputs.status == 'completed' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Get PR information
        id: pr-info
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.inputs.pr_number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.full_name);

      - name: Validate PR head SHA
        run: |
          if [ -z "${{ github.event.pull_request.head.sha }}" ] && [ -z "${{ steps.pr-info.outputs.head_sha }}" ]; then
            echo "Error: Cannot determine PR head SHA. This workflow requires a valid PR head SHA to checkout the correct commit."
            echo "github.event.pull_request.head.sha: ${{ github.event.pull_request.head.sha }}"
            echo "steps.pr-info.outputs.head_sha: ${{ steps.pr-info.outputs.head_sha }}"
            exit 1
          fi
          echo "PR head SHA validated successfully"

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.pull_request.head.repo.full_name || steps.pr-info.outputs.head_repo || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || steps.pr-info.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Run Ruff format
        run: |
          python -m ruff format .

      - name: Run Ruff lint (auto-fix)
        run: |
          python -m ruff check --fix .

      - name: Run Ruff lint (check remaining issues)
        run: |
          python -m ruff check .

      - name: Validate fixes
        run: |
          # Ensure Python files are still syntactically valid
          find . -name "*.py" -not -path "*/\.*" -not -path "*/node_modules/*" -exec python -m py_compile {} +

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply automated fixes"

      - name: Push changes
        if: >
          steps.changes.outputs.changed == 'true' &&
          (
            github.event.pull_request.head.repo.full_name == github.repository ||
            steps.pr-info.outputs.head_repo == github.repository
          )
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || steps.pr-info.outputs.head_ref }}
        run: |
          if [ -z "$TARGET_BRANCH" ]; then
            echo "Unable to determine PR head branch name."; exit 1;
          fi
          git push origin "HEAD:${TARGET_BRANCH}"
