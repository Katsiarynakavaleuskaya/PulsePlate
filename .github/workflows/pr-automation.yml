name: PR Automation

concurrency:
  group: pr-auto-fix-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.sha }}
  cancel-in-progress: false

env:
  CODE_RABBIT_TIMEOUT_MIN: ${{ github.event.inputs.coderabbit_timeout_min || vars.CODE_RABBIT_TIMEOUT_MIN || '15' }}
  SLEEP_SECONDS: '30'
  CODE_REVIEWER: ${{ github.event.inputs.code_reviewer || vars.CODE_REVIEWER || 'coderabbitai' }}
  # Maximum iterations will be calculated in the script using the formula:
  # ceil((timeoutMinutes * 60) / sleepSeconds)
  # This ensures we don't exceed the timeout while accounting for partial sleep cycles

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [main, develop, feat/**, fix/**]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number (required for manual trigger)'
        required: true
        type: string
      coderabbit_timeout_min:
        description: 'CodeRabbit timeout in minutes'
        required: false
        default: '15'
        type: string
      code_reviewer:
        description: 'Code reviewer username'
        required: false
        default: 'coderabbitai'
        type: string

jobs:
  wait-for-coderabbit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      status: ${{ steps.wait.outputs.status }}
    steps:
      - name: Wait for CodeRabbit review
        id: wait
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            // Parse timeout and sleep configuration from environment variables
            const timeoutMinutes = parseInt(process.env.CODE_RABBIT_TIMEOUT_MIN ?? '15', 10);
            const baseDelaySeconds = parseInt(process.env.SLEEP_SECONDS ?? '30', 10);
            const maxDelaySeconds = 300; // 5 minutes maximum delay

            // Calculate maximum iterations for polling CodeRabbit reviews
            // Using conservative estimate with base delay to ensure we don't exceed timeout
            const timeoutSeconds = timeoutMinutes * 60;
            const maxIterations = Math.ceil(timeoutSeconds / baseDelaySeconds);

            // Get PR number from context or manual input
            let prNumber;
            if (context.eventName === 'workflow_dispatch') {
              prNumber = context.payload.inputs.pr_number;
            } else {
              prNumber = context.payload.pull_request?.number;
            }

            if (!prNumber) {
              core.setFailed('Unable to determine pull request number. For manual triggers, provide pr_number input.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function reviewCompleted(reviews) {
              return reviews.some(review => {
                if (!review || !review.state) {
                  return false;
                }
                const reviewer = (review.user?.login ?? '').toLowerCase();
                const normalizedState = review.state.toUpperCase();
                const target = (process.env.CODE_REVIEWER ?? 'coderabbitai').toLowerCase();
                const matchesReviewer = reviewer === target;
                const matchesState = ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(normalizedState);
                return matchesReviewer && matchesState;
              });
            }

            for (let attempt = 1; attempt <= maxIterations; attempt += 1) {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });

              if (reviewCompleted(reviews)) {
                core.info(`CodeRabbit review completed on attempt ${attempt}.`);
                core.setOutput('status', 'completed');
                return;
              }

              // Calculate exponential backoff delay with jitter
              const exponentialDelay = Math.min(maxDelaySeconds, baseDelaySeconds * Math.pow(2, attempt - 1));
              const jitterFactor = 0.5 + Math.random() * 1.0; // Random factor between 0.5 and 1.5
              const delaySeconds = Math.floor(exponentialDelay * jitterFactor);

              core.info(`CodeRabbit review not complete (attempt ${attempt}/${maxIterations}). Waiting ${delaySeconds}s (exponential backoff with jitter)...`);
              await new Promise(resolve => setTimeout(resolve, delaySeconds * 1000));
            }

            core.setFailed(`CodeRabbit review not completed within ${timeoutMinutes} minutes.`);

  apply-auto-fixes:
    needs: wait-for-coderabbit
    if: >
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.wait-for-coderabbit.outputs.status == 'completed' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Get PR information
        id: pr-info
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.inputs.pr_number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.full_name);

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.pull_request.head.repo.full_name || steps.pr-info.outputs.head_repo || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || steps.pr-info.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff format
        run: |
          python -m ruff format . || {
            echo "::error::Ruff format failed"
            exit 1
          }

      - name: Run Ruff lint (auto-fix)
        run: |
          python -m ruff check --fix . || {
            echo "::error::Ruff check failed"
            exit 1
          }

      - name: Validate fixes
        run: |
          # Ensure Python files are still syntactically valid
          python -m py_compile $(find . -name "*.py" -not -path "*/\.*" -not -path "*/node_modules/*")

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply automated fixes"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || steps.pr-info.outputs.head_ref }}
        run: |
          if [ -z "$TARGET_BRANCH" ]; then
            echo "Unable to determine PR head branch name."; exit 1;
          fi
          git push origin "HEAD:${TARGET_BRANCH}"
