name: PR Automation

concurrency:
  group: pr-automation-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [main, develop, feat/**, fix/**, feature/**]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number (required for manual trigger)'
        required: true
        type: string

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Get PR details
        id: get-pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let prNumber, prData;

            if (context.eventName === 'workflow_dispatch') {
              prNumber = parseInt(context.payload.inputs.pr_number, 10);
              if (isNaN(prNumber)) {
                core.setFailed(`Invalid PR number: "${context.payload.inputs.pr_number}"`);
                return;
              }

              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });
                prData = pr;
              } catch (error) {
                core.setFailed(`Failed to fetch PR #${prNumber}: ${error.message}`);
                return;
              }
            } else {
              prNumber = context.payload.pull_request?.number;
              prData = context.payload.pull_request;
            }

            if (!prNumber || !prData) {
              core.setFailed('Unable to determine pull request information');
              return;
            }

            core.setOutput('pr_number', prNumber.toString());
            core.setOutput('head_ref', prData.head.ref);
            core.setOutput('head_sha', prData.head.sha);
            core.setOutput('head_repo', prData.head.repo.full_name);

            core.info(`PR #${prNumber}: ${prData.head.repo.full_name}/${prData.head.ref}@${prData.head.sha}`);

      - name: Validate PR state
        run: |
          echo "✅ PR validation completed successfully"
          echo "PR #${{ steps.get-pr.outputs.pr_number }} is valid and ready for review"
