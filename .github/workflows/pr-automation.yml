name: PR Automation - CodeRabbit → CI → Push

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, feat/**, fix/**]
  workflow_dispatch:
    inputs:
      coderabbit_timeout_min:
        description: "CodeRabbit review timeout in minutes (default: 15)"
        required: false
        default: "15"
        type: string

permissions:
  contents: write # Needed to push commits
  pull-requests: read # Needed to read PR reviews

env:
  # CodeRabbit review timeout in minutes (configurable via workflow input or env var)
  # Default: 15 minutes (reduced from 30 to speed up CI)
  CODE_RABBIT_TIMEOUT_MIN: ${{ github.event.inputs.coderabbit_timeout_min || '15' }}

jobs:
  wait-for-coderabbit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # Needed to read PR reviews
    outputs:
      review-status: ${{ steps.check-review.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for CodeRabbit review completion
        id: check-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMEOUT_MIN: ${{ env.CODE_RABBIT_TIMEOUT_MIN }}
        run: |
          # Configuration
          SLEEP_INTERVAL=30  # seconds between checks
          TIMEOUT_SECONDS=$((TIMEOUT_MIN * 60))
          MAX_ITERATIONS=$((TIMEOUT_SECONDS / SLEEP_INTERVAL))

          echo "⏱️  CodeRabbit review timeout: ${TIMEOUT_MIN} minutes (${MAX_ITERATIONS} iterations × ${SLEEP_INTERVAL}s)"
          echo "Waiting for CodeRabbit review..."

          status=""
          iteration=0
          while [ $iteration -lt $MAX_ITERATIONS ]; do
            iteration=$((iteration + 1))
            elapsed=$((iteration * SLEEP_INTERVAL))

            # Check if CodeRabbit review exists and is completed
            if gh pr view ${{ github.event.pull_request.number }} --json reviews | jq -e '.reviews[] | select(.author.login == "coderabbitai[bot]") | select(.state == "COMMENTED" or .state == "APPROVED" or .state == "CHANGES_REQUESTED")' > /dev/null; then
              echo "✅ CodeRabbit review completed after ${elapsed}s"
              echo "status=completed" >> $GITHUB_OUTPUT
              status="completed"
              break
            fi

            echo "⏳ Still waiting for CodeRabbit review... (${iteration}/${MAX_ITERATIONS}, ${elapsed}s elapsed)"
            sleep $SLEEP_INTERVAL
          done

          if [ "$status" != "completed" ]; then
            echo "⚠️ CodeRabbit review timeout after ${TIMEOUT_MIN} minutes" >&2
            echo "ℹ️ Continuing without CodeRabbit review (non-blocking)"
            echo "status=timeout" >> $GITHUB_OUTPUT
            # Do not fail - allow CI to continue
          fi

  apply-coderabbit-fixes:
    needs: wait-for-coderabbit
    runs-on: ubuntu-latest
    if: needs.wait-for-coderabbit.outputs.review-status == 'completed'
    permissions:
      contents: write # Needed to push automated fixes
      pull-requests: read # Needed to read PR context
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          cd frontend && npm ci

      - name: Apply auto-fixable CodeRabbit suggestions
        run: |
          # NOTE: This applies generic auto-fixes (ESLint, pre-commit)
          # CodeRabbit-specific suggestions must be applied manually
          echo "⚠️  Warning: Only applying generic auto-fixes"
          echo "CodeRabbit suggestions should be reviewed and applied manually"

          # Auto-fix ESLint issues
          (cd frontend && npm run lint:fix)

          # Auto-fix Python formatting/linting
          # Install pre-commit hooks first (idempotent operation)
          pre-commit install --install-hooks || echo "⚠️  Pre-commit install had issues, continuing..."

          # Run pre-commit with error handling to avoid failing on first run or existing issues
          # The || true ensures the step continues even if pre-commit finds issues
          pre-commit run --all-files || echo "⚠️  Pre-commit found issues but continuing to allow fixes to be committed"
      - name: Run full test suite
        run: |
          # Python tests with coverage
          python -m pytest tests --cov=. --cov-report=xml --cov-fail-under=97
      - name: Commit automated fixes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Check if this is a fork PR
          IS_FORK="false"
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            IS_FORK="true"
            echo "⚠️  Detected fork PR - skipping commit/push"
          fi

          # Stage changes
          git add -A

          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi

          # Only commit and push if NOT a fork
          if [ "$IS_FORK" = "false" ]; then
            # Checkout the actual branch (not detached HEAD)
            BRANCH_NAME="${GITHUB_HEAD_REF}"
            echo "Checking out branch: $BRANCH_NAME"
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME" || {
              echo "❌ Failed to checkout branch - manual intervention required"
              exit 1
            }

            # Merge with remote to sync (safer than rebase)
            git pull origin "$BRANCH_NAME" --no-rebase || {
              echo "⚠️  Merge conflict detected - manual intervention required"
              echo "ℹ️  Please resolve conflicts manually and re-push"
              echo "ℹ️  This is safer than automatic rebase which rewrites history"
              exit 1
            }

            # Re-stage changes after merge
            git add -A

            # Commit changes
            cat >/tmp/commit_msg <<'EOF'
          🤖 Auto-fix: CodeRabbit suggestions applied

          * Applied ESLint auto-fixes
          * Applied pre-commit auto-fixes (ruff format, ruff check)
          * Verified all tests pass
          * Ready for manual review
          EOF
            git commit -F /tmp/commit_msg || {
              echo "❌ Commit failed - manual intervention required"
              exit 1
            }

            # Push changes
            git push origin "$BRANCH_NAME" || {
              echo "❌ Push failed - manual intervention required"
              exit 1
            }
            echo "✅ Changes committed and pushed successfully"
          else
            echo "✅ Changes detected but skipped push (fork PR)"
            echo "ℹ️  Fork contributors must apply fixes manually"
          fi

  final-validation:
    needs: apply-coderabbit-fixes
    runs-on: ubuntu-latest
    permissions:
      contents: read # Minimal read access for validation
      checks: read # Needed to read check runs
      pull-requests: read # Needed to read PR status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate all CI checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "🔍 Validating CI checks for PR #${PR_NUMBER}..."
          echo "Repository: ${REPO}"

          # Configuration
          TIMEOUT_SECONDS=300  # 5 minutes
          POLL_INTERVAL=10     # Check every 10 seconds
          MAX_ITERATIONS=$((TIMEOUT_SECONDS / POLL_INTERVAL))

          # Required check names (adjust based on your CI setup)
          # Leave empty to check all checks
          REQUIRED_CHECKS=""

          iteration=0
          while [ $iteration -lt $MAX_ITERATIONS ]; do
            iteration=$((iteration + 1))
            elapsed=$((iteration * POLL_INTERVAL))

            echo ""
            echo "⏱️  Poll ${iteration}/${MAX_ITERATIONS} (${elapsed}s elapsed)..."

            # Get PR HEAD SHA
            PR_HEAD_SHA=$(gh pr view ${PR_NUMBER} --json headRefOid --jq '.headRefOid')
            echo "📍 HEAD SHA: ${PR_HEAD_SHA}"

            # Get all check runs for this commit
            check_runs=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${REPO}/commits/${PR_HEAD_SHA}/check-runs" \
              --jq '.check_runs[] | select(.name != "final-validation") | {name: .name, status: .status, conclusion: .conclusion}')

            if [ -z "$check_runs" ]; then
              echo "⚠️  No check runs found yet, waiting..."
              sleep $POLL_INTERVAL
              continue
            fi

            # Parse check runs
            echo "$check_runs" | jq -c '.' | while read -r check; do
              name=$(echo "$check" | jq -r '.name')
              status=$(echo "$check" | jq -r '.status')
              conclusion=$(echo "$check" | jq -r '.conclusion')

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "✅ ${name}: ${conclusion}"
                else
                  echo "❌ ${name}: ${conclusion}"
                fi
              else
                echo "⏳ ${name}: ${status}"
              fi
            done

            # Count check statuses
            total_checks=$(echo "$check_runs" | jq -s 'length')
            completed_checks=$(echo "$check_runs" | jq -s '[.[] | select(.status == "completed")] | length')
            success_checks=$(echo "$check_runs" | jq -s '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
            failed_checks=$(echo "$check_runs" | jq -s '[.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled"))] | length')
            pending_checks=$((total_checks - completed_checks))

            echo ""
            echo "📊 Summary: ${success_checks}/${total_checks} successful, ${failed_checks} failed, ${pending_checks} pending"

            # Check for failures
            if [ $failed_checks -gt 0 ]; then
              echo ""
              echo "❌ FAILURE: One or more CI checks failed or were cancelled"
              echo ""
              echo "Failed checks:"
              echo "$check_runs" | jq -s '.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled")) | "  - \(.name): \(.conclusion)"' -r
              exit 1
            fi

            # Check if all completed successfully
            if [ $pending_checks -eq 0 ] && [ $total_checks -gt 0 ]; then
              echo ""
              echo "✅ SUCCESS: All ${total_checks} CI checks passed!"
              exit 0
            fi

            # Continue waiting
            echo "⏳ Waiting for ${pending_checks} pending check(s) to complete..."
            sleep $POLL_INTERVAL
          done

          # Timeout reached
          echo ""
          echo "⏱️ TIMEOUT: CI checks did not complete within ${TIMEOUT_SECONDS} seconds"
          echo ""
          echo "Current status:"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/commits/${PR_HEAD_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name != "final-validation") | "  - \(.name): \(.status) (\(.conclusion // "pending"))"'
          exit 1
