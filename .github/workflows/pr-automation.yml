name: PR Automation

concurrency:
  group: pr-auto-fix-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [main, develop, feat/**, fix/**]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number (required for manual trigger)'
        required: true
        type: string

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      checks: read
    outputs:
      pr_number: ${{ steps.get-pr.outputs.pr_number }}
      head_ref: ${{ steps.get-pr.outputs.head_ref }}
      head_sha: ${{ steps.get-pr.outputs.head_sha }}
      head_repo: ${{ steps.get-pr.outputs.head_repo }}
    steps:
      - name: Get PR details
        id: get-pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = github.event.pull_request?.number || parseInt('${{ github.event.inputs.pr_number }}', 10);

            if (isNaN(prNumber)) {
              core.setFailed('Invalid PR number provided');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('pr_number', prNumber);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.full_name);

      - name: Validate PR state
        run: |
          echo "PR #${{ steps.get-pr.outputs.pr_number }} validation:"
          echo "  - Head ref: ${{ steps.get-pr.outputs.head_ref }}"
          echo "  - Head SHA: ${{ steps.get-pr.outputs.head_sha }}"
          echo "  - Head repo: ${{ steps.get-pr.outputs.head_repo }}"
          echo "  - Base repo: ${{ github.repository }}"

          # Validate PR is from same repository
          if [ "${{ steps.get-pr.outputs.head_repo }}" != "${{ github.repository }}" ]; then
            echo "❌ PR is from fork: ${{ steps.get-pr.outputs.head_repo }}"
            echo "Skipping automation for fork PRs"
            exit 0
          fi

          echo "✅ PR validation passed"

  syntax-check:
    runs-on: ubuntu-latest
    needs: validate-pr
    if: needs.validate-pr.outputs.head_repo == github.repository
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-pr.outputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: |
          echo "🔍 Validating Python syntax..."
          find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" -not -path "./env/*" | while IFS= read -r -d '' f; do
            if ! python -m py_compile "$f"; then
              echo "❌ Syntax error in $f"
              exit 1
            fi
          done
          echo "✅ All Python files have valid syntax"

      - name: Run basic linting
        run: |
          echo "🔍 Running basic linting checks..."
          python -m pip install --upgrade pip
          pip install ruff
          ruff check --select=E9,F63,F7,F82 --show-source --statistics .
          echo "✅ Basic linting passed"
