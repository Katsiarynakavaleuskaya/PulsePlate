name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, feat/**, fix/**]
  workflow_dispatch:
    inputs:
      coderabbit_timeout_min:
        description: 'CodeRabbit review timeout in minutes (default: 15)'
        required: false
        default: '15'
        type: string

env:
  CODE_RABBIT_TIMEOUT_MIN: ${{ github.event.inputs.coderabbit_timeout_min || '15' }}
  SLEEP_SECONDS: '30'

jobs:
  wait-for-coderabbit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CodeRabbit review
        run: |
          echo "Waiting for CodeRabbit review completion..."
          TIMEOUT_SECONDS=$(( CODE_RABBIT_TIMEOUT_MIN * 60 ))
          MAX_ITERATIONS=$(( TIMEOUT_SECONDS / SLEEP_SECONDS ))

          for i in $(seq 1 $MAX_ITERATIONS); do
            echo "Check $i/$MAX_ITERATIONS - waiting for CodeRabbit..."
            sleep $SLEEP_SECONDS
          done

          echo "CodeRabbit timeout reached, proceeding..."

  apply-auto-fixes:
    needs: wait-for-coderabbit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply auto-fixable CodeRabbit suggestions
        run: |
          pre-commit install --install-hooks || echo "⚠️  Pre-commit install had issues, continuing..."
          pre-commit run --all-files || echo "⚠️  Pre-commit found issues but continuing to allow fixes to be committed"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: apply auto-fixes from CodeRabbit suggestions"
            git push
          fi
