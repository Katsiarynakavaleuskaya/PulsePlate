name: Accessibility Tests

env:
  FRONTEND_NODE_VERSION_FILE: ".nvmrc"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/actions/npm-ci-with-retry/**'
      - 'frontend/vite.config.ts'
      - 'frontend/package.json'
      - 'frontend/tsconfig.json'
      - '.github/workflows/accessibility.yml'
  push:
    branches: [main, feat/**, fix/**]
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/actions/npm-ci-with-retry/**'
      - 'frontend/vite.config.ts'
      - 'frontend/package.json'
      - 'frontend/tsconfig.json'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE: "http://localhost:8000/api/v1"
      VITE_API_KEY: "test_key"
      VITE_DEV_MODE: "true"
      VITE_ANALYTICS_ENABLED: "false"
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ env.FRONTEND_NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          working-directory: frontend

      - name: Prepare test-results directory
        run: mkdir -p test-results

      - name: Run accessibility test suite
        run: npm run test:accessibility -- --reporter=junit --outputFile=test-results/accessibility.xml
        # env vars are inherited from job-level env

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: accessibility-reports
          path: frontend/test-results/**
          if-no-files-found: ignore
          retention-days: 7
