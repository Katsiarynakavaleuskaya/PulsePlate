name: Accessibility Tests

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'frontend/vite.config.ts'
      - 'frontend/package.json'
      - 'frontend/tsconfig.json'
      - '.github/workflows/accessibility.yml'
  push:
    branches: [main, feat/**, fix/**]
    paths:
      - 'frontend/**'
      - 'frontend/vite.config.ts'
      - 'frontend/package.json'
      - 'frontend/tsconfig.json'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE: "http://localhost:8000/api/v1"
      VITE_API_KEY: "test_key"
      VITE_DEV_MODE: "true"
      VITE_ANALYTICS_ENABLED: "false"
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci \
              --fetch-retries=5 \
              --fetch-retry-factor=2 \
              --fetch-retry-mintimeout=20000 \
              --fetch-retry-maxtimeout=120000 && exit 0
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Prepare test-results directory
        run: mkdir -p test-results

      - name: Run accessibility test suite
        run: npm run test:accessibility -- --reporter=junit --outputFile=test-results/accessibility.xml
        # env vars are inherited from job-level env

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: accessibility-reports
          path: frontend/test-results/**
          if-no-files-found: ignore
          retention-days: 7
