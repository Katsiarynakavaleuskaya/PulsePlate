name: Gemini PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: Gemini Review
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Gemini CLI
        run: |
          curl -sSL https://github.com/google-gemini/gemini-cli/releases/latest/download/gemini-linux-amd64 -o gemini
          chmod +x gemini
          sudo mv gemini /usr/local/bin/gemini

      - name: Run Gemini analysis
        if: env.GEMINI_API_KEY != ''
        run: |
          gemini pr review \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request ${{ github.event.pull_request.number }} \
            --output-format markdown > gemini-report.md

      - name: Post Gemini review comment
        if: env.GEMINI_API_KEY != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: gemini-report.md
          recreate: true

      - name: Skip note when API key missing
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY not configured; skipping Gemini analysis."
