name: Security Scan

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, feat/**, fix/**]
  pull_request:
    branches: [main, develop, feat/**, fix/**]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.9 safety==3.2.5

      - name: Run Bandit (security lint)
        run: |
          bandit -q -r . \
            -x node_modules,dist,build,test-results,.venv,venv,cache \
            -s B101 \
            -f json -o bandit-report.json

      - name: Run Safety (dependency audit)
        run: |
          safety check --full-report -r requirements.txt > safety-report.txt

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.txt
          if-no-files-found: ignore
