name: Security

on:
  push:
    branches: [ main, develop, feat/**, fix/** ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Bandit security scan
        run: |
          EXCLUDES="frontend,node_modules,dist,build,test-results,.venv,venv,cache"
          SCAN_PATH="."
          bandit -r "$SCAN_PATH" -x "$EXCLUDES" -f json -o bandit-report.json
          bandit -r "$SCAN_PATH" -x "$EXCLUDES" -s B101

      - name: Safety dependency scan
        continue-on-error: true
        run: |
          FILES=()
          [[ -f requirements.txt ]] && FILES+=("-r" "requirements.txt")
          [[ -f requirements-dev.txt ]] && FILES+=("-r" "requirements-dev.txt")
          if (( ${#FILES[@]} )); then
            safety check "${FILES[@]}" --json --output safety-report.json || true
            safety check "${FILES[@]}" || true
          else
            echo "No requirements files found; falling back to environment scan."
            safety check --json --output safety-report.json || true
            safety check || true
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          if-no-files-found: ignore
