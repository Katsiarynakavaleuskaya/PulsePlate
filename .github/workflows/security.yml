# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Scan

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, feat/**, fix/**]
  pull_request:
    branches: [main, develop, feat/**, fix/**]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.6 safety==3.6.2
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            sudo rm -rf /var/lib/apt/lists/*
          fi

      - name: Run Bandit (security lint)
        run: |
          bandit_exit_code=0
          # Main repository scan (production code) - no B101 skip
          bandit -q -r . \
            --exclude "tests,test_cache,cache,frontend/build,htmlcov,releases,data,external,node_modules,dist,build,.venv" \
            -f json -o bandit-report.json || bandit_exit_code=$?

          # Tests directory scan with B101 and B112 skip (asserts and Exception handling are acceptable in tests)
          bandit_tests_exit=0
          if [ -d tests ]; then
            bandit -q -r tests --skip B101,B112 || bandit_tests_exit=$?
          fi
          # Also scan tests_strict if it exists
          bandit_tests_strict_exit=0
          if [ -d tests_strict ]; then
            bandit -q -r tests_strict --skip B101,B112 || bandit_tests_strict_exit=$?
          fi

          if [ "$bandit_exit_code" -gt 1 ] || [ "$bandit_tests_exit" -gt 1 ] || [ "$bandit_tests_strict_exit" -gt 1 ]; then
            echo "❌ Bandit failed to complete successfully (exit code: $bandit_exit_code, tests exit: $bandit_tests_exit, tests_strict exit: $bandit_tests_strict_exit)"
            exit 1
          fi

          if [ ! -f bandit-report.json ]; then
            echo "❌ Bandit report was not generated"
            exit 1
          fi

          echo "=== Bandit Report Analysis ==="
          high_severity_count=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json 2>/dev/null || echo "0")
          if [ "$high_severity_count" -gt 0 ]; then
            echo "❌ Found $high_severity_count HIGH severity security issues in Bandit report"
            echo "::error::Bandit found $high_severity_count HIGH severity issues that must be addressed"
            exit 1
          fi

          if [ "$bandit_exit_code" -eq 1 ] || [ "$bandit_tests_exit" -eq 1 ] || [ "$bandit_tests_strict_exit" -eq 1 ]; then
            echo "⚠️  Bandit reported issues below HIGH severity (exit codes: main=$bandit_exit_code, tests=$bandit_tests_exit, tests_strict=$bandit_tests_strict_exit)"
            echo "::warning::Bandit reported issues below HIGH severity – review bandit-report.json and test scan output"
          else
            echo "✅ No HIGH severity issues found in Bandit report"
          fi

      - name: Run Safety (dependency audit with policy)
        run: |
          set -eo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ ! -f requirements.txt ]; then
            echo "⚠️ requirements.txt not found — creating from pip freeze"
            python -m pip freeze > requirements.txt || true
          fi

          extra_args=()
          if [ -f safety-policy.yaml ]; then
            extra_args+=(--policy-file safety-policy.yaml)
          elif [ -f safety-policy.toml ]; then
            # Fallback to TOML if YAML not found (legacy support)
            extra_args+=(--policy-file safety-policy.toml)
          else
            echo "⚠️ safety-policy.yaml not found — running safety without a policy file"
          fi

          echo "▶️  Running Safety audit (JSON output for post-processing)"
          safety_exit_code=0
          safety check \
            "${extra_args[@]}" \
            --json \
            -r requirements.txt \
            --save-json safety-report.json > safety-console.log 2>&1 || safety_exit_code=$?

          if [ -s safety-console.log ]; then
            echo "=== Raw Safety Output ==="
            cat safety-console.log
          fi

          if [ "$safety_exit_code" -gt 1 ]; then
            echo "❌ Safety failed to complete successfully (exit code: $safety_exit_code)"
            echo "::error::Safety execution failed with exit code $safety_exit_code"
            exit "$safety_exit_code"
          fi

          python3 .github/scripts/parse-safety-report.py
          analysis_status=$?

          if [ "$analysis_status" -eq 10 ]; then
            echo "❌ Safety found high/critical vulnerabilities"
            echo "::error::Safety found high/critical vulnerabilities - see safety-report.txt"
            exit 1
          elif [ "$analysis_status" -eq 2 ]; then
            echo "⚠️  Safety reported vulnerabilities below HIGH severity"
            echo "::warning::Safety reported vulnerabilities below HIGH severity – review safety-report.txt"
          elif [ "$analysis_status" -ne 0 ]; then
            echo "❌ Failed to analyze Safety report (status $analysis_status)"
            exit "$analysis_status"
          else
            echo "✅ Safety check passed - no high/critical vulnerabilities found"
          fi


      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            safety-report.txt
          if-no-files-found: ignore
