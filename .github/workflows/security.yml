name: Security Scan

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, feat/**, fix/**]
  pull_request:
    branches: [main, develop, feat/**, fix/**]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.9 safety==2.3.5

      - name: Run Bandit (security lint)
        run: |
          bandit -q -r . \
            -x node_modules,dist,build,test-results,.venv,venv,cache \
            -s B101 \
            -f json -o bandit-report.json || true

          # Analyze Bandit report for high severity issues
          if [ -f bandit-report.json ]; then
            echo "=== Bandit Report Analysis ==="
            high_severity_count=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json 2>/dev/null || echo "0")
            if [ "$high_severity_count" -gt 0 ]; then
              echo "❌ Found $high_severity_count HIGH severity security issues in Bandit report"
              echo "::error::Bandit found $high_severity_count HIGH severity issues that must be addressed"
              exit 1
            else
              echo "✅ No HIGH severity issues found in Bandit report"
            fi
          fi

      - name: Run Safety (dependency audit)
        run: |
          # Run Safety and capture exit code
          safety check --full-report -r requirements.txt > safety-report.txt 2>&1
          safety_exit_code=$?

          # Display Safety report
          if [ -f safety-report.txt ]; then
            echo "=== Safety Report ==="
            cat safety-report.txt
          fi

          # Analyze Safety exit code (more reliable than grep parsing)
          case "$safety_exit_code" in
            0)
              echo "✅ Safety check passed - no vulnerabilities found"
              ;;
            1)
              echo "❌ Safety found vulnerabilities that must be addressed"
              echo "::error::Safety found vulnerabilities - see report for details"
              exit 1
              ;;
            *)
              echo "❌ Safety failed to complete successfully (exit code: $safety_exit_code)"
              echo "::error::Safety execution failed with exit code $safety_exit_code"
              exit "$safety_exit_code"
              ;;
          esac

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.txt
          if-no-files-found: ignore
