name: Security Scan

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, feat/**, fix/**]
  pull_request:
    branches: [main, develop, feat/**, fix/**]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.6 safety==3.6.2
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            sudo rm -rf /var/lib/apt/lists/*
          fi

      - name: Run Bandit (security lint)
        run: |
          bandit_exit_code=0
          # Use command line parameters for consistent settings
          bandit -r . -x tests,frontend,node_modules,dist,build,.venv,venv,cache,releases,coverage_html,htmlcov -s B101,B105,B601 -lll -ii -f json -o bandit-report.json || bandit_exit_code=$?
          if [ "$bandit_exit_code" -gt 1 ]; then
            echo "❌ Bandit failed to complete successfully (exit code: $bandit_exit_code)"
            exit "$bandit_exit_code"
          fi
          if [ ! -f bandit-report.json ]; then
            echo "❌ Bandit report was not generated"
            exit 1
          fi
          echo "=== Bandit Report Analysis ==="
          high_severity_count=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json 2>/dev/null || echo "0")
          if [ "$high_severity_count" -gt 0 ]; then
            echo "❌ Found $high_severity_count HIGH severity security issues in Bandit report"
            echo "::error::Bandit found $high_severity_count HIGH severity issues that must be addressed"
            exit 1
          fi
          echo "✅ No HIGH severity issues found in Bandit report"

      - name: Run Safety (dependency audit)
        run: |
          # First run: Generate full report (always succeeds for artifact)
          safety scan --full-report -r requirements.txt > safety-report.txt 2>&1 || true
          if [ -f requirements-dev.txt ]; then
            {
              echo ""
              echo "=== Safety (dev) Report ==="
            } >> safety-report.txt
            safety scan --full-report -r requirements-dev.txt >> safety-report.txt 2>&1 || true
          fi

          # Display Safety report
          if [ -f safety-report.txt ]; then
            echo "=== Safety Report ==="
            cat safety-report.txt
          fi

          # Second run: Fail only on high/critical vulnerabilities
          safety_exit_code=0
          safety scan -r requirements.txt --severity high || safety_exit_code=$?
          if [ -f requirements-dev.txt ]; then
            safety scan -r requirements-dev.txt --severity high || safety_exit_code=$?
          fi

          # Analyze Safety exit code
          case "$safety_exit_code" in
            0)
              echo "✅ Safety scan passed - no high/critical vulnerabilities found"
              ;;
            1)
              echo "❌ Safety found high/critical vulnerabilities that must be addressed"
              echo "::error::Safety found high/critical vulnerabilities - see report for details"
              exit 1
              ;;
            *)
              echo "❌ Safety failed to complete successfully (exit code: $safety_exit_code)"
              echo "::error::Safety execution failed with exit code $safety_exit_code"
              exit "$safety_exit_code"
              ;;
          esac

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.txt
          if-no-files-found: ignore
