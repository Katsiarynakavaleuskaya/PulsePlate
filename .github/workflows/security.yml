name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, feat/**, fix/**]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit security scan
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Run Safety dependency scan
        run: safety check -r requirements.txt || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔒 Security Scan Results\n\n';

            try {
              const banditReport = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              const issues = banditReport.results || [];

              if (issues.length === 0) {
                comment += '✅ **Bandit**: No security issues found\n';
              } else {
                comment += `⚠️ **Bandit**: Found ${issues.length} security issues\n`;
                issues.slice(0, 5).forEach(issue => {
                  comment += `- ${issue.issue_severity}: ${issue.issue_text} (${issue.filename}:${issue.line_number})\n`;
                });
                if (issues.length > 5) {
                  comment += `- ... and ${issues.length - 5} more issues\n`;
                }
              }
            } catch (error) {
              comment += '❌ **Bandit**: Report generation failed\n';
            }

            comment += '\n📊 Full reports available in workflow artifacts.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
