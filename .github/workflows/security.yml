# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Scan

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, feat/**, fix/**]
  pull_request:
    branches: [main, develop, feat/**, fix/**]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.9 safety==2.3.5
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            sudo rm -rf /var/lib/apt/lists/*
          fi

      - name: Run Bandit (security lint)
        run: |
          bandit_exit_code=0
          # Main repository scan (production code) - no B101 skip
          bandit -q -r . \
            --exclude "tests,test_cache,cache,frontend/build,htmlcov,releases,data,external,node_modules,dist,build,.venv" \
            -f json -o bandit-report.json || bandit_exit_code=$?

          # Tests directory scan with B101 skip (asserts are acceptable in tests)
          bandit_tests_exit=0
          if [ -d tests ]; then
            bandit -q -r tests --skip B101 || bandit_tests_exit=$?
          fi
          # Also scan tests_strict if it exists
          if [ -d tests_strict ]; then
            bandit -q -r tests_strict --skip B101 || bandit_tests_exit=$?
          fi

          if [ "$bandit_exit_code" -gt 1 ] || [ "$bandit_tests_exit" -gt 1 ]; then
            echo "❌ Bandit failed to complete successfully (exit code: $bandit_exit_code, tests exit: $bandit_tests_exit)"
            exit 1
          fi

          if [ ! -f bandit-report.json ]; then
            echo "❌ Bandit report was not generated"
            exit 1
          fi

          echo "=== Bandit Report Analysis ==="
          high_severity_count=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json 2>/dev/null || echo "0")
          if [ "$high_severity_count" -gt 0 ]; then
            echo "❌ Found $high_severity_count HIGH severity security issues in Bandit report"
            echo "::error::Bandit found $high_severity_count HIGH severity issues that must be addressed"
            exit 1
          fi

          if [ "$bandit_exit_code" -eq 1 ] || [ "$bandit_tests_exit" -eq 1 ]; then
            echo "⚠️  Bandit reported issues below HIGH severity (exit codes: main=$bandit_exit_code, tests=$bandit_tests_exit)"
            echo "::warning::Bandit reported issues below HIGH severity – review bandit-report.json and test scan output"
          else
            echo "✅ No HIGH severity issues found in Bandit report"
          fi

      - name: Run Safety (dependency audit with policy)
        run: |
          set -eo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ ! -f requirements.txt ]; then
            echo "⚠️ requirements.txt not found — creating from pip freeze"
            python -m pip freeze > requirements.txt || true
          fi

          extra_args=()
          if [ -f safety-policy.toml ]; then
            extra_args+=(--policy-file safety-policy.toml)
          else
            echo "⚠️ safety-policy.toml not found — running safety without a policy file"
          fi

          echo "▶️  Running Safety audit (JSON output for post-processing)"
          safety_exit_code=0
          safety check \
            "${extra_args[@]}" \
            --json \
            -r requirements.txt \
            --save-json safety-report.json > safety-console.log 2>&1 || safety_exit_code=$?

          if [ -s safety-console.log ]; then
            echo "=== Raw Safety Output ==="
            cat safety-console.log
          fi

          if [ "$safety_exit_code" -gt 1 ]; then
            echo "❌ Safety failed to complete successfully (exit code: $safety_exit_code)"
            echo "::error::Safety execution failed with exit code $safety_exit_code"
            exit "$safety_exit_code"
          fi

          python3 <<'EOF'
          import json
          import sys
          from pathlib import Path

          report_path = Path("safety-report.json")
          summary_path = Path("safety-report.txt")

          if not report_path.exists():
              summary_path.write_text("Safety report JSON was not generated.\n")
              print("❌ Safety report JSON was not generated.")
              sys.exit(99)

          data = json.loads(report_path.read_text())
          vulns = data.get("vulnerabilities", []) or []
          ignored = data.get("ignored_vulnerabilities", []) or []

          def base_severity(entry: dict) -> str:
              severity = entry.get("severity") or {}
              for key in ("cvssv3", "cvssv2"):
                  info = severity.get(key)
                  if isinstance(info, dict):
                      base = info.get("base_severity")
                      if base:
                          return str(base).upper()
              base = severity.get("max_severity") or severity.get("severity") or severity.get("level")
              if isinstance(base, str):
                  return base.upper()
              return ""

          def build_lines() -> list[str]:
              lines = []
              if not vulns:
                  lines.append("No vulnerabilities reported by Safety.")
              else:
                  lines.append("Reported vulnerabilities:")
                  for item in vulns:
                      pkg = item.get("package_name") or "<unknown package>"
                      version = item.get("analyzed_version") or ""
                      vuln_id = item.get("vuln_id") or item.get("advisory_id") or ""
                      severity = base_severity(item) or "UNKNOWN"
                      advisory = (item.get("advisory") or "").strip()
                      lines.append(f"- [{severity}] {pkg} {version} — {vuln_id}")
                      if advisory:
                          lines.append(f"    {advisory}")
              if ignored:
                  lines.append("")
                  lines.append(f"Ignored vulnerabilities: {len(ignored)} (see JSON for details)")
              return lines

          lines = build_lines()
          summary_path.write_text("\n".join(lines) + "\n")

          high_or_critical = [
              item for item in vulns if base_severity(item) in {"HIGH", "CRITICAL"}
          ]
          medium_or_low = [
              item for item in vulns if base_severity(item) not in {"HIGH", "CRITICAL"}
          ]

          print("=== Safety Report Summary ===")
          print("\n".join(lines))
          print(f"\nHigh/Critical findings: {len(high_or_critical)}")
          print(f"Other findings: {len(medium_or_low)}")

          if high_or_critical:
              sys.exit(10)
          elif medium_or_low:
              sys.exit(2)
          else:
              sys.exit(0)
          EOF
          analysis_status=$?

          if [ "$analysis_status" -eq 10 ]; then
            echo "❌ Safety found high/critical vulnerabilities"
            echo "::error::Safety found high/critical vulnerabilities - see safety-report.txt"
            exit 1
          elif [ "$analysis_status" -eq 2 ]; then
            echo "⚠️  Safety reported vulnerabilities below HIGH severity"
            echo "::warning::Safety reported vulnerabilities below HIGH severity – review safety-report.txt"
          elif [ "$analysis_status" -ne 0 ]; then
            echo "❌ Failed to analyze Safety report (status $analysis_status)"
            exit "$analysis_status"
          else
            echo "✅ Safety check passed - no high/critical vulnerabilities found"
          fi


      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            safety-report.txt
          if-no-files-found: ignore
