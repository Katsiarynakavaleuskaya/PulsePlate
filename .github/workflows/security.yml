name: security
on:
  push:
    branches: [ main, develop, feat/** ]
  pull_request:
    branches: [ main, develop ]
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit full scan (safe excludes)
        run: bandit -q -r . -x frontend,node_modules,dist,build,test-results,.venv,venv,cache -s B101 || true
