name: Security Scan

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, feat/**, fix/**]
  pull_request:
    branches: [main, develop, feat/**, fix/**]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.9 "safety<3"

      - name: Run Bandit (security lint)
        run: |
          bandit -q -r . \
            -x node_modules,dist,build,test-results,.venv,venv,cache \
            -s B101 \
            -f json -o bandit-report.json || true

          # Analyze Bandit report for high severity issues
          if [ -f bandit-report.json ]; then
            echo "=== Bandit Report Analysis ==="
            high_severity_count=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json 2>/dev/null || echo "0")
            if [ "$high_severity_count" -gt 0 ]; then
              echo "⚠️  Found $high_severity_count HIGH severity security issues in Bandit report"
              echo "::warning::Bandit found $high_severity_count HIGH severity issues – see report for details"
            else
              echo "✅ No HIGH severity issues found in Bandit report"
            fi
          fi

      - name: Run Safety (dependency audit)
        run: |
          # Run Safety and capture exit code
          safety check --full-report -r requirements.txt > safety-report.txt 2>&1
          safety_exit_code=$?

          # Parse Safety report for high/critical vulnerabilities
          if [ -f safety-report.txt ]; then
            echo "=== Safety Report Analysis ==="
            cat safety-report.txt

            # Check for high/critical vulnerabilities
            high_critical_count=$(grep -c -E "(HIGH|CRITICAL)" safety-report.txt || echo "0")

            if [ "$high_critical_count" -gt 0 ]; then
              echo "❌ Found $high_critical_count HIGH/CRITICAL vulnerabilities"
              echo "::error::Safety found $high_critical_count HIGH/CRITICAL vulnerabilities that must be addressed"
              exit 1
            else
              echo "✅ No HIGH/CRITICAL vulnerabilities found"
              case "$safety_exit_code" in
                0)
                  ;;
                1)
                  echo "⚠️  Safety found lower severity issues (exit code: $safety_exit_code)"
                  echo "::warning::Safety found lower severity issues – see report for details"
                  ;;
                *)
                  echo "❌ Safety failed to complete successfully (exit code: $safety_exit_code)"
                  exit "$safety_exit_code"
                  ;;
              esac
            fi
          else
            echo "❌ Safety report file not found"
            exit 1
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.txt
          if-no-files-found: ignore
