# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Scan

env:
  PULSEPLATE_PYTHON_INDEX_URL: ${{ secrets.PULSEPLATE_PYTHON_INDEX_URL || vars.PULSEPLATE_PYTHON_INDEX_URL }}
  PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ secrets.PULSEPLATE_PYTHON_TRUSTED_HOST || vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2 / Node 24

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: '3.13.14'
          requirements-profile: ci-lite
          install-mode: direct-proxy

      - name: Production runtime invariant guard
        run: |
          set -euo pipefail
          python3 scripts/ci/check_production_runtime_invariants.py --synthetic-production

      - name: Run Bandit (security lint)
        run: |
          set -euo pipefail

          bandit_exit_code=0
          # Main repository scan (production code) - no B101 skip
          bandit -q -r . \
            --exclude "tests,test_cache,cache,frontend/build,htmlcov,releases,data,external,node_modules,dist,build,.venv" \
            -f json -o bandit-report.json || bandit_exit_code=$?

          # Tests directory scan with B101 and B112 skip (asserts and Exception handling are acceptable in tests)
          bandit_tests_exit=0
          if [ -d tests ]; then
            bandit -q -r tests --skip B101,B112 || bandit_tests_exit=$?
          fi
          # Also scan tests_strict if it exists
          bandit_tests_strict_exit=0
          if [ -d tests_strict ]; then
            bandit -q -r tests_strict --skip B101,B112 || bandit_tests_strict_exit=$?
          fi

          if [ "$bandit_exit_code" -gt 1 ] || [ "$bandit_tests_exit" -gt 1 ] || [ "$bandit_tests_strict_exit" -gt 1 ]; then
            echo "❌ Bandit failed to complete successfully (exit code: $bandit_exit_code, tests exit: $bandit_tests_exit, tests_strict exit: $bandit_tests_strict_exit)"
            exit 1
          fi

          if [ ! -f bandit-report.json ]; then
            echo "❌ Bandit report was not generated"
            exit 1
          fi

          echo "=== Bandit Report Analysis ==="
          python3 scripts/ci/summarize_bandit_report.py \
            --report bandit-report.json \
            --fail-on-high \
            --github-annotations

          if [ "$bandit_tests_exit" -eq 1 ] || [ "$bandit_tests_strict_exit" -eq 1 ]; then
            echo "⚠️  Bandit reported issues in test scan output (exit codes: tests=$bandit_tests_exit, tests_strict=$bandit_tests_strict_exit)"
            echo "::warning::Bandit reported issues in test scan output – review the Bandit log"
          fi

      - name: Run pip-audit (dependency audit)
        run: |
          set -euo pipefail
          bash scripts/ci_pip_audit.sh

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-*.json
          if-no-files-found: ignore
