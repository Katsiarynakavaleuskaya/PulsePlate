name: Security

on:
  push:
    branches: [ main, develop, feat/**, fix/** ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Bandit security scan
        run: |
          EXCLUDES="frontend,node_modules,dist,build,test-results,.venv,venv,cache"
          SCAN_PATH="."
          set +e
          bandit -r "$SCAN_PATH" -x "$EXCLUDES" -f json -o bandit-report.json
          bandit_json_exit=$?
          bandit -r "$SCAN_PATH" -x "$EXCLUDES" -s B101
          bandit_b101_exit=$?
          set -e
          echo "BANDIT_JSON_EXIT=$bandit_json_exit" >> "$GITHUB_ENV"
          echo "BANDIT_B101_EXIT=$bandit_b101_exit" >> "$GITHUB_ENV"
          if (( bandit_json_exit != 0 || bandit_b101_exit != 0 )); then
            echo "SECURITY_FAILURE=true" >> "$GITHUB_ENV"
          fi

      - name: Safety dependency scan
        run: |
          FILES=()
          [[ -f requirements.txt ]] && FILES+=("-r" "requirements.txt")
          [[ -f requirements-dev.txt ]] && FILES+=("-r" "requirements-dev.txt")
          set +e
          if (( ${#FILES[@]} )); then
            safety check "${FILES[@]}" -o json > safety-report.json
            safety_json_exit=$?
            safety check "${FILES[@]}"
            safety_console_exit=$?
          else
            echo "No requirements files found; falling back to environment scan."
            safety check -o json > safety-report.json
            safety_json_exit=$?
            safety check
            safety_console_exit=$?
          fi
          set -e
          echo "SAFETY_JSON_EXIT=${safety_json_exit:-0}" >> "$GITHUB_ENV"
          echo "SAFETY_CONSOLE_EXIT=${safety_console_exit:-0}" >> "$GITHUB_ENV"
          if (( ${safety_json_exit:-0} != 0 || ${safety_console_exit:-0} != 0 )); then
            echo "SECURITY_FAILURE=true" >> "$GITHUB_ENV"
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          if-no-files-found: ignore

      - name: Fail on security findings
        if: always() && env.SECURITY_FAILURE == 'true'
        run: |
          echo "Security scan found issues. Check the uploaded reports for details."
          echo "Bandit JSON exit code: $BANDIT_JSON_EXIT"
          echo "Bandit B101 exit code: $BANDIT_B101_EXIT"
          echo "Safety JSON exit code: $SAFETY_JSON_EXIT"
          echo "Safety console exit code: $SAFETY_CONSOLE_EXIT"
          exit 1
