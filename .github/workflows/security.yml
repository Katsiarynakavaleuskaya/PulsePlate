name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json
          bandit -r . -f txt

      - name: Run Safety check
        run: |
          safety check --json --output safety-report.json
          safety check

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 30

      - name: Comment security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔒 Security Scan Results\n\n';

            try {
              const banditReport = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              const issues = banditReport.results || [];

              if (issues.length === 0) {
                comment += '✅ **Bandit**: No security issues found\n\n';
              } else {
                comment += `⚠️ **Bandit**: Found ${issues.length} security issues\n\n`;
                issues.slice(0, 5).forEach(issue => {
                  comment += `- **${issue.severity}**: ${issue.test_name} in ${issue.filename}:${issue.line_number}\n`;
                });
                if (issues.length > 5) {
                  comment += `- ... and ${issues.length - 5} more issues\n`;
                }
                comment += '\n';
              }
            } catch (error) {
              comment += '❌ **Bandit**: Failed to parse report\n\n';
            }

            try {
              const safetyReport = JSON.parse(fs.readFileSync('safety-report.json', 'utf8'));
              const vulnerabilities = safetyReport.vulnerabilities || [];

              if (vulnerabilities.length === 0) {
                comment += '✅ **Safety**: No known vulnerabilities found\n\n';
              } else {
                comment += `⚠️ **Safety**: Found ${vulnerabilities.length} known vulnerabilities\n\n`;
                vulnerabilities.slice(0, 3).forEach(vuln => {
                  comment += `- **${vuln.package}**: ${vuln.vulnerability_id} - ${vuln.advisory}\n`;
                });
                if (vulnerabilities.length > 3) {
                  comment += `- ... and ${vulnerabilities.length - 3} more vulnerabilities\n`;
                }
                comment += '\n';
              }
            } catch (error) {
              comment += '❌ **Safety**: Failed to parse report\n\n';
            }

            comment += '📊 Full reports available in workflow artifacts.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
