# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Scan

env:
  PULSEPLATE_PYTHON_INDEX_URL: ${{ secrets.PULSEPLATE_PYTHON_INDEX_URL || vars.PULSEPLATE_PYTHON_INDEX_URL }}
  PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ secrets.PULSEPLATE_PYTHON_TRUSTED_HOST || vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 / Node 24

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: '3.13.6'
          requirements-profile: ci-lite
          install-mode: direct-proxy

      - name: Install security tooling
        run: |
          set -euo pipefail
          : "${PULSEPLATE_PYTHON_INDEX_URL:?Set PULSEPLATE_PYTHON_INDEX_URL to the approved private package proxy URL.}"
          pip_index_args=(--index-url "$PULSEPLATE_PYTHON_INDEX_URL")
          if [[ -n "${PULSEPLATE_PYTHON_TRUSTED_HOST:-}" ]]; then
            pip_index_args+=(--trusted-host "$PULSEPLATE_PYTHON_TRUSTED_HOST")
          fi
          python -m pip install "${pip_index_args[@]}" "safety>=3.7.0" -c constraints.txt
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
            sudo rm -rf /var/lib/apt/lists/*
          fi

      - name: Run Bandit (security lint)
        run: |
          bandit_exit_code=0
          # Main repository scan (production code) - no B101 skip
          bandit -q -r . \
            --exclude "tests,test_cache,cache,frontend/build,htmlcov,releases,data,external,node_modules,dist,build,.venv" \
            -f json -o bandit-report.json || bandit_exit_code=$?

          # Tests directory scan with B101 and B112 skip (asserts and Exception handling are acceptable in tests)
          bandit_tests_exit=0
          if [ -d tests ]; then
            bandit -q -r tests --skip B101,B112 || bandit_tests_exit=$?
          fi
          # Also scan tests_strict if it exists
          bandit_tests_strict_exit=0
          if [ -d tests_strict ]; then
            bandit -q -r tests_strict --skip B101,B112 || bandit_tests_strict_exit=$?
          fi

          if [ "$bandit_exit_code" -gt 1 ] || [ "$bandit_tests_exit" -gt 1 ] || [ "$bandit_tests_strict_exit" -gt 1 ]; then
            echo "❌ Bandit failed to complete successfully (exit code: $bandit_exit_code, tests exit: $bandit_tests_exit, tests_strict exit: $bandit_tests_strict_exit)"
            exit 1
          fi

          if [ ! -f bandit-report.json ]; then
            echo "❌ Bandit report was not generated"
            exit 1
          fi

          echo "=== Bandit Report Analysis ==="
          high_severity_count=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json 2>/dev/null || echo "0")
          if [ "$high_severity_count" -gt 0 ]; then
            echo "❌ Found $high_severity_count HIGH severity security issues in Bandit report"
            echo "::error::Bandit found $high_severity_count HIGH severity issues that must be addressed"
            exit 1
          fi

          if [ "$bandit_exit_code" -eq 1 ] || [ "$bandit_tests_exit" -eq 1 ] || [ "$bandit_tests_strict_exit" -eq 1 ]; then
            echo "⚠️  Bandit reported issues below HIGH severity (exit codes: main=$bandit_exit_code, tests=$bandit_tests_exit, tests_strict=$bandit_tests_strict_exit)"
            echo "::warning::Bandit reported issues below HIGH severity – review bandit-report.json and test scan output"
          else
            echo "✅ No HIGH severity issues found in Bandit report"
          fi

      - name: Run Safety (dependency audit with policy)
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/ci/run_safety_audit.py


      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-*.json
            safety-*.txt
            safety-*.log
          if-no-files-found: ignore
