name: Trusted Protected PR Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: trusted-protected-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-protected-pr-policy:
    name: trusted-protected-pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate protected PR policy from base-owned code
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/check_trusted_protected_pr_policy.py
          --event-path "$GITHUB_EVENT_PATH"
