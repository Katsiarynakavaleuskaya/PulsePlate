name: OWASP Security Testing

on:
  push:
    branches: [main, develop, feat/**, fix/**, feature/**]
  pull_request:
    branches: [main, develop, feat/**, fix/**, feature/**]
  schedule:
    - cron: '0 5 * * 3' # Every Wednesday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  owasp-zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start application
        run: |
          python -m uvicorn app:app --host 0.0.0.0 --port 8000 &
        env:
          APP_ENV: test
          API_KEY: test_key

      - name: Wait for application readiness
        run: |
          max_attempts=30
          attempt=0
          while [ "$attempt" -lt "$max_attempts" ]; do
            if curl -f --connect-timeout 2 http://localhost:8000/health >/dev/null 2>&1; then
              echo "✅ Application is ready"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          echo "❌ Application failed to become ready"
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@41aee98ebc7cf2802c3beae4e7d4336413a21e43
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zap-results
          path: zap-results.json
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          pkill -f uvicorn || true
