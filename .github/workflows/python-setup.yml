name: Python Setup

# Reusable workflow for Python environment setup
# Reduces duplication across lint, security, and test jobs

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: true
        type: string
      install-dev-deps:
        description: 'Install development dependencies (pre-commit, bandit, etc.)'
        required: false
        type: boolean
        default: false
      install-test-deps:
        description: 'Install test dependencies (pytest, pytest-cov)'
        required: false
        type: boolean
        default: false
      working-directory:
        description: 'Working directory for the job'
        required: false
        type: string
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install base dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          elif [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi

      - name: Install development dependencies
        if: ${{ inputs.install-dev-deps }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install pre-commit bandit

      - name: Install test dependencies
        if: ${{ inputs.install-test-deps }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install pytest pytest-cov
