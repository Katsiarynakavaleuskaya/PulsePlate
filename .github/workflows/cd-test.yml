# CD Workflow - Continuous Deployment (Testing Mode)
#
# This is a simplified CD workflow for testing CI/CD pipeline
# without requiring actual servers or frontend/iOS apps.
#
# It only validates the environment and builds Docker images.
# Real deployment will be enabled when frontend/iOS are ready.

name: CD-Test
on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
    branches: [ main ]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate environment
        run: |
          echo "🔍 Validating staging environment..."
          bash scripts/validate-ci-environment.sh
        env:
          ENVIRONMENT: staging
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Test Docker image pull
        run: |
          echo "🐳 Testing Docker image pull..."
          echo ${{ secrets.GHCR_READ_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ github.repository }}/pulseplate:${{ github.sha }}
          echo "✅ Docker image pull successful"
          # Cleanup: logout from GHCR to remove credentials
          docker logout ghcr.io

      - name: Test health endpoint locally
        run: |
          echo "🏥 Testing health endpoint locally..."
          # Set up cleanup trap to ensure container is always stopped
          CONTAINER_NAME="pulseplate-test-$$"
          trap 'echo "🧹 Cleaning up container..."; docker stop "$CONTAINER_NAME" 2>/dev/null || true; docker rm "$CONTAINER_NAME" 2>/dev/null || true' EXIT

          # Start container and capture its ID
          docker run --rm -d --name "$CONTAINER_NAME" -p 8000:8000 ghcr.io/${{ github.repository }}/pulseplate:${{ github.sha }}

          # Wait for container to start
          sleep 10

          # Test health endpoint (allow failure since frontend is not ready)
          curl -f http://localhost:8000/health || echo "⚠️ Health check failed (expected without frontend)"

          # Container will be cleaned up by trap on EXIT

      - name: Environment validation complete
        run: |
          echo "✅ Environment validation completed successfully"
          echo "📝 Note: Full deployment disabled until frontend/iOS are ready"
          echo "🚀 When ready, rename cd.yml.disabled back to cd.yml"

  production-validation:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate production environment
        run: |
          echo "🔍 Validating production environment..."
          bash scripts/validate-ci-environment.sh
        env:
          ENVIRONMENT: production
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Production validation complete
        run: |
          echo "✅ Production environment validation completed"
          echo "📝 Note: Full deployment disabled until frontend/iOS are ready"
