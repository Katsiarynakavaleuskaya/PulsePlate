# separate terms of service, privacy policy, and support
# documentation.

name: trivy

env:
  PULSEPLATE_PYTHON_INDEX_URL: ${{ secrets.PULSEPLATE_PYTHON_INDEX_URL || vars.PULSEPLATE_PYTHON_INDEX_URL }}
  PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ secrets.PULSEPLATE_PYTHON_TRUSTED_HOST || vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '16 15 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      actions: write
      contents: read # for actions/checkout to fetch code
      packages: read # for ghcr.io/aquasecurity/trivy-db pulls (AGENTS.md GHCR policy)
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    name: Build
    runs-on: ubuntu-latest
    env:
      # secrets.* is not available in step-level `if:` (actionlint / context rules); gate at job env instead.
      GHCR_READ_TOKEN_AVAILABLE: ${{ secrets.GHCR_READ_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free disk space (Ubuntu hosted runner)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build Docker image (production target)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          build-args: |
            PULSEPLATE_PYTHON_INDEX_URL=${{ env.PULSEPLATE_PYTHON_INDEX_URL }}
            PULSEPLATE_PYTHON_TRUSTED_HOST=${{ env.PULSEPLATE_PYTHON_TRUSTED_HOST }}
          platforms: linux/amd64
          push: false
          load: true
          tags: pulseplate:trivy-scan-${{ github.sha }}
          cache-from: type=gha,scope=trivy-image-${{ github.ref_name }}
          cache-to: type=gha,scope=trivy-image-${{ github.ref_name }},mode=min,ignore-error=true
          provenance: false
          target: production

      # PAT may be present but expired/revoked; anonymous pull still works for public trivy-db.
      - name: Log in to GHCR (Trivy DB)
        if: ${{ env.GHCR_READ_TOKEN_AVAILABLE == 'true' }}
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if ! echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          then
            echo "::warning::GHCR_READ_TOKEN is set but docker login was denied; continuing without registry auth."
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          scan-type: image
          image-ref: pulseplate:trivy-scan-${{ github.sha }}
          cache-dir: /tmp/trivy-cache
          scanners: vuln
          timeout: 15m
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: .trivyignore
          ignore-policy: ${{ github.workspace }}/trivy/ignore-policy.rego
          version: v0.69.3

      - name: Fail when Trivy SARIF is missing
        if: ${{ always() }}
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo "::error::Trivy SARIF missing after scan; failing closed."
            exit 1
          fi
          ls -la trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c00e4aee0547167576bc6663920491135a3dee27 # v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: 'trivy-results.sarif'
