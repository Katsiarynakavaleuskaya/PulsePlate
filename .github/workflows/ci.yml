# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Note: Action versions are pinned to specific commit SHAs for security and stability.
# Periodically update these SHAs to newer versions for security updates and bug fixes.

env:
  COVERAGE_PY: "3.13.6"

permissions:
  contents: read

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    types: [ opened, synchronize, reopened, edited, ready_for_review ]
    branches: [ main, feat/**, fix/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Determine changed paths (for conditional jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Determine changes
        id: filter
        # SHA pin for security (v3.0.2)
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/**'
              - '.github/actions/**'

  pr_scope_guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: PR Scope Guard
        run: |
          set -euo pipefail

          echo "Running PR Scope Guard script..."
          bash scripts/ci/pr_scope_guard.sh

      - name: Design invariant guard
        run: |
          set -euo pipefail
          python3 scripts/design_guard.py --manifest docs/design/figma-manifest.json

      - name: "Guard: fail on merge conflicts"
        run: |
          set -euo pipefail

          echo "Checking for merge conflict markers..."

          # Check for conflict markers in all files (anchored to line start to avoid false positives)
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . 2>/dev/null; then
            echo "::error::Merge conflict markers detected in committed files"
            echo "::error::This should never happen — conflicts must be resolved before push"
            echo "::error::See: AGENTS.md section 'Merge Conflict Safety (Hard Rule)'"
            exit 1
          fi

          # Check for unmerged paths in index (should be empty)
          unmerged=$(git ls-files -u 2>/dev/null)
          if [ -n "$unmerged" ]; then
            echo "::error::Unmerged paths detected in git index"
            echo "::error::Unmerged files:"
            echo "$unmerged" | awk '{print "  - " $4}'
            exit 1
          fi

          echo "✅ No merge conflicts detected"

  trivy_ignore_policy_expiry:
    name: Trivy ignore-policy expiry
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Check Trivy ignore-policy expiry dates
        run: python3 scripts/ci/check_trivy_ignore_policy_expiry.py
        env:
          TRIVY_IGNORE_POLICY_PATH: trivy/ignore-policy.rego

  docs_phase1_gates:
    name: Docs Phase1 gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.COVERAGE_PY }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20.11.1"

      - name: Run Phase1 docs gates
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE_REF}" ] || ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            # Fallback for rare checkout states: pull_request uses merge refs,
            # where HEAD^1 points to the base branch parent.
            BASE_REF="$(git rev-parse HEAD^1)"
          fi
          echo "Using docs Phase1 base ref: ${BASE_REF}"
          CHANGED_MD=()
          CHANGED_DOCS=()
          LINT_MD=()
          while IFS= read -r -d '' path; do
            CHANGED_MD+=("$path")
            if [[ "$path" == docs/* ]]; then
              CHANGED_DOCS+=("$path")
            fi
            # Exclude AGENTS.md, review mapping artifacts, BACKLOG_LEDGER,
            # and external/generated files from markdownlint.
            if [[ "$path" != */AGENTS.md && "$path" != "AGENTS.md" \
                  && "$path" != docs/review/* \
                  && "$path" != "docs/roadmap/BACKLOG_LEDGER.md" \
                  && "$path" != .agents/* && "$path" != .cursor/* && "$path" != .qoder/* ]]; then
              LINT_MD+=("$path")
            fi
          done < <(git diff --name-only -z --diff-filter=AMRT "$BASE_REF"...HEAD -- '*.md')

          if [ "${#CHANGED_MD[@]}" -eq 0 ]; then
            echo "No changed markdown files; skipping docs Phase1 gates."
            exit 0
          fi

          printf "Changed markdown files (all):\n"
          printf '%s\n' "${CHANGED_MD[@]}"

          if [ "${#CHANGED_DOCS[@]}" -eq 0 ]; then
            echo "No changed docs markdown files under docs/; skipping docs Phase1 gates."
          else
            printf "Changed markdown files under docs/ (Phase1 scope):\n"
            printf '%s\n' "${CHANGED_DOCS[@]}"
            python scripts/ci/check_docs_phase1_gates.py --files "${CHANGED_DOCS[@]}"
          fi

          if [ "${#LINT_MD[@]}" -eq 0 ]; then
            echo "No markdown files eligible for markdownlint after AGENTS.md exclusion."
            exit 0
          fi

          printf "Markdownlint targets:\n"
          printf '%s\n' "${LINT_MD[@]}"
          printf '%s\n' "${LINT_MD[@]}" > "$GITHUB_WORKSPACE/.phase1_lint_md_files"

      - name: Run markdownlint (optional; known KaTeX __VERSION__ env issue in npx)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -s "$GITHUB_WORKSPACE/.phase1_lint_md_files" ]; then
            echo "No markdownlint targets; skipping."
            exit 0
          fi
          mapfile -t LINT_FILES < "$GITHUB_WORKSPACE/.phase1_lint_md_files"
          npx --yes markdownlint-cli2 "${LINT_FILES[@]}"

  pr_body_phase2_gates:
    name: PR Body Phase2 gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.PR_BODY_PHASE2_TIMEOUT_MINUTES || '5') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.COVERAGE_PY }}

      - name: Run Phase2 PR body gates
        run: |
          set -euo pipefail
          python scripts/ci/check_pr_body_phase2_gates.py --event-path "$GITHUB_EVENT_PATH"

  merge_readiness_gate:
    name: Merge readiness gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.COVERAGE_PY }}

      - name: Enforce merge readiness policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci/check_pr_merge_readiness.py --event-path "$GITHUB_EVENT_PATH"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.13.6"
          install-dev-deps: "true"

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.13.6"
          install-dev-deps: "true"

      - name: Security scan with Bandit
        run: |
          set -e
          EXCLUDES="tests,tests_strict,htmlcov,.git,.venv,venv,node_modules,.mypy_cache,.pytest_cache"
          if [ -f scripts/ci_bandit.sh ]; then
            bash scripts/ci_bandit.sh --exclude "$EXCLUDES" --output bandit-report.json
          else
            echo "::notice::scripts/ci_bandit.sh not found; running bandit directly"
            bandit -r . -x "$EXCLUDES" -f json -o bandit-report.json
          fi
        continue-on-error: true

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

  openapi-sync:
    name: OpenAPI sync (backend -> frontend artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.13.6"
          install-dev-deps: "true"

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints.txt

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20.11.1"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate OpenAPI + TS types
        run: make openapi

      - name: Verify OpenAPI generation determinism
        run: python -m pytest -q tests/test_openapi_determinism.py

      - name: Fail if generated artifacts differ
        run: git diff --exit-code frontend/src/api/openapi.json frontend/src/api/schema.ts

  # Fast testing for PRs (single Python version)
  test-pr:
    if: github.event_name == 'pull_request'
    needs: [pr_scope_guard, openapi-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13.6']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true  # GitHub Actions cache service may be unavailable
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          MATRIX_PYTHON_VERSION: "${{ matrix.python-version }}"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          # Project standard: maintain 97% coverage for PR branches before merge
          # See .cursorrules and AGENTS.md for coverage requirements
          #
          # CI stability: Python 3.13 has seen intermittent segfaults under xdist+coverage.
          # Run sequentially on 3.13; keep parallelism for older versions.
          # Intentionally removed `--cov-context=test` due to flaky coverage DB corruption under xdist
          # on Python 3.13 ("no such table: context"). Revisit after pytest/hypothesis upgrades.
          PYVER="${MATRIX_PYTHON_VERSION}"
          if [[ "$PYVER" == 3.13* ]]; then
            # Fully disable xdist plugin on 3.13 (more stable than `-n 0`)
            PYTEST_XDIST_ARGS=(-p no:xdist)
          else
            PYTEST_XDIST_ARGS=(-n 4 --dist=loadscope)
          fi
          python -c "import sys; print('PY', sys.version)"
          echo "PYTEST_XDIST_ARGS=${PYTEST_XDIST_ARGS[*]}"
          python -X faulthandler -m pytest \
            "${PYTEST_XDIST_ARGS[@]}" \
            -m "not slow" \
            --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 \
            --junitxml=tests/results.xml -o junit_family=legacy \
            tests

      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (3.13.6 only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ env.COVERAGE_PY }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Fast testing for feature branches (single Python version)
  test-feature:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13.6']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true  # GitHub Actions cache service may be unavailable
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          MATRIX_PYTHON_VERSION: "${{ matrix.python-version }}"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          # Project standard: maintain 97% coverage for feature branches before merge
          # See .cursorrules and AGENTS.md for coverage requirements
          #
          # CI stability: Python 3.13 has seen intermittent segfaults under xdist+coverage.
          # Run sequentially on 3.13; keep parallelism for older versions.
          # Intentionally removed `--cov-context=test` due to flaky coverage DB corruption under xdist
          # on Python 3.13 ("no such table: context"). Revisit after pytest/hypothesis upgrades.
          PYVER="${MATRIX_PYTHON_VERSION}"
          if [[ "$PYVER" == 3.13* ]]; then
            # Fully disable xdist plugin on 3.13 (more stable than `-n 0`)
            PYTEST_XDIST_ARGS=(-p no:xdist)
          else
            PYTEST_XDIST_ARGS=(-n 4 --dist=loadscope)
          fi
          python -c "import sys; print('PY', sys.version)"
          echo "PYTEST_XDIST_ARGS=${PYTEST_XDIST_ARGS[*]}"
          python -X faulthandler -m pytest \
            "${PYTEST_XDIST_ARGS[@]}" \
            -m "not slow" \
            --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 \
            --junitxml=tests/results.xml -o junit_family=legacy \
            tests

      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (3.13.6 only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ env.COVERAGE_PY }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Comprehensive testing for main branch
  test-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}
          install-test-deps: "true"

      - name: Cache pip dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true  # GitHub Actions cache service may be unavailable
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Validate data
        run: |
          make validate-data

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          MATRIX_PYTHON_VERSION: "${{ matrix.python-version }}"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          # IMPORTANT: main branch must maintain 97% coverage per project standards
          # See .cursorrules and AGENTS.md
          #
          # CI stability: Python 3.13 has seen intermittent segfaults under xdist+coverage.
          # Run sequentially on 3.13; keep parallelism for older versions.
          # Intentionally removed `--cov-context=test` due to flaky coverage DB corruption under xdist
          # on Python 3.13 ("no such table: context"). Revisit after pytest/hypothesis upgrades.
          PYVER="${MATRIX_PYTHON_VERSION}"
          if [[ "$PYVER" == 3.13* ]]; then
            # Fully disable xdist plugin on 3.13 (more stable than `-n 0`)
            PYTEST_XDIST_ARGS=(-p no:xdist)
          else
            PYTEST_XDIST_ARGS=(-n 4 --dist=loadscope)
          fi
          python -c "import sys; print('PY', sys.version)"
          echo "PYTEST_XDIST_ARGS=${PYTEST_XDIST_ARGS[*]}"
          python -X faulthandler -m pytest \
            "${PYTEST_XDIST_ARGS[@]}" \
            -m "not slow" \
            --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 \
            --junitxml=tests/results.xml -o junit_family=legacy \
            tests

      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (all Python versions)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Coverage reporting for PRs
  coverage-pr:
    if: github.event_name == 'pull_request'
    needs: [pr_scope_guard, test-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifact (Python 3.13.6)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: ./coverage-artifacts
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
