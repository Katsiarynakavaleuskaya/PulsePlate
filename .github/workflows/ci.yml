name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          elif [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          # Ensure test tools available
          pip install pytest pytest-cov pre-commit bandit

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
        run: |
          python -m pytest tests --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 --junitxml=junit.xml -o junit_family=legacy -x --maxfail=5

      - name: Validate data
        run: |
          make validate-data

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: ignore

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Security scan with Bandit (non-blocking)
        if: always()
        run: |
          bash scripts/ci_bandit.sh --exclude tests,tests_strict,htmlcov --output bandit-report.json
        continue-on-error: true

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ matrix.python-version }}
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Upload to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true
