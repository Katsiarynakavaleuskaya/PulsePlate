# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Note: Action versions are pinned to specific commit SHAs for security and stability.
# Periodically update these SHAs to newer versions for security updates and bug fixes.

env:
  COVERAGE_PY: "3.13"
  FRONTEND_NODE_VERSION_FILE: ".nvmrc"
  PULSEPLATE_PYTHON_INDEX_URL: ${{ secrets.PULSEPLATE_PYTHON_INDEX_URL || vars.PULSEPLATE_PYTHON_INDEX_URL }}
  PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ secrets.PULSEPLATE_PYTHON_TRUSTED_HOST || vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}

permissions:
  contents: read

on:
  push:
    branches: [ main, feat/**, fix/**, feature/** ]
  pull_request:
    types: [ opened, synchronize, reopened, edited, ready_for_review ]
    branches: [ main, feat/**, fix/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Determine changed paths (for conditional jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      docs_only: ${{ steps.risk_profile.outputs.docs_only }}
      frontend_only: ${{ steps.risk_profile.outputs.frontend_only }}
      ios_only: ${{ steps.risk_profile.outputs.ios_only }}
      workflow_privileged: ${{ steps.risk_profile.outputs.workflow_privileged }}
      backend_shared: ${{ steps.risk_profile.outputs.backend_shared }}
      run_backend_blocking: ${{ steps.risk_profile.outputs.run_backend_blocking }}
      run_main_ci_diagnostic: ${{ steps.risk_profile.outputs.run_main_ci_diagnostic }}
      run_security: ${{ steps.risk_profile.outputs.run_security }}
      run_openapi_sync: ${{ steps.risk_profile.outputs.run_openapi_sync }}
      billing_entitlement: ${{ steps.risk_profile.outputs.billing_entitlement }}
      insight_ai: ${{ steps.risk_profile.outputs.insight_ai }}
      openapi_contract: ${{ steps.risk_profile.outputs.openapi_contract }}
      food_catalog: ${{ steps.risk_profile.outputs.food_catalog }}
      route_contract_safety: ${{ steps.risk_profile.outputs.route_contract_safety }}
      merge_governance: ${{ steps.risk_profile.outputs.merge_governance }}
      contract_risk_groups: ${{ steps.risk_profile.outputs.contract_risk_groups }}
      changed_file_count: ${{ steps.risk_profile.outputs.changed_file_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine changes
        id: filter
        # SHA pin for security (v3.0.2)
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      - name: Build CI risk profile
        id: risk_profile
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/')))
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            git fetch --no-tags --prune origin main
            BASE_SHA="$(git merge-base origin/main "${GITHUB_SHA}")"
            HEAD_SHA="${GITHUB_SHA}"
          fi
          echo "Risk-profile diff: ${BASE_SHA}...${HEAD_SHA}"
          python3 scripts/ci/ci_risk_profile.py \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --github-output "$GITHUB_OUTPUT"

  pr_scope_guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: PR Scope Guard
        run: |
          set -euo pipefail

          echo "Running PR Scope Guard script..."
          bash scripts/ci/pr_scope_guard.sh

      - name: PR size governance
        run: |
          set -euo pipefail
          python3 scripts/ci/check_pr_size_governance.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --event-path "$GITHUB_EVENT_PATH"

      - name: Design invariant guard
        run: |
          set -euo pipefail
          python3 scripts/design_guard.py --manifest docs/design/figma-manifest.json

      - name: "Guard: fail on merge conflicts"
        run: |
          set -euo pipefail

          echo "Checking for merge conflict markers..."

          # Check for conflict markers in all files (anchored to line start to avoid false positives)
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . 2>/dev/null; then
            echo "::error::Merge conflict markers detected in committed files"
            echo "::error::This should never happen — conflicts must be resolved before push"
            echo "::error::See: AGENTS.md section 'Merge Conflict Safety (Hard Rule)'"
            exit 1
          fi

          # Check for unmerged paths in index (should be empty)
          unmerged=$(git ls-files -u 2>/dev/null)
          if [ -n "$unmerged" ]; then
            echo "::error::Unmerged paths detected in git index"
            echo "::error::Unmerged files:"
            echo "$unmerged" | awk '{print "  - " $4}'
            exit 1
          fi

          echo "✅ No merge conflicts detected"

  trivy_ignore_policy_expiry:
    name: Trivy ignore-policy expiry
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Trivy ignore-policy expiry dates
        run: python3 scripts/ci/check_trivy_ignore_policy_expiry.py
        env:
          TRIVY_IGNORE_POLICY_PATH: trivy/ignore-policy.rego

  pygments_exception_guard:
    name: Pygments exception seam guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.COVERAGE_PY }}

      - name: Guard temporary Pygments exception seam
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI: "true"
        run: |
          set -euo pipefail
          python3 scripts/ci/check_pygments_exception_guard.py

  docs_phase1_gates:
    name: Docs Phase1 gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.COVERAGE_PY }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ env.FRONTEND_NODE_VERSION_FILE }}

      - name: Run Phase1 docs gates
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE_REF}" ] || ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            # Fallback for rare checkout states: pull_request uses merge refs,
            # where HEAD^1 points to the base branch parent.
            BASE_REF="$(git rev-parse HEAD^1)"
          fi
          echo "Using docs Phase1 base ref: ${BASE_REF}"
          CHANGED_MD=()
          CHANGED_DOCS=()
          LINT_MD=()
          while IFS= read -r -d '' path; do
            CHANGED_MD+=("$path")
            if [[ "$path" == docs/* ]]; then
              CHANGED_DOCS+=("$path")
            fi
            # Exclude AGENTS.md, review mapping artifacts, BACKLOG_LEDGER,
            # and external/generated files from markdownlint.
            if [[ "$path" != */AGENTS.md && "$path" != "AGENTS.md" \
                  && "$path" != docs/review/* \
                  && "$path" != "docs/roadmap/BACKLOG_LEDGER.md" \
                  && "$path" != .agents/* && "$path" != .cursor/* && "$path" != .qoder/* ]]; then
              LINT_MD+=("$path")
            fi
          done < <(git diff --name-only -z --diff-filter=AMRT "$BASE_REF"...HEAD -- '*.md')

          if [ "${#CHANGED_MD[@]}" -eq 0 ]; then
            echo "No changed markdown files; skipping docs Phase1 gates."
            exit 0
          fi

          printf "Changed markdown files (all):\n"
          printf '%s\n' "${CHANGED_MD[@]}"

          if [ "${#CHANGED_DOCS[@]}" -eq 0 ]; then
            echo "No changed docs markdown files under docs/; skipping docs Phase1 gates."
          else
            printf "Changed markdown files under docs/ (Phase1 scope):\n"
            printf '%s\n' "${CHANGED_DOCS[@]}"
            python scripts/ci/check_docs_phase1_gates.py --files "${CHANGED_DOCS[@]}"
          fi

          if [ "${#LINT_MD[@]}" -eq 0 ]; then
            echo "No markdown files eligible for markdownlint after AGENTS.md exclusion."
            exit 0
          fi

          printf "Markdownlint targets:\n"
          printf '%s\n' "${LINT_MD[@]}"
          printf '%s\n' "${LINT_MD[@]}" > "$GITHUB_WORKSPACE/.phase1_lint_md_files"

      - name: Run markdownlint (optional; known KaTeX __VERSION__ env issue in npx)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -s "$GITHUB_WORKSPACE/.phase1_lint_md_files" ]; then
            echo "No markdownlint targets; skipping."
            exit 0
          fi
          mapfile -t LINT_FILES < "$GITHUB_WORKSPACE/.phase1_lint_md_files"
          npx --yes markdownlint-cli2 "${LINT_FILES[@]}"

  pr_body_phase2_gates:
    name: PR Body Phase2 gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.PR_BODY_PHASE2_TIMEOUT_MINUTES || '5') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.COVERAGE_PY }}

      - name: Run Phase2 PR body gates
        run: |
          set -euo pipefail
          python scripts/ci/check_pr_body_phase2_gates.py --event-path "$GITHUB_EVENT_PATH"

  merge_readiness_gate:
    name: Merge readiness gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.COVERAGE_PY }}

      - name: Enforce merge readiness policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci/check_pr_merge_readiness.py --event-path "$GITHUB_EVENT_PATH"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.COVERAGE_PY }}
          requirements-profile: ci-lite
          install-mode: direct-proxy

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

  security:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.COVERAGE_PY }}
          requirements-profile: ci-lite
          install-mode: direct-proxy

      - name: Security scan with Bandit
        run: |
          set -e
          EXCLUDES="tests,tests_strict,htmlcov,.git,.venv,venv,node_modules,.mypy_cache,.pytest_cache"
          if [ -f scripts/ci_bandit.sh ]; then
            bash scripts/ci_bandit.sh --exclude "$EXCLUDES" --output bandit-report.json
          else
            echo "::notice::scripts/ci_bandit.sh not found; running bandit directly"
            bandit -r . -x "$EXCLUDES" -f json -o bandit-report.json
          fi

      - name: Enforce Bandit HIGH severity gate
        run: |
          set -euo pipefail

          if [ ! -f bandit-report.json ]; then
            echo "❌ Bandit report not found"
            exit 1
          fi

          read -r total_findings high_severity_findings <<EOF
          $(python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("bandit-report.json")
          data = json.loads(report.read_text())
          results = data.get("results", [])
          high = sum(1 for item in results if item.get("issue_severity") == "HIGH")
          print(len(results), high)
          PY
          )
          EOF

          if [ "$high_severity_findings" -gt 0 ]; then
            echo "❌ Found $high_severity_findings HIGH severity security issues in Bandit report"
            echo "::error::Bandit found $high_severity_findings HIGH severity issues that must be addressed"
            exit 1
          fi

          if [ "$total_findings" -gt 0 ]; then
            echo "⚠️ Bandit reported $total_findings findings below HIGH severity"
            echo "::warning::Bandit reported findings below HIGH severity – review bandit-report.json"
          else
            echo "✅ No HIGH severity issues found in Bandit report"
          fi

      - name: Install Safety
        run: |
          set -euo pipefail
          : "${PULSEPLATE_PYTHON_INDEX_URL:?Set PULSEPLATE_PYTHON_INDEX_URL to the approved private package proxy URL.}"
          pip_index_args=(--index-url "$PULSEPLATE_PYTHON_INDEX_URL")
          if [[ -n "${PULSEPLATE_PYTHON_TRUSTED_HOST:-}" ]]; then
            pip_index_args+=(--trusted-host "$PULSEPLATE_PYTHON_TRUSTED_HOST")
          fi
          python -m pip install "${pip_index_args[@]}" "safety>=3.7.0" -c constraints.txt

      - name: Dependency audit with Safety
        run: |
          set -euo pipefail
          python3 scripts/ci/run_safety_audit.py

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-*.json
            safety-*.txt
            safety-*.log
          if-no-files-found: ignore
          retention-days: 7

  openapi-sync:
    name: OpenAPI sync (backend -> frontend artifacts)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.run_openapi_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ env.COVERAGE_PY }}
          requirements-profile: ci-lite
          install-mode: direct-proxy

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ env.FRONTEND_NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          working-directory: frontend

      - name: Generate OpenAPI + TS types
        run: make openapi

      - name: Verify OpenAPI generation determinism
        run: python -m pytest -q tests/test_openapi_determinism.py

      - name: Fail if generated artifacts differ
        run: git diff --exit-code frontend/src/api/openapi.json frontend/src/api/schema.ts

  # Tier 1 PR testing: critical smoke + contract/risk suites
  test-pr:
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_backend_blocking == 'true'
    needs: [changes, pr_scope_guard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}
          requirements-profile: ci-test
          install-mode: direct-proxy

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ env.FRONTEND_NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Cache pip dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true  # GitHub Actions cache service may be unavailable
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install root Node dependencies
        run: npm ci

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}"

      - name: Critical smoke (deterministic merge blocker)
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/edges tests/test_remaining_modules.py tests/test_web_session_security.py \
            --maxfail=3 \
            --junitxml=tests/smoke-results.xml \
            -o junit_family=legacy

      - name: Contract and risk suites
        if: ${{ needs.changes.outputs.contract_risk_groups != '' }}
        shell: bash
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          CONTRACT_RISK_GROUPS: "${{ needs.changes.outputs.contract_risk_groups }}"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          set -euo pipefail

          declare -A suite_targets=()

          add_suite() {
            for target in "$@"; do
              suite_targets["$target"]=1
            done
          }

          for group in ${CONTRACT_RISK_GROUPS//,/ }; do
            case "$group" in
              billing_entitlement)
                add_suite \
                  tests/test_api_tiers_db_lookup.py \
                  tests/test_billing_openapi_contract.py \
                  tests/test_ios_receipt_verification_api.py \
                  tests/test_paid_route_guards.py \
                  tests/test_payment_reconciliation_api.py \
                  tests/test_payments_activation_paywall_events.py \
                  tests/test_payment_source_contract_api.py \
                  tests/test_payment_webhook_signature_api.py \
                  tests/test_pro_payments_openapi_contract.py \
                  tests/test_subscription_activation_api.py
                ;;
              insight_ai)
                add_suite \
                  tests/test_core_ai_insight_runtime.py \
                  tests/test_fitchef_insight_api.py \
                  tests/test_insight_error_hygiene.py \
                  tests/test_insight_vip_guard_api.py \
                  tests/test_insight_vip_monthly_quota_api.py \
                  tests/test_llm_extras.py \
                  tests/test_rag_orchestration.py \
                  tests/test_vector_rag.py \
                  tests/test_philosophy_validation_integration.py \
                  tests/test_rate_limit_llm_and_exports_api.py
                ;;
              openapi_contract)
                add_suite \
                  tests/test_main_paywall_bootstrap.py \
                  tests/test_openapi_determinism.py \
                  tests/test_openapi_import_safe_orm_guard.py \
                  tests/test_openapi_namespace_guards.py \
                  tests/test_paywall_exposure_ledger_api.py
                ;;
              food_catalog)
                add_suite \
                  tests/test_off_nutrition_bridge.py \
                  tests/test_off_nutrition_resolver.py \
                  tests/test_food_schema_provenance.py \
                  tests/test_food_store_additional_coverage.py \
                  tests/test_food_store_coverage.py \
                  tests/test_food_store_service.py \
                  tests/test_openfoodfacts_client.py \
                  tests/test_unified_db_basics.py \
                  tests/test_unified_db_off_coverage.py \
                  tests/test_food_merge.py \
                  tests/edges/test_unified_db_off_flags.py \
                  tests/test_food_apis_snapshot_w1.py \
                  tests/test_food_sources_snapshot_manager.py
                ;;
              route_contract_safety)
                add_suite \
                  tests/test_api.py \
                  tests/test_app_endpoints_combined.py \
                  tests/test_app_error_handling_combined.py \
                  tests/test_app_extended_coverage.py \
                  tests/test_creative_research_eval_contract.py \
                  tests/test_food_search_foundation.py \
                  tests/test_foods_router_coverage_boost.py \
                  tests/test_judgment_core.py \
                  tests/test_judgment_eval_contract.py \
                  tests/test_legacy_app_diff_coverage.py \
                  tests/test_metrics.py \
                  tests/test_paywall_exposure_ledger_api.py \
                  tests/test_paywall_exposure_ledger_service.py
                ;;
              merge_governance)
                add_suite \
                  tests/test_check_pr_size_governance.py \
                  tests/test_ci_risk_profile.py \
                  tests/test_orchestration_merge_ready.py \
                  tests/test_pr_body_phase2_gates.py \
                  tests/test_pr_merge_readiness_gate.py \
                  tests/test_review_threads_disposition_strict.py
                ;;
              *)
                echo "::error::Unknown contract/risk group: $group"
                exit 1
                ;;
            esac
          done

          if [ "${#suite_targets[@]}" -eq 0 ]; then
