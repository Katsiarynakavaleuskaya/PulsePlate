name: CI

# Note: Action versions are pinned to specific commit SHAs for security and stability.
# Periodically update these SHAs to newer versions for security updates and bug fixes.

permissions:
  contents: read

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main, feat/**, fix/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Python environment
        uses: ./.github/workflows/python-setup.yml
        with:
          python-version: "3.12"
          install-dev-deps: true

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Python environment
        uses: ./.github/workflows/python-setup.yml
        with:
          python-version: "3.12"
          install-dev-deps: true

      - name: Security scan with Bandit
        run: |
          set -e
          if [ -x scripts/ci_bandit.sh ]; then
            bash scripts/ci_bandit.sh --exclude tests,tests_strict,htmlcov --output bandit-report.json
          else
            echo "::notice::scripts/ci_bandit.sh not found; running bandit directly"
            bandit -r . -x tests,tests_strict,htmlcov -f json -o bandit-report.json || true
          fi
        continue-on-error: true

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Setup Python environment
        uses: ./.github/workflows/python-setup.yml
        with:
          python-version: ${{ matrix.python-version }}
          install-test-deps: true

      - name: Validate data
        run: |
          make validate-data

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
        run: |
          python -m pytest tests --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 --junitxml=tests/results.xml -o junit_family=legacy -x --maxfail=5

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload JUnit test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run on both push and pull_request for coverage data in PRs
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-3.12
          path: ./coverage-artifacts

      - name: Upload to Codecov
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Run vitest suite
        run: npm run test
        env:
          VITE_API_BASE: http://localhost:8000/api/v1
          VITE_API_KEY: test_key
          VITE_DEV_MODE: true
          VITE_ANALYTICS_ENABLED: false

      - name: Build SPA
        run: npm run build
