# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Note: Action versions are pinned to specific commit SHAs for security and stability.
# Periodically update these SHAs to newer versions for security updates and bug fixes.

env:
  COVERAGE_PY: "3.13.6"

permissions:
  contents: read

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main, feat/**, fix/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pr_scope_guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: PR Scope Guard
        run: bash scripts/ci/pr_scope_guard.sh

  trivy_ignore_policy_expiry:
    name: Trivy ignore-policy expiry
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Check Trivy ignore-policy expiry dates
        run: python3 scripts/ci/check_trivy_ignore_policy_expiry.py
        env:
          TRIVY_IGNORE_POLICY_PATH: trivy/ignore-policy.rego

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.13.6"
          install-dev-deps: "true"

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.13.6"
          install-dev-deps: "true"

      - name: Security scan with Bandit
        run: |
          set -e
          EXCLUDES="tests,tests_strict,htmlcov,.git,.venv,venv,node_modules,.mypy_cache,.pytest_cache"
          if [ -f scripts/ci_bandit.sh ]; then
            bash scripts/ci_bandit.sh --exclude "$EXCLUDES" --output bandit-report.json
          else
            echo "::notice::scripts/ci_bandit.sh not found; running bandit directly"
            bandit -r . -x "$EXCLUDES" -f json -o bandit-report.json
          fi
        continue-on-error: true

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

  openapi-sync:
    name: OpenAPI sync (backend -> frontend artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.13.6"
          install-dev-deps: "true"

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints.txt

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.11.1"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate OpenAPI + TS types
        run: make openapi

      - name: Verify OpenAPI generation determinism
        run: python -m pytest -q tests/test_openapi_determinism.py

      - name: Fail if generated artifacts differ
        run: git diff --exit-code frontend/src/api/openapi.json frontend/src/api/schema.ts

  # Fast testing for PRs (single Python version)
  test-pr:
    if: github.event_name == 'pull_request'
    needs: [pr_scope_guard, openapi-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13.6']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.1.0
        continue-on-error: true  # GitHub Actions cache service may be unavailable
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          MATRIX_PYTHON_VERSION: "${{ matrix.python-version }}"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          # Project standard: maintain 97% coverage for PR branches before merge
          # See .github/copilot-instructions.md and .cursorrules for coverage requirements
          #
          # CI stability: Python 3.13 has seen intermittent segfaults under xdist+coverage.
          # Run sequentially on 3.13; keep parallelism for older versions.
          # Intentionally removed `--cov-context=test` due to flaky coverage DB corruption under xdist
          # on Python 3.13 ("no such table: context"). Revisit after pytest/hypothesis upgrades.
          PYVER="${MATRIX_PYTHON_VERSION}"
          if [[ "$PYVER" == 3.13* ]]; then
            # Fully disable xdist plugin on 3.13 (more stable than `-n 0`)
            PYTEST_XDIST_ARGS=(-p no:xdist)
          else
            PYTEST_XDIST_ARGS=(-n 4 --dist=loadscope)
          fi
          python -c "import sys; print('PY', sys.version)"
          echo "PYTEST_XDIST_ARGS=${PYTEST_XDIST_ARGS[*]}"
          python -X faulthandler -m pytest \
            "${PYTEST_XDIST_ARGS[@]}" \
            -m "not slow" \
            --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 \
            --junitxml=tests/results.xml -o junit_family=legacy \
            tests

      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (3.13.6 only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ env.COVERAGE_PY }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Fast testing for feature branches (single Python version)
  test-feature:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13.6']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.1.0
        continue-on-error: true  # GitHub Actions cache service may be unavailable
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          MATRIX_PYTHON_VERSION: "${{ matrix.python-version }}"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          # Project standard: maintain 97% coverage for feature branches before merge
          # See .github/copilot-instructions.md and .cursorrules for coverage requirements
          #
          # CI stability: Python 3.13 has seen intermittent segfaults under xdist+coverage.
          # Run sequentially on 3.13; keep parallelism for older versions.
          # Intentionally removed `--cov-context=test` due to flaky coverage DB corruption under xdist
          # on Python 3.13 ("no such table: context"). Revisit after pytest/hypothesis upgrades.
          PYVER="${MATRIX_PYTHON_VERSION}"
          if [[ "$PYVER" == 3.13* ]]; then
            # Fully disable xdist plugin on 3.13 (more stable than `-n 0`)
            PYTEST_XDIST_ARGS=(-p no:xdist)
          else
            PYTEST_XDIST_ARGS=(-n 4 --dist=loadscope)
          fi
          python -c "import sys; print('PY', sys.version)"
          echo "PYTEST_XDIST_ARGS=${PYTEST_XDIST_ARGS[*]}"
          python -X faulthandler -m pytest \
            "${PYTEST_XDIST_ARGS[@]}" \
            -m "not slow" \
            --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 \
            --junitxml=tests/results.xml -o junit_family=legacy \
            tests

      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (3.13.6 only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ env.COVERAGE_PY }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Comprehensive testing for main branch
  test-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}
          install-test-deps: "true"

      - name: Cache pip dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.1.0
        continue-on-error: true  # GitHub Actions cache service may be unavailable
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Validate data
        run: |
          make validate-data

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          MATRIX_PYTHON_VERSION: "${{ matrix.python-version }}"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          # IMPORTANT: main branch must maintain 97% coverage per project standards
          # See .github/copilot-instructions.md and .cursorrules
          #
          # CI stability: Python 3.13 has seen intermittent segfaults under xdist+coverage.
          # Run sequentially on 3.13; keep parallelism for older versions.
          # Intentionally removed `--cov-context=test` due to flaky coverage DB corruption under xdist
          # on Python 3.13 ("no such table: context"). Revisit after pytest/hypothesis upgrades.
          PYVER="${MATRIX_PYTHON_VERSION}"
          if [[ "$PYVER" == 3.13* ]]; then
            # Fully disable xdist plugin on 3.13 (more stable than `-n 0`)
            PYTEST_XDIST_ARGS=(-p no:xdist)
          else
            PYTEST_XDIST_ARGS=(-n 4 --dist=loadscope)
          fi
          python -c "import sys; print('PY', sys.version)"
          echo "PYTEST_XDIST_ARGS=${PYTEST_XDIST_ARGS[*]}"
          python -X faulthandler -m pytest \
            "${PYTEST_XDIST_ARGS[@]}" \
            -m "not slow" \
            --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 \
            --junitxml=tests/results.xml -o junit_family=legacy \
            tests

      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (all Python versions)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Coverage reporting for PRs
  coverage-pr:
    if: github.event_name == 'pull_request'
    needs: [pr_scope_guard, test-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifact (Python 3.13.6)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: ./coverage-artifacts
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # Coverage reporting for feature branches
  coverage-feature:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/'))
    needs: test-feature
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifact (Python 3.13.6)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: ./coverage-artifacts
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # Coverage reporting for main branch
  coverage-main:
    if: github.ref == 'refs/heads/main'
    needs: test-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifact (Python 3.11)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-3.11
          path: ./coverage-artifacts/3.11
        continue-on-error: true

      - name: Download coverage artifact (Python 3.12)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-3.12
          path: ./coverage-artifacts/3.12
        continue-on-error: true

      - name: Download coverage artifact (Python 3.13)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-3.13
          path: ./coverage-artifacts/3.13
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/**/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/**/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # iOS unit tests (enforces guard tests and thin client invariants)
  ios-tests:
    name: iOS unit tests (xcodebuild)
    runs-on: macos-14
    timeout-minutes: 25
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || github.ref == 'refs/heads/main'))
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Select Xcode (built-in)
        run: |
          set -euo pipefail
          ls -la /Applications | grep -E '^d.*Xcode' || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.2.app"
          else
            # Fallback: choose latest installed Xcode
            sudo xcode-select -s "/Applications/Xcode.app"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme PulsePlate \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            -derivedDataPath ../.derivedData \
            -enableCodeCoverage NO \
            -quiet
