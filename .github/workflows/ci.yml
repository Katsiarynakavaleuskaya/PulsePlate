name: CI

# Note: Action versions are pinned to specific commit SHAs for security and stability.
# Periodically update these SHAs to newer versions for security updates and bug fixes.

env:
  COVERAGE_PY: "3.12"

permissions:
  contents: read

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main, feat/**, fix/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-dev-deps: "true"

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-dev-deps: "true"

      - name: Security scan with Bandit
        run: |
          set -e
          EXCLUDES="tests,tests_strict,htmlcov,.git,.venv,venv,node_modules,.mypy_cache,.pytest_cache"
          if [ -f scripts/ci_bandit.sh ]; then
            bash scripts/ci_bandit.sh --exclude "$EXCLUDES" --output bandit-report.json
          else
            echo "::notice::scripts/ci_bandit.sh not found; running bandit directly"
            bandit -r . -x "$EXCLUDES" -f json -o bandit-report.json
          fi
        continue-on-error: true

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7


  # Fast testing for PRs (single Python version)
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Clean Python cache
        run: |
          find . -not -path './.git/*' -type d -name '__pycache__' -delete 2>/dev/null || true
          find . -not -path './.git/*' -type f -name '*.pyc' -delete 2>/dev/null || true
          echo "✅ Python cache cleaned"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          python -m pytest tests --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 --junitxml=tests/results.xml -o junit_family=legacy --cov-context=test -n auto

      - name: Clean Python cache (post-test)
        if: always()
        run: |
          find . -not -path './.git/*' -type d -name '__pycache__' -delete 2>/dev/null || true
          find . -not -path './.git/*' -type f -name '*.pyc' -delete 2>/dev/null || true

      - name: Upload coverage artifact (3.12 only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Fast testing for feature branches (single Python version)
  test-feature:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Clean Python cache
        run: |
          find . -not -path './.git/*' -type d -name '__pycache__' -delete 2>/dev/null || true
          find . -not -path './.git/*' -type f -name '*.pyc' -delete 2>/dev/null || true
          echo "✅ Python cache cleaned"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          python -m pytest tests --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 --junitxml=tests/results.xml -o junit_family=legacy --cov-context=test -n auto

      - name: Clean Python cache (post-test)
        if: always()
        run: |
          find . -not -path './.git/*' -type d -name '__pycache__' -delete 2>/dev/null || true
          find . -not -path './.git/*' -type f -name '*.pyc' -delete 2>/dev/null || true

      - name: Upload coverage artifact (3.12 only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Comprehensive testing for main branch
  test-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}
          install-test-deps: "true"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Clean Python cache
        run: |
          # Clean __pycache__ and .pyc files to prevent cache issues
          find . -not -path './.git/*' -type d -name '__pycache__' -delete 2>/dev/null || true
          find . -not -path './.git/*' -type f -name '*.pyc' -delete 2>/dev/null || true
          echo "✅ Python cache cleaned"

      - name: Validate data
        run: |
          make validate-data

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
        run: |
          # Use pytest-xdist for parallel execution with proper coverage collection
          python -m pytest tests --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 --junitxml=tests/results.xml -o junit_family=legacy --cov-context=test -n auto

      - name: Clean Python cache (post-test)
        if: always()
        run: |
          find . -not -path './.git/*' -type d -name '__pycache__' -delete 2>/dev/null || true
          find . -not -path './.git/*' -type f -name '*.pyc' -delete 2>/dev/null || true

      - name: Upload coverage artifact (all Python versions)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Coverage reporting for PRs
  coverage-pr:
    if: github.event_name == 'pull_request'
    needs: test-pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifact (Python 3.12)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: ./coverage-artifacts
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # Coverage reporting for feature branches
  coverage-feature:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/'))
    needs: test-feature
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifact (Python 3.12)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: ./coverage-artifacts
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # Coverage reporting for main branch
  coverage-main:
    if: github.ref == 'refs/heads/main'
    needs: test-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifact (Python 3.12)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: ./coverage-artifacts
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true
