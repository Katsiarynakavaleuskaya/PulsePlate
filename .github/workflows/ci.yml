name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main, feat/**, fix/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]  # Python 3.14 excluded until ecosystem catches up

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js setup removed - not needed for Python project

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          elif [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          # Ensure test tools available
          pip install pytest pytest-cov pre-commit bandit

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
        continue-on-error: true

      - name: Validate data
        run: |
          make validate-data

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
        run: |
          python -m pytest tests --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 --junitxml=tests/results.xml -o junit_family=legacy -x --maxfail=5

      # Static data fixtures restoration removed - cache/ is in .gitignore

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore

      # Temporarily disabled due to timeout issues
      # - name: Upload test results to Codecov
      #   if: ${{ github.event_name == 'push' && !cancelled() }}
      #   uses: codecov/test-results-action@v1

      - name: Security scan with Bandit (non-blocking)
        if: always()
        run: |
          bash scripts/ci_bandit.sh --exclude tests,tests_strict,htmlcov --output bandit-report.json
        continue-on-error: true

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ matrix.python-version }}
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Upload to Codecov (optional)
        if: ${{ github.event_name == 'push' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (jsdom)
        run: npm run test

      - name: Browser tests (Playwright)
        if: ${{ hashFiles('frontend/tests/browser/**/*.test.*') != '' }}
        run: npm run test:browser

      - name: Build Storybook
        run: npm run sb:build

      - name: Upload Storybook artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/storybook-static   # Important: path from repository root

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
