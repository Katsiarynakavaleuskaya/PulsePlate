  # Comprehensive testing for main branch
  test-main:
    needs: [changes]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && needs.changes.outputs.run_main_ci_diagnostic == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            timeout-minutes: 60
          - python-version: '3.12'
            timeout-minutes: 60
          - python-version: '3.13'
            timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}
          requirements-profile: ci-test
          install-mode: direct-proxy

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ env.FRONTEND_NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Cache pip dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true  # GitHub Actions cache service may be unavailable
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install root Node dependencies
        run: npm ci

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Validate data
        run: |
          make validate-data

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}"

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
          MATRIX_PYTHON_VERSION: "${{ matrix.python-version }}"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "malloc"
        run: |
          # Use pytest-xdist only where the suite is stable.
          # IMPORTANT: main branch must maintain 97% coverage per project standards
          # See .cursorrules and AGENTS.md
          #
          # CI stability: Python 3.12 exceeded the 60-minute main window after xdist
          # containment. Run isolated process-level shards for 3.12 instead of pytest-xdist
          # workers, preserving the test-main (3.12, 60) required-check identity.
          # Python 3.13 has seen intermittent segfaults under xdist+coverage.
          # Intentionally removed `--cov-context=test` due to flaky coverage DB corruption under xdist
          # on Python 3.13 ("no such table: context"). Revisit after pytest/hypothesis upgrades.
          PYVER="${MATRIX_PYTHON_VERSION}"
          echo "TEST_STEP_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -c "import sys; print('PY', sys.version)"
          if [[ "$PYVER" == 3.12* ]]; then
            PY312_MAIN_SHARDS=2
            PY312_MAIN_MAX_PARALLEL=2
            echo "PY312_MAIN_SHARDS=${PY312_MAIN_SHARDS}"
            echo "PY312_MAIN_MAX_PARALLEL=${PY312_MAIN_MAX_PARALLEL}"
            set +e
            time python scripts/ci/run_py312_main_shards.py \
              --shard-count "${PY312_MAIN_SHARDS}" \
              --max-parallel "${PY312_MAIN_MAX_PARALLEL}"
            test_exit_code=$?
            set -e
            echo "TEST_STEP_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit "$test_exit_code"
          elif [[ "$PYVER" == 3.13* ]]; then
            # Fully disable xdist plugin on 3.13 (more stable than `-n 0`)
            PYTEST_XDIST_ARGS=(-p no:xdist)
          else
            PYTEST_XDIST_ARGS=(-n 4 --dist=loadscope)
          fi
          echo "PYTEST_XDIST_ARGS=${PYTEST_XDIST_ARGS[*]}"
          set +e
          time python -X faulthandler -m pytest \
            "${PYTEST_XDIST_ARGS[@]}" \
            -m "not slow" \
            --durations=25 \
            --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 \
            --junitxml=tests/results.xml -o junit_family=legacy \
            tests
          test_exit_code=$?
          set -e
          echo "TEST_STEP_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$test_exit_code"

      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (all Python versions)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: junit-${{ matrix.python-version }}
          path: |
