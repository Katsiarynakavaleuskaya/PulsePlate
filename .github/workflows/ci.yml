        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # Coverage reporting for main branch
  coverage-main:
    if: github.ref == 'refs/heads/main'
    needs: test-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Download coverage artifact (Python 3.11)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-3.11
          path: ./coverage-artifacts/3.11
        continue-on-error: true

      - name: Download coverage artifact (Python 3.12)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-3.12
          path: ./coverage-artifacts/3.12
        continue-on-error: true

      - name: Download coverage artifact (Python 3.13)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          name: coverage-xml-3.13
          path: ./coverage-artifacts/3.13
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/**/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/**/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # iOS unit tests (enforces guard tests and thin client invariants)
  ios-tests:
    name: iOS unit tests (xcodebuild)
    runs-on: macos-15
    timeout-minutes: 25
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || github.ref == 'refs/heads/main'))
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Select Xcode (deterministic, shellcheck-safe)
        shell: bash
        run: |
          set -euo pipefail

          # Prefer a pinned version if present, else fall back to default.
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.2.app/Contents/Developer"
          else
            latest_xcode_app="$(
              find /Applications -maxdepth 1 -type d -name "Xcode*.app" -print 2>/dev/null \
                | sort \
                | tail -n 1 || true
            )"

            if [ -n "${latest_xcode_app}" ]; then
              sudo xcode-select -s "${latest_xcode_app}/Contents/Developer"
            else
              sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
            fi
          fi

          xcode-select -p
          xcodebuild -version

      - name: Select iOS simulator destination (stable)
        working-directory: ios
        id: select-destination
        run: |
          set -euo pipefail

          python3 - << 'PY'
          import json, os, re, subprocess, sys

          # Pin to stable iOS 18.6 to avoid "latest" resolving to iOS 26.x betas.
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(out)
          devices = data.get("devices", {})

          def parse_ios_ver(runtime_id: str) -> tuple[int, int]:
              m = re.search(r"iOS-(\d+)-(\d+)", runtime_id)
              return (int(m.group(1)), int(m.group(2))) if m else (-1, -1)

          ios_runtimes = [r for r in devices.keys() if re.search(r"SimRuntime\.iOS-\d+-\d+\b", r)]
          if not ios_runtimes:
              print("::error::No iOS Simulator runtimes found", file=sys.stderr)
              sys.exit(1)

          pinned = [r for r in ios_runtimes if re.search(r"SimRuntime\.iOS-18-6\b", r)]
          if pinned:
              runtime = pinned[0]
          else:
              ios18 = [r for r in ios_runtimes if re.search(r"SimRuntime\.iOS-18-\d+\b", r)]
              runtime_pool = ios18 if ios18 else ios_runtimes
              runtime = sorted(runtime_pool, key=parse_ios_ver, reverse=True)[0]

          major, minor = parse_ios_ver(runtime)
          if major < 0 or minor < 0:
              print(f"::error::Cannot parse iOS runtime version from: {runtime}", file=sys.stderr)
              sys.exit(1)

          os_ver = f"{major}.{minor}"
          available_devices = [d for d in devices.get(runtime, []) if d.get("isAvailable", True)]
          available_names = [d["name"] for d in available_devices]

          pref_devices = ["iPhone 16e", "iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 14"]
          device = next((n for n in pref_devices if n in available_names), None)
          device_udid = None
          if device:
              device_udid = next((d["udid"] for d in available_devices if d["name"] == device), None)

          if device:
              dest = f"platform=iOS Simulator,name={device},OS={os_ver}"
          else:
              # Last resort: placeholder simulator device (rarely needed)
              dest = f"platform=iOS Simulator,name=Any iOS Simulator Device,OS={os_ver}"

          print(f"Selected runtime: {runtime} (iOS {os_ver})")
          print(f"Selected device: {device or 'Any iOS Simulator Device'}")
          if device_udid:
              print(f"Device UDID: {device_udid}")
          print(f"Selected destination: {dest}")
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/stdout"), "a", encoding="utf-8") as f:
              print(f"destination={dest}", file=f)
          PY

      - name: iOS tests (project-based, app scheme)
        working-directory: ios
        run: |
          set -euo pipefail

          DESTINATION="${{ steps.select-destination.outputs.destination }}"
          if [ -z "$DESTINATION" ]; then
            echo "::error::IOS_DESTINATION is empty"
            exit 1
          fi

          echo "Using destination: $DESTINATION"

          xcodebuild -version
          xcodebuild -list -project PulsePlate.xcodeproj

          # Optional: show destinations for sanity
          xcodebuild -showdestinations \
            -project PulsePlate.xcodeproj \
            -scheme PulsePlate | sed -n '1,60p'

          # List available simulators
          xcrun simctl list devices available

          # Run unit tests (UI tests excluded via -skip-testing)
          xcodebuild test \
            -project PulsePlate.xcodeproj \
            -scheme PulsePlate \
            -skip-testing:PulsePlateUITests \
            -only-testing:PulsePlateTests/ThinClientGuardsTests \
            -only-testing:PulsePlateTests/BMIServiceTests \
            -only-testing:PulsePlateTests/BMIResponseDecodingTests \
            -only-testing:PulsePlateTests/BMIRequestEncodingTests \
            -only-testing:PulsePlateTests/LocaleParsingTests \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath ../.derivedData \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO
