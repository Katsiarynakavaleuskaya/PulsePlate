name: CI

# Note: Action versions are pinned to specific commit SHAs for security and stability.
# Periodically update these SHAs to newer versions for security updates and bug fixes.

permissions:
  contents: read

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main, feat/**, fix/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      # Node.js setup removed - not needed for Python project

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          elif [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          # Ensure test tools available
          pip install pytest pytest-cov pre-commit bandit

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
        continue-on-error: true

      - name: Validate data
        run: |
          make validate-data

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
        run: |
          python -m pytest tests --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=97 --junitxml=tests/results.xml -o junit_family=legacy -x --maxfail=5

      # Static data fixtures restoration removed - cache/ is in .gitignore

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload JUnit test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore

      # Temporarily disabled due to timeout issues
      # - name: Upload test results to Codecov
      #   if: ${{ github.event_name == 'push' && !cancelled() }}
      #   uses: codecov/test-results-action@v1

      - name: Security scan with Bandit (non-blocking)
        if: always()
        run: |
          bash scripts/ci_bandit.sh --exclude tests,tests_strict,htmlcov --output bandit-report.json
        continue-on-error: true

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report-${{ matrix.python-version }}
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Upload to Codecov (optional)
        if: ${{ github.event_name == 'push' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Run vitest suite
        run: npm run test
        env:
          VITE_API_BASE: http://localhost:8000/api/v1
          VITE_API_KEY: test_key
          VITE_DEV_MODE: true
          VITE_ANALYTICS_ENABLED: false

      - name: Build SPA
        run: npm run build
