# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Note: Action versions are pinned to specific commit SHAs for security and stability.
# Periodically update these SHAs to newer versions for security updates and bug fixes.

env:
  COVERAGE_PY: "3.12"

permissions:
  contents: read

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main, feat/**, fix/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-dev-deps: "true"

      - name: Pre-commit (lint/format/security quick checks)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-dev-deps: "true"

      - name: Security scan with Bandit
        run: |
          set -e
          EXCLUDES="tests,tests_strict,htmlcov,.git,.venv,venv,node_modules,.mypy_cache,.pytest_cache"
          if [ -f scripts/ci_bandit.sh ]; then
            bash scripts/ci_bandit.sh --exclude "$EXCLUDES" --output bandit-report.json
          else
            echo "::notice::scripts/ci_bandit.sh not found; running bandit directly"
            bandit -r . -x "$EXCLUDES" -f json -o bandit-report.json
          fi
        continue-on-error: true

      - name: Upload bandit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7


  # Fast testing for PRs (single Python version)
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      HYPOTHESIS_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app"

      - name: Verify database initialization (explicit check)
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app"
        run: |
          python -c "from core.db import init_db; init_db(); print('✅ Database verified and initialized')"

      - name: Run tests with coverage (6-way file-shard, avoids full collection)
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          COVERAGE_CONTEXT: "disabled"
          PYTHONMALLOC: malloc
          HYPOTHESIS_PROFILE: ci
          COV_CORE_CONTEXT: ""
          TEST_DB_PATH: cache/test_app.sqlite
          LLM_PROVIDER: stub
        run: |
          set -euo pipefail

          # Python helper: select test files for shard using md5(filename) % N
          select_files_for_shard() {
            python - "$1" "$2" <<'PY'
          import glob, hashlib, sys, shlex
          group = int(sys.argv[1])      # 1-based
          groups = int(sys.argv[2])
          files = sorted(glob.glob('tests/**/*.py', recursive=True))
          # Filter test files only (exclude __init__.py, conftest.py)
          test_files = [f for f in files if f.endswith('_test.py') or f.startswith('tests/test_')]
          selected = []
          for f in test_files:
              h = int(hashlib.md5(f.encode('utf-8')).hexdigest(), 16)
              if (h % groups) + 1 == group:
                  selected.append(f)
          # Print space-separated, safe shell quoting
          print(' '.join(shlex.quote(x) for x in selected))
          PY
          }

          GROUPS=6
          for GROUP in $(seq 1 $GROUPS); do
            # Compute files for this shard
            FILES=$(select_files_for_shard "$GROUP" "$GROUPS")
            if [ -z "$FILES" ]; then
              echo "No files selected for shard $GROUP; skipping"
              continue
            fi

            APPEND_FLAG=""
            XML_FLAG="--cov-report=xml:.coverage${GROUP}.xml"
            JUNIT_FLAG=""
            if [ "$GROUP" -gt 1 ]; then
              APPEND_FLAG="--cov-append"
            fi
            if [ "$GROUP" -eq $GROUPS ]; then
              XML_FLAG="--cov-report=xml --cov-report=term-missing"
              JUNIT_FLAG="--junitxml=tests/results.xml"
            fi

            echo "Running shard ${GROUP}/${GROUPS} on files:"
            echo "$FILES"

            # Run pytest only on selected files (avoids global collection)
            # Note: --cov-fail-under only on final shard to check total coverage
            if [ "$GROUP" -eq $GROUPS ]; then
              python -m pytest -m "not slow" $FILES --cov=. $APPEND_FLAG $XML_FLAG $JUNIT_FLAG -o junit_family=legacy --cov-fail-under=97
            else
              python -m pytest -m "not slow" $FILES --cov=. $APPEND_FLAG $XML_FLAG $JUNIT_FLAG -o junit_family=legacy
            fi
          done


      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (3.12 only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ env.COVERAGE_PY }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Fast testing for feature branches (single Python version)
  test-feature:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      HYPOTHESIS_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app"

      - name: Verify database initialization (explicit check)
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app"
        run: |
          python -c "from core.db import init_db; init_db(); print('✅ Database verified and initialized')"

      - name: Run tests with coverage (6-way file-shard, avoids full collection)
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          COVERAGE_CONTEXT: "disabled"
          PYTHONMALLOC: malloc
          HYPOTHESIS_PROFILE: ci
          COV_CORE_CONTEXT: ""
          TEST_DB_PATH: cache/test_app.sqlite
          LLM_PROVIDER: stub
        run: |
          set -euo pipefail

          # Python helper: select test files for shard using md5(filename) % N
          select_files_for_shard() {
            python - "$1" "$2" <<'PY'
          import glob, hashlib, sys, shlex
          group = int(sys.argv[1])      # 1-based
          groups = int(sys.argv[2])
          files = sorted(glob.glob('tests/**/*.py', recursive=True))
          # Filter test files only (exclude __init__.py, conftest.py)
          test_files = [f for f in files if f.endswith('_test.py') or f.startswith('tests/test_')]
          selected = []
          for f in test_files:
              h = int(hashlib.md5(f.encode('utf-8')).hexdigest(), 16)
              if (h % groups) + 1 == group:
                  selected.append(f)
          # Print space-separated, safe shell quoting
          print(' '.join(shlex.quote(x) for x in selected))
          PY
          }

          GROUPS=6
          for GROUP in $(seq 1 $GROUPS); do
            # Compute files for this shard
            FILES=$(select_files_for_shard "$GROUP" "$GROUPS")
            if [ -z "$FILES" ]; then
              echo "No files selected for shard $GROUP; skipping"
              continue
            fi

            APPEND_FLAG=""
            XML_FLAG="--cov-report=xml:.coverage${GROUP}.xml"
            JUNIT_FLAG=""
            if [ "$GROUP" -gt 1 ]; then
              APPEND_FLAG="--cov-append"
            fi
            if [ "$GROUP" -eq $GROUPS ]; then
              XML_FLAG="--cov-report=xml --cov-report=term-missing"
              JUNIT_FLAG="--junitxml=tests/results.xml"
            fi

            echo "Running shard ${GROUP}/${GROUPS} on files:"
            echo "$FILES"

            # Run pytest only on selected files (avoids global collection)
            # Note: --cov-fail-under only on final shard to check total coverage
            if [ "$GROUP" -eq $GROUPS ]; then
              python -m pytest -m "not slow" $FILES --cov=. $APPEND_FLAG $XML_FLAG $JUNIT_FLAG -o junit_family=legacy --cov-fail-under=97
            else
              python -m pytest -m "not slow" $FILES --cov=. $APPEND_FLAG $XML_FLAG $JUNIT_FLAG -o junit_family=legacy
            fi
          done


      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (3.12 only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ env.COVERAGE_PY }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Comprehensive testing for main branch
  test-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      HYPOTHESIS_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        with:
          python-version: ${{ matrix.python-version }}
          install-test-deps: "true"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Validate data
        run: |
          make validate-data

      - name: Initialize test database
        uses: ./.github/actions/init-test-db
        env:
          APP_ENV: test
          ENVIRONMENT: test
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app"

      - name: Run tests with coverage (6-way split, no xdist - pure serial to avoid MemoryError)
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          # Force test-like environment for deterministic behavior
          APP_ENV: test
          ENVIRONMENT: test
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "test_key"
          COVERAGE_CONTEXT: "disabled"
          PYTHONMALLOC: malloc
          HYPOTHESIS_PROFILE: ci
          COV_CORE_CONTEXT: ""
          TEST_DB_PATH: cache/test_app.sqlite
          LLM_PROVIDER: stub
        run: |
          for GROUP in $(seq 1 6); do
            APPEND_FLAG=""
            XML_FLAG="--cov-report=xml:.coverage${GROUP}.xml"
            JUNIT_FLAG=""
            if [ "$GROUP" -gt 1 ]; then
              APPEND_FLAG="--cov-append"
            fi
            if [ "$GROUP" -eq 6 ]; then
              XML_FLAG="--cov-report=xml --cov-report=term-missing"
              JUNIT_FLAG="--junitxml=tests/results.xml"
            fi
            echo "Running shard ${GROUP}/6..."
            python -m pytest -m "not slow" tests --cov=. $APPEND_FLAG $XML_FLAG $JUNIT_FLAG -o junit_family=legacy --splits 6 --group "$GROUP" --cov-fail-under=97
          done


      - name: Clean Python cache (post-test)
        if: always()
        uses: ./.github/actions/clean-python-cache

      - name: Upload coverage artifact (all Python versions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: tests/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Coverage reporting for PRs
  coverage-pr:
    if: github.event_name == 'pull_request'
    needs: test-pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download coverage artifact (Python 3.12)
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: ./coverage-artifacts
        continue-on-error: true

      - name: Setup Python for diff-cover
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'

      - name: Install diff-cover
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        run: python -m pip install "diff-cover>=9.0.0"

      - name: Fetch base branch for diff-cover
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=50

      - name: Run diff-cover on changed lines (require 97% on PR changes)
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        run: |
          diff-cover ./coverage-artifacts/coverage.xml \
            --compare-branch "origin/${{ github.event.pull_request.base.ref }}" \
            --fail-under=97 \
            --diff-range-notation=".."

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # Coverage reporting for feature branches
  coverage-feature:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/'))
    needs: test-feature
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download coverage artifact (Python 3.12)
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml-${{ env.COVERAGE_PY }}
          path: ./coverage-artifacts
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

  # Coverage reporting for main branch
  coverage-main:
    if: github.ref == 'refs/heads/main'
    needs: test-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download coverage artifact (Python 3.11)
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml-3.11
          path: ./coverage-artifacts/3.11
        continue-on-error: true

      - name: Download coverage artifact (Python 3.12)
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml-3.12
          path: ./coverage-artifacts/3.12
        continue-on-error: true

      - name: Download coverage artifact (Python 3.13)
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml-3.13
          path: ./coverage-artifacts/3.13
        continue-on-error: true

      - name: Upload to Codecov
        if: ${{ hashFiles('./coverage-artifacts/**/coverage.xml') != '' }}
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-artifacts/**/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true
