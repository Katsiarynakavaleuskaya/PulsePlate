  # iOS unit tests (enforces guard tests and thin client invariants)
  ios-tests:
    name: iOS unit tests (xcodebuild)
    runs-on: macos-15
    timeout-minutes: 25
    if: |
      needs.changes.outputs.ios == 'true' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/') || github.ref == 'refs/heads/main'))
      )
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode (require 26.x for iOS 26 SDK readiness)
        id: select-xcode
        shell: bash
        run: |
          set -euo pipefail

          # Prefer explicit Xcode 26.x installs first.
          # Keep /Applications/Xcode.app as a final fallback, but verify the major version.
          CANDIDATES=(
            "/Applications/Xcode_26.2.app/Contents/Developer"
            "/Applications/Xcode_26.2.0.app/Contents/Developer"
            "/Applications/Xcode_26.1.app/Contents/Developer"
            "/Applications/Xcode_26.1.0.app/Contents/Developer"
            "/Applications/Xcode_26.0.app/Contents/Developer"
            "/Applications/Xcode_26.app/Contents/Developer"
            "/Applications/Xcode_26.0.0.app/Contents/Developer"
            "/Applications/Xcode.app/Contents/Developer"
          )

          SELECTED=""
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              SELECTED="$d"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::No suitable Xcode 26.x found in /Applications."
            echo "::error::Available Xcode apps:"
            for app in /Applications/Xcode*.app; do
              [ -e "$app" ] && echo " - $app"
            done
            exit 1
          fi

          # Set both GITHUB_ENV and GITHUB_OUTPUT for maximum compatibility
          echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          echo "developer_dir=$SELECTED" >> "$GITHUB_OUTPUT"

          # Force xcode-select to use selected Xcode (critical on multi-Xcode runners)
          sudo xcode-select -s "$SELECTED"

          echo "Selected DEVELOPER_DIR: $SELECTED"
          echo "Verifying Xcode selection:"
          xcode-select -p

          # Extract Xcode version for cache key (avoid broken pipe from pipe consumers like head/sed)
          XCODEBUILD_VERSION="$(xcodebuild -version)"
          # First line is like: "Xcode 26.1"
          XCODE_VERSION="${XCODEBUILD_VERSION#Xcode }"
          XCODE_VERSION="${XCODE_VERSION%%$'\n'*}"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          if [ "$XCODE_MAJOR" != "26" ]; then
            echo "::error::Selected Xcode must be 26.x for iOS 26 SDK readiness. Got $XCODE_VERSION"
            exit 1
          fi
          echo "xcode_version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"

          xcodebuild -version
          swift --version

      - name: Cache SwiftPM packages (SourcePackages only, not Build)
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: cache-swiftpm
        with:
          path: |
            ios/.derivedData/SourcePackages
          key: ${{ runner.os }}-xcode-${{ steps.select-xcode.outputs.xcode_version }}-swiftpm-${{ hashFiles('ios/Package.resolved', 'ios/PulsePlate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.select-xcode.outputs.xcode_version }}-swiftpm-
            ${{ runner.os }}-xcode-${{ steps.select-xcode.outputs.xcode_version }}-
            ${{ runner.os }}-swiftpm-

      - name: Select iOS simulator destination (stable)
        working-directory: ios
        id: select-destination
        env:
          DEVELOPER_DIR: ${{ steps.select-xcode.outputs.developer_dir }}
          # Allow override for testing fallback logic (e.g., PREFERRED_DEVICES="iPhone 99,iPhone 98")
          PREFERRED_DEVICES: ${{ env.PREFERRED_DEVICES || 'iPhone 16e,iPhone 16,iPhone 16 Pro,iPhone 15,iPhone 14' }}
        run: |
          set -euo pipefail

          # Ensure simctl uses the pinned Xcode
          echo "=== Xcode pinning verification (select-destination) ==="
          echo "DEVELOPER_DIR: ${DEVELOPER_DIR:-<empty>}"
          xcode-select -p
          xcodebuild -version
          swift --version

          echo "Preferred devices: ${PREFERRED_DEVICES}"

          python3 - << 'PY'
          import json, os, re, subprocess, sys

          # Prefer stable iOS 26.x to match Xcode 26 / iOS 26 SDK readiness.
          # Fall back to the highest available iOS runtime instead of using OS=latest.
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(out)
          devices = data.get("devices", {})

          def parse_ios_ver(runtime_id: str) -> tuple[int, int]:
              m = re.search(r"iOS-(\d+)-(\d+)", runtime_id)
              return (int(m.group(1)), int(m.group(2))) if m else (-1, -1)

          ios_runtimes = [r for r in devices.keys() if re.search(r"SimRuntime\.iOS-\d+-\d+\b", r)]
          if not ios_runtimes:
              print("::error::No iOS Simulator runtimes found", file=sys.stderr)
              sys.exit(1)

          ios26 = [r for r in ios_runtimes if re.search(r"SimRuntime\.iOS-26-\d+\b", r)]
          runtime_pool = ios26 if ios26 else ios_runtimes
          runtime = sorted(runtime_pool, key=parse_ios_ver, reverse=True)[0]

          major, minor = parse_ios_ver(runtime)
          if major < 0 or minor < 0:
              print(f"::error::Cannot parse iOS runtime version from: {runtime}", file=sys.stderr)
              sys.exit(1)

          os_ver = f"{major}.{minor}"
          available_devices = [d for d in devices.get(runtime, []) if d.get("isAvailable", True)]

          if not available_devices:
              print(f"::error::No available devices found for runtime: {runtime}", file=sys.stderr)
              sys.exit(1)

          # Device selection with fallback:
          # 1) Try preferred devices (from env or default)
          # 2) Fallback: any iPhone
          # 3) Fallback: any iOS simulator (iPad if no iPhone)
          # Source of truth: PREFERRED_DEVICES must be provided via workflow env.
          # This avoids duplicated defaults between YAML and Python.
          pref_devices_str = os.environ.get("PREFERRED_DEVICES", "")
          if not pref_devices_str:
              print("::error::PREFERRED_DEVICES is empty", file=sys.stderr)
              sys.exit(1)

          pref_devices = [name.strip() for name in pref_devices_str.split(",") if name.strip()]
          available_names = [d["name"] for d in available_devices]

          device = None
          device_udid = None

          # Step 1: Try preferred devices
          preferred_found = False
          for pref_name in pref_devices:
              if pref_name in available_names:
                  device_obj = next((d for d in available_devices if d["name"] == pref_name), None)
                  if device_obj:
                      device = pref_name
                      device_udid = device_obj["udid"]
                      preferred_found = True
                      break

          # Step 2: Fallback to any iPhone (deterministic: sort by name, then UDID)
          if not device_udid:
              iphones = [d for d in available_devices if d["name"].startswith("iPhone")]
              if iphones:
                  iphones.sort(key=lambda d: (d["name"], d["udid"]))
                  device_obj = iphones[0]
                  device = device_obj["name"]
                  device_udid = device_obj["udid"]
                  if not preferred_found:
                      print(f"Preferred devices not found, falling back to any iPhone: {device}", file=sys.stderr)

          # Step 3: Fallback to any iOS simulator (if no iPhone available)
          if not device_udid:
              available_devices.sort(key=lambda d: (d["name"], d["udid"]))
              device_obj = available_devices[0]
              device = device_obj["name"]
              device_udid = device_obj["udid"]
              print(f"No iPhone available, falling back to any iOS simulator: {device}", file=sys.stderr)

          # Canonical: use UDID-only destination for determinism (kills latest ambiguity, name mismatch, OS version format issues)
          if not device_udid:
              print("::error::No UDID found for selected device (fallback logic failed)", file=sys.stderr)
              sys.exit(1)

          dest = f"platform=iOS Simulator,id={device_udid}"

          print(f"Selected runtime: {runtime} (iOS {os_ver})")
          print(f"Selected device: {device} (UDID: {device_udid})")
          print(f"Selected destination: {dest}")

          # Export runtime ID for potential future use
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/stdout"), "a", encoding="utf-8") as f:
              print(f"destination={dest}", file=f)
              print(f"udid={device_udid}", file=f)
              print(f"device_name={device}", file=f)
              print(f"ios_runtime_id={runtime}", file=f)

          # Write step summary for easy debugging
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("### iOS Destination Selection\n\n")
                  f.write(f"- **Runtime:** `{runtime}` (iOS {os_ver})\n")
                  f.write(f"- **Device:** `{device}`\n")
                  f.write(f"- **UDID:** `{device_udid}`\n")
                  f.write(f"- **Destination:** `{dest}`\n")
          PY

      - name: iOS tests (project-based, app scheme)
        working-directory: ios
        env:
          DEVELOPER_DIR: ${{ steps.select-xcode.outputs.developer_dir }}
        run: |
          set -euo pipefail

          DESTINATION="${{ steps.select-destination.outputs.destination }}"
          UDID="${{ steps.select-destination.outputs.udid }}"

          if [ -z "$DESTINATION" ]; then
            echo "::error::DESTINATION is empty"
            exit 1
          fi

          # Anti-nondeterminism guard: OS=latest is forbidden in CI
          if echo "$DESTINATION" | grep -E -q 'OS=latest|(^|,)latest($|,)'; then
            echo "::error::CI destination must not contain 'latest'. Use UDID-based destination only."
            echo "::error::Got destination: $DESTINATION"
            exit 1
          fi

          echo "DESTINATION=$DESTINATION"
          echo "UDID=$UDID"

          # Export variables for embedded Python scripts (P0: required for os.environ.get())
          export DESTINATION
          export UDID

          # Verify Xcode pinning is applied (critical: ensure simctl and xcodebuild use same Xcode)
          echo "=== Xcode pinning verification ==="
          echo "DEVELOPER_DIR: ${DEVELOPER_DIR:-<not set>}"
          xcode-select -p
          xcodebuild -version
          swift --version

          echo "=== Toolchain consistency check ==="
          echo "xcrun simctl path:"
          xcrun --find simctl
          echo "xcrun xcodebuild path:"
          xcrun --find xcodebuild
          echo "SDK check:"
          xcrun --sdk iphonesimulator --show-sdk-version || echo "SDK version check failed"
          xcrun --sdk iphonesimulator --show-sdk-platform-path || echo "SDK path check failed"
          echo "Available SDKs:"
          xcodebuild -showsdks 2>&1 | grep -i "iphonesimulator" || echo "SDK listing failed"

          # Diagnostic: verify simulator exists and is accessible
          echo "=== Simulator availability check ==="
          xcrun simctl list devices | head -n 50
          if xcrun simctl list devices | grep -q "$UDID"; then
            echo "✓ Simulator UDID found in simctl list"
          else
            echo "::warning::Simulator UDID not found in simctl list"
          fi

          # Boot simulator to ensure it's ready for xcodebuild test
          # This fixes "Unable to find a destination" when simulator exists but isn't booted
          if [ -n "$UDID" ]; then
            echo "=== Booting simulator ==="
            echo "Booting simulator: $UDID"
            xcrun simctl boot "$UDID" || true

            # Enforce bootstatus verification (hard rule: simulator must be ready)
            # Timeout: 300 seconds (GitHub runners may need 70-120s+ for data migrations)
            # NOTE: Never interpolate shell vars into python code strings; pass via env + os.environ.get()
            export SIM_BOOT_TIMEOUT_SECONDS="${SIM_BOOT_TIMEOUT_SECONDS:-300}"
            echo "Waiting for simulator to be ready (timeout: ${SIM_BOOT_TIMEOUT_SECONDS}s)..."
            python3 - << 'PY'
          import os
          import subprocess
          import sys

          udid = os.environ.get("UDID", "")
          try:
              timeout_s = int(os.environ["SIM_BOOT_TIMEOUT_SECONDS"])
          except KeyError:
              print(
                  "::error::SIM_BOOT_TIMEOUT_SECONDS is not set (single-source timeout policy).",
                  file=sys.stderr,
              )
              sys.exit(2)

          if not udid:
              print("::error::UDID is empty", file=sys.stderr)
              sys.exit(1)

          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], timeout=timeout_s, check=True)
          except subprocess.TimeoutExpired:
              print(f"::error::Simulator not ready after {timeout_s}s (bootstatus timeout)", file=sys.stderr)
              print("Simulator state:", file=sys.stderr)
              subprocess.run(["xcrun", "simctl", "list", "devices"], check=False)
              sys.exit(1)
          except subprocess.CalledProcessError as e:
              print("::error::Simulator bootstatus failed", file=sys.stderr)
              subprocess.run(["xcrun", "simctl", "list", "devices"], check=False)
              sys.exit(e.returncode)
          PY
            echo "✓ Simulator booted and ready"

            # Warm up system services (best-effort, reduces flaky test failures)
            echo "Warming up system services..."
            xcrun simctl launch "$UDID" com.apple.springboard || true
            # Post-boot settle: Data Migration can leave simulator fragile
            SETTLE="${SIM_POST_BOOT_SETTLE_SECONDS:-5}"
            echo "Settling simulator (${SETTLE}s) after boot..."
            sleep "$SETTLE"
            echo "✓ System services ready"
          fi

          # Diagnostic: show destinations after boot
          echo "=== Available destinations after boot ==="
          xcodebuild -showdestinations -project PulsePlate.xcodeproj -scheme PulsePlate 2>&1 | sed -n '1,100p' | head -n 50

          echo "=== Using destination: $DESTINATION ==="

          # Additional diagnostic: list project schemes
          xcodebuild -list -project PulsePlate.xcodeproj

          # Split build and test for better diagnostics and targeted retries
          # Step 1: Build for testing (timeout: 10 minutes)
          echo "=== Building for testing (timeout: 10 minutes) ==="
          python3 - << 'PY'
          import subprocess
          import sys
          import os

          destination = os.environ.get("DESTINATION", "")
          if not destination:
              print("::error::DESTINATION is empty", file=sys.stderr)
              sys.exit(1)

          cmd = [
              "xcodebuild", "build-for-testing",
              "-project", "PulsePlate.xcodeproj",
              "-scheme", "PulsePlate",
              "-destination", destination,
              "-configuration", "Debug",
              "-derivedDataPath", ".derivedData",
              "-clonedSourcePackagesDirPath", ".derivedData/SourcePackages",
              "-enableCodeCoverage", "NO"
          ]

          try:
              result = subprocess.run(cmd, timeout=600, check=True)  # 10 minutes
          except subprocess.TimeoutExpired:
              print("::error::xcodebuild build-for-testing timed out after 10 minutes", file=sys.stderr)
              sys.exit(1)
          except subprocess.CalledProcessError as e:
              sys.exit(e.returncode)
          PY

          # Step 2: Run unit tests in the blocking iOS lane
          echo "=== Running unit tests (timeout: 15 minutes) ==="
          ONLY_TESTING="$(../scripts/ios_test_targets.sh)"
          export ONLY_TESTING
          python3 - << 'PY'
          import os
          import subprocess
          import sys

          destination = os.environ.get("DESTINATION", "")
          if not destination:
              print("::error::DESTINATION is empty", file=sys.stderr)
              sys.exit(1)

          tests = [t.strip() for t in os.environ.get("ONLY_TESTING", "").split(",") if t.strip()]
          if not tests:
              print(
                  "::error::ONLY_TESTING is empty — no test targets were found",
                  file=sys.stderr,
              )
              sys.exit(1)
          only_flags = [f"-only-testing:{t}" for t in tests]

          cmd = [
              "xcodebuild", "test-without-building",
              "-project", "PulsePlate.xcodeproj",
              "-scheme", "PulsePlate",
              "-skip-testing:PulsePlateUITests",
          ] + only_flags + [
              "-destination", destination,
              "-derivedDataPath", ".derivedData",
              "-clonedSourcePackagesDirPath", ".derivedData/SourcePackages",
              "-enableCodeCoverage", "NO",
              "-parallel-testing-enabled", "NO"
          ]

          try:
              subprocess.run(cmd, timeout=900, check=True)
          except subprocess.TimeoutExpired:
              print("::error::xcodebuild unit tests timed out after 15 minutes", file=sys.stderr)
              sys.exit(1)
          except subprocess.CalledProcessError as e:
              sys.exit(e.returncode)
          PY

  # iOS UI smoke (minimal, separate signal from unit tests)
  ios-ui-smoke:
    name: iOS UI smoke (xcodebuild)
    runs-on: macos-15
    timeout-minutes: 25
    if: |
      needs.changes.outputs.ios == 'true' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/') || github.ref == 'refs/heads/main'))
