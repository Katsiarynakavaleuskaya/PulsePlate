                  or q_prior_job["status"] != "completed" or q_prior_job["conclusion"] != "failure"
                  or q_prior_job["started_at"] != "2026-10-29T12:37:36Z" or q_prior_job["completed_at"] != "2026-10-29T12:41:19Z"
