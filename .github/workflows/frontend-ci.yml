          if len(official_caddy_ref) != 1:
              raise ValueError("Caddy official runtime reference")
          with caddy_ci_phase("RUNTIME_CONFIG"):
              version = _run_docker([*common, "pulseplate-caddy:contract", "caddy", "version"]).stdout
              if not version.split() or version.split()[0] != "v2.11.4":
                  raise ValueError("Caddy version differs")
              (evidence / "version.txt").write_text(version)
              info = _run_docker([*common, "pulseplate-caddy:contract", "caddy", "build-info"]).stdout
              if ["go", "go1.26.10"] not in [line.split() for line in info.splitlines()]:
                  raise ValueError("Caddy compiler differs")
              (evidence / "build-info.txt").write_text(info)
              caps = _run_docker([*common, "pulseplate-caddy:contract", "getcap", "/usr/bin/caddy"]).stdout
              if "cap_net_bind_service=ep" not in caps:
