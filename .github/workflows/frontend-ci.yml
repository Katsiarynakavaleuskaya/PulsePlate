name: Frontend CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, feat/**, fix/**]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main, feat/**, fix/**]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      BUILD_OUTPUT_DIR: dist
      VITE_API_BASE: "http://localhost:8000/api/v1"
      VITE_API_KEY: "test_key"
      VITE_DEV_MODE: "true"
      VITE_ANALYTICS_ENABLED: "false"
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else : > .env; fi
          if grep -q '^VITE_API_BASE=' .env; then
            sed -i 's|^VITE_API_BASE=.*$|VITE_API_BASE=http://localhost:8000/api/v1|' .env
          else
            echo "VITE_API_BASE=http://localhost:8000/api/v1" >> .env
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd ..
          pip install -r requirements.txt

      - name: Generate OpenAPI JSON from backend
        run: |
          cd ..
          python -c "from app import app; import json; print(json.dumps(app.openapi(), indent=2))" > frontend/src/api/openapi.json

      - name: Generate OpenAPI types
        run: npm run generate-types

      - name: Run ESLint with duplication checks
        run: |
          npm run lint --if-present -- --max-warnings=0

      - name: Run vitest suite
        run: npm run test -- --coverage
        # env vars наследуются из job-level env

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-build
          path: frontend/${{ env.BUILD_OUTPUT_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-test-results
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7
