      - name: Verify Caddy route ordering and security headers
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def active_lines(path: str) -> list[str]:
              return [
                  line.strip()
                  for line in Path(path).read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]

          def directive_blocks(lines: list[str], opener: str) -> list[list[str]]:
              blocks: list[list[str]] = []
              for index, line in enumerate(lines):
                  if line != opener:
                      continue
                  depth = 1
                  block: list[str] = []
                  for nested in lines[index + 1:]:
                      depth += nested.count("{") - nested.count("}")
                      if depth == 0:
                          blocks.append(block)
                          break
                      block.append(nested)
                  else:
                      raise AssertionError(f"unterminated Caddy directive block: {opener}")
              return blocks

          production = active_lines("deploy/Caddyfile.production")
          staging = active_lines("deploy/Caddyfile")
          assert production.index("handle @legacy_post {") < production.index("handle @api {")
          assert production.index("handle @api {") < production.index("handle {")
          production_headers = directive_blocks(production, "header {")
          staging_headers = directive_blocks(staging, "header {")
          assert production_headers
          assert staging_headers
          for directive in (
              'Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"',
              'X-Content-Type-Options "nosniff"',
              'X-Frame-Options "DENY"',
              'Referrer-Policy "strict-origin-when-cross-origin"',
              'Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), autoplay=(), encrypted-media=(), fullscreen=(self), picture-in-picture=()"',
          ):
              assert all(directive in block for block in production_headers)
          for directive in (
              'X-Content-Type-Options "nosniff"',
              'X-Frame-Options "DENY"',
              'Referrer-Policy "no-referrer"',
              'Content-Security-Policy "default-src \'self\'; frame-ancestors \'none\'; object-src \'none\'"',
          ):
              assert all(directive in block for block in staging_headers)
          assert "reverse_proxy app:8000" in staging
          PY

      - name: Scan hardened Caddy shell image
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') }}
        id: caddy-security
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        with:
          version: v0.74.0
          image-ref: pulseplate-caddy:contract
          format: table
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          cache-dir: /tmp/trivy-cache-caddy-contract

      - name: Prepare same-epoch full Caddy observation
        id: caddy-full-prep
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') && (!cancelled() && (steps.caddy-build.outcome == 'success' || steps.caddy-import.outcome == 'success') && steps.caddy-image.outcome == 'success' && (steps.caddy-security.outcome == 'success' || steps.caddy-security.outcome == 'failure')) }}
        env:
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
          CADDY_HC_OUTCOME: ${{ steps.caddy-security.outcome }}
          CADDY_TRIVY_CACHE: /tmp/trivy-cache-caddy-contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess

          try:
              state_path = Path(os.environ["CADDY_OBSERVATION_STATE"])
              if state_path.is_symlink() or not stat.S_ISREG(state_path.stat().st_mode):
                  raise ValueError("subject_state_invalid")
              subject = json.loads(state_path.read_text())
              private = state_path.parent
              scanner_command = shutil.which("trivy")
              if scanner_command is None:
                  raise ValueError("installed_scanner_missing")
              scanner = Path(scanner_command).resolve(strict=True)
              selected_command = os.environ.get("TRIVY_CMD", "").strip()
              if selected_command:
                  selected = shutil.which(selected_command)
                  if selected is None or Path(selected).resolve(strict=True) != scanner:
                      raise ValueError("HC_scanner_override_differs")
              if not scanner.is_file() or not os.access(scanner, os.X_OK):
                  raise ValueError("installed_scanner_invalid")
              home = private / "home"
              home.mkdir(mode=0o700)
              # Only these explicit host process values reach the diagnostic scanner.
              # No TRIVY_*, proxy, registry credential, native skip/VEX or plugin setting
              # survives from the action or job. Explicit config/ignore files below
              # avoid cwd/HOME defaults without adding another configuration parser.
              clean = {"PATH": str(Path(subject["docker"]).parent) + ":/usr/local/bin:/usr/bin:/bin",
                       "HOME": str(home), "LANG": "C.UTF-8"}
              version = subprocess.run([str(scanner), "--version"], env=clean, capture_output=True, timeout=30, check=False)
              if version.returncode or len(version.stdout) + len(version.stderr) > 65536 or re.search(rb"^Version: 0\.74\.0$", version.stdout, re.MULTILINE) is None:
                  raise ValueError("native_scanner_version_invalid")
              for name, raw in (("scanner-version.stdout", version.stdout), ("scanner-version.stderr", version.stderr)):
                  with (private / name).open("xb") as output:
                      output.write(raw)
                  (private / name).chmod(0o600)
              cache = Path(os.environ["CADDY_TRIVY_CACHE"])
              db = {}
              for name in ("db/trivy.db", "db/metadata.json"):
                  path = cache / name
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode) or path.stat().st_size == 0:
                      raise ValueError("post_HC_DB_missing")
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""):
                          digest.update(chunk)
                  db[name] = {"bytes": path.stat().st_size, "sha256": digest.hexdigest()}
              metadata = json.loads((cache / "db/metadata.json").read_text())
              if not isinstance(metadata, dict) or not metadata:
                  raise ValueError("post_HC_DB_metadata_invalid")
              config = private / "empty-trivy.yaml"
              ignore = private / "empty.trivyignore"
              config.write_text("{}\n")
              ignore.write_text("")
              for path in (config, ignore):
                  path.chmod(0o600)
              report = private / "full.raw.json"
              if report.exists() or report.is_symlink():
                  raise ValueError("full_report_not_fresh")
              subject.update(scanner=str(scanner), scanner_sha256=hashlib.sha256(scanner.read_bytes()).hexdigest(),
                             scanner_version_stdout_sha256=hashlib.sha256(version.stdout).hexdigest(),
                             post_HC_db=db, post_HC_db_metadata=metadata, clean_env=clean, cache=str(cache),
                             original_HC_outcome=os.environ["CADDY_HC_OUTCOME"])
              if subject["original_HC_outcome"] not in ("success", "failure"):
                  raise ValueError("HC_was_not_attempted")
              subject["full_argv"] = [str(scanner), "image", "--config", str(config), "--cache-dir", str(cache),
                                      "--skip-db-update", "--skip-java-db-update", "--skip-vex-repo-update",
                                      "--offline-scan", "--skip-version-check", "--disable-telemetry",
                                      "--image-src", "docker", "--platform", "linux/amd64",
                                      "--scanners", "vuln,secret", "--pkg-types", "os,library",
                                      "--severity", "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL", "--format", "json",
                                      "--list-all-pkgs", "--exit-code", "0", "--ignore-unfixed=false",
                                      "--ignorefile", str(ignore), "--timeout", os.environ["CADDY_FULL_SCAN_TIMEOUT_SECONDS"] + "s", "--output", str(report),
                                      subject["image_config_id"]]
              state_path.write_text(json.dumps(subject, sort_keys=True))
          except Exception as error:
              print("Caddy full-scan preparation failed: " + type(error).__name__)
              raise SystemExit(1)
          PY

      - name: Observe all-severity Caddy native report
        id: caddy-full-scan
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') && (!cancelled() && steps.caddy-full-prep.outcome == 'success') }}
        env:
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess

          try:
              state_path = Path(os.environ["CADDY_OBSERVATION_STATE"])
              subject = json.loads(state_path.read_text())
              scanner = Path(subject["scanner"])
              if hashlib.sha256(scanner.read_bytes()).hexdigest() != subject["scanner_sha256"]:
                  raise ValueError("scanner_changed_before_full_scan")
              for name, expected in subject["post_HC_db"].items():
                  path = Path(subject["cache"]) / name
                  digest = hashlib.sha256()
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode):
                      raise ValueError("DB_changed_before_full_scan")
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""):
                          digest.update(chunk)
                  if {"bytes": path.stat().st_size, "sha256": digest.hexdigest()} != expected:
                      raise ValueError("DB_changed_before_full_scan")
              # The scanner writes raw output outside the always-upload tree. Never echo
              # stdout/stderr or partial JSON, even if the native invocation fails.
              with (state_path.parent / "scan.stdout.private").open("xb") as stdout, (state_path.parent / "scan.stderr.private").open("xb") as stderr:
                  result = subprocess.run(subject["full_argv"], env=subject["clean_env"],
                                          cwd=state_path.parent, stdout=stdout, stderr=stderr,
                                          timeout=int(os.environ["CADDY_FULL_SCAN_TIMEOUT_SECONDS"]) + 30, check=False)
              if result.returncode:
                  raise ValueError("native_full_scan_failed")
          except Exception as error:
              print("Caddy full-scan observation failed: " + type(error).__name__)
              raise SystemExit(1)
          PY

      - name: Validate and publish full Caddy observation
        id: caddy-full-publish
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') && (!cancelled() && steps.caddy-full-prep.outcome == 'success' && steps.caddy-full-scan.outcome == 'success') }}
        env:
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import ssl
          import subprocess
          import sys

          try:
              state_path = Path(os.environ["CADDY_OBSERVATION_STATE"])
              subject = json.loads(state_path.read_text())
              private = state_path.parent
              root = Path(subject["root"])
              report = private / "full.raw.json"
              if report.is_symlink() or not stat.S_ISREG(report.stat().st_mode) or not 0 < report.stat().st_size <= 134217728:
                  raise ValueError("fresh_full_report_invalid")
              for name, expected in subject["sources"].items():
                  path = root / name
                  if path.is_symlink() or {"bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()} != expected:
                      raise ValueError("measured_source_epoch_changed")
              if (private / "empty-trivy.yaml").read_bytes() != b"{}\n" or (private / "empty.trivyignore").read_bytes() != b"":
                  raise ValueError("selected_native_configuration_changed")
              scanner = Path(subject["scanner"])
              if hashlib.sha256(scanner.read_bytes()).hexdigest() != subject["scanner_sha256"]:
                  raise ValueError("scanner_changed_after_full_scan")
              for name, expected in subject["post_HC_db"].items():
                  path = Path(subject["cache"]) / name
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode):
                      raise ValueError("DB_changed_after_full_scan")
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""):
                          digest.update(chunk)
                  if {"bytes": path.stat().st_size, "sha256": digest.hexdigest()} != expected:
                      raise ValueError("DB_changed_after_full_scan")

              def run(arguments):
                  result = subprocess.run([subject["docker"], *arguments], capture_output=True, timeout=60, check=False)
                  if result.returncode or len(result.stdout) > 1048576:
                      raise ValueError("native_subject_recheck_failed")
                  return result.stdout

              for reference in ("pulseplate-caddy:contract", subject["image_config_id"]):
                  inspected = json.loads(run(["image", "inspect", "--format", "{{json .}}", reference]))
                  if (inspected.get("Id"), inspected.get("Os"), inspected.get("Architecture")) != (subject["image_config_id"], "linux", "amd64"):
                      raise ValueError("image_or_tag_binding_changed")
              binary = run(["run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                            "--entrypoint", "/bin/busybox", subject["image_config_id"], "sha256sum", "/usr/bin/caddy"]).decode("ascii")
              if binary != subject["binary_sha256"] + "  /usr/bin/caddy\n":
                  raise ValueError("native_binary_changed")
              projection_directory = private / "native-projections"
              expected_projections = (("version.txt", ("version",)),
                                      ("build-info.txt", ("build-info",)),
                                      ("rebuilt-modules.txt", ("list-modules", "--packages")),
                                      ("default-ca.pem", ("cat", "/etc/ssl/certs/ca-certificates.crt")),
                                      ("ca-package-versions.txt", ("list", "--installed", "--manifest", "ca-certificates", "ca-certificates-bundle")))
              names = {name for name, _command in expected_projections}
              if (projection_directory.is_symlink() or not projection_directory.is_dir()
                      or {path.name for path in projection_directory.iterdir()} != names
                      or set(subject["native_projections"]) != names):
                  raise ValueError("native_projection_inventory_changed")
              for name, command in expected_projections:
                  expected = subject["native_projections"][name]
                  arguments = [subject["docker"], "run", "--rm", "--network", "none", "--read-only",
                               "--cap-drop", "ALL", "--cap-add", "NET_BIND_SERVICE", "--entrypoint",
                               "/usr/bin/caddy", subject["image_config_id"], *command]
                  if name in ("default-ca.pem", "ca-package-versions.txt"):
                      entrypoint = "/bin/busybox" if name == "default-ca.pem" else "/sbin/apk"
                      arguments = [subject["docker"], "run", "--rm", "--network", "none", "--read-only",
                                   "--cap-drop", "ALL", "--entrypoint", entrypoint, subject["image_config_id"], *command]
                      if (set(expected) != {"image_config_id", "argv", "exit_code", "bytes", "sha256"}
                              or type(expected["exit_code"]) is not int or expected["exit_code"] != 0):
                          raise ValueError("native_CA_projection_result_invalid")
                  if expected["image_config_id"] != subject["image_config_id"] or expected["argv"] != arguments:
                      raise ValueError("native_projection_image_binding_changed")
                  path = projection_directory / name
                  if (path.is_symlink() or not stat.S_ISREG(path.stat().st_mode)
                          or not 0 < path.stat().st_size <= 1048576):
                      raise ValueError("native_projection_file_invalid")
                  observed = path.read_bytes()
                  if {"bytes": len(observed), "sha256": hashlib.sha256(observed).hexdigest()} != {
                          "bytes": expected["bytes"], "sha256": expected["sha256"]}:
                      raise ValueError("native_projection_bytes_changed")
                  if name in ("default-ca.pem", "ca-package-versions.txt") and run(arguments[1:]) != observed:
                      raise ValueError("native_CA_subject_changed")
              sys.path.insert(0, str(root))
              from scripts.ci.prometheus_source_image import REMOVED_CA_DER_SHA256
              ca = (projection_directory / "default-ca.pem").read_bytes()
              if (len(ca) != 178791 or hashlib.sha256(ca).hexdigest()
                      != "5961c0a3c65459931c023e0075c09733f09aea4ca439cb85bc4a08bb4f3f568b"):
                  raise ValueError("native_Alpine_CA_supplier_bytes_unreconciled")
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
              context.load_verify_locations(cadata=ca.decode("ascii"))
              certificates = context.get_ca_certs(binary_form=True)
              if (len(certificates) != 118
                      or REMOVED_CA_DER_SHA256.intersection(hashlib.sha256(value).hexdigest() for value in certificates)):
                  raise ValueError("native_Alpine_removed_CA_present")
              installed = (projection_directory / "ca-package-versions.txt").read_bytes().decode("ascii").splitlines()
              expected_CA_versions = ["ca-certificates 20261020-r0", "ca-certificates-bundle 20261020-r0"]
              if sorted(installed) != expected_CA_versions:
                  raise ValueError("native_Alpine_CA_versions_unreconciled")
              from scripts.ci.check_docker_runtime_dependency_surface import validate_trivy_image_report
              validate_trivy_image_report(subject["image_config_id"], report)
              native = json.loads(report.read_text())
              missing_secrets = 0
              for result in native["Results"]:
                  if "Secrets" in result:
                      secrets = result["Secrets"]
                      if not isinstance(secrets, list) or secrets:
                          raise ValueError("native_Secrets_not_empty_array")
                  else:
                      missing_secrets += 1
              os_rows = [row for row in native["Results"] if row["Class"] == "os-pkgs"]
              caddy_rows = [row for row in native["Results"] if row["Target"] == "usr/bin/caddy" and row["Type"] == "gobinary"]
              if len(caddy_rows) != 1 or not os_rows:
                  raise ValueError("configured_package_target_inventory_missing")
              for result in [*os_rows, *caddy_rows]:
                  packages = result.get("Packages")
                  if not isinstance(packages, list) or not packages:
                      raise ValueError("listed_packages_missing")
                  if not all(isinstance(package, dict) and all(isinstance(package.get(key), str) and package[key] for key in ("Name", "Version")) for package in packages):
                      raise ValueError("listed_package_identity_incomparable")
              for package_name in ("ca-certificates", "ca-certificates-bundle"):
                  versions = [package["Version"] for result in os_rows for package in result["Packages"]
                              if package["Name"] == package_name]
                  if versions != ["20261020-r0"]:
                      raise ValueError("native_CA_package_inventory_mismatch")
              metadata = {"observed_at_utc": datetime.now(timezone.utc).isoformat(),
                          "subject": subject, "full_report_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
                          "full_scan_native_exit": 0, "capture_checks": "completed",
                          "default_CA": {"path": "/etc/ssl/certs/ca-certificates.crt", "bytes": len(ca),
                                         "sha256": hashlib.sha256(ca).hexdigest(), "roots": len(certificates),
                                         "installed_packages": installed, "named_removed_roots_absent": True},
                          "Results_Secrets_fields_absent": missing_secrets,
                          "Secrets_scope": "Present Results fields are empty arrays; absent fields retain native serialization omission, not forced zero.",
                          "claim_boundary": "Next observed local config/image ID, not prior ephemeral image or OCI manifest. Post-HC DB pre/post binding is not retroactive HC DB proof. Full native package/advisory reconciliation remains separate; diagnostic capture does not pass the blocking HC gate."}
              payload = private / "validated-publication"
              payload.mkdir(mode=0o700)
              # Native diagnostics retain their original bytes. The report's omitted
              # Secrets fields remain omitted; this does not manufacture coverage.
              diagnostics = {}
              for name in ("scanner-version.stdout", "scanner-version.stderr", "scan.stdout.private", "scan.stderr.private"):
                  path = private / name
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode) or path.stat().st_size > 1048576:
                      raise ValueError("scanner_diagnostic_bound_or_type")
                  raw = path.read_bytes()
                  for key in ("GH_TOKEN", "GITHUB_TOKEN", "GHCR_READ_TOKEN", "DEVPI_CI_PASSWORD"):
                      known = os.environ.get(key)
                      if known and known.encode() in raw:
                          raise ValueError("scanner_diagnostic_credential_reflection")
                  diagnostics[name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
                  os.rename(path, payload / name)
              metadata["native_diagnostics"] = diagnostics
              (payload / "observation.json").write_text(json.dumps(metadata, indent=2))
              os.rename(report, payload / "full.raw.json")
              os.rename(projection_directory, payload / "native-projections")
              evidence = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True) / "caddy-contract"
              if evidence.is_symlink() or not evidence.is_dir():
                  raise ValueError("existing_evidence_directory_invalid")
              destination = evidence / "full-observation"
              if destination.exists() or destination.is_symlink():
                  raise ValueError("publication_destination_not_fresh")
              # Final operation: only fully checked raw/metadata enter always-upload.
              os.rename(payload, destination)
          except Exception as error:
              print("Caddy full-scan publication rejected: " + type(error).__name__)
              raise SystemExit(1)
          PY

      - name: Decide exact Caddy D inventory and loaded isolated runtime
        id: caddy-D
        if: ${{ (steps.caddy-build.outcome == 'success' || steps.caddy-import.outcome == 'success') && steps.caddy-full-publish.outcome == 'success' }}
        env:
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          from scripts.ci.check_docker_runtime_dependency_surface import (
              observe_caddy_ci_runtime, validate_caddy_ci_report, validate_caddy_policy_projection, validate_caddy_ci_window,
          )

          work = Path(os.environ["RUNNER_TEMP"])
          evidence = work / "caddy-contract"
          observation = json.loads((evidence / "full-observation/observation.json").read_bytes())
          subject = observation["subject"]
          image = subject["image_config_id"]
          raw = evidence / "full-observation/full.raw.json"
          binary = (evidence / "full-observation/native-projections/build-info.txt").read_bytes()
          today = datetime.now(timezone.utc).date()
          policy = Path("trivy/ignore-policy-caddy-go-jose-v3.rego").resolve(strict=True)
          validate_caddy_ci_window(policy, today=today)
          decision = validate_caddy_ci_report(image, raw, binary_metadata=binary, today=today,
              native_exit=observation["full_scan_native_exit"], expected_report_sha256=observation["full_report_sha256"])
          runtime_dir = evidence / "loaded-runtime"
          runtime_dir.mkdir(mode=0o700)
          loaded = observe_caddy_ci_runtime(image, runtime_dir)
          (runtime_dir / "observation.json").write_text(json.dumps(loaded, indent=2))
          # These are native conversions of the actual same successful full image scan.
          # Rego receives the scanner's DetectedVulnerability object, never an invented envelope.
          # Outer image/result/config checks above supply the fields unavailable to that input.
          for label, selected_policy, accepted in (
              ("strict-control", Path("trivy/ignore-policy.rego").resolve(strict=True), False),
              ("D-policy", policy, True),
          ):
              output = evidence / (label + ".raw.json")
              argv = [subject["scanner"], "convert", "--quiet", "--format", "json", "--ignore-policy", str(selected_policy),
                      "--ignorefile", str(Path(os.environ["CADDY_OBSERVATION_STATE"]).parent / "empty.trivyignore"), str(raw)]
              with output.open("xb") as stdout, (evidence / (label + ".stderr")).open("xb") as stderr:
                  result = subprocess.run(argv, env=subject["clean_env"], stdout=stdout, stderr=stderr, timeout=60, check=False)
              if result.returncode != 0:
                  raise ValueError("Caddy native policy conversion failed: " + label)
              validate_caddy_policy_projection(image, raw, output, accept_v3=accepted)
              # No error exit can count as a successful strict-policy rejection.
              decision[label] = {"native_exit": result.returncode, "sha256": hashlib.sha256(output.read_bytes()).hexdigest(),
                                 "accepted_v3_rows": int(accepted), "strict_rejection": not accepted}
          decision["runtime_observation_sha256"] = hashlib.sha256((runtime_dir / "observation.json").read_bytes()).hexdigest()
          decision["current_head"] = json.loads((work / "caddy-admission/admission.json").read_bytes())["current_head"]
          decision["policy_sha256"] = hashlib.sha256(policy.read_bytes()).hexdigest()
          (evidence / "D-decision.json").write_text(json.dumps(decision, indent=2))
          # Only the completed full secret/runtime/policy conjunction may expose image bytes.
          admission = json.loads((work / "caddy-admission/admission.json").read_bytes())
          if admission["mode"] == "build":
              private_candidate = Path(os.environ["CADDY_OBSERVATION_STATE"]).parent / "candidate"
              for name in ("candidate.docker.tar", "candidate.json"):
                  source = private_candidate / name
                  if source.is_symlink() or not stat.S_ISREG(source.stat().st_mode) or (evidence / name).exists():
                      raise ValueError("Caddy accepted image publication path invalid")
              for name in ("candidate.docker.tar", "candidate.json"):
                  os.rename(private_candidate / name, evidence / name)
          print("Caddy D: exactly one visible v3 HIGH temporarily accepted for isolated CI; v4 fixed; strict CD/release remains outstanding")
          PY

      - name: Upload Caddy contract evidence
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: caddy-contract-evidence
          path: ${{ runner.temp }}/caddy-contract
          if-no-files-found: warn
          retention-days: 30
