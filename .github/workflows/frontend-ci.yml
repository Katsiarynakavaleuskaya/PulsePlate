                      response = api(path + separator + "per_page=100&page=" + str(page))
                      count = response["total_count"]
                      if type(count) is not int or not 0 <= count <= 10000 or not isinstance(response[key], list):
                          raise ValueError("Caddy API inventory shape")
                      if total is None:
                          total = count
                      expected_page_size = min(100, total - len(rows))
