name: Frontend CI

env:
  FRONTEND_NODE_VERSION_FILE: ".nvmrc"
  PYTHON_VERSION: "3.13.6"
  PULSEPLATE_PYTHON_INDEX_URL: ${{ vars.PULSEPLATE_PYTHON_INDEX_URL }}
  PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, feat/**, fix/**]
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/actions/npm-ci-with-retry/**'
      - 'tokens/**'
      - 'docs/design/TOKENS_SOT.md'
      - 'docs/design/TOKEN_PIPELINE_GOVERNANCE.md'
      - 'docs/runbooks/DESIGN_TOOLING_OPERATING_MODEL.md'
      - 'docs/figma/FIGMA_IMPLEMENTATION_RUNBOOK.md'
      - 'docs/runbooks/FIGMA_MCP_DESIGN_SYSTEM_RULES.md'
      - 'docs/orchestration/IOS_FRONTEND_MULTIAGENT_PLAYBOOK.md'
      - 'docs/roadmap/BACKLOG_LEDGER.md'
      - 'ios/PulsePlate/DesignSystem/DesignTokens.swift'
      - 'ios/PulsePlate/DesignSystem/DesignTokens.generated.swift'
      - 'ios/PulsePlate/Extensions/Color+Assets.swift'
      - 'ios/PulsePlate/Assets.xcassets/Navy.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/AppPrimary.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/AccentGreen.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/HeartRed.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/Gold.colorset/**'
      - 'docs/design/figma-manifest.json'
      - 'Makefile'
      - 'requirements.txt'
      - 'requirements-ci-lite.in'
      - 'requirements-ci-lite.txt'
      - 'constraints.txt'
      - '.github/actions/python-setup/**'
      - 'scripts/ci/install_locked_python_requirements.py'
      - 'scripts/ci/check_python_startup_hooks.py'
      - 'scripts/ci/emergency_python_wheels.json'
      - 'scripts/design_guard.py'
      - 'tests/test_design_token_parity.py'
      - 'tests/test_design_invariant_guard.py'
      - 'tests/test_frontend_raw_hex_guard.py'
      - 'tests/test_python_supply_chain_controls.py'
      - 'deploy/Caddyfile'
      - 'deploy/Caddyfile.production'
      - 'deploy/docker-compose.staging.yaml'
      - 'scripts/deploy.sh'
      - 'tests/test_caddy_deploy_provenance.py'
      - 'tests/test_cd_attestation_workflow_contract.py'
      - '.github/workflows/cd.yml'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main, feat/**, fix/**]
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/actions/npm-ci-with-retry/**'
      - 'tokens/**'
      - 'docs/design/TOKENS_SOT.md'
      - 'docs/design/TOKEN_PIPELINE_GOVERNANCE.md'
      - 'docs/runbooks/DESIGN_TOOLING_OPERATING_MODEL.md'
      - 'docs/figma/FIGMA_IMPLEMENTATION_RUNBOOK.md'
      - 'docs/runbooks/FIGMA_MCP_DESIGN_SYSTEM_RULES.md'
      - 'docs/orchestration/IOS_FRONTEND_MULTIAGENT_PLAYBOOK.md'
      - 'docs/roadmap/BACKLOG_LEDGER.md'
      - 'ios/PulsePlate/DesignSystem/DesignTokens.swift'
      - 'ios/PulsePlate/DesignSystem/DesignTokens.generated.swift'
      - 'ios/PulsePlate/Extensions/Color+Assets.swift'
      - 'ios/PulsePlate/Assets.xcassets/Navy.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/AppPrimary.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/AccentGreen.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/HeartRed.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/Gold.colorset/**'
      - 'docs/design/figma-manifest.json'
      - 'Makefile'
      - 'requirements.txt'
      - 'requirements-ci-lite.in'
      - 'requirements-ci-lite.txt'
      - 'constraints.txt'
      - '.github/actions/python-setup/**'
      - 'scripts/ci/install_locked_python_requirements.py'
      - 'scripts/ci/check_python_startup_hooks.py'
      - 'scripts/ci/emergency_python_wheels.json'
      - 'scripts/design_guard.py'
      - 'tests/test_design_token_parity.py'
      - 'tests/test_design_invariant_guard.py'
      - 'tests/test_frontend_raw_hex_guard.py'
      - 'tests/test_python_supply_chain_controls.py'
      - 'deploy/Caddyfile'
      - 'deploy/Caddyfile.production'
      - 'deploy/docker-compose.staging.yaml'
      - 'scripts/deploy.sh'
      - 'tests/test_caddy_deploy_provenance.py'
      - 'tests/test_cd_attestation_workflow_contract.py'
      - '.github/workflows/cd.yml'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      caddy: ${{ steps.filter.outputs.caddy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Caddy contract changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            caddy:
              - 'frontend/Dockerfile.caddy-spa'
              - 'deploy/Caddyfile'
              - 'deploy/Caddyfile.production'
              - 'deploy/docker-compose.staging.yaml'
              - 'scripts/deploy.sh'
              - 'tests/test_caddy_deploy_provenance.py'
              - 'tests/test_cd_attestation_workflow_contract.py'
              - '.github/workflows/cd.yml'
              - '.github/workflows/frontend-ci.yml'

  build-and-test:
    runs-on: ubuntu-latest
    env:
      BUILD_OUTPUT_DIR: dist
      VITE_API_BASE: "http://localhost:8000/api/v1"
      VITE_API_KEY: "test_key"
      VITE_DEV_MODE: "true"
      VITE_ANALYTICS_ENABLED: "false"
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ env.FRONTEND_NODE_VERSION_FILE }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          working-directory: frontend

      - name: Setup environment variables
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else : > .env; fi
          if grep -q '^VITE_API_BASE=' .env; then
            sed -i 's|^VITE_API_BASE=.*$|VITE_API_BASE=http://localhost:8000/api/v1|' .env
          else
            echo "VITE_API_BASE=http://localhost:8000/api/v1" >> .env
          fi

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        env:
          DEVPI_CI_USER: ${{ github.event_name != 'pull_request' && secrets.DEVPI_CI_USER || '' }}
          DEVPI_CI_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DEVPI_CI_PASSWORD || '' }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          requirements-profile: ci-lite
          install-mode: direct-proxy

      - name: Run design token pipeline checks
        run: |
          cd ..
          make tokens-check

      - name: Generate OpenAPI JSON from backend (canonical)
        env:
          APP_ENV: test
          ENVIRONMENT: test
        run: |
          cd ..
          make openapi

      - name: Fail if OpenAPI/types are out of sync
        run: |
          cd ..
          git diff --exit-code frontend/src/api/openapi.json frontend/src/api/schema.ts

      - name: Run ESLint with duplication checks
        run: |
          npm run lint --if-present -- --max-warnings=0

      - name: Run vitest suite
        run: npm run test -- --coverage
        # env vars наследуются из job-level env

      - name: Build frontend
        env:
          # Keep bundle analysis off for pull requests and feature/fix branch pushes so
          # branch-controlled Vite build code never receives Codecov upload credentials.
          CODECOV_BUNDLE_ANALYSIS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: npm run build

      - name: Verify Tailwind CSS utilities
        run: npm run smoke:css

      - name: Upload frontend build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: frontend-build
          path: frontend/${{ env.BUILD_OUTPUT_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: frontend-test-results
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  caddy-contract:
    needs: changes
    if: ${{ always() && (needs.changes.outputs.caddy == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 / Node 24

      - name: Build hardened Caddy shell image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.caddy-spa
          load: true
          push: false
          tags: pulseplate-caddy:contract
          cache-from: type=gha,scope=frontend-caddy-contract
          cache-to: type=gha,scope=frontend-caddy-contract,mode=min,ignore-error=true

      - name: Verify hardened Caddy runtime and module parity
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/caddy-contract"
          mkdir -p "$evidence_dir"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            pulseplate-caddy:contract caddy version | tee "$evidence_dir/version.txt"
          grep -F 'v2.11.4' "$evidence_dir/version.txt"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            pulseplate-caddy:contract caddy build-info | tee "$evidence_dir/build-info.txt"
          grep -F 'go1.26.5' "$evidence_dir/build-info.txt"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            pulseplate-caddy:contract getcap /usr/bin/caddy | tee "$evidence_dir/capabilities.txt"
          grep -F 'cap_net_bind_service=ep' "$evidence_dir/capabilities.txt"
          official_caddy_ref="$(awk '/^FROM caddy:/ { print $2; exit }' frontend/Dockerfile.caddy-spa)"
          [[ "$official_caddy_ref" =~ ^caddy:2\.11\.4-alpine@sha256:[0-9a-f]{64}$ ]]
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            "$official_caddy_ref" \
            caddy list-modules --packages \
            | awk 'NF && $1 != "Standard" { print $1 }' \
            | LC_ALL=C sort > "$evidence_dir/official-modules.txt"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            pulseplate-caddy:contract caddy list-modules --packages \
            | awk 'NF && $1 != "Standard" { print $1 }' \
            | LC_ALL=C sort > "$evidence_dir/rebuilt-modules.txt"
          diff -u "$evidence_dir/official-modules.txt" "$evidence_dir/rebuilt-modules.txt"

      - name: Validate staging and production Caddyfiles
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --tmpfs /data --tmpfs /config \
            -e STAGING_DOMAIN=staging.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            pulseplate-caddy:contract \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --tmpfs /data --tmpfs /config \
            -e PRODUCTION_DOMAIN=example.com \
            -e STAGING_FALLBACK_DOMAIN=staging.example.com \
            -v "$PWD/deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro" \
            pulseplate-caddy:contract \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Verify Caddy route ordering and security headers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def active_lines(path: str) -> list[str]:
              return [
                  line.strip()
                  for line in Path(path).read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]

          def directive_blocks(lines: list[str], opener: str) -> list[list[str]]:
              blocks: list[list[str]] = []
              for index, line in enumerate(lines):
                  if line != opener:
                      continue
                  depth = 1
                  block: list[str] = []
                  for nested in lines[index + 1:]:
                      depth += nested.count("{") - nested.count("}")
                      if depth == 0:
                          blocks.append(block)
                          break
                      block.append(nested)
                  else:
                      raise AssertionError(f"unterminated Caddy directive block: {opener}")
              return blocks

          production = active_lines("deploy/Caddyfile.production")
          staging = active_lines("deploy/Caddyfile")
          assert production.index("handle @legacy_post {") < production.index("handle @api {")
          assert production.index("handle @api {") < production.index("handle {")
          production_headers = directive_blocks(production, "header {")
          staging_headers = directive_blocks(staging, "header {")
          assert production_headers
          assert staging_headers
          for directive in (
              'Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"',
              'X-Content-Type-Options "nosniff"',
              'X-Frame-Options "DENY"',
              'Referrer-Policy "strict-origin-when-cross-origin"',
              'Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), autoplay=(), encrypted-media=(), fullscreen=(self), picture-in-picture=()"',
          ):
              assert all(directive in block for block in production_headers)
          for directive in (
              'X-Content-Type-Options "nosniff"',
              'X-Frame-Options "DENY"',
              'Referrer-Policy "no-referrer"',
              'Content-Security-Policy "default-src \'self\'; frame-ancestors \'none\'; object-src \'none\'"',
          ):
              assert all(directive in block for block in staging_headers)
          assert "reverse_proxy app:8000" in staging
          PY

      - name: Scan hardened Caddy shell image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        with:
          image-ref: pulseplate-caddy:contract
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          cache-dir: /tmp/trivy-cache-caddy-contract

      - name: Upload Caddy contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: caddy-contract-evidence
          path: ${{ runner.temp }}/caddy-contract
          if-no-files-found: warn
          retention-days: 14
