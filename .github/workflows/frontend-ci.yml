                  if (run["id"] == state["current_run_id"] and job["run_attempt"] == state["current_run_attempt"]
                          and job["name"] == "caddy-contract"):
                      current_jobs.append(job)
                  numbers = set()
                  for step in job["steps"]:
                      number = positive_id(step["number"])
                      if number in numbers:
                          raise ValueError("Caddy duplicate native step")
                      numbers.add(number)
                      if step["name"] == "Build accepted D Caddy candidate once":
                          if not {"status", "conclusion", "started_at", "completed_at"} <= set(step):
                              raise ValueError("Caddy build start/status evidence incomplete")
                          started, finished = step["started_at"], step["completed_at"]
                          if (step["status"] in ("pending", "queued") and step["conclusion"] is None
