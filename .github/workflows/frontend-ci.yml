          private = state_path.parent
          control_dir = private / "controls"
          control_dir.mkdir(mode=0o700)
          owner = "caddy-controls-" + uuid.uuid4().hex
          owned = []
          records = []
          scans = {}
          control = {"scans": scans, "subjects": {"candidate": subject["image_config_id"]},
                     "commands": records, "cleanup": False, "failure": None, "owner": owner}

          def digest(path, remaining=None):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1048576), b""):
                      if remaining is not None:
                          remaining(1)
                      value.update(chunk)
              return value.hexdigest()

          def freeze():
              with caddy_ci_phase("PROCESSING") as remaining:
                  remaining(1)
                  if (digest(Path(subject["scanner"]), remaining) != subject["scanner_sha256"] or
                          (private / "empty-trivy.yaml").read_bytes() != b"{}\n" or
                          (private / "empty.trivyignore").read_bytes() != b""):
                      raise ValueError("Caddy frozen scanner/config changed")
                  for name, expected in subject["frozen_db"].items():
                      remaining(1)
                      path = Path(subject["cache"]) / name
                      if path.is_symlink() or not path.is_file() or {"bytes": path.stat().st_size, "sha256": digest(path, remaining)} != expected:
                          raise ValueError("Caddy frozen DB changed")

          def invoke(label, argv, phase, cap, scan=False):
              stem = control_dir / (str(len(records)) + "-" + label)
              with caddy_ci_phase(phase) as remaining:
                  begin = time.monotonic()
                  outer = remaining(cap)
                  terminal = int(os.environ["CADDY_SCAN_TERM_SECONDS"])
                  killed = int(os.environ["CADDY_SCAN_KILL_SECONDS"])
                  book = int(os.environ["CADDY_SCAN_BOOKKEEPING_SECONDS"])
                  if scan and outer < int(os.environ["CADDY_FULL_SCAN_TIMEOUT_SECONDS"]) + terminal + killed + book - 0.05:
                      raise ValueError("Caddy insufficient inclusive scan envelope")
                  end = begin + outer
                  timed = False
                  record = {"label": label, "argv": argv, "phase": phase, "exit": None, "timeout": None,
                            "stdout": stem.with_suffix(".stdout.private").name,
                            "stderr": stem.with_suffix(".stderr.private").name}
                  records.append(record)
                  with stem.with_suffix(".stdout.private").open("xb") as stdout, stem.with_suffix(".stderr.private").open("xb") as stderr:
                      child = subprocess.Popen(argv, env=subject["clean_env"], cwd=private,
                                               stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr, start_new_session=True)
                      try:
                          work_seconds = int(os.environ["CADDY_FULL_SCAN_TIMEOUT_SECONDS"]) if scan else outer - min(20, outer / 2)
                          code = child.wait(timeout=work_seconds)
                      except subprocess.TimeoutExpired:
                          timed = True
                          record["timeout"] = True
                          os.killpg(child.pid, signal.SIGTERM)
                          try:
                              code = child.wait(timeout=min(terminal, max(0.01, end - time.monotonic())))
                          except subprocess.TimeoutExpired:
                              os.killpg(child.pid, signal.SIGKILL)
                              code = child.wait(timeout=min(killed, max(0.01, end - time.monotonic())))
                  record.update(exit=code, timeout=timed, seconds=time.monotonic() - begin,
                                stdout_sha256=digest(stem.with_suffix(".stdout.private")),
                                stderr_sha256=digest(stem.with_suffix(".stderr.private")))
                  if time.monotonic() > end:
                      raise ValueError("Caddy native call exceeded inclusive envelope")
                  if scan:
                      return code, timed
                  if timed or code != 0 or stem.with_suffix(".stdout.private").stat().st_size > 1048576:
                      raise ValueError("Caddy native control operation failed: " + label)
                  return stem.with_suffix(".stdout.private").read_bytes()

          def docker(label, arguments, cap=60, phase="FIXTURE"):
              return invoke(label, [subject["docker"], *arguments], phase, cap)

          def inspect(image, label, phase="FIXTURE", cap=60):
              return json.loads(docker(label, ["inspect", image], cap, phase))[0]

          def scan_pair(name, image):
              for stage, severity, expected_exit in (("full", "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL", "0"), ("HC", "HIGH,CRITICAL", "1")):
                  freeze()
                  report = control_dir / (name + "-" + stage + ".raw.json")
                  argv = list(subject["full_argv"])
                  for flag, value in (("--output", str(report)), ("--severity", severity), ("--exit-code", expected_exit)):
                      argv[argv.index(flag) + 1] = value
                  argv[-1] = image
                  cap = int(os.environ["CADDY_FULL_SCAN_TIMEOUT_SECONDS"]) + sum(int(os.environ[key]) for key in
                      ("CADDY_SCAN_TERM_SECONDS", "CADDY_SCAN_KILL_SECONDS", "CADDY_SCAN_BOOKKEEPING_SECONDS"))
                  code, timed = invoke(name + "-" + stage, argv, "SCANS", cap, scan=True)
                  observation = {"exit": code, "timeout": timed, "file": report.name}
                  if report.is_file() and not report.is_symlink() and 0 < report.stat().st_size <= 134217728:
                      observation["sha256"] = digest(report)
                  scans[name + "-" + stage] = observation
                  freeze()
                  # Collection/tool failures remain failures, but later technically available
                  # controls are still observed. No missing report becomes an empty report.

          try:
              freeze()
              candidate = inspect(subject["image_config_id"], "parent-image")
              control["parent_layers"] = candidate["RootFS"]["Layers"]
              official_ref = "caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648"
              official = inspect(official_ref, "official-image")
              if (official["Os"], official["Architecture"]) != ("linux", "amd64"):
                  raise ValueError("Caddy official control platform")
              control["subjects"]["official"] = official["Id"]
              name = owner + "-official"
              cid = docker("official-create", ["create", "--pull", "never", "--name", name, "--label", "pulseplate.caddy-control=" + owner,
                  "--network", "none", "--read-only", "--cap-drop", "ALL", "--cap-add", "NET_BIND_SERVICE",
                  "--security-opt", "no-new-privileges", "--cpus", "1", "--memory", "256m", "--memory-swap", "256m",
                  "--pids-limit", "64", "--entrypoint", "/usr/bin/caddy", official["Id"], "build-info"]).decode().strip()
              owned.append((cid, name, official["Id"]))
              row = inspect(cid, "official-created")
              if row["Image"] != official["Id"] or row["Config"]["Labels"].get("pulseplate.caddy-control") != owner or row["State"]["Running"]:
                  raise ValueError("Caddy official control ownership")
              info = docker("official-build-info", ["start", "--attach", cid])
              terminal = inspect(cid, "official-terminal")
              if terminal["State"]["ExitCode"] != 0 or terminal["State"]["OOMKilled"]:
                  raise ValueError("Caddy official metadata native failure")
              lines = [line.split() for line in info.decode().splitlines() if line.strip()]
              positions = [index for index, line in enumerate(lines) if line[:2] == ["dep", "github.com/go-jose/go-jose/v3"]]
              if len(positions) != 1 or lines[positions[0]][2:] != ["v3.0.5", "h1:BLLJWbC4nMZOfuPVxoZIxeYsn6Nl2r1fITaJ78UQlVQ="] or (
                      positions[0] + 1 < len(lines) and lines[positions[0] + 1][0] == "=>"):
                  raise ValueError("Caddy official unreplaced v3 witness")
              scan_pair("candidate", subject["image_config_id"])
              scan_pair("official", official["Id"])
              name = owner + "-secret"
              cid = docker("secret-create", ["create", "--pull", "never", "--name", name, "--label", "pulseplate.caddy-control=" + owner,
                  "--network", "none", subject["image_config_id"]]).decode().strip()
              owned.append((cid, name, subject["image_config_id"]))
              row = inspect(cid, "secret-created")
              if row["Image"] != subject["image_config_id"] or row["State"]["Running"] or row["Config"]["Labels"].get("pulseplate.caddy-control") != owner:
                  raise ValueError("Caddy stopped child ownership")
              if docker("secret-initial-diff", ["diff", cid]).strip():
                  raise ValueError("Caddy initial control filesystem not empty")
              fixture = private / "credentials.txt"
              fixture.write_text("GITHUB_PAT=" + "ghp_" + "012345678901234567890123456789abcdef" + "\n")
              docker("secret-copy", ["cp", str(fixture), cid + ":/credentials.txt"])
              delta = docker("secret-final-diff", ["diff", cid]).decode().splitlines()
              if delta != ["A /credentials.txt"]:
                  raise ValueError("Caddy control filesystem delta")
              tag = "pulseplate-caddy-control:" + owner
              control["child_tag"] = tag
              docker("secret-commit", ["commit", "--pause=false", cid, tag], 180)
              child = inspect(tag, "secret-image")
              control["subjects"]["secret"] = child["Id"]
              control["child_tag"] = tag
              still_stopped = inspect(cid, "secret-still-stopped")
              if still_stopped["State"]["Running"] or child["RootFS"]["Layers"][:-1] != candidate["RootFS"]["Layers"]:
                  raise ValueError("Caddy secret child lineage or execution")
              control.update(parent_layers=candidate["RootFS"]["Layers"], child_layers=child["RootFS"]["Layers"],
                             filesystem_delta=delta, fixture_sha256=digest(fixture), child_was_started=False)
              scan_pair("secret", child["Id"])
              if inspect(subject["image_config_id"], "parent-final")["RootFS"] != candidate["RootFS"]:
                  raise ValueError("Caddy parent changed during controls")
              freeze()
              # Existing private publication owner receives the actual candidate full report.
              report = control_dir / "candidate-full.raw.json"
              (private / "full.raw.json").write_bytes(report.read_bytes())
              record = next(row for row in records if row["label"] == "candidate-full")
              for channel in ("stdout", "stderr"):
                  (private / ("scan." + channel + ".private")).write_bytes((control_dir / record[channel]).read_bytes())
          except BaseException as error:
              control["failure"] = type(error).__name__
              raise
          finally:
              try:
                  # Closed two-container inventory; no foreign or inherited resources touched.
                  census = docker("cleanup-census", ["ps", "--all", "--no-trunc", "--filter", "label=pulseplate.caddy-control=" + owner,
                                                    "--format", "{{.ID}}"], 20, "CONTROL_CLEANUP").decode().splitlines()
                  if len(census) > 2 or len(set(census)) != len(census):
                      raise ValueError("Caddy control cleanup inventory differs")
                  for cid in census:
                      row = inspect(cid, "cleanup-owned", "CONTROL_CLEANUP")
                      expected_image = {"/" + owner + "-official": control["subjects"].get("official"),
                                        "/" + owner + "-secret": subject["image_config_id"]}.get(row["Name"])
                      if expected_image is None or row["Image"] != expected_image or row["Config"]["Labels"].get("pulseplate.caddy-control") != owner:
                          raise ValueError("Caddy control cleanup ownership differs")
                      if row["State"]["Running"]:
                          docker("cleanup-stop", ["stop", "--time", "10", cid], 20, "CONTROL_CLEANUP")
                      docker("cleanup-remove", ["rm", "--volumes", cid], 20, "CONTROL_CLEANUP")
                  # Child image must remain available for the final report/image binding.
                  # Its positively owned removal is performed by the final decision before release.
                  control["container_cleanup"] = True
              except BaseException as cleanup_error:
                  control["cleanup_failure"] = type(cleanup_error).__name__
                  raise
              finally:
                  subject["controls"] = control
                  state_path.write_text(json.dumps(subject, sort_keys=True))
                  (control_dir / "native-controls.json").write_text(json.dumps(control, indent=2))
          PY

      - name: Validate and publish full Caddy observation
        id: caddy-full-publish
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') && (!cancelled() && steps.caddy-full-prep.outcome == 'success' && steps.caddy-full-scan.outcome == 'success') }}
        env:
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import ssl
          import subprocess
          import sys
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_phase

          try:
              state_path = Path(os.environ["CADDY_OBSERVATION_STATE"])
              subject = json.loads(state_path.read_text())
              full_result = subject["controls"]["scans"]["candidate-full"]
              if type(full_result["exit"]) is not int or full_result["exit"] != 0 or full_result["timeout"] is not False:
                  raise ValueError("candidate full scan did not actually succeed")
              private = state_path.parent
              root = Path(subject["root"])
              report = private / "full.raw.json"
              if report.is_symlink() or not stat.S_ISREG(report.stat().st_mode) or not 0 < report.stat().st_size <= 134217728:
                  raise ValueError("fresh_full_report_invalid")
              for name, expected in subject["sources"].items():
                  path = root / name
                  if path.is_symlink() or {"bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()} != expected:
                      raise ValueError("measured_source_epoch_changed")
              if (private / "empty-trivy.yaml").read_bytes() != b"{}\n" or (private / "empty.trivyignore").read_bytes() != b"":
                  raise ValueError("selected_native_configuration_changed")
              scanner = Path(subject["scanner"])
              if hashlib.sha256(scanner.read_bytes()).hexdigest() != subject["scanner_sha256"]:
                  raise ValueError("scanner_changed_after_full_scan")
              for name, expected in subject["frozen_db"].items():
                  path = Path(subject["cache"]) / name
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode):
                      raise ValueError("DB_changed_after_full_scan")
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""):
                          digest.update(chunk)
                  if {"bytes": path.stat().st_size, "sha256": digest.hexdigest()} != expected:
                      raise ValueError("DB_changed_after_full_scan")

              def run(arguments):
                  with caddy_ci_phase("FINAL_SUBJECT") as remaining:
                      result = subprocess.run([subject["docker"], *arguments], capture_output=True, timeout=remaining(60), check=False)
                  if result.returncode or len(result.stdout) > 1048576:
                      raise ValueError("native_subject_recheck_failed")
                  return result.stdout

              for reference in ("pulseplate-caddy:contract", subject["image_config_id"]):
                  inspected = json.loads(run(["image", "inspect", "--format", "{{json .}}", reference]))
                  if (inspected.get("Id"), inspected.get("Os"), inspected.get("Architecture")) != (subject["image_config_id"], "linux", "amd64"):
                      raise ValueError("image_or_tag_binding_changed")
              binary = run(["run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                            "--entrypoint", "/bin/busybox", subject["image_config_id"], "sha256sum", "/usr/bin/caddy"]).decode("ascii")
              if binary != subject["binary_sha256"] + "  /usr/bin/caddy\n":
                  raise ValueError("native_binary_changed")
              projection_directory = private / "native-projections"
              expected_projections = (("version.txt", ("version",)),
                                      ("build-info.txt", ("build-info",)),
                                      ("rebuilt-modules.txt", ("list-modules", "--packages")),
                                      ("default-ca.pem", ("cat", "/etc/ssl/certs/ca-certificates.crt")),
                                      ("ca-package-versions.txt", ("list", "--installed", "--manifest", "ca-certificates", "ca-certificates-bundle")))
              names = {name for name, _command in expected_projections}
              if (projection_directory.is_symlink() or not projection_directory.is_dir()
                      or {path.name for path in projection_directory.iterdir()} != names
                      or set(subject["native_projections"]) != names):
                  raise ValueError("native_projection_inventory_changed")
              for name, command in expected_projections:
                  expected = subject["native_projections"][name]
                  arguments = [subject["docker"], "run", "--rm", "--network", "none", "--read-only",
                               "--cap-drop", "ALL", "--cap-add", "NET_BIND_SERVICE", "--entrypoint",
                               "/usr/bin/caddy", subject["image_config_id"], *command]
                  if name in ("default-ca.pem", "ca-package-versions.txt"):
                      entrypoint = "/bin/busybox" if name == "default-ca.pem" else "/sbin/apk"
                      arguments = [subject["docker"], "run", "--rm", "--network", "none", "--read-only",
                                   "--cap-drop", "ALL", "--entrypoint", entrypoint, subject["image_config_id"], *command]
                      if (set(expected) != {"image_config_id", "argv", "exit_code", "bytes", "sha256"}
                              or type(expected["exit_code"]) is not int or expected["exit_code"] != 0):
                          raise ValueError("native_CA_projection_result_invalid")
                  if expected["image_config_id"] != subject["image_config_id"] or expected["argv"] != arguments:
                      raise ValueError("native_projection_image_binding_changed")
                  path = projection_directory / name
                  if (path.is_symlink() or not stat.S_ISREG(path.stat().st_mode)
                          or not 0 < path.stat().st_size <= 1048576):
                      raise ValueError("native_projection_file_invalid")
                  observed = path.read_bytes()
                  if {"bytes": len(observed), "sha256": hashlib.sha256(observed).hexdigest()} != {
                          "bytes": expected["bytes"], "sha256": expected["sha256"]}:
                      raise ValueError("native_projection_bytes_changed")
                  if name in ("default-ca.pem", "ca-package-versions.txt") and run(arguments[1:]) != observed:
                      raise ValueError("native_CA_subject_changed")
              sys.path.insert(0, str(root))
              from scripts.ci.prometheus_source_image import REMOVED_CA_DER_SHA256
              ca = (projection_directory / "default-ca.pem").read_bytes()
              if (len(ca) != 178791 or hashlib.sha256(ca).hexdigest()
                      != "5961c0a3c65459931c023e0075c09733f09aea4ca439cb85bc4a08bb4f3f568b"):
                  raise ValueError("native_Alpine_CA_supplier_bytes_unreconciled")
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
              context.load_verify_locations(cadata=ca.decode("ascii"))
              certificates = context.get_ca_certs(binary_form=True)
              if (len(certificates) != 118
                      or REMOVED_CA_DER_SHA256.intersection(hashlib.sha256(value).hexdigest() for value in certificates)):
                  raise ValueError("native_Alpine_removed_CA_present")
              installed = (projection_directory / "ca-package-versions.txt").read_bytes().decode("ascii").splitlines()
              expected_CA_versions = ["ca-certificates 20261020-r0", "ca-certificates-bundle 20261020-r0"]
              if sorted(installed) != expected_CA_versions:
                  raise ValueError("native_Alpine_CA_versions_unreconciled")
              from scripts.ci.check_docker_runtime_dependency_surface import validate_trivy_image_report
              with caddy_ci_phase("REPORT_BINDINGS"):
                  validate_trivy_image_report(subject["image_config_id"], report)
              native = json.loads(report.read_text())
              missing_secrets = 0
              for result in native["Results"]:
                  if "Secrets" in result:
                      secrets = result["Secrets"]
                      if not isinstance(secrets, list) or secrets:
                          raise ValueError("native_Secrets_not_empty_array")
                  else:
                      missing_secrets += 1
              os_rows = [row for row in native["Results"] if row["Class"] == "os-pkgs"]
              caddy_rows = [row for row in native["Results"] if row["Target"] == "usr/bin/caddy" and row["Type"] == "gobinary"]
              if len(caddy_rows) != 1 or not os_rows:
                  raise ValueError("configured_package_target_inventory_missing")
              for result in [*os_rows, *caddy_rows]:
                  packages = result.get("Packages")
                  if not isinstance(packages, list) or not packages:
                      raise ValueError("listed_packages_missing")
                  if not all(isinstance(package, dict) and isinstance(package.get("Name"), str) and package["Name"] and
                      ((package["Name"] == "/opt/go-jose-v3.0.5-patched" and "Version" not in package and result is caddy_rows[0])
                       or (isinstance(package.get("Version"), str) and package["Version"])) for package in packages):
                      raise ValueError("listed_package_identity_incomparable")
              for package_name in ("ca-certificates", "ca-certificates-bundle"):
                  versions = [package["Version"] for result in os_rows for package in result["Packages"]
                              if package["Name"] == package_name]
                  if versions != ["20261020-r0"]:
                      raise ValueError("native_CA_package_inventory_mismatch")
              metadata = {"observed_at_utc": datetime.now(timezone.utc).isoformat(),
                          "subject": subject, "full_report_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
                          "full_scan_native_exit": full_result["exit"], "capture_checks": "completed",
                          "default_CA": {"path": "/etc/ssl/certs/ca-certificates.crt", "bytes": len(ca),
                                         "sha256": hashlib.sha256(ca).hexdigest(), "roots": len(certificates),
                                         "installed_packages": installed, "named_removed_roots_absent": True},
                          "Results_Secrets_fields_absent": missing_secrets,
                          "Secrets_scope": "Present Results fields are empty arrays; absent fields retain native serialization omission, not forced zero.",
                          "claim_boundary": "Next observed local config/image ID, not prior ephemeral image or OCI manifest. Frozen DB precedes the six governed scans; this capture alone does not supply their final acceptance. Full native package/advisory reconciliation remains separate; diagnostic capture does not pass the blocking HC gate."}
              payload = private / "validated-publication"
              payload.mkdir(mode=0o700)
              # Native diagnostics retain their original bytes. The report's omitted
              # Secrets fields remain omitted; this does not manufacture coverage.
              diagnostics = {}
              for name in ("scanner-version.stdout", "scanner-version.stderr", "scan.stdout.private", "scan.stderr.private"):
                  path = private / name
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode) or path.stat().st_size > 1048576:
                      raise ValueError("scanner_diagnostic_bound_or_type")
                  raw = path.read_bytes()
                  for key in ("GH_TOKEN", "GITHUB_TOKEN", "GHCR_READ_TOKEN", "DEVPI_CI_PASSWORD"):
                      known = os.environ.get(key)
                      if known and known.encode() in raw:
                          raise ValueError("scanner_diagnostic_credential_reflection")
                  diagnostics[name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
                  os.rename(path, payload / name)
              metadata["native_diagnostics"] = diagnostics
              (payload / "observation.json").write_text(json.dumps(metadata, indent=2))
              os.rename(report, payload / "full.raw.json")
              os.rename(projection_directory, payload / "native-projections")
              evidence = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True) / "caddy-contract"
              if evidence.is_symlink() or not evidence.is_dir():
                  raise ValueError("existing_evidence_directory_invalid")
              destination = evidence / "full-observation"
              if destination.exists() or destination.is_symlink():
                  raise ValueError("publication_destination_not_fresh")
              # Final operation: only fully checked raw/metadata enter always-upload.
              os.rename(payload, destination)
          except Exception as error:
              print("Caddy full-scan publication rejected: " + type(error).__name__)
              raise SystemExit(1)
          PY

      - name: Decide source-qualified Caddy inventory and current native controls
        id: caddy-source-decision
        if: ${{ (steps.caddy-build.outcome == 'success' || steps.caddy-import.outcome == 'success') && steps.caddy-full-publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import time
          from scripts.ci.check_docker_runtime_dependency_surface import (
              observe_caddy_ci_runtime, validate_caddy_ci_report, validate_caddy_policy_projection,
              validate_caddy_control_reports, caddy_ci_phase, caddy_ci_source_inventory,
          )

          work = Path(os.environ["RUNNER_TEMP"])
          evidence = work / "caddy-contract"
          state_path = Path(os.environ["CADDY_OBSERVATION_STATE"])
          subject = json.loads(state_path.read_bytes())
          private = state_path.parent
          observation = json.loads((evidence / "full-observation/observation.json").read_bytes())
          image = subject["image_config_id"]
          raw = evidence / "full-observation/full.raw.json"
          binary = (evidence / "full-observation/native-projections/build-info.txt").read_bytes()
          admission = json.loads((work / "caddy-admission/admission.json").read_bytes())
          with caddy_ci_phase("REPORT_BINDINGS"):
              decision = validate_caddy_ci_report(image, raw, binary_metadata=binary,
                  source_evidence=Path(subject["build_evidence"]), binary_sha256=subject["binary_sha256"],
                  recipe=Path("frontend/Dockerfile.caddy-spa").read_bytes(), native_exit=observation["full_scan_native_exit"],
                  expected_report_sha256=observation["full_report_sha256"])
              controls = subject["controls"]
              if controls["failure"] is not None or controls.get("container_cleanup") is not True:
                  raise ValueError("Caddy current native control execution incomplete")
              decision["controls"] = validate_caddy_control_reports(json.loads(raw.read_bytes()), controls, private / "controls")
          runtime_dir = evidence / "loaded-runtime"
          runtime_dir.mkdir(mode=0o700)
          with caddy_ci_phase("RUNTIME"):
              loaded = observe_caddy_ci_runtime(image, runtime_dir)
          (runtime_dir / "observation.json").write_text(json.dumps(loaded, indent=2))
          output = evidence / "strict-control.raw.json"
          argv = [subject["scanner"], "convert", "--quiet", "--format", "json", "--ignore-policy",
                  str(Path("trivy/ignore-policy.rego").resolve(strict=True)), "--ignorefile", str(private / "empty.trivyignore"), str(raw)]
          with caddy_ci_phase("CONVERSION") as remaining:
              with output.open("xb") as stdout, (evidence / "strict-control.stderr").open("xb") as stderr:
                  result = subprocess.run(argv, env=subject["clean_env"], stdout=stdout, stderr=stderr, timeout=remaining(60), check=False)
              if result.returncode != 0:
                  raise ValueError("Caddy native strict conversion failed")
          with caddy_ci_phase("REPORT_BINDINGS"):
              validate_caddy_policy_projection(image, raw, output)
          decision["strict_conversion"] = {"native_exit": result.returncode, "sha256": hashlib.sha256(output.read_bytes()).hexdigest()}
          with caddy_ci_phase("PROCESSING") as remaining:
              if caddy_ci_source_inventory(Path.cwd(), list(admission["inputs"])) != admission["inputs"]:
                  raise ValueError("Caddy complete source changed before release")
              for name, expected in subject["frozen_db"].items():
                  remaining(1)
                  path = Path(subject["cache"]) / name
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""):
                          remaining(1)
                          digest.update(chunk)
                  if path.is_symlink() or {"bytes": path.stat().st_size, "sha256": digest.hexdigest()} != expected:
                      raise ValueError("Caddy control epoch drift before release")
              if hashlib.sha256(Path(subject["scanner"]).read_bytes()).hexdigest() != subject["scanner_sha256"]:
                  raise ValueError("Caddy scanner changed before release")
          with caddy_ci_phase("ADMISSION") as remaining:
              from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_api
              pr = caddy_ci_api(Path.cwd(), private / "final-api", "/pulls/2494", remaining,
                                admission["inputs"]["scripts/ci/prometheus_source_image.py"]["sha256"])
              if (pr["number"] != 2494 or pr["head"]["repo"]["id"] != 1043311030 or
                      (os.environ["GITHUB_EVENT_NAME"] != "push" and (pr["state"] != "open" or pr["head"]["sha"] != admission["current_head"])) or
                      (os.environ["GITHUB_EVENT_NAME"] == "push" and (pr["merged"] is not True or pr["merge_commit_sha"] != admission["current_head"]))):
                  raise ValueError("Caddy current authenticated PR source changed")
          # Only positively owned control image is removed; candidate and official survive.
          with caddy_ci_phase("CONTROL_CLEANUP") as remaining:
              tag = controls["child_tag"]
              child = json.loads(subprocess.check_output([subject["docker"], "image", "inspect", tag], timeout=remaining(60)))[0]
              if (child["Id"] != controls["subjects"]["secret"] or child["RepoTags"] != [tag]
                      or child["RootFS"]["Layers"] != controls["child_layers"]):
                  raise ValueError("Caddy owned secret image changed before cleanup")
              subprocess.run([subject["docker"], "image", "rm", tag], check=True, capture_output=True, timeout=remaining(60))
              remaining_controls = subprocess.check_output([subject["docker"], "ps", "--all", "--filter",
                  "label=pulseplate.caddy-control=" + tag.split(":", 1)[1], "--format", "{{.ID}}"], timeout=remaining(20))
              if remaining_controls.strip():
                  raise ValueError("Caddy control containers remain")
              controls["cleanup"] = True
              state_path.write_text(json.dumps(subject, sort_keys=True))
          decision["runtime_observation_sha256"] = hashlib.sha256((runtime_dir / "observation.json").read_bytes()).hexdigest()
          decision["current_head"] = admission["current_head"]
          decision["policy_sha256"] = hashlib.sha256(Path("trivy/ignore-policy.rego").read_bytes()).hexdigest()
          (evidence / "source-decision.json").write_text(json.dumps(decision, indent=2))
          with caddy_ci_phase("PROCESSING") as remaining:
              destination = evidence / "build-evidence"
              destination.mkdir(mode=0o700)
              for name, expected in decision["source"]["members"].items():
                  remaining(1)
                  value = (Path(subject["build_evidence"]) / name).read_bytes()
                  if hashlib.sha256(value).hexdigest() != expected:
                      raise ValueError("Caddy source evidence changed before retention")
                  (destination / name).write_bytes(value)
          (private / "controls/native-controls.json").write_text(json.dumps(controls, indent=2))
          # Current native validation above authorizes only privacy-safe retained reports.
          # Raw secret-bearing/unclassified failures remain private; no report is rewritten.
          for source in (private / "controls").iterdir():
              if source.name.endswith(".raw.json") or source.name == "native-controls.json":
                  destination = evidence / "controls" / source.name
                  destination.parent.mkdir(exist_ok=True)
                  if source.is_symlink() or not source.is_file() or destination.exists():
                      raise ValueError("Caddy control retention path")
                  os.rename(source, destination)
          with caddy_ci_phase("RETENTION") as remaining:
              if admission["mode"] == "build":
                  private_candidate = private / "candidate"
                  for name in ("candidate.json", "candidate.docker.tar"):
                      member = private_candidate / name
                      if member.is_symlink() or not stat.S_ISREG(member.stat().st_mode) or member.stat().st_nlink != 1:
                          raise ValueError("Caddy private candidate member changed type")
                  record = json.loads((private_candidate / "candidate.json").read_bytes())
                  archive = private_candidate / "candidate.docker.tar"
                  digest = hashlib.sha256()
                  with archive.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""):
                          remaining(1)
                          digest.update(chunk)
                  if (archive.is_symlink() or archive.stat().st_size != record["archive_bytes"]
                          or digest.hexdigest() != record["archive_sha256"]
                          or record["image_config_id"] != image or record["binary_sha256"] != subject["binary_sha256"]
                          or record["inputs"] != admission["inputs"]
                          or (record["producer_run_id"], record["producer_run_attempt"], record["producer_head"]) !=
                             (admission["current_run_id"], admission["current_run_attempt"], admission["current_head"])):
                      raise ValueError("Caddy retained archive or producer binding changed before release")
                  record.update(source_correction="CVE-2026-116587", v3_scanner_comparability="UNKNOWN",
                                source_decision_sha256=hashlib.sha256((evidence / "source-decision.json").read_bytes()).hexdigest())
                  (private_candidate / "candidate.json").write_text(json.dumps(record, indent=2))
                  for name in ("candidate.docker.tar", "candidate.json"):
                      source = private_candidate / name
                      if source.is_symlink() or not stat.S_ISREG(source.stat().st_mode) or (evidence / name).exists():
                          raise ValueError("Caddy source-qualified publication path invalid")
                  remaining(1)
                  for name in ("candidate.docker.tar", "candidate.json"):
                      os.rename(private_candidate / name, evidence / name)
          print("Caddy source correction is CVE-2026-116587-specific; native controls observed; Trivy v3 comparability UNKNOWN")
          PY

      - name: Clean unpublished Caddy control image on failure
        if: ${{ always() && steps.caddy-image.outcome == 'success' && steps.caddy-source-decision.outcome != 'success' }}
        env:
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_phase
          path = Path(os.environ["CADDY_OBSERVATION_STATE"])
          subject = json.loads(path.read_bytes())
          control = subject.get("controls", {})
          if control.get("child_tag") and not control.get("cleanup"):
              with caddy_ci_phase("CONTROL_CLEANUP") as remaining:
                  tag = control["child_tag"]
                  result = subprocess.run([subject["docker"], "image", "inspect", tag], capture_output=True, timeout=remaining(60), check=True)
                  image = json.loads(result.stdout)[0]
                  if (image["RepoTags"] != [tag] or image["Config"]["Labels"].get("pulseplate.caddy-control") != control["owner"]
                          or image["RootFS"]["Layers"][:-1] != control["parent_layers"]):
                      raise ValueError("Caddy failure cleanup ownership")
                  subprocess.run([subject["docker"], "image", "rm", tag], capture_output=True, timeout=remaining(60), check=True)
                  control["cleanup"] = True
                  path.write_text(json.dumps(subject, sort_keys=True))
          PY

      - name: Charge Upload Caddy contract evidence budget
        id: caddy-upload-budget
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') && (always()) }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_charge_action
          caddy_ci_charge_action("UPLOAD")
          PY

      - name: Upload Caddy contract evidence
        timeout-minutes: ${{ fromJSON(env.CADDY_ACTION_UPLOAD_MINUTES) }}
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') && (always()) && steps.caddy-upload-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: caddy-contract-evidence
          path: ${{ runner.temp }}/caddy-contract
          if-no-files-found: warn
          retention-days: 30
