          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import time
          import uuid
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_phase

          state_path = Path(os.environ["CADDY_OBSERVATION_STATE"])
