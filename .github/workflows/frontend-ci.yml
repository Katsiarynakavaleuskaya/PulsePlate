          import subprocess

          work = Path(os.environ["RUNNER_TEMP"])
          state = json.loads((work / "caddy-admission/admission.json").read_bytes())
          retained = work / "caddy-original-producer"
          manifest = retained / "candidate.json"
          archive = retained / "candidate.docker.tar"
          for path in (manifest, archive):
              if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode) or path.stat().st_size == 0:
                  raise ValueError("Caddy retained candidate file unavailable")
          original = json.loads(manifest.read_bytes())
          expected = state["producer"]
          if (original["producer_run_id"], original["producer_run_attempt"], original["producer_head"], original["inputs"]) != (
                  expected["run_id"], expected["run_attempt"], expected["head"], expected["git_inputs"]):
              raise ValueError("Caddy original producer/current input identity differs")
          if expected["git_inputs"] != state["inputs"]:
              raise ValueError("Caddy original producer/current input identity differs")
          hash_value = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1048576), b""):
                  hash_value.update(chunk)
          if hash_value.hexdigest() != original["archive_sha256"] or archive.stat().st_size != original["archive_bytes"]:
              raise ValueError("Caddy retained docker archive differs")
          docker = shutil.which("docker")
          if docker is None:
              raise ValueError("docker unavailable")
          subprocess.run([docker, "load", "--input", str(archive)], check=True, timeout=300)
          inspected = json.loads(subprocess.check_output([docker, "image", "inspect", "pulseplate-caddy:contract"], timeout=60))[0]
          if (inspected["Id"], inspected["Os"], inspected["Architecture"]) != (original["image_config_id"], "linux", "amd64"):
              raise ValueError("Caddy imported image/config/platform differs")
          binary = subprocess.check_output([docker, "run", "--rm", "--pull", "never", "--network", "none", "--read-only", "--cap-drop", "ALL",
              "--entrypoint", "/bin/busybox", inspected["Id"], "sha256sum", "/usr/bin/caddy"], timeout=60).decode()
          if binary != original["binary_sha256"] + "  /usr/bin/caddy\n":
              raise ValueError("Caddy imported binary differs")
          state["original_candidate"] = original
          (work / "caddy-admission/admission.json").write_text(json.dumps(state, indent=2))
          PY

      # xnet060-metadata is the retained compatibility identifier for the current fixed recipe.
      - name: Admit explicit first Caddy metadata invocation
        if: ${{ steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Katsiarynakavaleuskaya/PulsePlate'
          test "$GITHUB_REPOSITORY_ID" = '1043311030'
          test "$GITHUB_RUN_ATTEMPT" = '1'

      - name: Install pinned compiler metadata scanner and DB
        if: ${{ steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        with:
          version: v0.74.0
          image-ref: golang:1.26.10-alpine3.23@sha256:0525c952defebc693cdaf62cdf43afa32be5a7f377e99260642ea19c240c708e
          format: table
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          cache-dir: /tmp/trivy-cache-caddy-metadata

      - name: Qualify Caddy compiler and two counterfactual v4 derivations
        id: caddy-metadata
        if: ${{ steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import stat
          import time
          import urllib.request
          from scripts.ci.prometheus_source_image import Native, fresh_directory, tree_inventory, canonical_data, require

          require(os.environ.get("GITHUB_ACTIONS") == "true" and platform.system() == "Linux"
                  and platform.machine() == "x86_64" and os.environ["GITHUB_REPOSITORY"] == "Katsiarynakavaleuskaya/PulsePlate"
                  and os.environ["GITHUB_RUN_ATTEMPT"] == "1", "caddy_metadata_admission")
          root = Path.cwd()
          work = Path(os.environ["RUNNER_TEMP"]) / "caddy-xnet060-metadata"
          fresh_directory(work)
          evidence = work / "evidence"
          fresh_directory(evidence)
          deadline = time.monotonic() + int(os.environ["CADDY_METADATA_TIMEOUT_SECONDS"])
          native = Native(evidence, deadline, int(os.environ["CADDY_METADATA_CLEANUP_SECONDS"]))
          docker = shutil.which("docker")
          require(docker is not None and Path(docker).is_absolute(), "caddy_metadata_docker")
          config = work / "docker-config"
          fresh_directory(config)
          environment = {"PATH": "/usr/bin:/bin", "HOME": str(work), "DOCKER_CONFIG": str(config), "LANG": "C.UTF-8"}
          compiler = "golang:1.26.10-alpine3.23@sha256:0525c952defebc693cdaf62cdf43afa32be5a7f377e99260642ea19c240c708e"
          recipe = (root / "frontend/Dockerfile.caddy-spa").read_bytes()
          gets = re.findall(rb"^    go get ([^;]+);", recipe, re.MULTILINE)
          baseline_gets = [b"github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4", b"google.golang.org/grpc@v1.83.2", b"golang.org/x/crypto@v0.55.0", b"golang.org/x/net@v0.60.0", b"github.com/klauspost/compress@v1.18.7"]
          require(gets == baseline_gets + [b"github.com/go-jose/go-jose/v4@v4.1.6"], "caddy_selected_six_gets")
          report = {"purpose": "Counterfactual recipe baselines, not recovered historical ephemeral locks or a compiled candidate",
                    "compiler_index": compiler, "recipe_sha256": hashlib.sha256(recipe).hexdigest(),
                    "counterfactual_seed_gets": [value.decode() for value in baseline_gets],
                    "selected_recipe_gets": [value.decode() for value in gets],
                    "authored_action": "github.com/go-jose/go-jose/v4@v4.1.6",
                    "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": 1,
                    "source_head": json.loads((Path(os.environ["RUNNER_TEMP"]) / "caddy-admission/admission.json").read_bytes())["current_head"], "go_build_invocations": 0,
                    "failure": None, "derivations": {}, "closure_admission": "exact authored v4 action only; additional solver closure is HOLD"}
          owned = []
          try:
              raw = native.run([docker, "--config", str(config), "buildx", "imagetools", "inspect", "--raw", compiler], "compiler-index", environment, cwd=work)
              require(hashlib.sha256(raw).hexdigest() == compiler.split("sha256:")[1], "compiler_raw_index_digest")
              index = json.loads(raw)
              targets = [row for row in index["manifests"] if row.get("platform") == {"architecture": "amd64", "os": "linux"}]
              require(len(targets) == 1 and re.fullmatch(r"sha256:[0-9a-f]{64}", targets[0]["digest"]) is not None, "compiler_exact_platform")
              selected = "golang@" + targets[0]["digest"]
              native.run([docker, "--config", str(config), "pull", "--platform", "linux/amd64", selected], "compiler-pull", environment, cwd=work)
              observed = json.loads(native.run([docker, "--config", str(config), "image", "inspect", selected], "compiler-config", environment, cwd=work))[0]
              require((observed["Os"], observed["Architecture"]) == ("linux", "amd64"), "compiler_native_platform")
              platform_raw = native.run([docker, "--config", str(config), "buildx", "imagetools", "inspect", "--raw", selected], "compiler-platform-raw", environment, cwd=work)
              require("sha256:" + hashlib.sha256(platform_raw).hexdigest() == targets[0]["digest"]
                      and json.loads(platform_raw)["config"]["digest"] == observed["Id"], "compiler_platform_config_binding")
              report["compiler_platform"] = targets[0]
              report["compiler_config"] = observed
              version_name = "pulseplate-caddy-compiler-version-" + os.environ["GITHUB_RUN_ID"]
              owned.append(version_name)
              go_version = native.run([docker, "--config", str(config), "run", "--rm", "--pull", "never", "--name", version_name,
                  "--label", "pulseplate.caddy-metadata=" + os.environ["GITHUB_RUN_ID"],
                  "--user", "65532:65532", "--network", "none", "--read-only", "--cap-drop", "ALL",
                  "--security-opt", "no-new-privileges", "--cpus", "2", "--memory", "2g", "--pids-limit", "128",
                  "--env", "GOTOOLCHAIN=local", "--env", "GOENV=off", "--env", "GOWORK=off",
                  "--entrypoint", "/usr/local/go/bin/go", observed["Id"], "version"], "compiler-native-version", environment, cwd=work)
              require(go_version == b"go version go1.26.10 linux/amd64\n", "compiler_native_version")
              report["compiler_go_version_sha256"] = hashlib.sha256(go_version).hexdigest()
              scanner = shutil.which("trivy")
              require(scanner is not None and Path(scanner).is_absolute(), "compiler_native_scanner_missing")
              version = native.run([scanner, "--version"], "compiler-scanner-version", environment, cwd=work)
              require(re.search(rb"^Version: 0\.74\.0$", version, re.MULTILINE) is not None, "compiler_pinned_scanner_version")
              cache = Path("/tmp/trivy-cache-caddy-metadata")
              db = {name: {"bytes": (cache / name).stat().st_size,
                           "sha256": hashlib.sha256((cache / name).read_bytes()).hexdigest()}
                    for name in ("db/trivy.db", "db/metadata.json")}
              empty_config, empty_ignore = work / "empty-trivy.yaml", work / "empty.trivyignore"
              empty_config.write_bytes(b"{}\n")
              empty_ignore.write_bytes(b"")
              scan = evidence / "compiler-full.raw.json"
              native.run([scanner, "image", "--config", str(empty_config), "--cache-dir", str(cache),
                          "--skip-db-update", "--skip-java-db-update", "--skip-vex-repo-update", "--offline-scan",
                          "--skip-version-check", "--disable-telemetry", "--image-src", "docker", "--platform", "linux/amd64",
                          "--scanners", "vuln,secret", "--pkg-types", "os,library", "--list-all-pkgs",
                          "--severity", "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL", "--format", "json", "--exit-code", "0",
                          "--ignore-unfixed=false", "--ignorefile", str(empty_ignore), "--timeout", "300s",
                          "--output", str(scan), observed["Id"]], "compiler-full-scan", environment, cwd=work)
              from scripts.ci.check_docker_runtime_dependency_surface import validate_trivy_image_report
              validate_trivy_image_report(observed["Id"], scan)
              full = json.loads(scan.read_bytes())
              require(all("Secrets" not in row or (type(row["Secrets"]) is list and not row["Secrets"])
                          for row in full["Results"]), "compiler_secret_HOLD")
              require(all(finding.get("Severity") not in ("HIGH", "CRITICAL") for row in full["Results"]
                          for finding in row.get("Vulnerabilities", [])), "compiler_native_HC_HOLD")
              require({name: {"bytes": (cache / name).stat().st_size,
                              "sha256": hashlib.sha256((cache / name).read_bytes()).hexdigest()} for name in db} == db,
                      "compiler_scanner_DB_changed")
              report["compiler_scan"] = {"report_sha256": hashlib.sha256(scan.read_bytes()).hexdigest(),
                  "scanner_sha256": hashlib.sha256(Path(scanner).read_bytes()).hexdigest(), "DB": db,
                  "Secrets_fields_absent": sum("Secrets" not in row for row in full["Results"]),
                  "boundary": "Native vuln,secret command and listed inventory; omitted Secrets fields are not a forced zero claim"}
              # Historical signed Alpine acquisitions remain at their original proof identity.
              # This transition changes only go-jose/v4; do not reacquire old cutoff inputs.
              for label in ("a", "b"):
                  lane = work / label
                  fresh_directory(lane)
                  for name in ("work", "modules", "home", "cache", "tmp", "output"):
                      fresh_directory(lane / name, 0o777)
                      (lane / name).chmod(0o777)
                  name = "pulseplate-caddy-metadata-" + os.environ["GITHUB_RUN_ID"] + "-" + label
                  argv = [docker, "--config", str(config), "create", "--pull", "never", "--name", name,
                          "--label", "pulseplate.caddy-metadata=" + os.environ["GITHUB_RUN_ID"],
                          "--user", "65532:65532", "--workdir", "/work", "--read-only", "--cap-drop", "ALL",
                          "--security-opt", "no-new-privileges", "--cpus", "2", "--memory", "2g", "--pids-limit", "128"]
                  for directory in ("work", "modules", "home", "cache", "tmp", "output"):
                      argv += ["--mount", f"type=bind,source={lane / directory},target=/{directory}"]
                  for key, value in {"PATH": "/usr/local/go/bin:/usr/bin:/bin", "HOME": "/home", "TMPDIR": "/tmp",
                                     "GOCACHE": "/cache", "GOMODCACHE": "/modules", "GOPATH": "/home/gopath",
                                     "GOOS": "linux", "GOARCH": "amd64", "CGO_ENABLED": "0", "GOTOOLCHAIN": "local",
                                     "GOWORK": "off", "GOENV": "off", "GOPROXY": "https://proxy.golang.org",
                                     "GOSUMDB": "sum.golang.org", "GOMAXPROCS": "2"}.items():
                      argv += ["--env", key + "=" + value]
                  # The same fixed guest paths and canonical phases are used in both fresh lanes.
                  script = '''set -eu
          go version > /output/compiler-version.txt
          test "$(cat /output/compiler-version.txt)" = "go version go1.26.10 linux/amd64"
          cat /etc/alpine-release > /output/alpine-release.txt
          go mod init pulseplate.local/caddy-build
          go get github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
          go get google.golang.org/grpc@v1.83.2
          go get golang.org/x/crypto@v0.55.0
          go get golang.org/x/net@v0.60.0
          go get github.com/klauspost/compress@v1.18.7
          go mod download all
          go mod verify > /output/baseline-verify.txt
          cp go.mod /output/baseline-go.mod
          cp go.sum /output/baseline-go.sum
          go list -mod=readonly -m -json all > /output/baseline-modules.json
          go mod graph > /output/baseline-module-graph.txt
          go list -mod=readonly -deps -json github.com/caddyserver/caddy/v2/cmd/caddy > /output/baseline-packages.json
          cmp go.mod /output/baseline-go.mod
          cmp go.sum /output/baseline-go.sum
          go get github.com/go-jose/go-jose/v4@v4.1.6
          cp go.mod /output/post-get-go.mod
          cp go.sum /output/post-get-go.sum
          go mod download all
          go mod verify > /output/final-verify.txt
          cp go.mod /output/final-go.mod
          cp go.sum /output/final-go.sum
          export GOPROXY=off GOSUMDB=off GOFLAGS=-mod=readonly
          go list -mod=readonly -m -json all > /output/final-modules.json
          go mod graph > /output/final-module-graph.txt
          go list -mod=readonly -deps -json github.com/caddyserver/caddy/v2/cmd/caddy > /output/final-packages.json
          cmp go.mod /output/final-go.mod
          cmp go.sum /output/final-go.sum
          '''
                  owned.append(name)
                  native.run(argv + ["--entrypoint", "/bin/sh", observed["Id"], "-c", script], label + "-create", environment, cwd=work)
                  native.run([docker, "--config", str(config), "start", "--attach", name], label + "-native", environment, cwd=work)
                  terminal = json.loads(native.run([docker, "--config", str(config), "inspect", name], label + "-terminal", environment, cwd=work))[0]
                  require(terminal["State"]["ExitCode"] == 0 and terminal["State"]["OOMKilled"] is False, "caddy_metadata_native_terminal")
                  require(terminal["Config"]["Labels"].get("pulseplate.caddy-metadata") == os.environ["GITHUB_RUN_ID"], "caddy_metadata_owned_identity")
                  output = lane / "output"
                  for phase in ("baseline", "final"):
                      from scripts.ci.prometheus_source_image import decode_selected_modules, decode_objects
                      modules = decode_selected_modules((output / (phase + "-modules.json")).read_bytes(), root_module="pulseplate.local/caddy-build")
                      require(all("Replace" not in row for row in modules.values()), "caddy_no_module_replacement")
                      packages = decode_objects((output / (phase + "-packages.json")).read_bytes())
                      require(all(not row.get("Error") and not row.get("DepsErrors") and not row.get("Incomplete") for row in packages), "caddy_metadata_package_errors")
                      indexed = {row["ImportPath"]: row for row in packages}
                      require(len(indexed) == len(packages) and "github.com/caddyserver/caddy/v2/cmd/caddy" in indexed
                              and indexed["github.com/caddyserver/caddy/v2/cmd/caddy"].get("Name") == "main", "caddy_complete_command_identity")
                      for row in packages:
                          mapping = row.get("ImportMap", {})
                          require(all(mapping.get(path, path) in indexed for path in row.get("Imports", [])), "caddy_complete_native_import_graph")
                      require(modules["github.com/caddyserver/caddy/v2"]["Version"] == "v2.11.4", "caddy_preserved_source_version")
                      report["derivations"].setdefault(label, {})[phase] = {"modules": modules, "packages": len(packages)}
                  before, after = report["derivations"][label]["baseline"]["modules"], report["derivations"][label]["final"]["modules"]
                  target = "github.com/go-jose/go-jose/v4"
                  require(before[target]["Version"] == "v4.1.4" and after[target]["Version"] == "v4.1.6"
                          and after[target]["Sum"] == "h1:sNRkftxFJxwsILiQukqp5z83QBSmntVwmgRY7AqBDO4=", "caddy_exact_authored_v4_transition")
                  delta = [{"path": path, "before": before.get(path), "after": after.get(path),
                            "class": "I_R" if path == target else "C_R_candidate"}
                           for path in sorted(set(before) | set(after)) if before.get(path) != after.get(path)]
                  require([row["path"] for row in delta] == [target], "caddy_unexpected_solver_closure_HOLD")
                  (output / "complete-delta.json").write_bytes(canonical_data(delta))
                  patch = "".join("".join(difflib.unified_diff((output / ("baseline-" + name)).read_text().splitlines(True), (output / ("final-" + name)).read_text().splitlines(True), fromfile="a/" + name, tofile="b/" + name)) for name in ("go.mod", "go.sum"))
                  (output / "module-derivation.patch").write_text(patch)
                  report["derivations"][label]["native_terminal"] = terminal
                  report["derivations"][label]["output_inventory"] = tree_inventory(output)
              left, right = work / "a/output", work / "b/output"
              require(tree_inventory(left) == tree_inventory(right), "caddy_independent_raw_output_equality")
              report["status"] = "observed_counterfactual_metadata_only"
          except BaseException as error:
              report["failure"] = type(error).__name__
              raise
          finally:
              native.begin_cleanup()
              inventory = native.run([docker, "--config", str(config), "ps", "--all", "--format", "{{.Names}}"], "cleanup-inventory", environment, cwd=work, cleaning=True).decode().splitlines()
              for name in owned:
                  if name not in inventory:
                      continue
                  actual = json.loads(native.run([docker, "--config", str(config), "inspect", name], name + "-cleanup-inspect", environment, cwd=work, cleaning=True))[0]
                  require(actual["Config"]["Labels"].get("pulseplate.caddy-metadata") == os.environ["GITHUB_RUN_ID"], "caddy_cleanup_ownership")
                  native.run([docker, "--config", str(config), "rm", "--force", name], name + "-cleanup", environment, cwd=work, cleaning=True)
              remaining = native.run([docker, "--config", str(config), "ps", "--all", "--format", "{{.Names}}"], "cleanup-absence", environment, cwd=work, cleaning=True).decode().splitlines()
              require(not set(owned).intersection(remaining), "caddy_metadata_owned_container_survives")
              report["native_commands"] = native.records
              (evidence / "qualification.json").write_bytes(canonical_data(report))
          PY

      - name: Upload counterfactual Caddy metadata
        if: ${{ always() && (steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: caddy-xnet060-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/caddy-xnet060-metadata/evidence
            ${{ runner.temp }}/caddy-xnet060-metadata/a/output
            ${{ runner.temp }}/caddy-xnet060-metadata/b/output
          if-no-files-found: error
          retention-days: 30

      - name: Recheck accepted Caddy dates immediately before build
        id: caddy-build-window
        if: ${{ steps.caddy-admission.outputs.mode == 'build' && steps.caddy-metadata.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.ci.check_docker_runtime_dependency_surface import validate_caddy_ci_window
          validate_caddy_ci_window(Path("trivy/ignore-policy-caddy-go-jose-v3.rego"), today=datetime.now(timezone.utc).date())
          PY

      - name: Build accepted D Caddy candidate once
        if: ${{ steps.caddy-admission.outputs.mode == 'build' && steps.caddy-metadata.outcome == 'success' && steps.caddy-build-window.outcome == 'success' }}
        id: caddy-build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.caddy-spa
          platforms: linux/amd64
          load: true
          push: false
          tags: pulseplate-caddy:contract
          cache-from: type=gha,scope=frontend-caddy-contract
          cache-to: type=gha,scope=frontend-caddy-contract,mode=min,ignore-error=true

      - name: Capture next loaded Caddy image identity
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') }}
        id: caddy-image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          import tempfile

          try:
              root = Path.cwd().resolve(strict=True)
              docker = shutil.which("docker")
              if docker is None or not Path(docker).is_absolute():
                  raise ValueError("docker_unavailable")

              def run(arguments):
                  result = subprocess.run([docker, *arguments], capture_output=True, timeout=60, check=False)
                  if result.returncode or len(result.stdout) > 1048576:
                      raise ValueError("native_image_observation_failed")
                  return result.stdout

              inspected = json.loads(run(["image", "inspect", "--format", "{{json .}}", "pulseplate-caddy:contract"]))
              image = inspected["Id"]
              if re.fullmatch(r"sha256:[0-9a-f]{64}", image) is None:
                  raise ValueError("image_config_id_invalid")
              if (inspected.get("Os"), inspected.get("Architecture")) != ("linux", "amd64"):
                  raise ValueError("image_platform_invalid")
              binary = run(["run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                            "--entrypoint", "/bin/busybox", image, "sha256sum", "/usr/bin/caddy"]).decode("ascii")
              if re.fullmatch(r"[0-9a-f]{64}  /usr/bin/caddy\n", binary) is None:
                  raise ValueError("binary_identity_invalid")
              # This literal measured source set describes the observed recipe epoch;
              # it does not prove all upstream inputs or a prior ephemeral image equal.
              paths = ("frontend/Dockerfile.caddy-spa", "frontend/package.json", "frontend/package-lock.json",
                       "frontend/.dockerignore", ".github/workflows/frontend-ci.yml",
                       "deploy/Caddyfile", "deploy/Caddyfile.production",
                       "scripts/ci/check_docker_runtime_dependency_surface.py",
                       "scripts/ci/prometheus_source_image.py")
              sources = {}
              for name in paths:
                  path = root / name
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode):
                      raise ValueError("source_identity_invalid")
                  sources[name] = {"bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
              private = Path(tempfile.mkdtemp(prefix="caddy-full-private-", dir=Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)))
              private.chmod(0o700)
              projection_directory = private / "native-projections"
              projection_directory.mkdir(mode=0o700)
              projections = {}
              for name, command in (("version.txt", ("version",)),
                                    ("build-info.txt", ("build-info",)),
                                    ("rebuilt-modules.txt", ("list-modules", "--packages"))):
                  arguments = ["run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                               "--cap-add", "NET_BIND_SERVICE", "--entrypoint", "/usr/bin/caddy", image, *command]
                  observed = run(arguments)
                  if not observed:
                      raise ValueError("native_projection_empty")
                  # run() requires native success and at most 1MiB stdout before retention.
                  # This is a retained-output bound, not a live host-process byte ceiling.
                  path = projection_directory / name
                  with path.open("xb") as output:
                      output.write(observed)
                  path.chmod(0o600)
                  projections[name] = {"image_config_id": image, "argv": [docker, *arguments],
                                       "bytes": len(observed), "sha256": hashlib.sha256(observed).hexdigest()}
              for name, entrypoint, command in (
                      ("default-ca.pem", "/bin/busybox", ("cat", "/etc/ssl/certs/ca-certificates.crt")),
                      ("ca-package-versions.txt", "/sbin/apk", ("list", "--installed", "--manifest", "ca-certificates", "ca-certificates-bundle"))):
                  arguments = ["run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                               "--entrypoint", entrypoint, image, *command]
                  observed = run(arguments)
                  if not observed:
                      raise ValueError("native_CA_projection_empty")
                  path = projection_directory / name
                  with path.open("xb") as output:
                      output.write(observed)
                  path.chmod(0o600)
                  projections[name] = {"image_config_id": image, "argv": [docker, *arguments],
                                       "exit_code": 0, "bytes": len(observed),
                                       "sha256": hashlib.sha256(observed).hexdigest()}
              state = private / "subject.json"
              state.write_text(json.dumps({"image_config_id": image, "platform": "linux/amd64",
                                           "binary_sha256": binary.split()[0], "sources": sources,
                                           "native_projections": projections,
                                           "root": str(root), "docker": docker,
                                           "observed_at_utc": datetime.now(timezone.utc).isoformat()}, sort_keys=True))
              state.chmod(0o600)
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write(f"image_id={image}\nstate={state}\n")
          except Exception as error:
              print("Caddy subject capture failed: " + type(error).__name__)
              raise SystemExit(1)
          PY

      - name: Retain original Caddy candidate or current import binding
        id: caddy-retain
        if: ${{ (steps.caddy-build.outcome == 'success' || steps.caddy-import.outcome == 'success') && steps.caddy-image.outcome == 'success' }}
        env:
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          work = Path(os.environ["RUNNER_TEMP"])
          admission = json.loads((work / "caddy-admission/admission.json").read_bytes())
          subject = json.loads(Path(os.environ["CADDY_OBSERVATION_STATE"]).read_bytes())
          evidence = work / "caddy-contract"
          evidence.mkdir(exist_ok=True)
          (evidence / "admission.json").write_text(json.dumps(admission, indent=2))
          if admission["mode"] == "build":
              metadata_root = work / "caddy-xnet060-metadata"
              qualification = json.loads((metadata_root / "evidence/qualification.json").read_bytes())
              if (qualification["failure"] is not None or qualification["status"] != "observed_counterfactual_metadata_only"
                      or qualification["source_head"] != admission["current_head"] or qualification["go_build_invocations"] != 0):
                  raise ValueError("Caddy build metadata predecessor differs")
              from scripts.ci.prometheus_source_image import decode_objects
              modules = qualification["derivations"]["a"]["final"]["modules"]
              packages = decode_objects((metadata_root / "a/output/final-packages.json").read_bytes())
              command_modules = {package["Module"]["Path"] for package in packages if "Module" in package}
              expected_modules = {name: (modules[name]["Version"], modules[name]["Sum"]) for name in command_modules}
              binary_path = Path(os.environ["CADDY_OBSERVATION_STATE"]).parent / "native-projections/build-info.txt"
              rows = [line.split() for line in binary_path.read_text().splitlines()]
              selected_rows = [row for row in rows if row and row[0] in ("mod", "dep")]
              if (any(row and row[0] == "=>" for row in rows)
                      or any(len(row) != 4 for row in selected_rows)
                      or len({row[1] for row in selected_rows}) != len(selected_rows)
                      or {row[1]: (row[2], row[3]) for row in selected_rows} != expected_modules):
                  raise ValueError("Caddy actual binary differs from complete qualified command module/sum projection")
              private_candidate = Path(os.environ["CADDY_OBSERVATION_STATE"]).parent / "candidate"
              private_candidate.mkdir(mode=0o700)
              archive = private_candidate / "candidate.docker.tar"
              if archive.exists():
                  raise ValueError("Caddy export destination not fresh")
              subprocess.run([subject["docker"], "save", "--output", str(archive), "pulseplate-caddy:contract"], check=True, timeout=300)
              digest = hashlib.sha256()
              with archive.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1048576), b""):
                      digest.update(chunk)
              record = {"producer_run_id": admission["current_run_id"], "producer_run_attempt": admission["current_run_attempt"],
                  "producer_head": admission["current_head"], "repository": admission["repository"],
                  "inputs": admission["inputs"], "image_config_id": subject["image_config_id"],
                  "binary_sha256": subject["binary_sha256"], "platform": "linux/amd64",
                  "archive_sha256": digest.hexdigest(), "archive_bytes": archive.stat().st_size,
                  "metadata_qualification_sha256": hashlib.sha256((metadata_root / "evidence/qualification.json").read_bytes()).hexdigest(),
                  "build_action_invocations": 1, "actual_compiler_starts": "inspect original BuildKit raw log; cache is not assumed"}
              (private_candidate / "candidate.json").write_text(json.dumps(record, indent=2))
              for name in ("evidence", "a/output", "b/output"):
                  shutil.copytree(metadata_root / name, evidence / "metadata" / name)
          else:
              original = admission["original_candidate"]
              if (subject["image_config_id"], subject["binary_sha256"]) != (original["image_config_id"], original["binary_sha256"]):
                  raise ValueError("Caddy reused native identity differs")
              # Consumer artifacts retain references, never pretend to be a second producer.
              (evidence / "original-producer.json").write_text(json.dumps(admission["producer"], indent=2))
          PY

      - name: Verify hardened Caddy runtime and module parity
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/caddy-contract"
          mkdir -p "$evidence_dir"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            pulseplate-caddy:contract caddy version | tee "$evidence_dir/version.txt"
          awk 'NR == 1 && $1 == "v2.11.4" { found=1 } END { exit found ? 0 : 1 }' \
            "$evidence_dir/version.txt"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            pulseplate-caddy:contract caddy build-info | tee "$evidence_dir/build-info.txt"
          awk -F '\t' '$1 == "go" && $2 == "go1.26.10" { found=1 } END { exit found ? 0 : 1 }' \
            "$evidence_dir/build-info.txt"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            pulseplate-caddy:contract getcap /usr/bin/caddy | tee "$evidence_dir/capabilities.txt"
          grep -F 'cap_net_bind_service=ep' "$evidence_dir/capabilities.txt"
          official_caddy_ref="$(awk '/^FROM caddy:/ { print $2; exit }' frontend/Dockerfile.caddy-spa)"
          [[ "$official_caddy_ref" =~ ^caddy:2\.11\.4-alpine@sha256:[0-9a-f]{64}$ ]]
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            "$official_caddy_ref" \
            caddy list-modules --packages \
            | awk 'NF && $1 != "Standard" { print $1 }' \
            | LC_ALL=C sort > "$evidence_dir/official-modules.txt"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            pulseplate-caddy:contract caddy list-modules --packages \
            | awk 'NF && $1 != "Standard" { print $1 }' \
            | LC_ALL=C sort > "$evidence_dir/rebuilt-modules.txt"
          diff -u "$evidence_dir/official-modules.txt" "$evidence_dir/rebuilt-modules.txt"

      - name: Validate staging and production Caddyfiles
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') }}
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --tmpfs /data --tmpfs /config \
            -e STAGING_DOMAIN=staging.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            pulseplate-caddy:contract \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --tmpfs /data --tmpfs /config \
            -e PRODUCTION_DOMAIN=example.com \
            -e STAGING_FALLBACK_DOMAIN=staging.example.com \
            -v "$PWD/deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro" \
            pulseplate-caddy:contract \
