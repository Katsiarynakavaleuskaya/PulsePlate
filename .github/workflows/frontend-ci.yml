          authenticate_pr_source(proof_api, 2497, failed_head, pr["head"]["sha"], "refs/heads/" + branch)
          authenticate_pr_source(proof_api, 2497, failed_q_head, pr["head"]["sha"], "refs/heads/" + branch)
          replacements = [row for row in spent if row is not predecessors[0] and row is not q_predecessors[0]]
