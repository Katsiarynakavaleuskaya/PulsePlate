name: Frontend CI

env:
  FRONTEND_NODE_VERSION_FILE: ".nvmrc"
  PYTHON_VERSION: "3.13.14"
  PULSEPLATE_PYTHON_INDEX_URL: ${{ vars.PULSEPLATE_PYTHON_INDEX_URL }}
  PULSEPLATE_PYTHON_TRUSTED_HOST: ${{ vars.PULSEPLATE_PYTHON_TRUSTED_HOST }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && (github.event.action == 'edited' || github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'metadata' || 'material' }}${{ inputs.caddy_action == 'candidate-D' && '-caddy-D-producer' || '' }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, feat/**, fix/**]
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/actions/npm-ci-with-retry/**'
      - 'tokens/**'
      - 'docs/design/TOKENS_SOT.md'
      - 'docs/design/TOKEN_PIPELINE_GOVERNANCE.md'
      - 'docs/runbooks/DESIGN_TOOLING_OPERATING_MODEL.md'
      - 'docs/figma/FIGMA_IMPLEMENTATION_RUNBOOK.md'
      - 'docs/runbooks/FIGMA_MCP_DESIGN_SYSTEM_RULES.md'
      - 'docs/orchestration/IOS_FRONTEND_MULTIAGENT_PLAYBOOK.md'
      - 'docs/roadmap/BACKLOG_LEDGER.md'
      - 'ios/PulsePlate/DesignSystem/DesignTokens.swift'
      - 'ios/PulsePlate/DesignSystem/DesignTokens.generated.swift'
      - 'ios/PulsePlate/Extensions/Color+Assets.swift'
      - 'ios/PulsePlate/Assets.xcassets/Navy.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/AppPrimary.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/AccentGreen.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/HeartRed.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/Gold.colorset/**'
      - 'docs/design/figma-manifest.json'
      - 'Makefile'
      - 'requirements.txt'
      - 'requirements-ci-lite.in'
      - 'requirements-ci-lite.txt'
      - 'constraints.txt'
      - '.github/actions/python-setup/**'
      - 'scripts/ci/install_locked_python_requirements.py'
      - 'scripts/ci/check_python_startup_hooks.py'
      - 'scripts/ci/emergency_python_wheels.json'
      - 'scripts/design_guard.py'
      - 'tests/test_design_token_parity.py'
      - 'tests/test_design_invariant_guard.py'
      - 'tests/test_frontend_raw_hex_guard.py'
      - 'tests/test_python_supply_chain_controls.py'
      - 'deploy/Caddyfile'
      - 'deploy/Caddyfile.production'
      - 'deploy/docker-compose.staging.yaml'
      - 'scripts/deploy.sh'
      - 'scripts/QUICK_FIX_PRODUCTION.sh'
      - 'tests/test_caddy_deploy_provenance.py'
      - 'scripts/ci/check_docker_runtime_dependency_surface.py'
      - 'tests/test_cd_attestation_workflow_contract.py'
      - '.github/workflows/cd.yml'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main, feat/**, fix/**]
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/actions/npm-ci-with-retry/**'
      - 'tokens/**'
      - 'docs/design/TOKENS_SOT.md'
      - 'docs/design/TOKEN_PIPELINE_GOVERNANCE.md'
      - 'docs/runbooks/DESIGN_TOOLING_OPERATING_MODEL.md'
      - 'docs/figma/FIGMA_IMPLEMENTATION_RUNBOOK.md'
      - 'docs/runbooks/FIGMA_MCP_DESIGN_SYSTEM_RULES.md'
      - 'docs/orchestration/IOS_FRONTEND_MULTIAGENT_PLAYBOOK.md'
      - 'docs/roadmap/BACKLOG_LEDGER.md'
      - 'ios/PulsePlate/DesignSystem/DesignTokens.swift'
      - 'ios/PulsePlate/DesignSystem/DesignTokens.generated.swift'
      - 'ios/PulsePlate/Extensions/Color+Assets.swift'
      - 'ios/PulsePlate/Assets.xcassets/Navy.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/AppPrimary.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/AccentGreen.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/HeartRed.colorset/**'
      - 'ios/PulsePlate/Assets.xcassets/Gold.colorset/**'
      - 'docs/design/figma-manifest.json'
      - 'Makefile'
      - 'requirements.txt'
      - 'requirements-ci-lite.in'
      - 'requirements-ci-lite.txt'
      - 'constraints.txt'
      - '.github/actions/python-setup/**'
      - 'scripts/ci/install_locked_python_requirements.py'
      - 'scripts/ci/check_python_startup_hooks.py'
      - 'scripts/ci/emergency_python_wheels.json'
      - 'scripts/design_guard.py'
      - 'tests/test_design_token_parity.py'
      - 'tests/test_design_invariant_guard.py'
      - 'tests/test_frontend_raw_hex_guard.py'
      - 'tests/test_python_supply_chain_controls.py'
      - 'deploy/Caddyfile'
      - 'deploy/Caddyfile.production'
      - 'deploy/docker-compose.staging.yaml'
      - 'scripts/deploy.sh'
      - 'scripts/QUICK_FIX_PRODUCTION.sh'
      - 'tests/test_caddy_deploy_provenance.py'
      - 'scripts/ci/check_docker_runtime_dependency_surface.py'
      - 'tests/test_cd_attestation_workflow_contract.py'
      - '.github/workflows/cd.yml'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:
    inputs:
      caddy_action:
        description: Import a qualified PR2494 candidate, inspect metadata, or explicitly build the patched source
        type: choice
        default: contract
        options: [contract, xnet060-metadata, candidate-D]
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      caddy: ${{ steps.filter.outputs.caddy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Caddy contract changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            caddy:
              - 'frontend/Dockerfile.caddy-spa'
              - 'frontend/patches/go-jose-v3.0.5-CVE-2026-116587.patch'
              - 'frontend/patches/caddy_v3_compat_test.go'
              - 'deploy/Caddyfile'
              - 'deploy/Caddyfile.production'
              - 'deploy/docker-compose.staging.yaml'
              - 'scripts/deploy.sh'
              - 'scripts/QUICK_FIX_PRODUCTION.sh'
              - 'tests/test_caddy_deploy_provenance.py'
              - 'scripts/ci/check_docker_runtime_dependency_surface.py'
              - 'tests/test_cd_attestation_workflow_contract.py'
              - '.github/workflows/cd.yml'
              - '.github/workflows/frontend-ci.yml'
  build-and-test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata' }}
    runs-on: ubuntu-latest
    env:
      BUILD_OUTPUT_DIR: dist
      VITE_API_BASE: "http://localhost:8000/api/v1"
      VITE_API_KEY: "test_key"
      VITE_DEV_MODE: "true"
      VITE_ANALYTICS_ENABLED: "false"
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ env.FRONTEND_NODE_VERSION_FILE }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-with-retry
        with:
          working-directory: frontend

      - name: Verify foundation ESLint native controls
        env:
          ESLINT_CONTROL_TIMEOUT_MS: "15000"
        run: |
          set -euo pipefail
          npm_binary="$(command -v npm)"
          node_binary="$(command -v node)"
          case "$npm_binary" in /*) ;; *) exit 1 ;; esac
          case "$node_binary" in /*) ;; *) exit 1 ;; esac
          "$node_binary" - "$npm_binary" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const { ESLint } = require('eslint');

          (async () => {
            const cwd = process.cwd();
            assert.ok(path.isAbsolute(process.execPath));
            assert.match(process.versions.node, /^24\./);
            const timeout = Number(process.env.ESLINT_CONTROL_TIMEOUT_MS);
            assert.ok(Number.isSafeInteger(timeout) && timeout > 0, 'Step must supply a positive integer control timeout');
            const config = path.join(cwd, 'eslint.config.js');
            const npm = process.argv[2];
            assert.ok(path.isAbsolute(npm));
            const cli = path.join(path.dirname(require.resolve('eslint/package.json')), 'bin/eslint.js');
            const patterns = ['src/api/*.ts', 'src/api/premium/*.ts', 'src/lib/analytics.ts'];
            const expected = ['src/api', 'src/api/premium'].flatMap(directory =>
              fs.readdirSync(directory).filter(name => name.endsWith('.ts') && !name.endsWith('.d.ts')).map(name => path.join(directory, name))
            ).filter(file => file !== 'src/api/schema.ts');
            expected.push('src/lib/analytics.ts');
            assert.ok(expected.length > 0, 'Authored foundation selection must be nonempty');
            for (const file of expected) assert.ok(fs.lstatSync(file).isFile(), file);
            const expectedPaths = expected.map(file => path.resolve(file)).sort();
            const eslint = new ESLint({ overrideConfigFile: config });
            assert.equal(await eslint.isPathIgnored('src/api/schema.ts'), true);
            for (const file of expected) assert.equal(await eslint.isPathIgnored(file), false, file);
            const results = await eslint.lintFiles(patterns);
            assert.deepEqual(results.map(result => result.filePath).sort(), expectedPaths);
            console.log(JSON.stringify({ control: 'membership', files: expected.sort() }));
            const ignored = new ESLint({ overrideConfigFile: config, overrideConfig: [{ ignores: ['src/api/*.ts'] }] });
            const ignoredFile = expected.find(file => path.dirname(file) === 'src/api');
            assert.ok(ignoredFile);
            assert.equal(await ignored.isPathIgnored(ignoredFile), true);
            await assert.rejects(ignored.lintFiles(patterns), {
              messageTemplate: 'all-matched-files-ignored',
              messageData: { pattern: 'src/api/*.ts' },
            });
            console.log(JSON.stringify({ control: 'ignored-selection', diagnostic: 'all-matched-files-ignored', pattern: 'src/api/*.ts' }));

            const uiPattern = 'src/components/ui/**/*.{ts,tsx}';
            const uiRoot = path.join(cwd, 'src/components/ui');
            function enumerateUI(directory) {
              assert.ok(fs.lstatSync(directory).isDirectory(), directory);
              const files = [];
              for (const name of fs.readdirSync(directory).sort()) {
                const file = path.join(directory, name);
                const stat = fs.lstatSync(file);
                assert.equal(stat.isSymbolicLink(), false, `Unsupported UI symlink: ${file}`);
                if (stat.isDirectory()) files.push(...enumerateUI(file));
                else if ((name.endsWith('.ts') || name.endsWith('.tsx')) && !name.endsWith('.d.ts')) {
                  assert.ok(stat.isFile(), `Unsupported UI member: ${file}`);
                  files.push(file);
                }
              }
              return files.sort();
            }
            function requireUISelection(directory) {
              const files = enumerateUI(directory);
              assert.ok(files.length > 0, 'Authored UI selection must be nonempty');
              return files;
            }
            function assertUIResults(report, inventory) {
              const actual = report.map(result => result.filePath).sort();
              assert.ok(actual.every((file, index) => index === 0 || file !== actual[index - 1]), 'UI result paths must be unique');
              assert.ok(actual.length === inventory.length && actual.every((file, index) => file === inventory[index]), 'UI membership mismatch');
              for (const result of report) assert.equal(result.fatalErrorCount, 0, result.filePath);
            }
            async function assertUIMembership(engine, selection, inventory) {
              assert.ok(inventory.length > 0, 'Authored UI selection must be nonempty');
              for (const file of inventory) {
                assert.ok(fs.lstatSync(file).isFile(), file);
                assert.ok((await engine.isPathIgnored(file)) === false, `Ignored UI member: ${file}`);
              }
              const report = await engine.lintFiles(selection);
              assertUIResults(report, inventory);
              return report;
            }
            const originalUI = requireUISelection(uiRoot);
            const uiReport = await assertUIMembership(eslint, [uiPattern], originalUI);
            console.log(JSON.stringify({ control: 'ui-membership', files: originalUI.map(file => path.relative(cwd, file)) }));
            const omittedMember = originalUI[0];
            await assert.rejects(assertUIMembership(eslint, originalUI.slice(1), originalUI), {
              name: 'AssertionError', message: 'UI membership mismatch',
            });
            console.log(JSON.stringify({ control: 'ui-omitted-member', file: omittedMember, diagnostic: 'UI membership mismatch' }));
            assert.throws(() => assertUIResults([...uiReport, uiReport[0]], originalUI), {
              name: 'AssertionError', message: 'UI result paths must be unique',
            });
            console.log(JSON.stringify({ control: 'ui-duplicate-result', diagnostic: 'UI result paths must be unique', evidence: 'assertion control over observed native results' }));
            const ignoredMember = path.relative(cwd, originalUI[0]).split(path.sep).join('/');
            const singleIgnoredUI = new ESLint({ overrideConfigFile: config, overrideConfig: [{ ignores: [ignoredMember] }] });
            assert.equal(await singleIgnoredUI.isPathIgnored(originalUI[0]), true);
            await assert.rejects(assertUIMembership(singleIgnoredUI, [uiPattern], originalUI), {
              name: 'AssertionError', message: `Ignored UI member: ${originalUI[0]}`,
            });
            console.log(JSON.stringify({ control: 'ui-ignored-member', file: ignoredMember, diagnostic: 'Ignored UI member' }));
            const allIgnoredUI = new ESLint({ overrideConfigFile: config, overrideConfig: [{ ignores: ['src/components/ui/**'] }] });
            await assert.rejects(allIgnoredUI.lintFiles([uiPattern]), {
              messageTemplate: 'all-matched-files-ignored', messageData: { pattern: uiPattern },
            });
            console.log(JSON.stringify({ control: 'ui-all-ignored', diagnostic: 'all-matched-files-ignored', pattern: uiPattern }));

            let fixtures;
            let scratch;
            let uiFixtures;
            try {
              fixtures = fs.mkdtempSync(path.join(cwd, 'src/.foundation-controls-'));
              scratch = fs.mkdtempSync(path.join(os.tmpdir(), 'foundation-npm-controls-'));
              uiFixtures = fs.mkdtempSync(path.join(uiRoot, 'cab07b-native-'));
              const nestedDirectory = path.join(uiFixtures, 'nested');
              fs.mkdirSync(nestedDirectory);
              const nestedFile = path.join(nestedDirectory, 'clean.tsx');
              fs.writeFileSync(nestedFile, 'export const Nested = () => <div />;\n');
              const nestedUI = requireUISelection(uiRoot);
              assert.deepEqual(nestedUI, [...originalUI, nestedFile].sort());
              await assertUIMembership(eslint, [uiPattern], nestedUI);
              console.log(JSON.stringify({ control: 'ui-nested-tsx', file: nestedFile }));
              const emptyDirectory = path.join(fixtures, 'empty-ui');
              const declarationDirectory = path.join(fixtures, 'declaration-only-ui');
              fs.mkdirSync(emptyDirectory);
              fs.mkdirSync(declarationDirectory);
              fs.writeFileSync(path.join(declarationDirectory, 'only.d.ts'), 'declare const value: number;\n');
              for (const [control, directory] of [['ui-empty-inventory', emptyDirectory], ['ui-declaration-only', declarationDirectory]]) {
                assert.throws(() => requireUISelection(directory), {
                  name: 'AssertionError', message: 'Authored UI selection must be nonempty',
                });
                console.log(JSON.stringify({ control, diagnostic: 'Authored UI selection must be nonempty' }));
              }
              const userconfig = path.join(scratch, 'user.npmrc');
              const globalconfig = path.join(scratch, 'global.npmrc');
              fs.writeFileSync(userconfig, '');
              fs.writeFileSync(globalconfig, '');
              fs.writeFileSync(path.join(scratch, 'package.json'), JSON.stringify({ name: 'foundation-startup-control', private: true, scripts: {} }));
              const env = {
                PATH: path.dirname(process.execPath),
                TMPDIR: scratch,
                CI: 'true',
                npm_config_userconfig: userconfig,
                npm_config_globalconfig: globalconfig,
                npm_config_cache: path.join(scratch, 'cache'),
                npm_config_update_notifier: 'false',
              };
              const options = { cwd, env, encoding: 'utf8', timeout, maxBuffer: 1024 * 1024 };
              const cases = [
                ['clean', 'export const value: number = 1;\n', null, 0, 0],
                ['error', 'import { readFileSync } from "node:fs";\nimport { existsSync } from "node:fs";\nexport const read = (file: string) => existsSync(file) ? readFileSync(file, "utf8") : "";\n', 'no-duplicate-imports', 2, 1],
                ['warning', 'export const value: any = 1;\n', '@typescript-eslint/no-explicit-any', 1, 1],
              ];
              const tsxCases = [
                ['ui-clean', 'export const Sample = () => <div />;\n', null, 0, 0],
                ['ui-error', 'import { readFileSync } from "node:fs";\nimport { existsSync } from "node:fs";\nexport const Sample = () => <div>{existsSync("x") ? readFileSync("x", "utf8") : ""}</div>;\n', 'no-duplicate-imports', 2, 1],
                ['ui-warning', 'export const Sample = (props: any) => <div>{props.value}</div>;\n', '@typescript-eslint/no-explicit-any', 1, 1],
              ];
              for (const [name, source, ruleId, severity, exit] of [...cases, ...tsxCases]) {
                const extension = name.startsWith('ui-') ? 'tsx' : 'ts';
                const file = path.join(fixtures, `${name}.${extension}`);
                fs.writeFileSync(file, source);
                const result = spawnSync(process.execPath, [cli, '--config', config, '--max-warnings=0', '--format', 'json', file], options);
                assert.equal(result.error, undefined);
                assert.equal(result.signal, null);
                assert.equal(result.status, exit, result.stderr);
                const report = JSON.parse(result.stdout);
                assert.equal(report.length, 1);
                assert.equal(report[0].filePath, file);
                assert.equal(report[0].fatalErrorCount, 0);
                assert.equal(report[0].errorCount, severity === 2 ? 1 : 0);
                assert.equal(report[0].warningCount, severity === 1 ? 1 : 0);
                assert.deepEqual(report[0].suppressedMessages, []);
                const messages = report[0].messages;
                if (ruleId === null) assert.deepEqual(messages, []);
                else {
                  assert.equal(messages.length, 1);
                  assert.equal(messages[0].ruleId, ruleId);
                  assert.equal(messages[0].severity, severity);
                  assert.notEqual(messages[0].fatal, true);
                }
                console.log(JSON.stringify({ control: name, exit: result.status, messages }));
              }
              const missingConfig = path.join(scratch, 'missing-eslint.config.cjs');
              const configFailure = spawnSync(process.execPath, [cli, '--config', missingConfig, path.join(fixtures, 'clean.ts')], options);
              assert.equal(configFailure.error, undefined);
              assert.equal(configFailure.signal, null);
              assert.equal(configFailure.status, 2);
              assert.match(configFailure.stderr, /ENOENT/);
              assert.ok(configFailure.stderr.includes(missingConfig));
              console.log(JSON.stringify({ control: 'missing-config', exit: configFailure.status, diagnostic: 'ENOENT missing-eslint.config.cjs' }));
              const emptyFailure = spawnSync(process.execPath, [cli, '--config', config, path.join(fixtures, 'absent/*.ts')], options);
              assert.equal(emptyFailure.error, undefined);
              assert.equal(emptyFailure.signal, null);
              assert.equal(emptyFailure.status, 2);
              assert.match(emptyFailure.stderr, /No files matching/);
              assert.ok(emptyFailure.stderr.includes(path.join(fixtures, 'absent/*.ts')));
              console.log(JSON.stringify({ control: 'empty-selection', exit: emptyFailure.status, diagnostic: 'No files matching' }));
              const scriptFailure = spawnSync(npm, ['run', 'lint:foundation'], { ...options, cwd: scratch });
              assert.equal(scriptFailure.error, undefined);
              assert.equal(scriptFailure.signal, null);
              assert.equal(scriptFailure.status, 1);
              assert.match(scriptFailure.stderr, /Missing script: "lint:foundation"/);
              console.log(JSON.stringify({ control: 'missing-script', exit: scriptFailure.status, diagnostic: 'Missing script: lint:foundation' }));
              const uiScriptFailure = spawnSync(npm, ['run', 'lint:ui'], { ...options, cwd: scratch });
              assert.equal(uiScriptFailure.error, undefined);
              assert.equal(uiScriptFailure.signal, null);
              assert.equal(uiScriptFailure.status, 1);
              assert.match(uiScriptFailure.stderr, /Missing script: "lint:ui"/);
              console.log(JSON.stringify({ control: 'ui-missing-script', exit: uiScriptFailure.status, diagnostic: 'Missing script: lint:ui' }));
              const emptyUIPattern = path.join(fixtures, 'absent-ui/**/*.tsx');
              const emptyUIFailure = spawnSync(process.execPath, [cli, '--config', config, emptyUIPattern], options);
              assert.equal(emptyUIFailure.error, undefined);
              assert.equal(emptyUIFailure.signal, null);
              assert.equal(emptyUIFailure.status, 2);
              assert.match(emptyUIFailure.stderr, /No files matching/);
              assert.ok(emptyUIFailure.stderr.includes(emptyUIPattern));
              console.log(JSON.stringify({ control: 'ui-unmatched-pattern', exit: emptyUIFailure.status, diagnostic: 'No files matching', pattern: emptyUIPattern }));
            } finally {
              if (fixtures) fs.rmSync(fixtures, { recursive: true, force: true });
              if (scratch) fs.rmSync(scratch, { recursive: true, force: true });
              if (uiFixtures) fs.rmSync(uiFixtures, { recursive: true, force: true });
            }
            const restoredUI = requireUISelection(uiRoot);
            assert.deepEqual(restoredUI, originalUI);
            await assertUIMembership(eslint, [uiPattern], restoredUI);
            console.log(JSON.stringify({ control: 'ui-restored-inventory', files: restoredUI.map(file => path.relative(cwd, file)) }));
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Setup environment variables
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else : > .env; fi
          if grep -q '^VITE_API_BASE=' .env; then
            sed -i 's|^VITE_API_BASE=.*$|VITE_API_BASE=http://localhost:8000/api/v1|' .env
          else
            echo "VITE_API_BASE=http://localhost:8000/api/v1" >> .env
          fi

      - name: Setup Python environment
        uses: ./.github/actions/python-setup
        env:
          DEVPI_CI_USER: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DEVPI_CI_USER || '' }}
          DEVPI_CI_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DEVPI_CI_PASSWORD || '' }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          requirements-profile: ci-lite
          install-mode: direct-proxy

      - name: Run frontend builder governance guard
        run: |
          cd ..
          python -m pytest -q \
            tests/test_ci_workflow_pr_size_governance_contract.py \
            -k node24

      - name: Run design token pipeline checks
        run: |
          cd ..
          make tokens-check

      - name: Generate OpenAPI JSON from backend (canonical)
        env:
          APP_ENV: test
          ENVIRONMENT: test
        run: |
          cd ..
          make openapi

      - name: Fail if OpenAPI/types are out of sync
        run: |
          cd ..
          git diff --exit-code frontend/src/api/openapi.json frontend/src/api/schema.ts

      - name: Lint API and foundation scope
        run: npm run lint:foundation

      - name: Lint UI primitives
        run: npm run lint:ui

      - name: Run vitest suite
        run: npm run test -- --coverage
        # env vars наследуются из job-level env

      - name: Build frontend
        env:
          # Keep bundle analysis off for pull requests and feature/fix branch pushes so
          # branch-controlled Vite build code never receives Codecov upload credentials.
          CODECOV_BUNDLE_ANALYSIS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: npm run build

      - name: Verify Tailwind CSS utilities
        run: npm run smoke:css

      - name: Upload frontend build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: frontend-build
          path: frontend/${{ env.BUILD_OUTPUT_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: frontend-test-results
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  caddy-contract:
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      CADDY_API_CALL_SECONDS: '30'
      CADDY_API_CLEANUP_SECONDS: '10'
      CADDY_FULL_SCAN_TIMEOUT_SECONDS: '300'
      CADDY_METADATA_TIMEOUT_SECONDS: '900'
      CADDY_METADATA_CLEANUP_SECONDS: '120'
      CADDY_CHECKOUT_SECONDS: '120'
      CADDY_REUSE_TIMEOUT_SECONDS: '840'
      CADDY_REUSE_DOWNLOAD_SECONDS: '300'
      CADDY_CONFIGURED_JOB_MINUTES: ${{ vars.CADDY_CONTRACT_TIMEOUT_MINUTES }}
      CADDY_SCAN_TERM_SECONDS: '10'
      CADDY_SCAN_KILL_SECONDS: '10'
      CADDY_SCAN_BOOKKEEPING_SECONDS: '10'
      CADDY_PHASE_SETUP: '300'
      CADDY_PHASE_ADMISSION: '600'
      CADDY_PHASE_COMPILER_BOOTSTRAP: '600'
      CADDY_PHASE_COMPILER_WORK: '900'
      CADDY_PHASE_COMPILER_CLEANUP: '120'
      CADDY_PHASE_METADATA_UPLOAD: '180'
      CADDY_PHASE_BUILD: '1800'
      CADDY_PHASE_CAPTURE: '420'
      CADDY_PHASE_RUNTIME_CONFIG: '420'
      CADDY_PHASE_OFFICIAL_PULL: '300'
      CADDY_PHASE_SOURCE16: '180'
      CADDY_PHASE_FINAL_SUBJECT: '300'
      CADDY_PHASE_REPORT_BINDINGS: '540'
      CADDY_PHASE_CONVERSION: '60'
      CADDY_PHASE_RUNTIME: '900'
      CADDY_PHASE_FIXTURE: '1050'
      CADDY_PHASE_SCANNER_BOOTSTRAP: '600'
      CADDY_PHASE_SCANS: '1980'
      CADDY_PHASE_PROCESSING: '300'
      CADDY_PHASE_CONTROL_CLEANUP: '360'
      CADDY_PHASE_RETENTION: '420'
      CADDY_PHASE_UPLOAD: '600'
      CADDY_PHASE_SAFETY: '270'
    timeout-minutes: ${{ fromJSON(vars.CADDY_CONTRACT_TIMEOUT_MINUTES || '220') }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.caddy == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: caddy-source-single-producer-2494
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Initialize bounded Caddy runner clock
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import json, math, os, time
          from pathlib import Path
          caps = {key.removeprefix("CADDY_PHASE_"): int(value) for key, value in os.environ.items() if key.startswith("CADDY_PHASE_")}
          expected_phases = {'SAFETY', 'FINAL_SUBJECT', 'FIXTURE', 'METADATA_UPLOAD', 'SOURCE16', 'COMPILER_WORK', 'CONVERSION', 'PROCESSING', 'BUILD', 'SETUP', 'CAPTURE', 'COMPILER_BOOTSTRAP', 'ADMISSION', 'CONTROL_CLEANUP', 'RUNTIME_CONFIG', 'SCANNER_BOOTSTRAP', 'RUNTIME', 'OFFICIAL_PULL', 'RETENTION', 'COMPILER_CLEANUP', 'SCANS', 'UPLOAD', 'REPORT_BINDINGS'}
          if set(caps) != expected_phases:
              raise ValueError("Caddy closed phase inventory differs")
          total = sum(caps.values())
          configured = os.environ.get("CADDY_CONFIGURED_JOB_MINUTES", "")
          if any(value <= 0 for value in caps.values()) or (configured and int(configured) * 60 < total):
              raise ValueError("Caddy configured job budget below phase ledger")
          directory = Path(os.environ["RUNNER_TEMP"]) / "caddy-admission"
          directory.mkdir(mode=0o700)
          charged = dict.fromkeys(caps, 0)
          charged["SETUP"] = caps["SETUP"]
          (directory / "admission.json").write_text(json.dumps({"budget": {
              "started": time.monotonic(), "seconds": total,
              "boot_id": Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
              "charged": charged, "action_deadlines": {}}}))
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              for phase, seconds in caps.items():
                  output.write("CADDY_ACTION_" + phase + "_MINUTES=" + str(math.ceil(seconds / 60)) + "\n")
              checkout = int(os.environ["CADDY_CHECKOUT_SECONDS"])
              if not 0 < checkout < caps["SETUP"]:
                  raise ValueError("Caddy setup split")
              output.write("CADDY_ACTION_REUSE_DOWNLOAD_MINUTES=" + str(math.ceil(int(os.environ["CADDY_REUSE_DOWNLOAD_SECONDS"]) / 60)) + "\n")
              output.write("CADDY_ACTION_CHECKOUT_MINUTES=" + str(math.ceil(checkout / 60)) + "\n")
              output.write("CADDY_ACTION_BUILDX_MINUTES=" + str(math.ceil((caps["SETUP"] - checkout) / 60)) + "\n")
              output.write("CADDY_ACTION_METADATA_MINUTES=" + str(math.ceil((caps["COMPILER_WORK"] + caps["COMPILER_CLEANUP"]) / 60)) + "\n")
          PY
      - name: Checkout code
        timeout-minutes: ${{ fromJSON(env.CADDY_ACTION_CHECKOUT_MINUTES) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        timeout-minutes: ${{ fromJSON(env.CADDY_ACTION_BUILDX_MINUTES) }}
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 / Node 24

      - name: Admit existing Caddy producer or exact retained subject
        id: caddy-admission
        env:
          GH_TOKEN: ${{ github.token }}
          CADDY_ACTION: ${{ inputs.caddy_action }}
          CADDY_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_phase
          with caddy_ci_phase("ADMISSION") as remaining:
              from datetime import datetime, timezone
              import hashlib
              import json
              import os
              from pathlib import Path
              import re
              import shutil
              import subprocess
              from types import SimpleNamespace
              import urllib.request
              from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_source_inventory, caddy_ci_phase

              root = Path.cwd()
              repo = "Katsiarynakavaleuskaya/PulsePlate"
              if os.environ["GITHUB_REPOSITORY"] != repo or os.environ["GITHUB_REPOSITORY_ID"] != "1043311030":
                  raise ValueError("Caddy source repository differs")
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes())
              event_name = os.environ["GITHUB_EVENT_NAME"]
              action = os.environ.get("CADDY_ACTION", "")
              if (event_name == "workflow_dispatch" and action not in ("contract", "xnet060-metadata", "candidate-D")) or (event_name != "workflow_dispatch" and action):
                  raise ValueError("Caddy unknown operation")
              selected = os.environ["CADDY_SOURCE_HEAD"]
              if re.fullmatch(r"[0-9a-f]{40}", selected) is None:
                  raise ValueError("Caddy source head invalid")
              git = shutil.which("git")
              if git is None:
                  raise ValueError("git unavailable")
              if subprocess.check_output([git, "rev-parse", "HEAD"], text=True, timeout=remaining(30)).strip() != selected:
                  raise ValueError("Caddy checkout is not selected source head")
              if event_name == "pull_request":
                  pr = event["pull_request"]
                  if type(pr["number"]) is not int or pr["number"] != 2494 or pr["head"]["repo"]["full_name"] != repo or pr["head"]["sha"] != selected:
                      raise ValueError("Caddy source PR scope differs")
              elif event_name == "push":
                  if os.environ["GITHUB_REF"] != "refs/heads/main" or selected != os.environ["GITHUB_SHA"]:
                      raise ValueError("Caddy source main scope differs")
              elif event_name != "workflow_dispatch":
                  raise ValueError("Caddy source event not admitted")

              fixed = [".github/workflows/frontend-ci.yml", "deploy/Caddyfile", "deploy/Caddyfile.production",
                       "scripts/ci/check_docker_runtime_dependency_surface.py", "scripts/ci/prometheus_source_image.py",
                       "scripts/ci/check_trivy_ignore_policy_expiry.py",
                       "trivy/ignore-policy.rego"]
              tracked = subprocess.check_output([git, "ls-files", "-z", "--", "frontend/"], timeout=remaining(60)).decode().split("\0")[:-1]
              if subprocess.check_output([git, "status", "--porcelain", "--", "frontend/", *fixed], timeout=remaining(60)):
                  raise ValueError("Caddy build context is dirty")
              inputs = caddy_ci_source_inventory(root, tracked + fixed)

              # The same no-redirect opener runs under its existing bounded process owner.
              from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_api
              api_sequence = 0
              def api(path):
                  global api_sequence
                  api_sequence += 1
                  directory = Path(os.environ["RUNNER_TEMP"]) / "caddy-admission" / ("api-" + str(api_sequence))
                  return caddy_ci_api(root, directory, path, remaining, inputs["scripts/ci/prometheus_source_image.py"]["sha256"])

              def positive_id(value):
                  if type(value) is not int or value <= 0:
                      raise ValueError("Caddy native positive ID required")
                  return value

              def pages(path, key):
                  observations = []
                  for observation in range(2):
                      rows, identities, total = [], set(), None
                      for page in range(1, 101):
                          separator = "&" if "?" in path else "?"
                          response = api(path + separator + "per_page=100&page=" + str(page))
                          count = response["total_count"]
                          if type(count) is not int or not 0 <= count <= 10000 or not isinstance(response[key], list):
                              raise ValueError("Caddy API inventory shape")
                          if total is None:
                              total = count
                          expected_page_size = min(100, total - len(rows))
                          if count != total or len(response[key]) != expected_page_size:
                              raise ValueError("Caddy API inventory incomplete or changed")
                          for row in response[key]:
                              if not isinstance(row, dict):
                                  raise ValueError("Caddy API row shape")
                              identity = positive_id(row.get("id"))
                              if identity in identities:
                                  raise ValueError("Caddy duplicate API identity")
                              identities.add(identity)
                              rows.append(row)
                          if len(rows) == total:
                              observations.append(rows)
                              break
                      else:
                          raise ValueError("Caddy API pagination bound")
                  if observations[0] != observations[1]:
                      raise ValueError("Caddy API same-count inventory replacement")
                  return observations[0]

              pr = api("/pulls/2494")
              if (type(pr["number"]) is not int or pr["number"] != 2494
                      or pr["head"]["repo"]["full_name"] != repo or pr["base"]["ref"] != "main"
                      or positive_id(pr["head"]["repo"]["id"]) != 1043311030
                      or positive_id(pr["base"]["repo"]["id"]) != 1043311030):
                  raise ValueError("Caddy original PR identity differs")
              if event_name in ("workflow_dispatch", "pull_request") and (pr["state"] != "open" or selected != pr["head"]["sha"]
                      or (event_name == "workflow_dispatch" and os.environ["GITHUB_REF"] != "refs/heads/" + pr["head"]["ref"])):
                  raise ValueError("Caddy dispatch must select current accepted PR head")
              if event_name == "push" and (pr["merged"] is not True or pr["merge_commit_sha"] != selected):
                  raise ValueError("Caddy main observation is only the accepted PR merge")
              state_dir = Path(os.environ["RUNNER_TEMP"]) / "caddy-admission"
              budget = json.loads((state_dir / "admission.json").read_bytes())["budget"]
              state = {"current_head": selected, "current_run_id": positive_id(int(os.environ["GITHUB_RUN_ID"])),
                       "current_run_attempt": positive_id(int(os.environ["GITHUB_RUN_ATTEMPT"])), "inputs": inputs,
                       "repository": repo, "repository_id": 1043311030, "producer": None, "mode": None, "budget": budget}
              workflow_id = positive_id(api("/actions/workflows/frontend-ci.yml")["id"])
              if workflow_id != 196310935:
                  raise ValueError("Caddy recovery workflow identity differs")
              branch = pr["head"]["ref"]
              build_name = "Build source-patched Caddy candidate"
              decision_name = "Decide source-qualified Caddy inventory and current native controls"
              # Historical PR2497 starts stay visible in the complete observed history.
              # They are not permissions or a remaining-attempt counter for PR2494.
              runs = pages("/actions/workflows/frontend-ci.yml/runs?created=%3E%3D2026-10-28T00%3A00%3A00Z", "workflow_runs")
              spent, current_runs, current_jobs, candidates = [], [], [], []
              for run in runs:
                  if (run["repository"]["full_name"] != repo or positive_id(run["repository"]["id"]) != 1043311030
                          or positive_id(run["workflow_id"]) != workflow_id or run["path"] != ".github/workflows/frontend-ci.yml"
                          or re.fullmatch(r"[0-9a-f]{40}", run["head_sha"]) is None):
                      raise ValueError("Caddy producer run identity differs")
                  positive_id(run["run_attempt"])
                  if run["id"] == state["current_run_id"]:
                      current_runs.append(run)
                  for job in pages("/actions/runs/" + str(run["id"]) + "/jobs?filter=all", "jobs"):
                      if (positive_id(job["run_id"]) != run["id"] or positive_id(job["run_attempt"]) > run["run_attempt"]
                              or job["head_sha"] != run["head_sha"]):
                          raise ValueError("Caddy native job/run relationship differs")
                      if job["name"] != "caddy-contract":
                          continue
                      if run["id"] == state["current_run_id"] and job["run_attempt"] == state["current_run_attempt"]:
                          current_jobs.append(job)
                      if len({positive_id(step["number"]) for step in job["steps"]}) != len(job["steps"]):
                          raise ValueError("Caddy duplicate native step")
                      starts = [step for step in job["steps"] if step["name"] in (build_name, "Build accepted D Caddy candidate once")]
                      for step in starts:
                          if not {"status", "conclusion", "started_at", "completed_at"} <= set(step):
                              raise ValueError("Caddy native build history incomplete")
                          if step["status"] in ("pending", "queued") and step["started_at"] is None and step["conclusion"] is None:
                              continue
                          if step["conclusion"] == "skipped" and step["status"] == "completed" and step["started_at"] == step["completed_at"]:
                              continue
                          if step["started_at"] is None:
                              raise ValueError("Caddy build start missing")
                          spent.append({"run": run["id"], "attempt": job["run_attempt"], "job": job["id"],
                                        "source": run["head_sha"], "branch": run["head_branch"], "step": step})
                          if step["name"] != build_name or run["head_branch"] != branch:
                              continue
                          if run["id"] != state["current_run_id"] and job["status"] != "completed":
                              raise ValueError("Caddy another producer still active")
                          accepted = [value for value in job["steps"] if value["name"] == decision_name]
                          if (run["event"] == "workflow_dispatch" and run["status"] == job["status"] == "completed"
                                  and run["conclusion"] == job["conclusion"] == step["conclusion"] == "success"
                                  and job["run_attempt"] == run["run_attempt"] == 1
                                  and positive_id(run["head_repository"]["id"]) == 1043311030
                                  and len(accepted) == 1 and accepted[0]["status"] == "completed" and accepted[0]["conclusion"] == "success"):
                              candidates.append((run, job, step))
              state["observed_build_history"] = spent
              if len(current_runs) != 1 or len(current_jobs) != 1:
                  raise ValueError("Caddy current native run/job missing or ambiguous")
              current_run, current_job = current_runs[0], current_jobs[0]
              if (current_run["head_sha"] != selected or current_run["event"] != event_name
                      or current_run["head_branch"] != ("main" if event_name == "push" else branch)
                      or positive_id(current_run["head_repository"]["id"]) != 1043311030
                      or current_run["run_attempt"] != state["current_run_attempt"]
                      or current_run["status"] != "in_progress" or current_run["conclusion"] is not None
                      or current_job["status"] != "in_progress" or current_job["conclusion"] is not None):
                  raise ValueError("Caddy current native run/job differs")
              current_builds = [row for row in current_job["steps"] if row["name"] == build_name]
              if (len(current_builds) != 1 or current_builds[0]["status"] not in ("pending", "queued")
                      or current_builds[0]["conclusion"] is not None or current_builds[0]["started_at"] is not None
                      or current_builds[0]["completed_at"] is not None):
                  raise ValueError("Caddy current prebuild observation differs")
              from scripts.ci.prometheus_source_image import authenticate_pr_source, GitHubRead
              prefix = "/repos/" + repo
              proof_api = SimpleNamespace(json=lambda endpoint: api(endpoint.removeprefix(prefix)))
              proof_api.pages = lambda endpoint, key, count: GitHubRead.pages(proof_api, endpoint, key, count)
              if action == "xnet060-metadata":
                  state["mode"] = "metadata"
              elif action == "candidate-D":
                  if event_name != "workflow_dispatch" or state["current_run_attempt"] != 1:
                      raise ValueError("Caddy build requires actual current PR manual invocation")
                  state["mode"] = "build"
              elif candidates:
                  run, job, step = max(candidates, key=lambda row: (row[0]["created_at"], row[0]["id"]))
                  authenticate_pr_source(proof_api, 2494, run["head_sha"], pr["head"]["sha"], "refs/heads/" + branch)
                  # Native Git resolves original regular blobs; no manifest-authored input claim is trusted.
                  git_env = {"PATH": os.environ["PATH"], "LANG": "C.UTF-8", "GIT_CONFIG_NOSYSTEM": "1",
                             "GIT_CONFIG_GLOBAL": "/dev/null", "GIT_NO_REPLACE_OBJECTS": "1"}
                  original_head = run["head_sha"]
                  subprocess.run([git, "--no-replace-objects", "fetch", "--no-tags", "--depth=1",
                                  "https://github.com/" + repo + ".git", original_head], env=git_env, check=True, timeout=remaining(120))
                  original_paths = subprocess.check_output([git, "--no-replace-objects", "ls-tree", "-r", "-z", "--name-only",
                                  original_head, "--", "frontend/", *fixed], env=git_env, timeout=remaining(60)).decode().split("\0")[:-1]
                  if len(original_paths) != len(set(original_paths)) or set(original_paths) != set(inputs):
                      raise ValueError("Caddy actual producer source inventory differs")
                  original_inputs = {}
                  for name in original_paths:
                      row = subprocess.check_output([git, "--no-replace-objects", "ls-tree", "--format=%(objectmode) %(objecttype) %(objectname)",
                                  original_head, "--", name], env=git_env, timeout=remaining(30)).decode().split()
                      if len(row) != 3 or row[0] not in ("100644", "100755") or row[1] != "blob" or re.fullmatch(r"[0-9a-f]{40}", row[2]) is None:
                          raise ValueError("Caddy original source is not one regular Git blob")
                      raw = subprocess.check_output([git, "--no-replace-objects", "cat-file", "blob", row[2]], env=git_env, timeout=remaining(30))
                      original_inputs[name] = {"mode": int(row[0], 8) & 0o777, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
                  if original_inputs != inputs:
                      raise ValueError("Caddy authenticated original Git source differs from current source")
                  artifacts = pages("/actions/runs/" + str(run["id"]) + "/artifacts", "artifacts")
                  for artifact in artifacts:
                      relation = artifact["workflow_run"]
                      if (positive_id(relation["id"]) != run["id"] or relation["head_sha"] != run["head_sha"]
                              or positive_id(relation["repository_id"]) != 1043311030
                              or positive_id(relation["head_repository_id"]) != 1043311030
                              or relation["head_branch"] != run["head_branch"]):
                          raise ValueError("Caddy native artifact/run relationship differs")
                  artifacts = [a for a in artifacts if a["name"] == "caddy-contract-evidence"]
                  if len(artifacts) != 1 or artifacts[0]["expired"] is not False:
                      raise ValueError("Caddy original producer artifact unavailable")
                  if re.fullmatch(r"sha256:[0-9a-f]{64}", artifacts[0].get("digest", "")) is None:
                      raise ValueError("Caddy native artifact digest unavailable")
                  state.update(mode="reuse", producer={"run_id": run["id"], "run_attempt": 1,
                      "head": run["head_sha"], "job_id": job["id"], "artifact": artifacts[0], "git_inputs": original_inputs})
              else:
                  raise ValueError("Caddy requires a real successful same-source PR2494 producer; no automatic build")
              (state_dir / "admission.json").write_text(json.dumps(state, indent=2))
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
                  output.write("mode=" + state["mode"] + "\n")
                  if state["mode"] == "reuse":
                      output.write("producer_run=" + str(state["producer"]["run_id"]) + "\nartifact_id=" + str(state["producer"]["artifact"]["id"]) + "\n")
          PY

      - name: Charge Download original retained Caddy candidate budget
        if: ${{ steps.caddy-admission.outputs.mode == 'reuse' }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_charge_action
          caddy_ci_charge_action("BUILD", int(os.environ["CADDY_REUSE_DOWNLOAD_SECONDS"]))
          PY

      - name: Download original retained Caddy candidate
        timeout-minutes: ${{ fromJSON(env.CADDY_ACTION_REUSE_DOWNLOAD_MINUTES) }}
        if: ${{ steps.caddy-admission.outputs.mode == 'reuse' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 / Node 24
        with:
          artifact-ids: ${{ steps.caddy-admission.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.caddy-admission.outputs.producer_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/caddy-original-producer

      - name: Import and bind exact retained Caddy candidate
        if: ${{ steps.caddy-admission.outputs.mode == 'reuse' }}
        id: caddy-import
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_phase
          with caddy_ci_phase("BUILD") as remaining:
              import hashlib
              import json
              import os
              from pathlib import Path
              import shutil
              import stat
              import subprocess

              work = Path(os.environ["RUNNER_TEMP"])
              state = json.loads((work / "caddy-admission/admission.json").read_bytes())
              retained = work / "caddy-original-producer"
              manifest = retained / "candidate.json"
              archive = retained / "candidate.docker.tar"
              for path in (manifest, archive):
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode) or path.stat().st_size == 0:
                      raise ValueError("Caddy retained candidate file unavailable")
              original = json.loads(manifest.read_bytes())
              if original.get("source_correction") != "CVE-2026-116587" or original.get("v3_scanner_comparability") != "UNKNOWN":
                  raise ValueError("Caddy historical D artifact is not a source-qualified candidate")
              expected = state["producer"]
              if (original["producer_run_id"], original["producer_run_attempt"], original["producer_head"], original["inputs"]) != (
                      expected["run_id"], expected["run_attempt"], expected["head"], expected["git_inputs"]):
                  raise ValueError("Caddy original producer/current input identity differs")
              if expected["git_inputs"] != state["inputs"]:
                  raise ValueError("Caddy original producer/current input identity differs")
              hash_value = hashlib.sha256()
              with archive.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1048576), b""):
                      hash_value.update(chunk)
              if hash_value.hexdigest() != original["archive_sha256"] or archive.stat().st_size != original["archive_bytes"]:
                  raise ValueError("Caddy retained docker archive differs")
              docker = shutil.which("docker")
              if docker is None:
                  raise ValueError("docker unavailable")
              subprocess.run([docker, "load", "--input", str(archive)], check=True, timeout=remaining(300))
              inspected = json.loads(subprocess.check_output([docker, "image", "inspect", "pulseplate-caddy:contract"], timeout=remaining(60)))[0]
              if (inspected["Id"], inspected["Os"], inspected["Architecture"]) != (original["image_config_id"], "linux", "amd64"):
                  raise ValueError("Caddy imported image/config/platform differs")
              binary = subprocess.check_output([docker, "run", "--rm", "--pull", "never", "--network", "none", "--read-only", "--cap-drop", "ALL",
                  "--entrypoint", "/bin/busybox", inspected["Id"], "sha256sum", "/usr/bin/caddy"], timeout=remaining(60)).decode()
              if binary != original["binary_sha256"] + "  /usr/bin/caddy\n":
                  raise ValueError("Caddy imported binary differs")
              state["original_candidate"] = original
              (work / "caddy-admission/admission.json").write_text(json.dumps(state, indent=2))
          PY

      # xnet060-metadata is the retained compatibility identifier for the current fixed recipe.
      - name: Admit explicit first Caddy metadata invocation
        if: ${{ steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Katsiarynakavaleuskaya/PulsePlate'
          test "$GITHUB_REPOSITORY_ID" = '1043311030'
          test "$GITHUB_RUN_ATTEMPT" = '1'

      - name: Charge Install pinned compiler metadata scanner and DB budget
        if: ${{ steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build' }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_charge_action
          caddy_ci_charge_action("COMPILER_BOOTSTRAP")
          PY

      - name: Install pinned compiler metadata scanner and DB
        timeout-minutes: ${{ fromJSON(env.CADDY_ACTION_COMPILER_BOOTSTRAP_MINUTES) }}
        if: ${{ steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Node 24 cache path
        with:
          version: v0.74.0
          image-ref: golang:1.26.10-alpine3.23@sha256:0525c952defebc693cdaf62cdf43afa32be5a7f377e99260642ea19c240c708e
          format: table
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          cache-dir: /tmp/trivy-cache-caddy-metadata

      - name: Qualify Caddy compiler and two counterfactual v4 derivations
        timeout-minutes: ${{ fromJSON(env.CADDY_ACTION_METADATA_MINUTES) }}
        id: caddy-metadata
        if: ${{ steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_phase
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import stat
          import time
          import urllib.request
          from scripts.ci.prometheus_source_image import Native, fresh_directory, tree_inventory, canonical_data, require

          require(os.environ.get("GITHUB_ACTIONS") == "true" and platform.system() == "Linux"
                  and platform.machine() == "x86_64" and os.environ["GITHUB_REPOSITORY"] == "Katsiarynakavaleuskaya/PulsePlate"
                  and os.environ["GITHUB_RUN_ATTEMPT"] == "1", "caddy_metadata_admission")
          root = Path.cwd()
          work = Path(os.environ["RUNNER_TEMP"]) / "caddy-xnet060-metadata"
          fresh_directory(work)
          evidence = work / "evidence"
          fresh_directory(evidence)
          deadline = time.monotonic() + int(os.environ["CADDY_METADATA_TIMEOUT_SECONDS"])
          native = Native(evidence, deadline, int(os.environ["CADDY_METADATA_CLEANUP_SECONDS"]))
          docker = shutil.which("docker")
          require(docker is not None and Path(docker).is_absolute(), "caddy_metadata_docker")
          config = work / "docker-config"
          fresh_directory(config)
          environment = {"PATH": "/usr/bin:/bin", "HOME": str(work), "DOCKER_CONFIG": str(config), "LANG": "C.UTF-8"}
          compiler = "golang:1.26.10-alpine3.23@sha256:0525c952defebc693cdaf62cdf43afa32be5a7f377e99260642ea19c240c708e"
          recipe = (root / "frontend/Dockerfile.caddy-spa").read_bytes()
          gets = re.findall(rb"^    go get ([^;]+);", recipe, re.MULTILINE)
          baseline_gets = [b"github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4", b"google.golang.org/grpc@v1.83.2", b"golang.org/x/crypto@v0.55.0", b"golang.org/x/net@v0.60.0", b"github.com/klauspost/compress@v1.18.7"]
          require(gets == baseline_gets + [b"github.com/go-jose/go-jose/v4@v4.1.6"], "caddy_selected_six_gets")
          report = {"purpose": "Counterfactual recipe baselines, not recovered historical ephemeral locks or a compiled candidate",
                    "compiler_index": compiler, "recipe_sha256": hashlib.sha256(recipe).hexdigest(),
                    "counterfactual_seed_gets": [value.decode() for value in baseline_gets],
                    "selected_recipe_gets": [value.decode() for value in gets],
                    "authored_action": "github.com/go-jose/go-jose/v4@v4.1.6",
                    "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": 1,
                    "source_head": json.loads((Path(os.environ["RUNNER_TEMP"]) / "caddy-admission/admission.json").read_bytes())["current_head"], "go_build_invocations": 0,
                    "failure": None, "derivations": {}, "closure_admission": "exact authored v4 action only; additional solver closure is HOLD"}
          owned = []
          try:
              with caddy_ci_phase("COMPILER_WORK") as remaining:
                  native.deadline = min(native.deadline, time.monotonic() + remaining(float("inf")))
                  raw = native.run([docker, "--config", str(config), "buildx", "imagetools", "inspect", "--raw", compiler], "compiler-index", environment, cwd=work)
                  require(hashlib.sha256(raw).hexdigest() == compiler.split("sha256:")[1], "compiler_raw_index_digest")
                  index = json.loads(raw)
                  targets = [row for row in index["manifests"] if row.get("platform") == {"architecture": "amd64", "os": "linux"}]
                  require(len(targets) == 1 and re.fullmatch(r"sha256:[0-9a-f]{64}", targets[0]["digest"]) is not None, "compiler_exact_platform")
                  selected = "golang@" + targets[0]["digest"]
                  native.run([docker, "--config", str(config), "pull", "--platform", "linux/amd64", selected], "compiler-pull", environment, cwd=work)
                  observed = json.loads(native.run([docker, "--config", str(config), "image", "inspect", selected], "compiler-config", environment, cwd=work))[0]
                  require((observed["Os"], observed["Architecture"]) == ("linux", "amd64"), "compiler_native_platform")
                  platform_raw = native.run([docker, "--config", str(config), "buildx", "imagetools", "inspect", "--raw", selected], "compiler-platform-raw", environment, cwd=work)
                  require("sha256:" + hashlib.sha256(platform_raw).hexdigest() == targets[0]["digest"]
                          and json.loads(platform_raw)["config"]["digest"] == observed["Id"], "compiler_platform_config_binding")
                  report["compiler_platform"] = targets[0]
                  report["compiler_config"] = observed
                  version_name = "pulseplate-caddy-compiler-version-" + os.environ["GITHUB_RUN_ID"]
                  owned.append(version_name)
                  go_version = native.run([docker, "--config", str(config), "run", "--rm", "--pull", "never", "--name", version_name,
                      "--label", "pulseplate.caddy-metadata=" + os.environ["GITHUB_RUN_ID"],
                      "--user", "65532:65532", "--network", "none", "--read-only", "--cap-drop", "ALL",
                      "--security-opt", "no-new-privileges", "--cpus", "2", "--memory", "2g", "--pids-limit", "128",
                      "--env", "GOTOOLCHAIN=local", "--env", "GOENV=off", "--env", "GOWORK=off",
                      "--entrypoint", "/usr/local/go/bin/go", observed["Id"], "version"], "compiler-native-version", environment, cwd=work)
                  require(go_version == b"go version go1.26.10 linux/amd64\n", "compiler_native_version")
                  report["compiler_go_version_sha256"] = hashlib.sha256(go_version).hexdigest()
                  scanner = shutil.which("trivy")
                  require(scanner is not None and Path(scanner).is_absolute(), "compiler_native_scanner_missing")
                  version = native.run([scanner, "--version"], "compiler-scanner-version", environment, cwd=work)
                  require(re.search(rb"^Version: 0\.74\.0$", version, re.MULTILINE) is not None, "compiler_pinned_scanner_version")
                  cache = Path("/tmp/trivy-cache-caddy-metadata")
                  db = {name: {"bytes": (cache / name).stat().st_size,
                               "sha256": hashlib.sha256((cache / name).read_bytes()).hexdigest()}
                        for name in ("db/trivy.db", "db/metadata.json")}
                  empty_config, empty_ignore = work / "empty-trivy.yaml", work / "empty.trivyignore"
                  empty_config.write_bytes(b"{}\n")
                  empty_ignore.write_bytes(b"")
                  scan = evidence / "compiler-full.raw.json"
                  native.run([scanner, "image", "--config", str(empty_config), "--cache-dir", str(cache),
                              "--skip-db-update", "--skip-java-db-update", "--skip-vex-repo-update", "--offline-scan",
                              "--skip-version-check", "--disable-telemetry", "--image-src", "docker", "--platform", "linux/amd64",
                              "--scanners", "vuln,secret", "--pkg-types", "os,library", "--list-all-pkgs",
                              "--severity", "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL", "--format", "json", "--exit-code", "0",
                              "--ignore-unfixed=false", "--ignorefile", str(empty_ignore), "--timeout", "300s",
                              "--output", str(scan), observed["Id"]], "compiler-full-scan", environment, cwd=work)
                  from scripts.ci.check_docker_runtime_dependency_surface import validate_trivy_image_report
                  validate_trivy_image_report(observed["Id"], scan)
                  full = json.loads(scan.read_bytes())
                  require(all("Secrets" not in row or (type(row["Secrets"]) is list and not row["Secrets"])
                              for row in full["Results"]), "compiler_secret_HOLD")
                  require(all(finding.get("Severity") not in ("HIGH", "CRITICAL") for row in full["Results"]
                              for finding in row.get("Vulnerabilities", [])), "compiler_native_HC_HOLD")
                  require({name: {"bytes": (cache / name).stat().st_size,
                                  "sha256": hashlib.sha256((cache / name).read_bytes()).hexdigest()} for name in db} == db,
                          "compiler_scanner_DB_changed")
                  report["compiler_scan"] = {"report_sha256": hashlib.sha256(scan.read_bytes()).hexdigest(),
                      "scanner_sha256": hashlib.sha256(Path(scanner).read_bytes()).hexdigest(), "DB": db,
                      "Secrets_fields_absent": sum("Secrets" not in row for row in full["Results"]),
                      "boundary": "Native vuln,secret command and listed inventory; omitted Secrets fields are not a forced zero claim"}
                  # Historical signed Alpine acquisitions remain at their original proof identity.
                  # This transition changes only go-jose/v4; do not reacquire old cutoff inputs.
                  for label in ("a", "b"):
                      lane = work / label
                      fresh_directory(lane)
                      for name in ("work", "modules", "home", "cache", "tmp", "output"):
                          fresh_directory(lane / name, 0o777)
                          (lane / name).chmod(0o777)
                      name = "pulseplate-caddy-metadata-" + os.environ["GITHUB_RUN_ID"] + "-" + label
                      argv = [docker, "--config", str(config), "create", "--pull", "never", "--name", name,
                              "--label", "pulseplate.caddy-metadata=" + os.environ["GITHUB_RUN_ID"],
                              "--user", "65532:65532", "--workdir", "/work", "--read-only", "--cap-drop", "ALL",
                              "--security-opt", "no-new-privileges", "--cpus", "2", "--memory", "2g", "--pids-limit", "128"]
                      for directory in ("work", "modules", "home", "cache", "tmp", "output"):
                          argv += ["--mount", f"type=bind,source={lane / directory},target=/{directory}"]
                      for key, value in {"PATH": "/usr/local/go/bin:/usr/bin:/bin", "HOME": "/home", "TMPDIR": "/tmp",
                                         "GOCACHE": "/cache", "GOMODCACHE": "/modules", "GOPATH": "/home/gopath",
                                         "GOOS": "linux", "GOARCH": "amd64", "CGO_ENABLED": "0", "GOTOOLCHAIN": "local",
                                         "GOWORK": "off", "GOENV": "off", "GOPROXY": "https://proxy.golang.org",
                                         "GOSUMDB": "sum.golang.org", "GOMAXPROCS": "2"}.items():
                          argv += ["--env", key + "=" + value]
                      # The same fixed guest paths and canonical phases are used in both fresh lanes.
                      script = '''set -eu
              go version > /output/compiler-version.txt
              test "$(cat /output/compiler-version.txt)" = "go version go1.26.10 linux/amd64"
              cat /etc/alpine-release > /output/alpine-release.txt
              go mod init pulseplate.local/caddy-build
              go get github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
              go get google.golang.org/grpc@v1.83.2
              go get golang.org/x/crypto@v0.55.0
              go get golang.org/x/net@v0.60.0
              go get github.com/klauspost/compress@v1.18.7
              go mod download all
              go mod verify > /output/baseline-verify.txt
              cp go.mod /output/baseline-go.mod
              cp go.sum /output/baseline-go.sum
              go list -mod=readonly -m -json all > /output/baseline-modules.json
              go mod graph > /output/baseline-module-graph.txt
              go list -mod=readonly -deps -json github.com/caddyserver/caddy/v2/cmd/caddy > /output/baseline-packages.json
              cmp go.mod /output/baseline-go.mod
              cmp go.sum /output/baseline-go.sum
              go get github.com/go-jose/go-jose/v4@v4.1.6
              cp go.mod /output/post-get-go.mod
              cp go.sum /output/post-get-go.sum
              go mod download all
              go mod verify > /output/final-verify.txt
              cp go.mod /output/final-go.mod
              cp go.sum /output/final-go.sum
              export GOPROXY=off GOSUMDB=off GOFLAGS=-mod=readonly
              go list -mod=readonly -m -json all > /output/final-modules.json
              go mod graph > /output/final-module-graph.txt
              go list -mod=readonly -deps -json github.com/caddyserver/caddy/v2/cmd/caddy > /output/final-packages.json
              cmp go.mod /output/final-go.mod
              cmp go.sum /output/final-go.sum
              '''
                      owned.append(name)
                      native.run(argv + ["--entrypoint", "/bin/sh", observed["Id"], "-c", script], label + "-create", environment, cwd=work)
                      native.run([docker, "--config", str(config), "start", "--attach", name], label + "-native", environment, cwd=work)
                      terminal = json.loads(native.run([docker, "--config", str(config), "inspect", name], label + "-terminal", environment, cwd=work))[0]
                      require(terminal["State"]["ExitCode"] == 0 and terminal["State"]["OOMKilled"] is False, "caddy_metadata_native_terminal")
                      require(terminal["Config"]["Labels"].get("pulseplate.caddy-metadata") == os.environ["GITHUB_RUN_ID"], "caddy_metadata_owned_identity")
                      output = lane / "output"
                      for phase in ("baseline", "final"):
                          from scripts.ci.prometheus_source_image import decode_selected_modules, decode_objects
                          modules = decode_selected_modules((output / (phase + "-modules.json")).read_bytes(), root_module="pulseplate.local/caddy-build")
                          require(all("Replace" not in row for row in modules.values()), "caddy_no_module_replacement")
                          packages = decode_objects((output / (phase + "-packages.json")).read_bytes())
                          require(all(not row.get("Error") and not row.get("DepsErrors") and not row.get("Incomplete") for row in packages), "caddy_metadata_package_errors")
                          indexed = {row["ImportPath"]: row for row in packages}
                          require(len(indexed) == len(packages) and "github.com/caddyserver/caddy/v2/cmd/caddy" in indexed
                                  and indexed["github.com/caddyserver/caddy/v2/cmd/caddy"].get("Name") == "main", "caddy_complete_command_identity")
                          for row in packages:
                              mapping = row.get("ImportMap", {})
                              require(all(mapping.get(path, path) in indexed for path in row.get("Imports", [])), "caddy_complete_native_import_graph")
                          require(modules["github.com/caddyserver/caddy/v2"]["Version"] == "v2.11.4", "caddy_preserved_source_version")
                          report["derivations"].setdefault(label, {})[phase] = {"modules": modules, "packages": len(packages)}
                      before, after = report["derivations"][label]["baseline"]["modules"], report["derivations"][label]["final"]["modules"]
                      target = "github.com/go-jose/go-jose/v4"
                      require(before[target]["Version"] == "v4.1.4" and after[target]["Version"] == "v4.1.6"
                              and after[target]["Sum"] == "h1:sNRkftxFJxwsILiQukqp5z83QBSmntVwmgRY7AqBDO4=", "caddy_exact_authored_v4_transition")
                      delta = [{"path": path, "before": before.get(path), "after": after.get(path),
                                "class": "I_R" if path == target else "C_R_candidate"}
                               for path in sorted(set(before) | set(after)) if before.get(path) != after.get(path)]
                      require([row["path"] for row in delta] == [target], "caddy_unexpected_solver_closure_HOLD")
                      (output / "complete-delta.json").write_bytes(canonical_data(delta))
                      patch = "".join("".join(difflib.unified_diff((output / ("baseline-" + name)).read_text().splitlines(True), (output / ("final-" + name)).read_text().splitlines(True), fromfile="a/" + name, tofile="b/" + name)) for name in ("go.mod", "go.sum"))
                      (output / "module-derivation.patch").write_text(patch)
                      report["derivations"][label]["native_terminal"] = terminal
                      report["derivations"][label]["output_inventory"] = tree_inventory(output)
                  left, right = work / "a/output", work / "b/output"
                  require(tree_inventory(left) == tree_inventory(right), "caddy_independent_raw_output_equality")
                  report["status"] = "observed_counterfactual_metadata_only"
          except BaseException as error:
              report["failure"] = type(error).__name__
              raise
          finally:
              with caddy_ci_phase("COMPILER_CLEANUP"):
                  native.begin_cleanup()
                  inventory = native.run([docker, "--config", str(config), "ps", "--all", "--format", "{{.Names}}"], "cleanup-inventory", environment, cwd=work, cleaning=True).decode().splitlines()
                  for name in owned:
                      if name not in inventory:
                          continue
                      actual = json.loads(native.run([docker, "--config", str(config), "inspect", name], name + "-cleanup-inspect", environment, cwd=work, cleaning=True))[0]
                      require(actual["Config"]["Labels"].get("pulseplate.caddy-metadata") == os.environ["GITHUB_RUN_ID"], "caddy_cleanup_ownership")
                      native.run([docker, "--config", str(config), "rm", "--force", name], name + "-cleanup", environment, cwd=work, cleaning=True)
                  remaining = native.run([docker, "--config", str(config), "ps", "--all", "--format", "{{.Names}}"], "cleanup-absence", environment, cwd=work, cleaning=True).decode().splitlines()
                  require(not set(owned).intersection(remaining), "caddy_metadata_owned_container_survives")
                  report["native_commands"] = native.records
                  (evidence / "qualification.json").write_bytes(canonical_data(report))
          PY

      - name: Charge Upload counterfactual Caddy metadata budget
        id: caddy-metadata-upload-budget
        if: ${{ always() && (steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build') }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_charge_action
          caddy_ci_charge_action("METADATA_UPLOAD")
          PY

      - name: Upload counterfactual Caddy metadata
        timeout-minutes: ${{ fromJSON(env.CADDY_ACTION_METADATA_UPLOAD_MINUTES) }}
        if: ${{ always() && (steps.caddy-admission.outputs.mode == 'metadata' || steps.caddy-admission.outputs.mode == 'build') && steps.caddy-metadata-upload-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: caddy-xnet060-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/caddy-xnet060-metadata/evidence
            ${{ runner.temp }}/caddy-xnet060-metadata/a/output
            ${{ runner.temp }}/caddy-xnet060-metadata/b/output
          if-no-files-found: error
          retention-days: 30

      - name: Charge Build source-patched Caddy candidate budget
        if: ${{ steps.caddy-admission.outputs.mode == 'build' && steps.caddy-metadata.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_charge_action
          import json
          from pathlib import Path
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_source_inventory, caddy_ci_phase
          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "caddy-admission/admission.json").read_bytes())
          with caddy_ci_phase("PROCESSING"):
              if caddy_ci_source_inventory(Path.cwd(), list(state["inputs"])) != state["inputs"]:
                  raise ValueError("Caddy source changed immediately before build")
          caddy_ci_charge_action("BUILD")
          PY

      - name: Build source-patched Caddy candidate
        timeout-minutes: ${{ fromJSON(env.CADDY_ACTION_BUILD_MINUTES) }}
        if: ${{ steps.caddy-admission.outputs.mode == 'build' && steps.caddy-metadata.outcome == 'success' }}
        id: caddy-build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.caddy-spa
          platforms: linux/amd64
          load: true
          push: false
          tags: pulseplate-caddy:contract
          no-cache-filters: caddy-build
          cache-from: type=gha,scope=frontend-caddy-contract
          cache-to: type=gha,scope=frontend-caddy-contract,mode=min,ignore-error=true

      - name: Capture next loaded Caddy image identity
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.caddy_action != 'xnet060-metadata') }}
        id: caddy-image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          import tempfile
          import io
          import tarfile
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_phase, CADDY_BUILD_MEMBERS, CADDY_BUILD_EVIDENCE_PATH

          try:
              root = Path.cwd().resolve(strict=True)
              docker = shutil.which("docker")
              if docker is None or not Path(docker).is_absolute():
                  raise ValueError("docker_unavailable")

              def run(arguments, maximum=1048576):
                  with caddy_ci_phase("CAPTURE") as remaining:
                      result = subprocess.run([docker, *arguments], capture_output=True, timeout=remaining(60), check=False)
                  if result.returncode or len(result.stdout) > maximum:
                      raise ValueError("native_image_observation_failed")
                  return result.stdout

              inspected = json.loads(run(["image", "inspect", "--format", "{{json .}}", "pulseplate-caddy:contract"]))
              image = inspected["Id"]
              if re.fullmatch(r"sha256:[0-9a-f]{64}", image) is None:
                  raise ValueError("image_config_id_invalid")
              if (inspected.get("Os"), inspected.get("Architecture")) != ("linux", "amd64"):
                  raise ValueError("image_platform_invalid")
              binary = run(["run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                            "--entrypoint", "/bin/busybox", image, "sha256sum", "/usr/bin/caddy"]).decode("ascii")
              if re.fullmatch(r"[0-9a-f]{64}  /usr/bin/caddy\n", binary) is None:
                  raise ValueError("binary_identity_invalid")
              # This literal measured source set describes the observed recipe epoch;
              # it does not prove all upstream inputs or a prior ephemeral image equal.
              paths = ("frontend/Dockerfile.caddy-spa", "frontend/package.json", "frontend/package-lock.json",
                       "frontend/.dockerignore", ".github/workflows/frontend-ci.yml",
                       "deploy/Caddyfile", "deploy/Caddyfile.production",
                       "scripts/ci/check_docker_runtime_dependency_surface.py",
                       "scripts/ci/prometheus_source_image.py")
              sources = {}
              for name in paths:
                  path = root / name
                  if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode):
                      raise ValueError("source_identity_invalid")
                  sources[name] = {"bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
              private = Path(tempfile.mkdtemp(prefix="caddy-full-private-", dir=Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)))
              private.chmod(0o700)
              projection_directory = private / "native-projections"
              projection_directory.mkdir(mode=0o700)
              projections = {}
              for name, command in (("version.txt", ("version",)),
                                    ("build-info.txt", ("build-info",)),
                                    ("rebuilt-modules.txt", ("list-modules", "--packages"))):
                  arguments = ["run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                               "--cap-add", "NET_BIND_SERVICE", "--entrypoint", "/usr/bin/caddy", image, *command]
                  observed = run(arguments)
                  if not observed:
                      raise ValueError("native_projection_empty")
                  # run() requires native success and at most 1MiB stdout before retention.
                  # This is a retained-output bound, not a live host-process byte ceiling.
                  path = projection_directory / name
                  with path.open("xb") as output:
                      output.write(observed)
                  path.chmod(0o600)
                  projections[name] = {"image_config_id": image, "argv": [docker, *arguments],
                                       "bytes": len(observed), "sha256": hashlib.sha256(observed).hexdigest()}
              for name, entrypoint, command in (
                      ("default-ca.pem", "/bin/busybox", ("cat", "/etc/ssl/certs/ca-certificates.crt")),
                      ("ca-package-versions.txt", "/sbin/apk", ("list", "--installed", "--manifest", "ca-certificates", "ca-certificates-bundle"))):
                  arguments = ["run", "--rm", "--network", "none", "--read-only", "--cap-drop", "ALL",
                               "--entrypoint", entrypoint, image, *command]
                  observed = run(arguments)
                  if not observed:
                      raise ValueError("native_CA_projection_empty")
                  path = projection_directory / name
                  with path.open("xb") as output:
                      output.write(observed)
                  path.chmod(0o600)
                  projections[name] = {"image_config_id": image, "argv": [docker, *arguments],
                                       "exit_code": 0, "bytes": len(observed),
                                       "sha256": hashlib.sha256(observed).hexdigest()}
              source_evidence = private / "build-evidence"
              source_evidence.mkdir(mode=0o700)
              source_name = "caddy-source-" + private.name
              cidfile = private / "source-extract.cid"
              with caddy_ci_phase("SOURCE16") as remaining:
                  try:
                      result = subprocess.run([docker, "run", "--rm", "--pull", "never", "--name", source_name,
                          "--cidfile", str(cidfile), "--label", "pulseplate.caddy-source=" + source_name,
                          "--network", "none", "--read-only", "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
                          "--entrypoint", "/bin/busybox", image, "tar", "-C", CADDY_BUILD_EVIDENCE_PATH, "-cf", "-", "."],
                          capture_output=True, timeout=remaining(60), check=True)
                      if len(result.stdout) > 9437184:
                          raise ValueError("Caddy source tar bound")
                      with tarfile.open(fileobj=io.BytesIO(result.stdout), mode="r:") as archive:
                          members = archive.getmembers()
                          files = [member for member in members if member.name not in (".", "./")]
                          if (len(members) - len(files) > 1 or len(files) != len(CADDY_BUILD_MEMBERS) or
                                  {member.name.removeprefix("./") for member in files} != CADDY_BUILD_MEMBERS or
                                  any(not member.isdir() for member in members if member.name in (".", "./"))):
                              raise ValueError("Caddy exact build evidence membership")
                          if sum(member.size for member in files) > 8388608:
                              raise ValueError("Caddy source total bound")
                          for member in files:
                              if (not member.isfile() or member.linkname or member.pax_headers or
                                      not 0 < member.size <= 2097152 or member.name not in (member.name.removeprefix("./"), "./" + member.name.removeprefix("./"))):
                                  raise ValueError("Caddy source nonregular member")
                              (source_evidence / member.name.removeprefix("./")).write_bytes(archive.extractfile(member).read())
                  except BaseException:
                      if cidfile.is_file() and not cidfile.is_symlink():
                          cid = cidfile.read_text().strip()
                          if re.fullmatch(r"[0-9a-f]{64}", cid) is None:
                              raise ValueError("Caddy extraction CID malformed")
                          inspected = subprocess.run([docker, "inspect", cid], capture_output=True, timeout=remaining(60), check=False)
                          if inspected.returncode == 0:
                              owned = json.loads(inspected.stdout)[0]
                              if owned["Config"]["Labels"].get("pulseplate.caddy-source") != source_name or owned["Image"] != image:
                                  raise ValueError("Caddy extraction cleanup ownership")
                              subprocess.run([docker, "rm", "--force", cid], capture_output=True, timeout=remaining(60), check=True)
                      raise
              state = private / "subject.json"
              state.write_text(json.dumps({"image_config_id": image, "platform": "linux/amd64",
                                           "binary_sha256": binary.split()[0], "sources": sources,
                                           "native_projections": projections, "build_evidence": str(source_evidence),
                                           "root": str(root), "docker": docker,
                                           "observed_at_utc": datetime.now(timezone.utc).isoformat()}, sort_keys=True))
              state.chmod(0o600)
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write(f"image_id={image}\nstate={state}\n")
          except Exception as error:
              print("Caddy subject capture failed: " + type(error).__name__)
              raise SystemExit(1)
          PY

      - name: Retain original Caddy candidate or current import binding
        id: caddy-retain
        if: ${{ (steps.caddy-build.outcome == 'success' || steps.caddy-import.outcome == 'success') && steps.caddy-image.outcome == 'success' }}
        env:
          CADDY_OBSERVATION_STATE: ${{ steps.caddy-image.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.ci.check_docker_runtime_dependency_surface import caddy_ci_phase
          with caddy_ci_phase("RETENTION") as remaining:
              import hashlib
              import json
              import os
              from pathlib import Path
              import shutil
              import subprocess

              work = Path(os.environ["RUNNER_TEMP"])
              admission = json.loads((work / "caddy-admission/admission.json").read_bytes())
              subject = json.loads(Path(os.environ["CADDY_OBSERVATION_STATE"]).read_bytes())
              evidence = work / "caddy-contract"
              evidence.mkdir(exist_ok=True)
              (evidence / "admission.json").write_text(json.dumps(admission, indent=2))
              if admission["mode"] == "build":
                  metadata_root = work / "caddy-xnet060-metadata"
                  qualification = json.loads((metadata_root / "evidence/qualification.json").read_bytes())
                  if (qualification["failure"] is not None or qualification["status"] != "observed_counterfactual_metadata_only"
                          or qualification["source_head"] != admission["current_head"] or qualification["go_build_invocations"] != 0):
                      raise ValueError("Caddy build metadata predecessor differs")
                  from scripts.ci.prometheus_source_image import decode_objects
                  modules = qualification["derivations"]["a"]["final"]["modules"]
                  packages = decode_objects((metadata_root / "a/output/final-packages.json").read_bytes())
                  command_modules = {package["Module"]["Path"] for package in packages if "Module" in package}
                  expected_modules = {name: (modules[name]["Version"], modules[name]["Sum"]) for name in command_modules}
                  binary_path = Path(os.environ["CADDY_OBSERVATION_STATE"]).parent / "native-projections/build-info.txt"
                  rows = [line.split() for line in binary_path.read_text().splitlines()]
                  from scripts.ci.check_docker_runtime_dependency_surface import validate_caddy_source_evidence
                  validate_caddy_source_evidence(Path(subject["build_evidence"]), binary_metadata=binary_path.read_bytes(),
                      binary_sha256=subject["binary_sha256"], recipe=Path("frontend/Dockerfile.caddy-spa").read_bytes())
                  original_v3 = "github.com/go-jose/go-jose/v3"
                  selected_rows = [row for row in rows if row and row[0] in ("mod", "dep") and row[1] != original_v3]
                  expected_modules.pop(original_v3)
                  if (any(len(row) != 4 for row in selected_rows)
                          or len({row[1] for row in selected_rows}) != len(selected_rows)
                          or {row[1]: (row[2], row[3]) for row in selected_rows} != expected_modules):
                      raise ValueError("Caddy actual ordinary modules differ from qualified projection")
                  private_candidate = Path(os.environ["CADDY_OBSERVATION_STATE"]).parent / "candidate"
                  private_candidate.mkdir(mode=0o700)
                  archive = private_candidate / "candidate.docker.tar"
                  if archive.exists():
                      raise ValueError("Caddy export destination not fresh")
                  subprocess.run([subject["docker"], "save", "--output", str(archive), "pulseplate-caddy:contract"], check=True, timeout=remaining(300))
                  digest = hashlib.sha256()
                  with archive.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""):
                          digest.update(chunk)
                  record = {"producer_run_id": admission["current_run_id"], "producer_run_attempt": admission["current_run_attempt"],
                      "producer_head": admission["current_head"], "repository": admission["repository"],
                      "inputs": admission["inputs"], "image_config_id": subject["image_config_id"],
                      "binary_sha256": subject["binary_sha256"], "platform": "linux/amd64",
                      "archive_sha256": digest.hexdigest(), "archive_bytes": archive.stat().st_size,
                      "metadata_qualification_sha256": hashlib.sha256((metadata_root / "evidence/qualification.json").read_bytes()).hexdigest(),
                      "build_action_invocations": 1, "actual_compiler_starts": "inspect original BuildKit raw log; cache is not assumed"}
                  (private_candidate / "candidate.json").write_text(json.dumps(record, indent=2))
                  for name in ("evidence", "a/output", "b/output"):
                      shutil.copytree(metadata_root / name, evidence / "metadata" / name)
              else:
                  original = admission["original_candidate"]
                  if (subject["image_config_id"], subject["binary_sha256"]) != (original["image_config_id"], original["binary_sha256"]):
                      raise ValueError("Caddy reused native identity differs")
                  # Consumer artifacts retain references, never pretend to be a second producer.
                  (evidence / "original-producer.json").write_text(json.dumps(admission["producer"], indent=2))
          PY

