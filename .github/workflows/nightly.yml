# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Nightly Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpq-dev \
            build-essential \
            python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
          pip list

      - name: Run linting
        run: |
          echo "Running linting checks..."
          ruff check . --config pyproject.toml
          black --check . --config pyproject.toml

      - name: Run type checking (non-blocking)
        continue-on-error: true
        run: |
          echo "Running type checking..."
          # NOTE: mypy is enforced in PR CI via lint/pre-commit.
          # Nightly is focused on long-running tests; mypy is non-blocking here by design.
          mypy app tests --config-file pyproject.toml

      - name: Run security checks
        run: |
          echo "Running security checks..."
          bandit -r . -f json -o bandit-report.json
          safety check --json > safety-report.json

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
          PYTEST_TIMEOUT: 300
        run: |
          START_TIME=$(date +%s)
          export START_TIME
          echo "Running test suite..."
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junitxml=tests/results.xml \
            --tb=short \
            -v \
            -n auto

      - name: Check test coverage
        run: |
          echo "Checking test coverage..."
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib['line-rate']) * 100
          print(f'Coverage: {coverage:.2f}%')
          if coverage < 97:
              print(f'Coverage {coverage:.2f}% is below 97% threshold')
              exit(1)
          "

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: test-results
          path: tests/results.xml
          retention-days: 30

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 30

  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run performance tests
        run: |
          echo "Running performance benchmarks..."
          pytest tests/ \
            -m performance \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 30

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: |
          START_TIME=$(date +%s)
          export START_TIME
          echo "START_TIME=$START_TIME" >> $GITHUB_ENV
          echo "Running integration tests..."
          pytest tests/ \
            -m integration \
            --tb=short \
            -v

      - name: Generate test report
        if: always()
        run: |
          echo "Generating test execution report..."
          : "${START_TIME:=0}"
          TEST_DURATION=$(( $(date +%s) - START_TIME ))
          echo "# Nightly Test Report" > performance-report.md
          echo "## $(date '+%Y-%m-%d %H:%M:%S UTC')" >> performance-report.md
          echo "" >> performance-report.md
          echo "### Test Execution Summary" >> performance-report.md
          echo "- Total test time: ${TEST_DURATION} seconds" >> performance-report.md
          echo "- Python version: 3.13" >> performance-report.md
          echo "- Parallel workers: auto" >> performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 30
