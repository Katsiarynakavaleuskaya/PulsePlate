# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Nightly Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Each shard should complete in 15-25min; 60min provides buffer for slow runners
    env:
      SHARD_TOTAL: 6  # Total number of test shards (MUST match matrix.shard_id array length below)
    strategy:
      fail-fast: false  # Run all shards even if one fails
      matrix:
        shard_id: [1, 2, 3, 4, 5, 6]  # Tenant-based sharding; update SHARD_TOTAL above if adding/removing shards

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpq-dev \
            build-essential \
            python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
          pip list

      - name: Run linting
        if: matrix.shard_id == 1  # Run once (shard 1 only) - codebase-wide check
        run: |
          echo "Running linting checks..."
          ruff check . --config pyproject.toml
          black --check . --config pyproject.toml

      - name: Run type checking (non-blocking)
        if: matrix.shard_id == 1  # Run once (shard 1 only) - codebase-wide check
        continue-on-error: true
        run: |
          echo "Running type checking..."
          # NOTE: mypy is enforced in PR CI via lint/pre-commit.
          # Nightly is focused on long-running tests; mypy is non-blocking here by design.
          # Use the same discovery script as PR workflow to avoid duplicate module detection
          # shellcheck disable=SC2046
          mypy $(scripts/discover_mypy_targets.sh) --config-file pyproject.toml

      - name: Run security checks
        if: matrix.shard_id == 1  # Run once (shard 1 only) - codebase-wide check
        run: |
          set +e  # Disable immediate exit on error
          set -u  # Check undefined variables

          echo "Running security checks..."

          # Version info (should not fail step)
          bandit --version || true

          # Ensure artifact files always exist for upload-artifact
          : > bandit-report.json
          : > safety-report.json
          : > safety-stderr.log
          : > safety-text-report.txt

          BANDIT_EXIT=0
          SAFETY_EXIT=0
          SAFETY_INSTALLED=0

          # Check if safety is installed
          if command -v safety > /dev/null 2>&1; then
            SAFETY_INSTALLED=1
            safety --version || true
          else
            echo "WARNING: safety is not installed (disabled due to typer compatibility issue)"
            echo "Skipping safety checks - see requirements-all.txt for details"
          fi

          # Bandit (don't interrupt step, just record exit code)
          # Exclude tests/ and tests_strict/ - they use assert which is fine for tests
          # Only fail on MEDIUM/HIGH severity (-ll) and MEDIUM/HIGH confidence (-ii)
          bandit -r . -f json -o bandit-report.json --exclude './tests,./tests_strict' -ll -ii || BANDIT_EXIT=$?

          # Safety (v3 preferred: scan with --save-as, fallback to deprecated check)
          # Only run if safety is installed
          if [ "$SAFETY_INSTALLED" -eq 1 ]; then
            safety --stage cicd scan --save-as json safety-report.json > safety-text-report.txt 2> safety-stderr.log
            SAFETY_EXIT=$?

            if [ "$SAFETY_EXIT" -ne 0 ]; then
              echo "safety scan failed (exit=$SAFETY_EXIT). Falling back to deprecated 'safety check'..."
              : > safety-stderr.log
              safety check --json > safety-report.json 2> safety-stderr.log
              SAFETY_EXIT=$?
            fi

            echo "--- safety-stderr.log (first 120 lines) ---"
            sed -n '1,120p' safety-stderr.log || true

            echo "--- safety-text-report.txt (first 120 lines) ---"
            sed -n '1,120p' safety-text-report.txt || true

            echo "--- safety-report.json (first 120 lines) ---"
            sed -n '1,120p' safety-report.json || true
          fi

          echo "Bandit exit code: $BANDIT_EXIT"
          echo "Safety exit code: $SAFETY_EXIT (skipped if safety not installed)"

          # Gate: fail step only if bandit failed
          # Safety is optional until typer compatibility is resolved
          if [ "$BANDIT_EXIT" -ne 0 ]; then
            exit 1
          fi

          # Warn but don't fail if safety failed (when installed)
          if [ "$SAFETY_INSTALLED" -eq 1 ] && [ "$SAFETY_EXIT" -ne 0 ]; then
            echo "WARNING: safety check failed (exit=$SAFETY_EXIT) - review safety-report.json"
          fi

      - name: Run tests with coverage (shard ${{ matrix.shard_id }}/${{ env.SHARD_TOTAL }})
        env:
          PYTHONPATH: .:tests
          PYTEST_TIMEOUT: 300
          PYTHONFAULTHANDLER: 1
          COV_CORE_DATAFILE: coverage-data/shard-${{ matrix.shard_id }}/.coverage
          COVERAGE_FILE: coverage-data/shard-${{ matrix.shard_id }}/.coverage
        run: |
          START_TIME=$(date +%s)
          export START_TIME
          echo "Running test suite (shard ${{ matrix.shard_id }}/${SHARD_TOTAL})..."

          # Create coverage directory for this shard
          mkdir -p coverage-data/shard-${{ matrix.shard_id }}

          run_with_timeout() {
            timeout --signal=SIGQUIT --kill-after=5m 30m "$@"
            status=$?
            if [ "$status" -eq 124 ] || [ "$status" -eq 131 ] || [ "$status" -eq 137 ]; then
              echo "=== Pytest timeout detected (status=$status) ==="
              echo "=== Faulthandler stack traces should appear above (SIGQUIT) ==="
              echo "=== Process snapshot ==="
              ps -eo pid,ppid,stat,etimes,cmd | head -200 || true
              pgrep -fa python || true
            fi
            return "$status"
          }

          # Step 1: Run parallel tests (exclude serial-marked tests to avoid xdist hang)
          echo "=== Running parallel tests (-n 4, excluding serial) ==="
          export COV_CORE_DATAFILE="coverage-data/shard-${{ matrix.shard_id }}/.coverage"
          export COVERAGE_FILE="coverage-data/shard-${{ matrix.shard_id }}/.coverage"
          run_with_timeout python -X faulthandler -m pytest -c pyproject.toml tests/ \
            --shard-id=${{ matrix.shard_id }} \
            --maxfail=10 \
            --cov=. \
            --cov-report=xml:coverage-shard-${{ matrix.shard_id }}.xml \
            --cov-report=term-missing \
            --junitxml=tests/results-shard-${{ matrix.shard_id }}.xml \
            --durations=25 \
            --durations-min=10.0 \
            -rA \
            --tb=short \
            -v \
            -n 4 \
            --dist loadscope \
            -o faulthandler_timeout=300 \
            -m "not serial"

          # Step 2: Run serial tests (coverage-smoke imports heavy modules that hang xdist)
          echo "=== Running serial tests (-n 0, serial only) ==="
          export COV_CORE_DATAFILE="coverage-data/shard-${{ matrix.shard_id }}/.coverage"
          export COVERAGE_FILE="coverage-data/shard-${{ matrix.shard_id }}/.coverage"
          run_with_timeout python -X faulthandler -m pytest -c pyproject.toml tests/ \
            --shard-id=${{ matrix.shard_id }} \
            --maxfail=10 \
            --cov=. \
            --cov-append \
            --cov-report=xml:coverage-shard-${{ matrix.shard_id }}.xml \
            --junitxml=tests/results-serial-shard-${{ matrix.shard_id }}.xml \
            --durations=25 \
            --durations-min=10.0 \
            -rA \
            --tb=short \
            -v \
            -n 0 \
            -o faulthandler_timeout=300 \
            -m serial || true  # Serial tests are coverage-only, non-blocking

      - name: Debug coverage files (shard)
        if: always()
        run: |
          echo "PWD=$(pwd)"
          echo "COV_CORE_DATAFILE=${COV_CORE_DATAFILE}"
          echo "COVERAGE_FILE=${COVERAGE_FILE}"
          echo "=== shard coverage files ==="
          find coverage-data -type f -maxdepth 3 -print -ls || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: coverage-reports-shard-${{ matrix.shard_id }}
          path: |
            coverage-data/shard-${{ matrix.shard_id }}/.coverage*
            coverage-shard-${{ matrix.shard_id }}.xml
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: test-results-shard-${{ matrix.shard_id }}
          path: tests/results-*-shard-${{ matrix.shard_id }}.xml
          retention-days: 30

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always() && matrix.shard_id == 1  # Upload once (shard 1 only) to avoid duplicates
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            safety-text-report.txt
            safety-stderr.log
          retention-days: 30

  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run performance tests
        env:
          PYTHONPATH: .:tests
        run: |
          echo "Running performance benchmarks..."
          pytest tests/ \
            -m performance \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 30

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
          python -m pip install psycopg2-binary -c constraints.txt

      - name: Run integration tests
        env:
          PYTHONPATH: .:tests
          DATABASE_URL: postgresql+psycopg://testuser:testpass@localhost:5432/testdb
        run: |
          START_TIME=$(date +%s)
          export START_TIME
          echo "START_TIME=$START_TIME" >> "$GITHUB_ENV"
          echo "Running integration tests..."
          set +e
          pytest tests/ \
            -m integration \
            --tb=short \
            -v
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 5 ]; then
            echo "No integration tests collected; treating as success."
            exit 0
          fi
          exit "$EXIT_CODE"

      - name: Generate test report
        if: always()
        run: |
          echo "Generating test execution report..."
          : "${START_TIME:=0}"
          TEST_DURATION=$(( $(date +%s) - START_TIME ))
          {
            echo "# Nightly Test Report"
            echo "## $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "### Test Execution Summary"
            echo "- Total test time: ${TEST_DURATION} seconds"
            echo "- Python version: 3.13"
            echo "- Parallel workers: auto"
          } > performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 30

  coverage-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Combining coverage should be fast; timeout detects hangs
    needs: test
    env:
      SHARD_TOTAL: 6  # Must match test job matrix.shard_id array length

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Download coverage artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.6.2
        with:
          pattern: coverage-reports-shard-*
          merge-multiple: true
          path: coverage-artifacts

      - name: Debug coverage artifacts
        if: always()
        run: |
          echo "PWD=$(pwd)"
          echo "=== coverage-artifacts tree ==="
          ls -la coverage-artifacts || true
          echo "=== all files (max depth 3) ==="
          find coverage-artifacts -maxdepth 3 -type f -print || true
          echo "=== coverage XML shard files ==="
          find coverage-artifacts -type f -name "coverage-shard-*.xml" -print || true
          echo "=== binary .coverage data files ==="
          find coverage-artifacts -type f -name ".coverage*" -print || true
          echo "=== file count check ==="
          # Validate binary .coverage files since coverage combine needs them
          # SHARD_TOTAL must match matrix.shard_id array length in test job
          expected_count="${SHARD_TOTAL:-6}"
          echo "expected_count=${expected_count}"
          file_count=$(find coverage-artifacts/coverage-data -type f -name ".coverage*" 2>/dev/null | wc -l || echo 0)
          echo "file_count=${file_count}"
          if [ "${file_count}" -lt "${expected_count}" ]; then
            echo "ERROR: Expected ${expected_count} binary .coverage data files, found ${file_count}."
            exit 1
          fi

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage -c constraints.txt

      - name: Combine coverage and generate report
        run: |
          coverage combine coverage-artifacts/coverage-data/shard-*/.coverage
          coverage debug data
          coverage xml -o coverage-combined.xml
          coverage report -m | head -n 50 || true

      - name: Upload combined coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: coverage-combined
          path: coverage-combined.xml
          retention-days: 30
