name: Nightly Full Test Suite

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref_name || 'schedule' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  id-token: write

env:
  COVERAGE_PY: "3.12"

jobs:
  # Full test suite with all Python versions
  test-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Clean Python cache
        uses: ./.github/actions/clean-python-cache

      - name: Run full test suite (including slow tests)
        run: |
          python -m pytest \
            --cov=app \
            --cov=core \
            --cov=bmi_core \
            --cov=nutrition_core \
            --cov=nutrition_plate \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=tests/results.xml \
            --tb=short \
            -v \
            -n auto \
            -m "slow or demo"

      - name: Upload coverage to Codecov
        if: matrix.python-version == env.COVERAGE_PY
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: tests/results.xml
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: matrix.python-version == env.COVERAGE_PY
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

  # Security and quality checks
  security-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run security checks
        run: |
          # Bandit security scan
          bandit -r app/ core/ bmi_core/ nutrition_core/ nutrition_plate/ -f json -o bandit-report.json

          # pip-audit for vulnerability scan
          pip-audit --requirement requirements.txt --format=json --output=pip-audit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # Performance monitoring
  performance-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run performance tests and record timing
        run: |
          TEST_START=$(date +%s)
          # Run tests with timing information
          python -m pytest \
            --durations=10 \
            --tb=short \
            -v \
            -n auto
          TEST_END=$(date +%s)
          TEST_DURATION=$((TEST_END - TEST_START))

          # Generate performance report with actual timing
          echo "## Performance Report" > performance-report.md
          echo "Generated: $(date)" >> performance-report.md
          echo "" >> performance-report.md
          echo "### Test Execution Summary" >> performance-report.md
          echo "- Total test time: ${TEST_DURATION} seconds" >> performance-report.md
          echo "- Python version: 3.12" >> performance-report.md
          echo "- Parallel workers: auto" >> performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 30
