# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Nightly Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # Full test suite can take 90-120min, buffer for slower runners
    strategy:
      fail-fast: false  # Run all shards even if one fails
      matrix:
        shard_id: [1, 2, 3, 4, 5, 6]  # Tenant-based sharding (see pytest_sharding.py)

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpq-dev \
            build-essential \
            python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
          pip list

      - name: Run linting
        run: |
          echo "Running linting checks..."
          ruff check . --config pyproject.toml
          black --check . --config pyproject.toml

      - name: Run type checking (non-blocking)
        continue-on-error: true
        run: |
          echo "Running type checking..."
          # NOTE: mypy is enforced in PR CI via lint/pre-commit.
          # Nightly is focused on long-running tests; mypy is non-blocking here by design.
          # Use the same discovery script as PR workflow to avoid duplicate module detection
          # shellcheck disable=SC2046
          mypy $(scripts/discover_mypy_targets.sh) --config-file pyproject.toml

      - name: Run security checks
        run: |
          set +e  # Отключаем немедленный выход при ошибке
          set -u  # Проверяем неопределённые переменные

          echo "Running security checks..."

          # Версии (не должны валить step)
          bandit --version || true
          safety --version || true
          command -v safety || true

          # Гарантируем, что файлы всегда существуют для upload-artifact
          : > bandit-report.json
          : > safety-report.json
          : > safety-stderr.log
          : > safety-text-report.txt

          BANDIT_EXIT=0
          SAFETY_EXIT=0

          # Bandit (не прерываем step, просто фиксируем exit code)
          # Exclude tests/ and tests_strict/ - they use assert which is fine for tests
          # Only fail on MEDIUM/HIGH severity (-ll) and MEDIUM/HIGH confidence (-ii)
          bandit -r . -f json -o bandit-report.json --exclude './tests,./tests_strict' -ll -ii || BANDIT_EXIT=$?

          # Safety (v3 preferred: scan with --save-as, fallback to deprecated check)
          safety --stage cicd scan --save-as json safety-report.json > safety-text-report.txt 2> safety-stderr.log
          SAFETY_EXIT=$?

          if [ "$SAFETY_EXIT" -ne 0 ]; then
            echo "safety scan failed (exit=$SAFETY_EXIT). Falling back to deprecated 'safety check'..."
            : > safety-stderr.log
            safety check --json > safety-report.json 2> safety-stderr.log
            SAFETY_EXIT=$?
          fi

          echo "Bandit exit code: $BANDIT_EXIT"
          echo "Safety exit code:  $SAFETY_EXIT"

          echo "--- safety-stderr.log (first 120 lines) ---"
          sed -n '1,120p' safety-stderr.log || true

          echo "--- safety-text-report.txt (first 120 lines) ---"
          sed -n '1,120p' safety-text-report.txt || true

          echo "--- safety-report.json (first 120 lines) ---"
          sed -n '1,120p' safety-report.json || true

          # Гейт: валим step, если кто-то из инструментов упал
          if [ "$BANDIT_EXIT" -ne 0 ] || [ "$SAFETY_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Run tests with coverage (shard ${{ matrix.shard_id }}/6)
        env:
          PYTHONPATH: .:app:core:tests
          PYTEST_TIMEOUT: 300
        run: |
          START_TIME=$(date +%s)
          export START_TIME
          echo "Running test suite (shard ${{ matrix.shard_id }}/6)..."
          # Use tenant-based sharding from pytest_sharding.py
          # Each shard runs tests for specific functional domain
          # -n 4: fixed workers for predictable performance
          pytest -c pyproject.toml tests/ \
            --shard-id=${{ matrix.shard_id }} \
            --maxfail=10 \
            --cov=. \
            --cov-report=xml:coverage-shard-${{ matrix.shard_id }}.xml \
            --cov-report=term-missing \
            --junitxml=tests/results-shard-${{ matrix.shard_id }}.xml \
            --tb=short \
            -v \
            -n 4 \
            --dist loadscope

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: coverage-reports-shard-${{ matrix.shard_id }}
          path: |
            coverage-shard-${{ matrix.shard_id }}.xml
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: test-results-shard-${{ matrix.shard_id }}
          path: tests/results-shard-${{ matrix.shard_id }}.xml
          retention-days: 30

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            safety-text-report.txt
            safety-stderr.log
          retention-days: 30

  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run performance tests
        env:
          PYTHONPATH: .:app:core:tests
        run: |
          echo "Running performance benchmarks..."
          pytest tests/ \
            -m performance \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 30

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
          python -m pip install psycopg2-binary -c constraints.txt

      - name: Run integration tests
        env:
          PYTHONPATH: .:app:core:tests
          DATABASE_URL: postgresql+psycopg://testuser:testpass@localhost:5432/testdb
        run: |
          START_TIME=$(date +%s)
          export START_TIME
          echo "START_TIME=$START_TIME" >> $GITHUB_ENV
          echo "Running integration tests..."
          set +e
          pytest tests/ \
            -m integration \
            --tb=short \
            -v
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 5 ]; then
            echo "No integration tests collected; treating as success."
            exit 0
          fi
          exit "$EXIT_CODE"

      - name: Generate test report
        if: always()
        run: |
          echo "Generating test execution report..."
          : "${START_TIME:=0}"
          TEST_DURATION=$(( $(date +%s) - START_TIME ))
          echo "# Nightly Test Report" > performance-report.md
          echo "## $(date '+%Y-%m-%d %H:%M:%S UTC')" >> performance-report.md
          echo "" >> performance-report.md
          echo "### Test Execution Summary" >> performance-report.md
          echo "- Total test time: ${TEST_DURATION} seconds" >> performance-report.md
          echo "- Python version: 3.13" >> performance-report.md
          echo "- Parallel workers: auto" >> performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        if: always()
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 30
