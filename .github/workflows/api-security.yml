name: API Security Testing

on:
  push:
    branches: [main, develop, feat/**, fix/**, feature/**]
  pull_request:
    branches: [main, develop, feat/**, fix/**, feature/**]
  schedule:
    - cron: '0 4 * * 2' # Every Tuesday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  api-security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Start application
        run: |
          python -m uvicorn app:app --host 0.0.0.0 --port 8000 &
          sleep 10
        env:
          APP_ENV: test
          API_KEY: test_key

      - name: Run API security tests
        run: |
          # Test authentication endpoints
          curl -f http://localhost:8000/health || exit 1

          # Test rate limiting
          for i in {1..20}; do
            curl -s http://localhost:8000/health > /dev/null
          done

          # Test input validation
          curl -f -X POST http://localhost:8000/bmi \
            -H "Content-Type: application/json" \
            -d '{"height": 180, "weight": 70}' || exit 1

          # Test SQL injection protection
          curl -f -X POST http://localhost:8000/bmi \
            -H "Content-Type: application/json" \
            -d '{"height": 180, "weight": "70; DROP TABLE users; --"}' || exit 1

      - name: Test API endpoints security
        run: |
          # Test that sensitive endpoints require authentication
          curl -f http://localhost:8000/debug_env && exit 1 || true

          # Test CORS headers
          curl -I http://localhost:8000/health | grep -i "access-control-allow-origin" || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f uvicorn || true
