name: Codecov Coverage

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install codecov

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "ci-test-key"
          APP_ENV: ci
        run: |
          python -m pytest tests --cov=. --cov-report=xml --cov-fail-under=97 --junitxml=tests/results.xml -o junit_family=legacy -q

      - name: Restore static data fixtures
        if: always()
        run: git checkout -- data/food_aliases.csv cache/food_db/database_versions.json

      - name: Resolve Codecov token
        if: ${{ github.event_name == 'push' }}
        id: resolve-codecov-token
        shell: bash
        env:
          CODECOV_TOKEN_CI: ${{ secrets.CODECOV_TOKEN_CI }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "$CODECOV_TOKEN_CI" ]]; then
            echo "token=$CODECOV_TOKEN_CI" >> "$GITHUB_OUTPUT"
          elif [[ -n "$CODECOV_TOKEN" ]]; then
            echo "token=$CODECOV_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Codecov
        if: ${{ github.event_name == 'push' && steps.resolve-codecov-token.outputs.token != '' }}
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ steps.resolve-codecov-token.outputs.token }}

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: tests/results.xml
          if-no-files-found: ignore

      - name: Upload test results to Codecov
        if: ${{ github.event_name == 'push' && !cancelled() && steps.resolve-codecov-token.outputs.token != '' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ steps.resolve-codecov-token.outputs.token }}
