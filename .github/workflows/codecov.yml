name: Codecov Coverage

permissions:
  contents: read

on:
  push:
    branches: [ main, develop, feat/**, fix/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          elif [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          pip install codecov pytest pytest-cov

      - name: Run tests with coverage
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/app:${{ github.workspace }}/tests"
          VIP_MODULE_ENABLED: "true"
          FEATURE_PREMIUM_NUTRITION: "true"
          API_KEY: "ci-test-key"
          APP_ENV: ci
        run: |
          python -m pytest tests --cov=. --cov-report=xml --cov-fail-under=97 --junitxml=tests/results.xml -o junit_family=legacy -q

      - name: Restore static data fixtures
        if: always()
        run: git checkout -- data/food_aliases.csv cache/food_db/database_versions.json || true

      - name: Upload to Codecov
        if: ${{ github.event_name == 'push' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Upload test artifacts
        if: always()
        uses: ./.github/actions/upload-artifacts
        with:
          coverage-file: coverage.xml
          junit-file: tests/results.xml
          python-version: "3.12"
          artifact-prefix: codecov

      - name: Upload test results to Codecov
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: codecov/test-results-action@v1
