name: Setup Python Tools

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.12'
      install-dev-deps:
        description: 'Install development dependencies'
        required: false
        type: boolean
        default: true
      install-security-tools:
        description: 'Install security tools (bandit, pip-audit)'
        required: false
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install development dependencies
        if: inputs.install-dev-deps == true
        run: |
          pip install -r requirements-dev.txt

      - name: Install security tools
        if: inputs.install-security-tools == true
        run: |
          pip install bandit pip-audit

      - name: Verify installations
        run: |
          echo "🔍 Verifying Python tool installations..."
          python --version
          pip --version

          if [ "${{ inputs.install-dev-deps }}" = "true" ]; then
            echo "📦 Development tools:"
            python -c "import ruff; print(f'✅ ruff: {ruff.__version__}')" 2>/dev/null || echo "❌ ruff not installed"
            python -c "import mypy; print(f'✅ mypy: {mypy.__version__}')" 2>/dev/null || echo "❌ mypy not installed"
            python -c "import black; print(f'✅ black: {black.__version__}')" 2>/dev/null || echo "❌ black not installed"
          fi

          if [ "${{ inputs.install-security-tools }}" = "true" ]; then
            echo "🔒 Security tools:"
            python -c "import bandit; print(f'✅ bandit: {bandit.__version__}')" 2>/dev/null || echo "❌ bandit not installed"
            python -c "import pip_audit; print(f'✅ pip-audit: {pip_audit.__version__}')" 2>/dev/null || echo "❌ pip-audit not installed"
          fi
