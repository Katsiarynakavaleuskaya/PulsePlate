name: PR Tests (Fast)

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@1d7c6f60b5dfe11f636e381f8ed5fe695c8ddef0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0110b67a18425f7ee6b
        with:
          python-version: '3.13.5'

      - name: Cache pip
        uses: actions/cache@6849a6489940f00c2f30c00b8107265d6674ca75
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Ruff Lint
        run: ruff check . --output-format=github

      - name: Black Check
        run: black --check --diff .

      - name: Determine changed files (PR)
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          set -e
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only --diff-filter=AMRT origin/${{ github.base_ref }}... | grep -E '\\.py$' || true)
          echo "Changed Python files:\n$CHANGED"
          CHANGED_SP=${CHANGED//$'\n'/ }
          echo "files=$CHANGED_SP" >> $GITHUB_OUTPUT

      - name: Mypy (changed files only)
        if: github.event_name != 'pull_request' || steps.changed.outputs.files != ''
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mypy ${{ steps.changed.outputs.files }}
          else
            mypy app core
          fi

  tests:
    needs: [lint]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@1d7c6f60b5dfe11f636e381f8ed5fe695c8ddef0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0110b67a18425f7ee6b
        with:
          python-version: '3.13.5'

      - name: Cache pip
        uses: actions/cache@6849a6489940f00c2f30c00b8107265d6674ca75
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Determine changes
        id: filter
        uses: dorny/paths-filter@4512585191d433e5f4186d08d5a971cbff2e95e6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            code:
              - 'app/**'
              - 'core/**'
              - 'providers/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - '.coveragerc'
            docs:
              - 'README.md'
              - 'docs/**'
              - '**/*.md'

      - name: Run fast test suite with coverage (no slow/MC/demo)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        env:
          PYTHONUNBUFFERED: '1'
          BAYESIAN_PERSIST: '0'
          MC_SEED: '2025'
          MC_SAMPLES: '5'
          MC_SAMPLES_FEW: '3'
        run: |
          pytest -c pyproject.toml -m "not slow and not monte_carlo and not demo" \
            --cov=. --cov-report=xml --junitxml=junit.xml -ra tests

      - name: Diff coverage on changed lines (PR)
        if: github.event_name == 'pull_request' && steps.filter.outputs.code == 'true' && hashFiles('coverage.xml') != ''
        run: |
          diff-cover coverage.xml --compare-branch origin/${{ github.base_ref }} --fail-under=97

      - name: Upload coverage.xml (PR diagnostics)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@6f51ac03b9356f8fe4d9a59af4d8637605335674
        with:
          name: pr-coverage-xml
          path: coverage.xml

      - name: JUnit report upload
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f8fe4d9a59af4d8637605335674
        with:
          name: junit-report
          path: junit.xml
