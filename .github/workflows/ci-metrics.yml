# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Metrics

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  collect-ci-metrics:
    name: collect-ci-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"

      - name: Collect Tier 1 CI metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/ci/collect_ci_metrics.py \
            --repo "${GITHUB_REPOSITORY}" \
            --json-out ci-metrics-summary.json \
            --markdown-out ci-metrics-summary.md

      - name: Publish metrics to step summary
        run: |
          set -euo pipefail
          cat ci-metrics-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload CI metrics artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: ci-metrics-summary
          path: |
            ci-metrics-summary.json
            ci-metrics-summary.md
          if-no-files-found: error
          retention-days: 14
