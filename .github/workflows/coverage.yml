name: Tests + Coverage (Codecov)

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main, feat/**, fix/** ]

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Linting handled via pre-commit locally; CI lint optional

      - name: Run tests with coverage (97% gate)
        run: |
          pytest -q --maxfail=1 \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=96.5 \
            --junitxml=tests/results.xml -o junit_family=legacy

      - name: Restore static data fixtures
        if: always()
        run: git checkout -- data/food_aliases.csv cache/food_db/database_versions.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ github.event_name == 'push' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false  # Allow tokenless uploads without failing CI on auth issues
          verbose: true

      - name: Upload JUnit test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit
          path: tests/results.xml
          if-no-files-found: ignore

      - name: Upload test results to Codecov
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: codecov/test-results-action@v1
