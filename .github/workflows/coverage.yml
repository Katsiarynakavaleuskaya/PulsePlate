name: Tests + Coverage (Codecov)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Linting handled via pre-commit locally; CI lint optional

      - name: Run tests with coverage (97% gate)
        run: |
          pytest -q --maxfail=1 \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=97 \
            --junitxml=tests/results.xml -o junit_family=legacy

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Resolve Codecov token
        if: ${{ github.event_name == 'push' }}
        id: resolve-codecov-token
        shell: bash
        env:
          CODECOV_TOKEN_CI: ${{ secrets.CODECOV_TOKEN_CI }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "$CODECOV_TOKEN_CI" ]]; then
            echo "token=$CODECOV_TOKEN_CI" >> "$GITHUB_OUTPUT"
          elif [[ -n "$CODECOV_TOKEN" ]]; then
            echo "token=$CODECOV_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: ${{ github.event_name == 'push' && steps.resolve-codecov-token.outputs.token != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          token: ${{ steps.resolve-codecov-token.outputs.token }}

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: tests/results.xml
          if-no-files-found: ignore

      - name: Upload test results to Codecov
        if: ${{ github.event_name == 'push' && !cancelled() && steps.resolve-codecov-token.outputs.token != '' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ steps.resolve-codecov-token.outputs.token }}
