name: CD
on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
    branches: [ main ]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read
  id-token: write
  deployments: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
    concurrency:
      group: cd-smoke-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: ⚠️ Smoke Test Warning
        run: |
          echo "⚠️  WARNING: This is a SMOKE TEST only!"
          echo "Containers run on ephemeral GitHub Actions runners and will be destroyed after completion."
          echo "This is NOT a persistent staging deployment."
          echo "For iOS app development, Ollama provides sufficient AI capabilities locally."

      - name: Resolve image tag
        id: meta
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging with Ollama
        run: |
          echo "🚀 Deploying to staging with Ollama..."

          # Login to GHCR
          echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Wait for Docker image to be available (with retry)
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Checking for image availability (attempt $attempt/$max_attempts)..."

            if docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.TAG }} >/dev/null 2>&1; then
              echo "✅ Docker image is available"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Docker image not available after $max_attempts attempts"
              docker logout ghcr.io
              exit 1
            fi

            echo "Image not ready, waiting 10 seconds..."
            sleep 10
          done

          # Stop existing container if running
          if ! docker stop pulseplate-staging 2>/dev/null; then
            echo "::warning::Failed to stop pulseplate-staging container (may not exist)"
          fi
          if ! docker rm pulseplate-staging 2>/dev/null; then
            echo "::warning::Failed to remove pulseplate-staging container (may not exist)"
          fi

          # Run new container
          docker run -d \
            --name pulseplate-staging \
            --restart unless-stopped \
            -p 8000:8000 \
            -e ENVIRONMENT=staging \
            -e OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://host.docker.internal:11434} \
            -e OLLAMA_API_KEY=${{ secrets.OLLAMA_API_KEY }} \
            -e OPENAI_API_KEY=${{ secrets.PULSEPLATE_OPENAI }} \
            -e AI_ROUTER_ENABLED=true \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.TAG }}

          echo "✅ Staging deployment completed"

          # Cleanup: logout from GHCR
          docker logout ghcr.io

      - name: Verify staging health
        run: |
          echo "🔍 Verifying staging health..."

          # Wait for container to be running (with timeout)
          timeout 30 sh -c 'until docker ps | grep -q pulseplate-staging; do sleep 1; done' || {
            echo "❌ Container failed to start after 30 seconds"
            docker logs pulseplate-staging
            exit 1
          }
          echo "✅ Container is running"

          # Health check
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Health check attempt $attempt/$max_attempts..."

            if curl -f http://localhost:8000/health >/dev/null 2>&1; then
              echo "✅ Staging health check passed"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Staging health check failed after $max_attempts attempts"
              docker logs pulseplate-staging
              exit 1
            fi

            sleep 2
          done

  production-smoke-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: production
    concurrency:
      group: cd-production-smoke-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: ⚠️ Production Smoke Test Warning
        run: |
          echo "⚠️  WARNING: This is a PRODUCTION SMOKE TEST only!"
          echo "Containers run on ephemeral GitHub Actions runners and will be destroyed after completion."
          echo "This is NOT a persistent production deployment."
          echo "For iOS app production, consider deploying Ollama to a dedicated server for better performance."

      - name: Check if this is a tag build
        id: check-tag
        run: |
          # Check if this is triggered by a tag push
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.head_branch }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve image tag
        id: meta
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production with Ollama
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        run: |
          echo "🚀 Deploying to production with Ollama..."

          # Login to GHCR
          echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Wait for Docker image to be available (with retry)
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Checking for image availability (attempt $attempt/$max_attempts)..."

            if docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.TAG }} >/dev/null 2>&1; then
              echo "✅ Docker image is available"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Docker image not available after $max_attempts attempts"
              docker logout ghcr.io
              exit 1
            fi

            echo "Image not ready, waiting 10 seconds..."
            sleep 10
          done

          # Stop existing container if running
          if ! docker stop pulseplate-production 2>/dev/null; then
            echo "::warning::Failed to stop pulseplate-production container (may not exist)"
          fi
          if ! docker rm pulseplate-production 2>/dev/null; then
            echo "::warning::Failed to remove pulseplate-production container (may not exist)"
          fi

          # Run new container
          docker run -d \
            --name pulseplate-production \
            --restart unless-stopped \
            -p 8001:8000 \
            -e ENVIRONMENT=production \
            -e OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-https://ollama.com} \
            -e OLLAMA_API_KEY=${{ secrets.OLLAMA_API_KEY }} \
            -e OPENAI_API_KEY=${{ secrets.PULSEPLATE_OPENAI }} \
            -e AI_ROUTER_ENABLED=true \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.TAG }}

          echo "✅ Production deployment completed"

          # Cleanup: logout from GHCR
          docker logout ghcr.io

      - name: Verify production health
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        run: |
          echo "🔍 Verifying production health..."

          # Wait for container to be running (with timeout)
          timeout 30 sh -c 'until docker ps | grep -q pulseplate-production; do sleep 1; done' || {
            echo "❌ Container failed to start after 30 seconds"
            docker logs pulseplate-production
            exit 1
          }
          echo "✅ Container is running"

          # Health check
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Health check attempt $attempt/$max_attempts..."

            if curl -f http://localhost:8001/health >/dev/null 2>&1; then
              echo "✅ Production health check passed"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Production health check failed after $max_attempts attempts"
              docker logs pulseplate-production
              exit 1
            fi

            sleep 2
          done
