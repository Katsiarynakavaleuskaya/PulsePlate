# CD Workflow - Continuous Deployment
#
# Environment Configuration:
# - Staging: AI_ROUTER_ENABLED=false (no AI features, basic functionality only)
# - Production: AI_ROUTER_ENABLED=true (full AI features with API keys)
#
# Secrets Required:
# - Staging: GHCR_READ_TOKEN, SSH_* secrets
# - Production: GHCR_READ_TOKEN, OLLAMA_API_KEY, PULSEPLATE_OPENAI, SSH_* secrets

name: CD
on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
    branches: [ main ]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read
  id-token: write
  deployments: write

jobs:
  staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
    concurrency:
      group: cd-staging-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate environment
        run: |
          echo "🔍 Validating staging environment..."
          ./scripts/validate-ci-environment.sh
        env:
          ENVIRONMENT: staging
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging over SSH
        uses: appleboy/ssh-action@3ca8a7c5359ac6ad91aa47f1946ece1c3b025004
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            export GHCR_USER='${{ github.actor }}'
            export GHCR_TOKEN='${{ secrets.GHCR_READ_TOKEN }}'   # PAT with read:packages
            export STAGING_DOMAIN='${{ secrets.STAGING_DOMAIN }}'
            cd /srv/pulseplate-staging
            ./deploy.sh '${{ steps.meta.outputs.TAG }}'

      - name: Verify health
        run: curl -v --fail https://${{ secrets.STAGING_DOMAIN }}/health

  production:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: production
    concurrency:
      group: cd-production-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate environment
        run: |
          echo "🔍 Validating production environment..."
          ./scripts/validate-ci-environment.sh
        env:
          ENVIRONMENT: production
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          PULSEPLATE_OPENAI: ${{ secrets.PULSEPLATE_OPENAI }}

      - name: Check if this is a tag build
        id: check-tag
        run: |
          # Check if this is triggered by a tag push
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.head_branch }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve image tag
        id: meta
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Wait for Docker image to be available
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          # Authenticate to GHCR so we can pull the private image
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Wait for Docker image to be built and pushed
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Checking for image availability (attempt $attempt/$max_attempts)..."

            # Try to pull the image (this will now succeed once built)
            if docker pull ghcr.io/${{ github.repository }}:${{ github.sha }} >/dev/null 2>&1; then
              echo "✅ Docker image is available"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Docker image not available after $max_attempts attempts"
              exit 1
            fi

            echo "Image not ready, waiting 10 seconds..."
            sleep 10
          done

      - name: Deploy to production over SSH
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        uses: appleboy/ssh-action@3ca8a7c5359ac6ad91aa47f1946ece1c3b025004
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            export GHCR_USER='${{ github.actor }}'
            export GHCR_TOKEN='${{ secrets.GHCR_READ_TOKEN }}'   # PAT with read:packages
            export PRODUCTION_DOMAIN='${{ secrets.PRODUCTION_DOMAIN }}'
            cd /srv/pulseplate-production
            ./deploy.sh '${{ steps.meta.outputs.TAG }}'

      - name: Verify production health
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        run: curl -v --fail https://${{ secrets.PRODUCTION_DOMAIN }}/health
