name: CD
on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
    branches: [ main ]

permissions:
  contents: read
  packages: read
  id-token: write
  deployments: write

jobs:
  staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
    concurrency:
      group: cd-staging-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging over SSH
        uses: appleboy/ssh-action@3ca8a7c5359ac6ad91aa47f1946ece1c3b025004
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            export GHCR_USER='${{ github.actor }}'
            export GHCR_TOKEN='${{ secrets.GHCR_READ_TOKEN }}'   # PAT with read:packages
            export STAGING_DOMAIN='${{ secrets.STAGING_DOMAIN }}'
            cd /srv/pulseplate-staging
            ./deploy.sh '${{ steps.meta.outputs.TAG }}'

      - name: Verify health
        run: curl -v --fail https://${{ secrets.STAGING_DOMAIN }}/health

  production:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
    concurrency:
      group: cd-production-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Check if this is a tag build
        id: check-tag
        run: |
          # Check if the workflow_run was triggered by a tag push
          # head_branch contains just the tag name (e.g., "v1.0.0") for tag pushes
          if [[ "${{ github.event.workflow_run.head_branch }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve image tag
        id: meta
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production over SSH
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        uses: appleboy/ssh-action@3ca8a7c5359ac6ad91aa47f1946ece1c3b025004
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            export GHCR_USER='${{ github.actor }}'
            export GHCR_TOKEN='${{ secrets.GHCR_READ_TOKEN }}'   # PAT with read:packages
            export PRODUCTION_DOMAIN='${{ secrets.PRODUCTION_DOMAIN }}'
            cd /srv/pulseplate-production
            ./deploy.sh '${{ steps.meta.outputs.TAG }}'

      - name: Verify production health
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        run: curl -v --fail https://${{ secrets.PRODUCTION_DOMAIN }}/health
