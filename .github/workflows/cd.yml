name: CD
on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
    branches: [ main ]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read
  id-token: write
  deployments: write

jobs:
  staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
    concurrency:
      group: cd-staging-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging with Ollama
        run: |
          echo "🚀 Deploying to staging with Ollama..."

          # Pull the latest image
          echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.TAG }}

          # Stop existing container if running
          docker stop pulseplate-staging || true
          docker rm pulseplate-staging || true

          # Run new container
          docker run -d \
            --name pulseplate-staging \
            --restart unless-stopped \
            -p 8000:8000 \
            -e ENVIRONMENT=staging \
            -e OLLAMA_HOST=http://host.docker.internal:11434 \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.TAG }}

          echo "✅ Staging deployment completed"

      - name: Verify staging health
        run: |
          echo "🔍 Verifying staging health..."
          sleep 10  # Wait for container to start

          # Check if container is running
          if docker ps | grep -q pulseplate-staging; then
            echo "✅ Container is running"
          else
            echo "❌ Container failed to start"
            docker logs pulseplate-staging
            exit 1
          fi

          # Health check
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Health check attempt $attempt/$max_attempts..."

            if curl -f http://localhost:8000/health >/dev/null 2>&1; then
              echo "✅ Staging health check passed"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Staging health check failed after $max_attempts attempts"
              docker logs pulseplate-staging
              exit 1
            fi

            sleep 2
          done

  production:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: production
    concurrency:
      group: cd-production-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Check if this is a tag build
        id: check-tag
        run: |
          # Check if this is triggered by a tag push
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.head_branch }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve image tag
        id: meta
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production with Ollama
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        run: |
          echo "🚀 Deploying to production with Ollama..."

          # Pull the latest image
          echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.TAG }}

          # Stop existing container if running
          docker stop pulseplate-production || true
          docker rm pulseplate-production || true

          # Run new container
          docker run -d \
            --name pulseplate-production \
            --restart unless-stopped \
            -p 8001:8000 \
            -e ENVIRONMENT=production \
            -e OLLAMA_HOST=http://host.docker.internal:11434 \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.TAG }}

          echo "✅ Production deployment completed"

      - name: Verify production health
        if: ${{ steps.check-tag.outputs.is_tag == 'true' }}
        run: |
          echo "🔍 Verifying production health..."
          sleep 10  # Wait for container to start

          # Check if container is running
          if docker ps | grep -q pulseplate-production; then
            echo "✅ Container is running"
          else
            echo "❌ Container failed to start"
            docker logs pulseplate-production
            exit 1
          fi

          # Health check
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Health check attempt $attempt/$max_attempts..."

            if curl -f http://localhost:8001/health >/dev/null 2>&1; then
              echo "✅ Production health check passed"
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Production health check failed after $max_attempts attempts"
              docker logs pulseplate-production
              exit 1
            fi

            sleep 2
          done
