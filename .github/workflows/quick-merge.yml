name: Quick Merge

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pull_request_number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull request number to merge'
        required: true
        type: string

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    if: >
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request_review' &&
          github.event.review.state == 'approved' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == 'main'
        )
      )
    steps:
      - name: Determine pull request number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pull_request_number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          # Validate PR_NUMBER is non-empty and consists only of digits
          if [ -z "$PR_NUMBER" ]; then
            echo "Error: PR_NUMBER is empty" >&2
            exit 1
          fi

          if ! echo "$PR_NUMBER" | grep -E '^[0-9]+$' > /dev/null; then
            echo "Error: PR_NUMBER '$PR_NUMBER' is not a valid number (must contain only digits)" >&2
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for CI checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.pr_number }}', 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Wait up to 10 minutes for CI checks
            const maxWaitTime = 10 * 60 * 1000; // 10 minutes
            const checkInterval = 30 * 1000; // 30 seconds
            const startTime = Date.now();

            while (Date.now() - startTime < maxWaitTime) {
              // Get PR details to obtain the head SHA
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              });

              // Early policy guard for workflow_dispatch as well
              if (pr.base.ref !== 'main' || pr.user?.login === 'dependabot[bot]') {
                core.info(`Skipping wait: base='${pr.base.ref}', author='${pr.user?.login}'.`);
                core.setFailed('PR does not meet Quick Merge policy.');
                return;
              }

              const prHeadSha = pr.head.sha;

              // Get checks for the PR head SHA
              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: prHeadSha,
                per_page: 100
              });

              // Also get commit statuses for comprehensive check coverage
              const { data: statuses } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: prHeadSha,
                per_page: 100
              });

              const requiredChecks = ['tests (3.12)', 'tests (3.13)', 'bandit', 'coverage', 'CodeRabbit'];

              // Check that each required check exists and has passed with "success" conclusion
              const checkResults = requiredChecks.map(requiredCheck => {
                // Look for check runs first with suffix matching
                const matchingCheck = checks.check_runs
                  .filter(cr => cr.status === 'completed')
                  .find(cr =>
                    cr.name === requiredCheck ||
                    cr.name.endsWith(` / ${requiredCheck}`) ||
                    cr.name.endsWith(requiredCheck)
                  );

                // If not found in check runs, look in commit statuses with suffix matching
                const matchingStatus = !matchingCheck
                  ? statuses.statuses.find(s =>
                      s.context === requiredCheck ||
                      s.context.endsWith(` / ${requiredCheck}`) ||
                      s.context.endsWith(requiredCheck)
                    )
                  : null;
                const conclusion = matchingCheck?.conclusion ?? matchingStatus?.state;
                const isPendingStatus = conclusion === 'pending';
                const found = !!matchingCheck || (!!matchingStatus && !isPendingStatus);
                const passed = conclusion === 'success';

                return {
                  name: requiredCheck,
                  found,
                  passed,
                  conclusion
                };
              });

              const allChecksFound = checkResults.every(result => result.found);
              const allChecksPassed = checkResults.every(result => result.passed);

              if (allChecksFound && allChecksPassed) {
                core.info('All required CI checks passed');
                return;
              }

              // Find any required check that has terminal failure states (excluding pending/in_progress)
              const terminalFailureStates = ['failure', 'timed_out', 'cancelled', 'action_required', 'stale', 'error', 'neutral', 'skipped'];
              const nonSuccessChecks = checkResults.filter(result =>
                result.found && terminalFailureStates.includes(result.conclusion)
              );

              if (nonSuccessChecks.length > 0) {
                core.setFailed(`CI checks not successful: ${nonSuccessChecks.map(c => `${c.name} (${c.conclusion})`).join(', ')}`);
                return;
              }

              const completedCount = checkResults.filter(result => result.found).length;
              core.info(`Waiting for CI checks... (${completedCount}/${requiredChecks.length} completed)`);
              const MAX_JITTER_MS = 5000; // 5s upper bound to reduce thundering herd and provide backoff breathing room
              const jitter = Math.floor(Math.random() * MAX_JITTER_MS);
              await new Promise(resolve => setTimeout(resolve, checkInterval + jitter));
            }

            core.setFailed('Timeout waiting for CI checks to complete');

      - name: Merge pull request

        id: merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            // Wait briefly for mergeability to be computed
            for (let i = 0; (pr.mergeable === null || pr.mergeable_state === 'unknown') && i < 10; i++) {
              await new Promise(r => setTimeout(r, 3000));
              const res = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              pr = res.data;
            }

            // Enforce policies for workflow_dispatch as well
            if (pr.base.ref !== 'main') {
              core.info(`PR #${prNumber} targets '${pr.base.ref}', not 'main'. Aborting.`);
              return { merged: false, reason: 'wrong-base' };
            }
            if (pr.user?.login === 'dependabot[bot]') {
              core.info(`PR #${prNumber} is from Dependabot. Aborting.`);
              return { merged: false, reason: 'dependabot' };
            }

            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is not open. Current state: ${pr.state}`);
              return { merged: false, reason: 'not-open' };
            }

            if (!pr.mergeable) {
              if (pr.mergeable === null) {
                core.info(`PR #${prNumber} mergeable status is still being calculated.`);
              } else {
                core.info(`PR #${prNumber} is not currently mergeable.`);
              }
              return { merged: false, reason: 'not-mergeable' };
            }

            const requiredChecksOk = pr.mergeable_state === 'clean';
            if (!requiredChecksOk) {
              core.info(`Required checks not yet successful (mergeable_state=${pr.mergeable_state}). Only 'clean' state is acceptable for merging.`);
              return { merged: false, reason: 'checks-pending' };
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: 'squash',
            });
            core.info(`PR #${prNumber} merged successfully.`);
            return { merged: true };

      - name: Delete branch
        if: steps.merge.outputs.result && fromJSON(steps.merge.outputs.result).merged
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const headRef = pr.head.ref;
            const baseRef = pr.base.ref;
            const headRepo = pr.head.repo;

            if (headRef === baseRef) {
              core.info(`Head ref matches base ref (${baseRef}); skipping deletion as a safety measure.`);
              return;
            }

            if (headRepo && headRepo.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${headRef}`,
                });
                core.info(`Deleted branch ${headRef}`);
              } catch (err) {
                if (err.status === 404 || err.status === 422) {
                  core.info(`Branch ${headRef} already deleted or protected; skipping.`);
                } else {
                  throw err;
                }
              }
            } else {
              core.info('Branch belongs to a fork. Skipping deletion.');
            }
