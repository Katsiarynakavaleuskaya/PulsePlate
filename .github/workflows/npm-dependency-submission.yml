# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: NPM Dependency Submission

# Repo-managed npm dependency submission provides explicit graph refresh for
# root npm lockfile truth after security remediation on main.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/npm-dependency-submission.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Submit root npm dependency snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect and submit root npm dependencies
        uses: advanced-security/component-detection-dependency-submission-action@b876b8cc341a53970394b33ea0ca4e86c25542de # v0.1.3
        with:
          correlator: npm-dependency-submission-root
          detectorsCategories: Npm
          detectorArgs: NpmLockfile3=EnableIfDefaultOff
          directoryExclusionList: frontend,node_modules,worktrees,.venv
