version: 2
updates:
  # Python dependencies with grouped security (weekly) and general (monthly) updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "katsiarynakavaleuskaya"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      security:
        patterns:
          - "pip-audit"
          - "safety"
          - "cryptography"
          - "urllib3"
          - "certifi"
          - "requests"
      production:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"
          - "openai"
          - "httpx"
          - "python-dotenv"
          - "sqlalchemy"
          - "alembic"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "pytest*"
          - "hypothesis"
          - "faker"
          - "coverage"
        update-types:
          - "minor"
          - "patch"
      quality:
        patterns:
          - "black"
          - "mypy"
          - "ruff"
          - "bandit"
        update-types:
          - "minor"
          - "patch"
