version: 2
updates:
  # Python dependencies with grouped updates (monthly schedule for regular updates)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "katsiarynakavaleuskaya"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Security-critical runtime dependencies (monthly for regular, but security updates handled by separate config below)
      security:
        patterns:
          - "cryptography"
          - "urllib3"
          - "certifi"
          - "requests"
      production:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"
          - "openai"
          - "httpx"
          - "python-dotenv"
          - "sqlalchemy"
          - "alembic"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "pytest*"
          - "hypothesis"
          - "faker"
          - "coverage"
        update-types:
          - "minor"
          - "patch"
      quality:
        patterns:
          - "black"
          - "mypy"
          - "ruff"
          - "bandit"
        update-types:
          - "minor"
          - "patch"

  # Security updates with weekly schedule to ensure rapid patching
  # Overrides the monthly interval for security-critical packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "katsiarynakavaleuskaya"
    commit-message:
      prefix: "security"
      include: "scope"
    # Only open PRs for security updates (vulnerabilities)
    # This ensures rapid response to CVEs while avoiding noise from regular updates
    labels:
      - "security"
      - "dependencies"

  # Dev-time auditing and quality tools (monthly schedule)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "katsiarynakavaleuskaya"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Track dev dependencies from requirements-dev.txt
    # Note: pip-audit and safety are dev-time security scanning tools, not runtime dependencies
    allow:
      - dependency-type: "development"
    groups:
      dev-tools:
        patterns:
          - "pip-audit"
          - "safety"
          - "pre-commit"
