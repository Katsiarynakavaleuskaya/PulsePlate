version: 2
updates:
  # Security-critical packages - weekly updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    assignees:
      - "katsiarynakavaleuskaya"
    commit-message:
      prefix: "deps(security)"
      include: "scope"
    groups:
      security:
        patterns:
          - "pip-audit"
          - "safety"
          - "cryptography"
          - "urllib3"
          - "certifi"
          - "requests"

  # General dependencies - monthly updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "katsiarynakavaleuskaya"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      production:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"
          - "openai"
          - "httpx"
          - "python-dotenv"
          - "sqlalchemy"
          - "alembic"
      testing:
        patterns:
          - "pytest*"
          - "hypothesis"
          - "faker"
          - "coverage"
      quality:
        patterns:
          - "black"
          - "mypy"
          - "ruff"
          - "bandit"
